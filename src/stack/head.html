<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Stack Smash</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<!-- src/arcade/pad.css goes here (build.sh) -->
</head>
<body>
<header>
  <h1><a href="./" title="Back to the cartridge shelf">&#8249; Stack Smash</a></h1>
  <div id="hud">&larr; &rarr; move &middot; &uarr; / X turn &middot; Z turn back &middot; &darr; soft drop &middot; Space drop &middot; C hold &middot; Esc menu</div>
</header>
<div id="stage">
  <canvas id="cv" aria-label="Game screen. Left and right move the piece, Up or X turns it, Z turns it back, Down drops it faster, Space drops it at once, C holds it."></canvas>
</div>
<nav>
  <div id="gamepad" hidden>
    <div id="dpad" role="group" aria-label="Direction pad. Left and right move, down drops faster, up drops at once."><span class="l">&#9664;</span><span class="r">&#9654;</span><span class="u">&#9650;</span><span class="d">&#9660;</span></div>
    <div class="mid"><button data-pad="select" data-label="SELECT" aria-label="Select: open the menu"></button><button data-pad="start" data-label="START" aria-label="Start: start the game, or hold the piece"></button></div>
    <div class="ab"><button data-pad="b" aria-label="B: turn the piece back">B</button><button data-pad="a" aria-label="A: turn the piece">A</button></div>
  </div>
</nav>
