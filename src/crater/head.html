  <div id="hud">&larr; &rarr; aim &middot; Shift+&larr; &rarr; drive &middot; hold Space for power, let go to fire &middot; Tab weapon &middot; Esc menu &middot; M sound</div>

<div id="stage">
  <canvas id="cv" aria-label="Game screen. Left and right aim the barrel; with Shift they drive the tank. Hold Space to build power and let go to fire. Tab changes weapon. On a touch screen, drag back and let go to fire, drag your tank to drive, and tap the weapon to change it."></canvas>
