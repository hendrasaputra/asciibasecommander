<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Crater Duel</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<!-- src/arcade/pad.css goes here (build.sh) -->
</head>
<body>
<header>
  <h1><a href="./" title="Back to the cartridge shelf">&#8249; Crater Duel</a></h1>
  <div id="hud">&larr; &rarr; aim &middot; hold Space for power, let go to fire &middot; Tab weapon &middot; Esc menu &middot; M sound</div>
</header>
<div id="stage">
  <canvas id="cv" aria-label="Game screen. Left and right aim the barrel. Hold Space to build power and let go to fire. Tab changes weapon."></canvas>
</div>
<nav>
  <div id="gamepad" hidden>
    <div id="dpad" role="group" aria-label="Direction pad. Left and right aim the barrel."><span class="l">&#9664;</span><span class="r">&#9654;</span><span class="u">&#9650;</span><span class="d">&#9660;</span></div>
    <div class="mid"><button data-pad="select" data-label="SELECT" aria-label="Select: open the menu"></button><button data-pad="start" data-label="START" aria-label="Start, continue, or open the menu"></button></div>
    <div class="ab"><button data-pad="b" aria-label="B: change weapon">B</button><button data-pad="a" aria-label="A: hold for power, let go to fire">A</button></div>
  </div>
</nav>
