<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Arcade Settings</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<meta name="description" content="The tube TV filter for every cartridge: scanlines, phosphor glow and rounded glass.">
<style>
:root{
  --room:#E7E4DC; --panel:#F4F2EC; --ink:#2A2A30; --muted:#6B6A72; --line:#CFCBC0; --chip:#E2DED4; --chip-on:#2A2A30; --chip-on-ink:#F4F2EC; --focus:#2F5BD3;
  box-sizing:border-box;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --room:#14161C; --panel:#1C1F27; --ink:#E4E2DC; --muted:#8E8C95; --line:#2E323C; --chip:#262A33; --chip-on:#E4E2DC; --chip-on-ink:#14161C; --focus:#8FB0FF; }
}
:root[data-theme="dark"]{ --room:#14161C; --panel:#1C1F27; --ink:#E4E2DC; --muted:#8E8C95; --line:#2E323C; --chip:#262A33; --chip-on:#E4E2DC; --chip-on-ink:#14161C; --focus:#8FB0FF; }
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100vh;background:var(--room);color:var(--ink);
  font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  padding:clamp(16px,4vw,40px) 16px 40px}
main{max-width:760px;margin:0 auto}
.back{color:var(--muted);text-decoration:none;font-size:14px}.back:hover{text-decoration:underline}
h1{margin:10px 0 4px;font:700 clamp(22px,5vw,30px)/1.1 ui-monospace,"SF Mono",Menlo,Consolas,monospace;letter-spacing:.06em}
.lede{margin:0 0 18px;color:var(--muted)}
#stage{position:relative;height:clamp(220px,42vw,340px);border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#0B0F16}
#cv{position:absolute;inset:0;margin:auto;height:100%;aspect-ratio:1;display:block;object-fit:cover}
.switch{display:flex;align-items:center;gap:12px;cursor:pointer;min-height:44px}
.switch input{width:44px;height:26px;appearance:none;-webkit-appearance:none;margin:0;border-radius:13px;background:var(--chip);position:relative;cursor:pointer;flex:none;transition:background .15s}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--muted);transition:transform .15s,background .15s}
.switch input:checked{background:var(--chip-on)}
.switch input:checked::after{transform:translateX(18px);background:var(--chip-on-ink)}
.switch input:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
#status{color:var(--muted);font-size:13px}
.games{margin-top:28px;font-size:14px;color:var(--muted)}
.games a{color:inherit}
@media (prefers-reduced-motion: reduce){ .switch input,.switch input::after{transition:none} }
</style>
</head>
<body>
<main>
  <a class="back" href="./">&#8249; Cartridge shelf</a>
  <h1>TUBE TV FILTER</h1>
  <p class="lede">Lays scanlines, phosphor glow, rounded glass and a faint flicker over every cartridge. Saved in this browser; each game uses it the next time it opens.</p>

  <div id="stage"><img id="cv" src="cartridges/rover-patrol.jpg" alt="Preview: a cartridge picture under the filter"></div>

  <p><label class="switch"><input type="checkbox" id="crt"><span>Tube TV filter</span></label></p>
  <p><span id="status" role="status" aria-live="polite"></span></p>

  <p class="games">The <a href="ascii-physics.html">Physics Sandbox</a> has its own Display settings.</p>
</main>
