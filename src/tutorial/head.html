<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>How the ASCII physics engine works (v0.3)</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EEF1F4; --stage:#E3E8EE; --ink:#1E2B40; --muted:#5A6679; --line:#C6CED9; --code:#E2E7ED;
  --accent:#2F5BD3; --btn:#D6DDE6; --btn-on:#1E2B40; --btn-on-ink:#F4F6F8;
  --c0:#8A94A3; --c1:#2F5BD3; --c2:#0E8A7E; --c3:#4E5B6E; --c4:#B03A7A; --c5:#1E2B40; --c6:#A3AEBD; --c7:#B9790F;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#131923; --stage:#0F141C; --ink:#DCE3EC; --muted:#8B96A7; --line:#283243; --code:#1A212D;
    --accent:#7FA2FF; --btn:#222B3A; --btn-on:#DCE3EC; --btn-on-ink:#131923;
    --c0:#5B6678; --c1:#7FA2FF; --c2:#4FD1BF; --c3:#C9D2DE; --c4:#F07FB8; --c5:#DCE3EC; --c6:#56637A; --c7:#FFC857;
  }
}
:root[data-theme="dark"]{
  --paper:#131923; --stage:#0F141C; --ink:#DCE3EC; --muted:#8B96A7; --line:#283243; --code:#1A212D;
  --accent:#7FA2FF; --btn:#222B3A; --btn-on:#DCE3EC; --btn-on-ink:#131923;
  --c0:#5B6678; --c1:#7FA2FF; --c2:#4FD1BF; --c3:#C9D2DE; --c4:#F07FB8; --c5:#DCE3EC; --c6:#56637A; --c7:#FFC857;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 12px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);
  font:18px/1.62 "Source Serif 4",Georgia,"Times New Roman",serif;}
main{max-width:46rem;margin:0 auto;padding:28px 18px 64px}
h1{font-size:clamp(2rem,6vw,2.8rem);line-height:1.08;font-weight:700;letter-spacing:-0.02em;margin:0 0 .4em}
.lede{font-size:1.1rem;color:var(--muted);margin:0 0 1.2em;max-width:36rem}
h2{font-size:1.4rem;line-height:1.2;font-weight:700;margin:0 0 .5em;letter-spacing:-0.01em}
p{margin:0 0 .85em}
a{color:var(--accent)}
code.i{font:0.86em "IBM Plex Mono",ui-monospace,Menlo,monospace;background:var(--code);padding:.08em .3em;border-radius:4px}
section{display:grid;grid-template-columns:minmax(0,1fr);gap:0;padding-top:2.4rem;margin-top:2.4rem;border-top:1px solid var(--line)}
.num{font:500 1rem "IBM Plex Mono",ui-monospace,Menlo,monospace;color:var(--accent);margin-bottom:.35rem}
@media (min-width:760px){
  section{grid-template-columns:3.2rem minmax(0,1fr)}
  .num{font-size:1.5rem;line-height:1.1;margin:0}
}
.demo{background:var(--stage);border:1px solid var(--line);border-radius:10px;margin:1.1rem 0;overflow:hidden}
.demo canvas{display:block;width:100%;touch-action:none}
.ctrl{display:flex;flex-wrap:wrap;gap:6px;padding:10px;border-top:1px solid var(--line);align-items:center;
  font:14px/1.3 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
.ctrl label{color:var(--muted);display:flex;align-items:center;gap:6px;flex:1 1 12rem}
.ctrl input[type=range]{flex:1;accent-color:var(--accent)}
button{min-height:38px;padding:6px 12px;border:0;border-radius:8px;background:var(--btn);color:var(--ink);font:inherit;cursor:pointer}
button[aria-pressed="true"]{background:var(--btn-on);color:var(--btn-on-ink);font-weight:600}
button.go{background:var(--accent);color:var(--paper);font-weight:600}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sep{flex-basis:100%;height:0}
.readout{padding:8px 12px 10px;font:13px/1.5 "IBM Plex Mono",ui-monospace,Menlo,monospace;color:var(--ink);border-top:1px solid var(--line);white-space:pre-wrap;overflow-wrap:anywhere}
.try{padding:8px 12px 10px;font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:var(--muted);border-top:1px solid var(--line)}
.try b{color:var(--ink);font-weight:600}
pre{margin:1rem 0 0;background:var(--code);border-radius:8px;padding:14px 14px;overflow-x:auto;
  font:13px/1.55 "IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;color:var(--ink);tab-size:2}
pre .cm{color:var(--muted)}
ol.toc{padding-left:1.4rem;margin:.5rem 0 0;columns:2 15rem;column-gap:2rem;font-size:1rem}
ol.toc li{margin:.15rem 0;break-inside:avoid}
ol.toc a{text-decoration:none;color:var(--ink)}
ol.toc a:hover{color:var(--accent)}
.stack{font:14px/1.5 "IBM Plex Mono",ui-monospace,Menlo,monospace;background:var(--code);border-radius:8px;padding:12px 14px;margin:1rem 0;overflow-x:auto;white-space:pre}
.cta{display:inline-block;margin-top:.6rem;padding:10px 16px;border-radius:8px;background:var(--accent);color:var(--paper);text-decoration:none;font:600 15px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
</style>
</head>
<style>
.demo canvas{background:#0B0F16}
.swatch{width:38px;min-width:38px;flex:0 0 38px;padding:0;border:2px solid transparent}
.swatch[aria-pressed="true"]{border-color:var(--ink)}
.new{font:600 11px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin-left:.5rem;vertical-align:middle}
</style>
<style>section>div{min-width:0} html,body{overflow-x:hidden}</style>
