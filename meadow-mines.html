<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Meadow Mines</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
/* Shared by the game pages: page layout, the header buttons, and the phone-on-its-side layout. Built into each page. */
:root{
  --ground:#E9EDF1; --ink:#20304A; --muted:#5E6A7D; --line:#C9D1DB;
  --btn:#DCE2E9; --accent:#2F5BD3;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  padding-left:env(safe-area-inset-left,0px);
  padding-right:env(safe-area-inset-right,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#151B26; --ink:#D9E1EC; --muted:#8792A3; --line:#2A3445;
    --btn:#222B3A; --accent:#7FA2FF;
  }
}
:root[data-theme="dark"]{
  --ground:#151B26; --ink:#D9E1EC; --muted:#8792A3; --line:#2A3445;
  --btn:#222B3A; --accent:#7FA2FF;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;overscroll-behavior:none}
body{height:100%;height:calc(100svh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));margin:0;touch-action:manipulation;overscroll-behavior:none;-webkit-touch-callout:none;background:var(--ground);color:var(--ink);
  font:15px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  display:flex;flex-direction:column;overflow:hidden;-webkit-user-select:none;user-select:none}
header{display:flex;align-items:center;gap:4px 12px;padding:2px 8px 2px 4px;min-height:48px}
h1{font-size:17px;font-weight:650;margin:0;letter-spacing:-0.01em;flex:none}
/* the back link and the buttons are at least 44px tall, so a thumb finds them */
h1 a{color:inherit;text-decoration:none;display:inline-flex;align-items:center;min-height:44px;padding:0 10px}h1 a:hover{text-decoration:underline}
#hud{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;font:12px/1.2 ui-monospace,"SF Mono",Menlo,Consolas,monospace;color:var(--muted);white-space:nowrap}
.tools{margin-left:auto;display:flex;gap:6px;flex:none}
#stage{flex:1;position:relative;touch-action:none;margin:0 8px 8px;border:1px solid var(--line);border-radius:6px;overflow:hidden;min-height:0;background:#0B0F16}
#cv{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:block;touch-action:none}
button{min-width:44px;min-height:44px;padding:6px 14px;border:0;border-radius:10px;background:var(--btn);color:var(--ink);font:inherit;font-size:14px;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
body.touch #hud{visibility:hidden}
/* Phone on its side: a slimmer header, so the game gets the height */
@media (orientation: landscape) and (max-height: 500px){
  header{min-height:44px;padding-top:0;padding-bottom:0}
  #stage{margin-bottom:4px}
}
</style>
</head>
<body>
<header>
  <h1><a href="./" title="Back to the cartridge shelf">&#8249; Meadow Mines</a></h1>
  <div id="hud">click dig &middot; right-click flag &middot; arrows + Space / F &middot; N new field &middot; Esc menu</div>
  <div class="tools"><button id="menuBtn" type="button">Menu</button><button id="soundBtn" type="button">Sound</button></div>
</header>
<div id="stage">
  <canvas id="cv" aria-label="Game screen: a meadow of grass squares with mines buried under some. Click or tap a square to dig it; a number tells how many mines touch it. Right-click, press F, or hold a finger on a square to flag it. The DIG button at the top switches taps to flagging."></canvas>
</div>
<script>
"use strict";
/* ================= Shared core: physics, light, ink, 24-bit renderer ================= */
const MONO = 'ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace';
const SANS = '-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif';
// The simulated screen is always dark: characters emit light, so they need a black background.
const SCREEN = { bg: "#0B0F16", dot: "#1C2432", line: "#263042", text: "#DCE3EC", muted: "#7C889B", accent: "#7FA2FF", pink: "#F07FB8", lamp: "#FFC857" };
const RAMPS = { classic: " .:-=+*#%@", detailed: " .'`^\",:;Il!i~+_-?]}1)|/tfjrxnuvczXYUJCLQ0OZmwqpdbkhao*#MW&8%B@", blocks: " \u2591\u2592\u2593\u2588" };
function norm(v){ const l = Math.hypot(...v); return v.map(x => x / l); }
const DIR = norm([-0.5, -0.6, 0.65]), SUB = [0.25, 0.75], MREF = 2.4;
const AMB_RGB = [0.55, 0.65, 0.9];     // room light is slightly blue
const FLASH_RGB = [1.0, 0.75, 0.45];   // impact flashes are warm
const FLOOR_ALB = 0.5;                 // share of light the floor reflects
const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5];
const MATS = {
  foam:   { name: "foam",   density: 0.2, e: 0.70, mu: 0.6, kd: 0.95, ks: 0.05, shine: 4,  alb: [0.20, 0.85, 0.72], rMin: 1.6, rMax: 2.4 },
  rubber: { name: "rubber", density: 1.0, e: 0.55, mu: 0.8, kd: 0.85, ks: 0.30, shine: 14, alb: [0.30, 0.48, 1.00], alt: [1.00, 0.38, 0.68], rMin: 1.2, rMax: 1.9 },
  steel:  { name: "steel",  density: 7.0, e: 0.35, mu: 0.2, kd: 0.45, ks: 1.10, shine: 70, alb: [0.72, 0.76, 0.82], rMin: 0.9, rMax: 1.3 },
  peg:    { name: "peg",    density: 0,   e: 0.50, mu: 0.3, kd: 0.80, ks: 0.20, shine: 10, alb: [0.42, 0.47, 0.56] }
};
const MIX = ["rubber", "rubber", "rubber", "rubber", "foam", "foam", "foam", "steel", "steel", "steel"];
function hexToLinear(hex){
  const n = parseInt(hex.slice(1), 16);
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255].map(c => Math.pow(c / 255, 2.2));
}
function defaultDisplay(){
  return { chars: RAMPS.classic, calibrate: true, dither: false, black: 0.15, exposure: 1.3, gamma: 2.2, split: 0.2, glow: 0.35, room: 0.18, lampHex: "#FFD9A0", lampRGB: hexToLinear("#FFD9A0") };
}

/* ---------- arcade display settings (settings.html), shared by the game pages ---------- */
// One choice for every cartridge, saved in this browser: character set, ASCII or pixel drawing, tube TV filter, and
// detail (1, 2 or 3: how many times finer the engine draws its lit bodies and light; see Screen.fit).
const ARCADE_KEY = "arcade.v1.display";
const ARCADE_DEFAULTS = { ramp: "classic", custom: " .:oO0@", mode: "ascii", crt: false, detail: 1 };
function arcadeSettings(){
  let saved = {};
  try { saved = JSON.parse(localStorage.getItem(ARCADE_KEY) || "{}") || {}; }
  catch (e){ console.warn("Arcade: saved display settings unreadable, using defaults", e); }
  return { ...ARCADE_DEFAULTS, ...saved };
}
function saveArcadeSettings(s){
  try { localStorage.setItem(ARCADE_KEY, JSON.stringify(s)); return true; }
  catch (e){ console.warn("Arcade: could not save display settings", e); return false; }
}
function arcadeChars(s){ return s.ramp === "custom" ? (s.custom.length > 1 ? s.custom : " @") : RAMPS[s.ramp] || RAMPS.classic; }
// The tube TV look is CSS laid over the game's #stage: scanlines, a phosphor grille, vignette, rounded glass, flicker.
const CRT_CSS = `
body.crt #stage{background:#050607}
body.crt #cv{border-radius:14px;filter:saturate(1.15) contrast(1.06) brightness(1.1)}
body.crt #stage::before,body.crt #stage::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:2}
body.crt #stage::before{background:repeating-linear-gradient(to bottom,rgba(0,0,0,.24) 0 1px,transparent 1px 3px),
  repeating-linear-gradient(to right,rgba(255,40,40,.06) 0 1px,rgba(40,255,40,.06) 1px 2px,rgba(60,60,255,.06) 2px 3px)}
body.crt #stage::after{border-radius:inherit;background:radial-gradient(ellipse at center,transparent 58%,rgba(0,0,0,.55) 100%);
  box-shadow:inset 0 0 50px rgba(0,0,0,.85),inset 0 0 6px rgba(160,200,255,.15);animation:crt-flicker 5s steps(40) infinite}
@keyframes crt-flicker{0%,100%{opacity:1}47%{opacity:.93}50%{opacity:1}73%{opacity:.96}}
@media (prefers-reduced-motion: reduce){body.crt #stage::after{animation:none}}`;
// Call once at start-up with the game's display: applies the character set, pixel mode and the TV filter.
function applyArcadeSettings(D){
  const s = arcadeSettings();
  D.chars = arcadeChars(s); D.pixels = s.mode === "pixels"; D.detail = Math.max(1, Math.min(3, s.detail | 0 || 1));
  if (!document.getElementById("crt-css")){ const st = document.createElement("style"); st.id = "crt-css"; st.textContent = CRT_CSS; document.head.appendChild(st); }
  document.body.classList.toggle("crt", !!s.crt);
  return s;
}

/* ---------- physics (unchanged from v2) ---------- */
function hit(b, dv){ if (dv > 220) b.flash = Math.max(b.flash, Math.min(1, (dv - 220) / 1000)); }
class World {
  constructor(){ this.bodies = []; this.forces = []; this.w = 300; this.h = 300; this.unit = 10; this.g = { x: 0, y: 0 };
    this.substeps = 4; this.cell = 60; this.grid = new Map(); this.drag = 0; this.onSub = null;
    this.openTop = false;   // true: no ceiling, bodies can fly above y = 0 and fall back
    this.terrain = null;    // optional grid of solid cells: { cw, ch, cols, rows, solid: Uint8Array, mat } (see collideTerrain)
  }
  add(x, y, r, matName, alb, matOverride){
    const M = matOverride || MATS[matName], st = matName === "peg";
    const m = st ? 0 : M.density * (r / this.unit) ** 2;
    const b = { x, y, vx: 0, vy: 0, r, a: Math.random() * 6.283, w: 0, mat: M, alb: alb || M.alb, static: st, m,
      im: st ? 0 : 1 / m, iI: st ? 0 : 1 / (0.4 * m * r * r), grab: null, flash: 0, touch: false };
    this.bodies.push(b);
    if (this.bodies.length > 260){ const i = this.bodies.findIndex(o => !o.static && !o.grab); if (i >= 0) this.bodies.splice(i, 1); }
    return b;
  }
  // A box is a rotating rectangle with half-width hw and half-height hh. Its r is the bounding radius, which the
  // broadphase grid uses; mass uses the same area rule as circles, so equal materials have equal density.
  addBox(x, y, hw, hh, matName, alb, matOverride){
    const b = this.add(x, y, Math.hypot(hw, hh), matName, alb, matOverride);
    b.box = true; b.hw = hw; b.hh = hh;
    if (!b.static){ b.m = b.mat.density * 4 * hw * hh / Math.PI / this.unit ** 2; b.im = 1 / b.m; b.iI = 3 / (b.m * (hw * hw + hh * hh)); }
    return b;
  }
  step(dt){
    let maxR = 1; for (const b of this.bodies) if (b.r > maxR) maxR = b.r;
    this.cell = maxR * 2 + 2;
    const h = dt / this.substeps;
    for (let s = 0; s < this.substeps; s++){ this.substep(h); if (this.onSub) this.onSub(); }
    const decay = Math.pow(0.001, dt); for (const b of this.bodies) b.flash *= decay;
  }
  substep(h){
    const { w, h: H, g } = this;
    for (const b of this.bodies){
      if (b.static) continue;
      const mN = Math.max(0.25, b.m / MREF);
      let ax = g.x, ay = g.y;
      const sp = Math.hypot(b.vx, b.vy);
      if (sp > 0 && this.drag){ const k = this.drag * b.r * sp * b.im; ax -= b.vx * k; ay -= b.vy * k; }
      if (b.grab){ ax += (520 * (b.grab.x - b.x) - 46 * b.vx) / mN; ay += (520 * (b.grab.y - b.y) - 46 * b.vy) / mN; }
      for (const f of this.forces){
        const dx = b.x - f.x, dy = b.y - f.y, d = Math.hypot(dx, dy);
        if (d > 0.001 && d < f.radius){ const k = (1 - d / f.radius) * f.strength / mN; ax += dx / d * k; ay += dy / d * k; }
      }
      b.vx += ax * h; b.vy += ay * h;
      const s2 = Math.hypot(b.vx, b.vy); if (s2 > 4000){ b.vx *= 4000 / s2; b.vy *= 4000 / s2; }
      b.x += b.vx * h; b.y += b.vy * h; b.a += b.w * h; b.w *= 0.9997;
      if (b.box){ this.boxWalls(b); continue; }
      if (b.x - b.r <= 0){ b.x = b.r; this.wall(b, -1, 0, h); }
      if (b.x + b.r >= w){ b.x = w - b.r; this.wall(b, 1, 0, h); }
      if (!this.openTop && b.y - b.r <= 0){ b.y = b.r; this.wall(b, 0, -1, h); }
      if (b.y + b.r >= H){ b.y = H - b.r; this.wall(b, 0, 1, h); }
    }
    for (const b of this.bodies) b.touch = false;
    this.collide(); this.collide(false);   // second pass reuses the grid: positions only moved by sub-pixel corrections
    if (this.terrain) this.collideTerrain();
    for (const b of this.bodies){
      if (b.static) continue;
      if (b.touch && !b.grab && b.vx * b.vx + b.vy * b.vy < 1600){ b.vx *= 0.9; b.vy *= 0.9; b.w *= 0.9; }
      if (!b.box){ b.x = Math.min(w - b.r, Math.max(b.r, b.x)); b.y = Math.min(H - b.r, this.openTop ? b.y : Math.max(b.r, b.y)); }
    }
  }
  // Boxes meet walls at their corners: push back the deepest corner, then apply one impulse at the middle of the
  // corners past the wall, so a box lying flat gets no spurious spin.
  boxWalls(b){
    const c = Math.cos(b.a), s = Math.sin(b.a), ux = c * b.hw, uy = s * b.hw, vx = -s * b.hh, vy = c * b.hh;
    const P = [b.x + ux + vx, b.y + uy + vy, b.x - ux + vx, b.y - uy + vy, b.x - ux - vx, b.y - uy - vy, b.x + ux - vx, b.y + uy - vy];
    for (const [nx, ny, lim] of [[-1, 0, 0], [1, 0, this.w], [0, -1, 0], [0, 1, this.h]]){
      if (ny < 0 && this.openTop) continue;
      let depth = 0, sx = 0, sy = 0, n = 0;
      for (let i = 0; i < 8; i += 2){
        const d = nx ? nx * (P[i] - lim) : ny * (P[i + 1] - lim);   // how far this corner is past the wall
        if (d > 0){ depth = Math.max(depth, d); sx += P[i]; sy += P[i + 1]; n++; }
      }
      if (!n) continue;
      b.x -= nx * depth; b.y -= ny * depth;
      for (let i = 0; i < 8; i += 2){ P[i] -= nx * depth; P[i + 1] -= ny * depth; }
      b.touch = true;
      this.impulse(b, null, sx / n - nx * depth, sy / n - ny * depth, nx, ny);
    }
  }
  // Impulse at contact point (px, py) with normal n pointing from a towards b. b = null is an immovable wall.
  // Includes rotation, so it works for any shape; circle pairs keep their own cheaper path in resolve().
  impulse(a, b, px, py, nx, ny){
    const rax = px - a.x, ray = py - a.y, rbx = b ? px - b.x : 0, rby = b ? py - b.y : 0;
    const bim = b ? b.im : 0, biI = b ? b.iI : 0;
    const rel = () => [(b ? b.vx - b.w * rby : 0) - (a.vx - a.w * ray), (b ? b.vy + b.w * rbx : 0) - (a.vy + a.w * rax)];
    let [rvx, rvy] = rel();
    const vn = rvx * nx + rvy * ny;
    if (vn >= 0) return;
    const ran = rax * ny - ray * nx, rbn = rbx * ny - rby * nx;
    const e = -vn < 30 ? 0 : b ? (a.mat.e + b.mat.e) / 2 : a.mat.e;
    const j = -(1 + e) * vn / (a.im + bim + ran * ran * a.iI + rbn * rbn * biI);
    a.vx -= j * nx * a.im; a.vy -= j * ny * a.im; a.w -= j * ran * a.iI; hit(a, j * a.im);
    if (b){ b.vx += j * nx * bim; b.vy += j * ny * bim; b.w += j * rbn * biI; hit(b, j * bim); }
    [rvx, rvy] = rel();
    const tx = -ny, ty = nx, vt = rvx * tx + rvy * ty, rat = rax * ty - ray * tx, rbt = rbx * ty - rby * tx;
    const lim = (b ? Math.sqrt(a.mat.mu * b.mat.mu) : a.mat.mu) * j;
    const jt = Math.max(-lim, Math.min(lim, -vt / (a.im + bim + rat * rat * a.iI + rbt * rbt * biI)));
    a.vx -= jt * tx * a.im; a.vy -= jt * ty * a.im; a.w -= jt * rat * a.iI;
    if (b){ b.vx += jt * tx * bim; b.vy += jt * ty * bim; b.w += jt * rbt * biI; }
  }
  // Terrain cells are not bodies: each moving body checks only the solid cells under its bounding box, each one
  // treated as a fixed box. So a screen full of terrain costs nothing until something touches it.
  collideTerrain(){
    const T = this.terrain, cell = this.tcell || (this.tcell = { box: true, static: true, a: 0, im: 0, iI: 0, vx: 0, vy: 0, w: 0, flash: 0 });
    cell.hw = T.cw / 2; cell.hh = T.ch / 2; cell.r = Math.hypot(cell.hw, cell.hh); cell.mat = T.mat;
    for (const b of this.bodies){
      if (b.static || b.sensor) continue;
      const c0 = Math.max(0, Math.floor((b.x - b.r) / T.cw)), c1 = Math.min(T.cols - 1, Math.floor((b.x + b.r) / T.cw));
      const r0 = Math.max(0, Math.floor((b.y - b.r) / T.ch)), r1 = Math.min(T.rows - 1, Math.floor((b.y + b.r) / T.ch));
      for (let r = r0; r <= r1; r++) for (let c = c0; c <= c1; c++){
        if (!T.solid[r * T.cols + c]) continue;
        cell.x = (c + 0.5) * T.cw; cell.y = (r + 0.5) * T.ch;
        this.resolve(cell, b);
      }
    }
  }
  resolveBox(a, b){
    const A = a.box ? a : b, B = A === a ? b : a;   // A is always a box
    const C = B.box ? boxBox(A, B) : boxCircle(A, B);
    if (!C) return;
    A.touch = B.touch = true;
    const ws = A.im + B.im, corr = Math.max(0, C.depth - 0.3) / ws * 0.8;
    A.x -= C.nx * corr * A.im; A.y -= C.ny * corr * A.im; B.x += C.nx * corr * B.im; B.y += C.ny * corr * B.im;
    for (const [px, py] of C.pts) this.impulse(A, B, px, py, C.nx, C.ny);
  }
  wall(b, nx, ny, h){
    const M = b.mat; let jn; b.touch = true;
    const vn = b.vx * nx + b.vy * ny;
    if (vn > 0){ const e = vn < 30 ? 0 : M.e, dv = (1 + e) * vn; b.vx -= dv * nx; b.vy -= dv * ny; hit(b, dv); jn = dv * b.m; }
    else jn = Math.max(0, this.g.x * nx + this.g.y * ny) * h * b.m;
    const tx = -ny, ty = nx, slip = b.vx * tx + b.vy * ty + b.w * b.r;
    let jt = -slip / (b.im + b.r * b.r * b.iI);
    const lim = M.mu * jn; jt = Math.max(-lim, Math.min(lim, jt));
    b.vx += jt * tx * b.im; b.vy += jt * ty * b.im; b.w += jt * b.r * b.iI;
  }
  buildGrid(){
    const cs = this.cell, grid = this.grid, B = this.bodies; grid.clear();
    for (let i = 0; i < B.length; i++){
      const key = Math.floor(B[i].x / cs) * 65536 + Math.floor(B[i].y / cs);   // numeric key: no string per lookup
      let arr = grid.get(key); if (!arr){ arr = []; grid.set(key, arr); } arr.push(i);
    }
  }
  collide(rebuild = true){
    if (rebuild) this.buildGrid();
    const cs = this.cell, grid = this.grid, B = this.bodies;
    for (let i = 0; i < B.length; i++){
      const a = B[i], cx = Math.floor(a.x / cs), cy = Math.floor(a.y / cs);
      for (let ox = -1; ox <= 1; ox++) for (let oy = -1; oy <= 1; oy++){
        const arr = grid.get((cx + ox) * 65536 + cy + oy);
        if (arr) for (const j of arr) if (j > i && !(a.static && B[j].static)) this.resolve(a, B[j]);
      }
    }
  }
  resolve(a, b){
    if (a.sensor || b.sensor) return;   // sensors fly through everything; the game checks their hits itself
    const dx = b.x - a.x, dy = b.y - a.y, rs = a.r + b.r, d2 = dx * dx + dy * dy;
    if (d2 >= rs * rs || d2 === 0) return;
    const wa = a.im, wb = b.im, ws = wa + wb; if (ws === 0) return;
    if (a.box || b.box) return this.resolveBox(a, b);
    const d = Math.sqrt(d2), nx = dx / d, ny = dy / d; a.touch = b.touch = true;
    const corr = Math.max(0, rs - d - 0.3) / ws * 0.8;
    a.x -= nx * corr * wa; a.y -= ny * corr * wa; b.x += nx * corr * wb; b.y += ny * corr * wb;
    const rvx = b.vx - a.vx, rvy = b.vy - a.vy, vn = rvx * nx + rvy * ny;
    if (vn >= 0) return;
    const e = -vn < 30 ? 0 : (a.mat.e + b.mat.e) / 2, j = -(1 + e) * vn / ws;
    a.vx -= j * nx * wa; a.vy -= j * ny * wa; b.vx += j * nx * wb; b.vy += j * ny * wb;
    hit(a, j * wa); hit(b, j * wb);
    const tx = -ny, ty = nx, vt = rvx * tx + rvy * ty - b.w * b.r - a.w * a.r;
    let jt = -vt / (ws + a.r * a.r * a.iI + b.r * b.r * b.iI);

/* ---------- in-game pause menu, shared by the games ---------- */
// Drawn into the game's own screen on MENU_LAYER, above the game's text, so it matches ASCII or pixel mode and
// stays readable.
// The game supplies the rows as a function (labels and values can change): each row is
// { label, value?: () => string, change?: dir => void, select?: () => void }.
// Keys while open: up/down move, left/right change a value, Enter/Space choose, Esc/P close.
function createMenu(rows, { onOpen, onClose, onChange } = {}){
  const m = { open: false, at: 0, box: null };
  const touched = () => onChange && onChange();
  m.show = () => { if (m.open) return; m.open = true; m.at = 0; onOpen && onOpen(); touched(); };
  m.hide = () => { if (!m.open) return; m.open = false; onClose && onClose(); touched(); };
  m.toggle = () => (m.open ? m.hide() : m.show());
  m.move = d => { const n = rows().length; m.at = (m.at + d + n) % n; touched(); };
  m.change = d => { const r = rows()[m.at]; if (r.change) r.change(d); else if (d > 0 && r.select) r.select(); touched(); };
  m.choose = () => { const r = rows()[m.at]; if (r.select) r.select(); else if (r.change) r.change(1); touched(); };
  // Returns true when the menu used the key, so the game ignores it.
  m.key = e => {
    if (!m.open) return false;
    const k = e.key;
    if (k === "ArrowUp" || k === "w" || k === "W") m.move(-1);
    else if (k === "ArrowDown" || k === "s" || k === "S") m.move(1);
    else if (k === "ArrowLeft" || k === "a" || k === "A") m.change(-1);
    else if (k === "ArrowRight" || k === "d" || k === "D") m.change(1);
    else if (k === "Enter" || k === " ") m.choose();
    else if (k === "Escape" || k === "p" || k === "P") m.hide();
    return true;   // other keys do nothing while the menu is open
  };
    // A tap or click at grid cell (gx, gy): picks that row and changes or chooses it. Taps outside the box close it.
  m.tap = (gx, gy) => {
    if (!m.open || !m.box) return false;
    const b = m.box, i = Math.floor((gy - b.y0 + (b.gap >> 1)) / b.gap);
    if (gx < b.x0 || gx >= b.x0 + b.w || gy < b.top || gy >= b.top + b.h){ m.hide(); return true; }
    if (i >= 0 && i < b.n){ m.at = b.first + i; m.choose(); }
    return true;
  };

    const GW = screen.cols, GH = screen.rows, text = (x, y, s, rgb) => screen.text(x, y, s, rgb, MENU_LAYER);
    const R = rows(); m.at = Math.min(m.at, R.length - 1);
    const gap = INPUT.touch ? 2 : 1;   // rows two lines apart on a touch screen, so a finger can pick one
    // a list longer than the screen shows a window around the chosen row, with ^ and v marks
    const n = Math.min(R.length, Math.max(3, Math.floor((GH - 8 - (note ? 1 : 0)) / gap))), first = Math.max(0, Math.min(m.at - (n >> 1), R.length - n));
    // 40 wide, or wider when a row or the note needs it, but never wider than the screen
    const longest = Math.max(title.length + 4, note.length + 4, ...R.map(r => 5 + Math.max(18, r.label.length) + (r.value ? r.value().length + 4 : 0) + 3));
    const w = Math.min(GW - 2, Math.max(40, longest)), h = n * gap + 6 - (gap - 1) + (note ? 1 : 0), x0 = (GW - w) >> 1, top = Math.max(1, (GH - h) >> 1);
    const edge = "+" + "-".repeat(w - 2) + "+";
    text(x0, top, edge, dim); text(x0, top + h - 1, edge, dim);
    for (let y = 1; y < h - 1; y++){
      // Spaces blank the game behind. They are drawn black: on a shared layer the brighter text wins, so anything
      // written on top later (including dim notes) still shows.
      text(x0, top + y, "|", dim); text(x0 + 1, top + y, " ".repeat(w - 2), [0, 0, 0]); text(x0 + w - 1, top + y, "|", dim);
    }
    text(x0 + ((w - title.length) >> 1), top + 1, title, accent);
    for (let i = 0; i < n; i++){
      const r = R[first + i], sel = first + i === m.at, v = r.value ? "< " + r.value() + " >" : "";
      text(x0 + 3, top + 3 + i * gap, (sel ? "> " : "  ") + r.label.padEnd(18) + v, sel ? accent : normal);
    }
    if (first > 0) text(x0 + w - 3, top + 3, "^", dim);
    if (first + n < R.length) text(x0 + w - 3, top + 3 + (n - 1) * gap, "v", dim);
    if (note) text(x0 + ((w - note.length) >> 1), top + h - 2, note, dim);
    m.box = { x0, w, top, h, y0: top + 3, first, n, gap };
  };

}
// Grid cell under a pointer event on the game canvas (handles the canvas being scaled to fit).
function gridAt(e, canvas, GW, GH){
  const r = canvas.getBoundingClientRect();
  return [Math.floor((e.clientX - r.left) / r.width * GW), Math.floor((e.clientY - r.top) / r.height * GH)];

/* ---------- shared by the game pages: saved settings, sound, touch, fitting the canvas, the loop ---------- */
// Built into every cartridge after core.js and menu.js. Each game keeps only its own rules and drawing.

function prefs(prefix, label){
  return {
    get(k, d = null){ try { const v = localStorage.getItem(prefix + k); return v === null ? d : v; } catch (e){ return d; } },
    set(k, v){ try { localStorage.setItem(prefix + k, v); return true; } catch (e){ console.warn(label + ": could not save " + k, e); return false; } },
    getJSON(k, d){ const v = this.get(k); if (v === null) return d; try { return JSON.parse(v); } catch (e){ console.warn(label + ": saved " + k + " unreadable, using defaults", e); return d; } },
    setJSON(k, v){ return this.set(k, JSON.stringify(v)); }
  };
}
// A saved top-n list. add() returns the new entry's rank (0 is best) and whether saving worked.
function scoreTable(store, n = 5, key = "scores", better = (a, b) => b.score - a.score){
  const list = store.getJSON(key, []);
  return { list, add(entry){ list.push(entry); list.sort(better); list.length = Math.min(list.length, n); return { rank: list.indexOf(entry), saved: store.setJSON(key, list) }; } };
}

// sounds: { name: base64 }; music: { name: { data, loopStart, loopEnd } }, looped between margins cut from the
// recording so MP3 padding never lands inside the loop. vol: per-sound gain (volume for the rest). minGap: seconds within which a
// sound plays only once (a volley from many enemies still makes one sound). The mute choice is saved.
function createAudio({ label, store, sounds, music = {}, vol = {}, volume = 0.6, sfxGain = 0.9, musicGain = 0.5, minGap = 0 }){
  let ctx = null, master = null, sfxBus = null, musicBus = null, unlocked = false, waiting = null, song = null, songNode = null, paused = false;

  // the end of the touch (or a key) wakes it.

}

// Touch, the mouse and the keyboard all work at once. INPUT.touch says which was used last (a touch-first device
// starts with touch), so a game shows the hints for it; body.touch hides the keyboard hints in the header.
const INPUT = { touch: false };

addEventListener("pointerdown", e => { if (e.pointerType === "touch") setTouch(true); }, true);
addEventListener("keydown", () => setTouch(false), true);

// work together. down(p), move(p) and up(p) get { x0, y0, x, y } as fractions of the canvas (0 to 1 across and
// down), moved: the furthest it strayed from where it went down, in CSS pixels, and on up, tap: a quick touch that
// barely moved. It listens on the whole stage, so the empty space around the picture works too (fractions there
// fall outside 0 to 1).
function createTouch(cv, { down = () => {}, move = () => {}, up = () => {} }){
  const el = cv.parentElement, live = new Map(), at = e => { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) / r.width, (e.clientY - r.top) / r.height, r]; };

    e.preventDefault(); try { el.setPointerCapture(e.pointerId); } catch (err){}

// The header's Menu and Sound buttons (#menuBtn, #soundBtn). The sound label follows every mute, from anywhere.
function headerButtons(menu, audio){

  const label = () => { s.textContent = audio.muted ? "Sound off" : "Sound on"; s.setAttribute("aria-pressed", String(!audio.muted)); };
  audio.toggleMute = () => { toggle(); label(); };

  m.addEventListener("click", () => { m.blur(); audio.unlock(); menu.toggle(); });

// The short names every game draws with, on whichever screen get() returns (it changes when the page is re-fitted).
function pen(get){

    center: (gy, s, rgb) => get().center(gy, s, rgb), sprite: (art, x, y, rgb, k, layer) => get().sprite(art, x, y, rgb, k, layer) };

// Sizes the canvas to w x h CSS pixels (scaled down by k < 1 if it must shrink to fit) and the drawing to the device.
function sizeCanvas(cv, ctx, w, h, dpr, k = 1){
  cv.style.width = w + "px"; cv.style.height = h + "px";
  cv.style.transform = "translate(-50%,-50%)" + (k < 1 ? " scale(" + k + ")" : "");
  cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    screen = new Screen(f, D); screen.fit(r.width, r.height, dpr);

// The frame loop: step(dt, t) at most ~60 times a second (120 Hz displays call more often than a game needs),

/* ---------- effects: sparks, embers, smoke, debris and light ---------- */

const PAL = {

  ice:   [[0.04, 0.1, 0.3], [0.15, 0.4, 0.9], [0.5, 1.0, 1.6], [1.6, 2.0, 2.4]],
  toxic: [[0.05, 0.2, 0.04], [0.2, 0.7, 0.1], [0.7, 1.6, 0.3], [1.8, 2.4, 1.0]],
  spark: [[0.6, 0.3, 0.1], [1.6, 1.2, 0.5], [2.4, 2.2, 1.6]],
  smoke: [[0.05, 0.05, 0.06], [0.13, 0.12, 0.13], [0.22, 0.2, 0.2]],

    }

    // drift up, then smoke that swells and thins. Phases after pixelfx: fast attack, slow release.
    explode(x, y, R, pal = PAL.fire){

  U: "55557", V: "55552", W: "55775", X: "55255", Y: "55222", Z: "71247",
  0: "25552", 1: "26227", 2: "61247", 3: "61216", 4: "55711", 5: "74616", 6: "34757", 7: "71222", 8: "75757", 9: "75716",
  "!": "22202", "-": "00700", ".": "00002", ":": "02020", "<": "12421", ">": "42124", "^": "25000", "|": "22222", "+": "02720",
  "(": "12221", ")": "42224", "/": "11244", "'": "22000", ",": "00024", "?": "61202", "*": "05250", "#": "57575", "=": "07070", "_": "00007", "$": "36236"
} };
(() => {
const $ = id => document.getElementById(id);
const cv = $("cv"), ctx = cv.getContext("2d", { alpha: false }), stage = $("stage");
// A meadow of grass squares with mines buried under some. Dig a square to see how many mines touch it; flag the
// ones you think hide a mine. Drawn as pixel art (src/pixel.js), one tile T pixels square, under a HUD band, with
// the HUD and menu in the pixel font at its native size. The picture is at least MIN_W x MIN_H pixels below the HUD,
// so the menu (36 letters wide) fits; a smaller field sits in the middle of a hedge.
const T = 12, HUD = 22, MIN_W = 144, MIN_H = 144;
const LEVELS = { easy: [9, 9, 10], medium: [16, 16, 40], hard: [30, 16, 99], custom: null };   // columns, rows, mines (wide)
const NAMES = Object.keys(LEVELS);
// Custom fields, as in the Windows game: 9 to 30 across, 9 to 24 down, 10 mines up to (w - 1) x (h - 1)
const CW = [9, 30], CH = [9, 24], maxMines = c => (c.w - 1) * (c.h - 1);
const GRASS = [[84, 158, 68], [94, 170, 76]], DIRT = [[150, 110, 70], [140, 102, 64]], SCORCH = [60, 44, 36];
const NUM = [null, [90, 170, 255], [120, 230, 110], [255, 110, 90], [200, 140, 255], [255, 196, 70], [90, 232, 220], [244, 244, 244], [176, 176, 176]];
const DIGITS = [null,   // 5 x 7, the tiles' numbers
  ["..#..", ".##..", "..#..", "..#..", "..#..", "..#..", ".###."], [".###.", "#...#", "....#", "...#.", "..#..", ".#...", "#####"],
  ["####.", "....#", "....#", ".###.", "....#", "....#", "####."], ["...#.", "..##.", ".#.#.", "#..#.", "#####", "...#.", "...#."],
  ["#####", "#....", "####.", "....#", "....#", "#...#", ".###."], [".###.", "#....", "#....", "####.", "#...#", "#...#", ".###."],
  ["#####", "....#", "...#.", "..#..", ".#...", ".#...", ".#..."], [".###.", "#...#", "#...#", ".###.", "#...#", "#...#", ".###."]];
const WHITE = [1.6, 1.6, 1.6], DIM = [0.4, 0.45, 0.6], ACCENT = [1.6, 1.3, 0.5], RED = [1.8, 0.4, 0.3], GREEN = [0.6, 1.6, 0.6];

applyArcadeSettings(defaultDisplay());   // the tube TV filter from the shared Settings page
const store = prefs("meadowMines.v1.", "Meadow Mines");
const audio = createAudio({ label: "Meadow Mines", store, sounds: CRATER_SFX, volume: 1, minGap: 0.05 });
const sfx = name => audio.play(name);
const feel = createFeel(), vfx = createFx();
const best = store.getJSON("best", {});   // fastest clear in seconds, per level (not custom fields)
const custom = { w: 20, h: 14, m: 45, ...store.getJSON("custom", {}) };

let pix = null, ready = false, level = NAMES.includes(store.get("level")) ? store.get("level") : "easy", nextLevel = level;
let bc = 0, br = 0, BX = 0, BY = HUD, nMines = 0, mine, open, flag, cnt, gone, nOpen = 0, nFlags = 0;
let state = "ready", time = 0, overT = 0, boomQ = [], hitAt = -1, digMode = true, cursor = { x: 0, y: 0 }, msg = "";

/* ---------- the field ---------- */
function newField(){
  level = nextLevel; store.set("level", level);
  const [w, h, m] = LEVELS[level] || [custom.w, custom.h, custom.m], r = stage.getBoundingClientRect();
  [bc, br] = r.height > r.width && w > h ? [h, w] : [w, h];   // a long field stands up on a phone held upright
  nMines = m; const n = bc * br;
  mine = new Uint8Array(n); open = new Uint8Array(n); flag = new Uint8Array(n); cnt = new Uint8Array(n); gone = new Uint8Array(n);
  nOpen = nFlags = 0; state = "ready"; time = overT = 0; boomQ = []; hitAt = -1; msg = "";
  cursor = { x: bc >> 1, y: br >> 1 }; vfx.clear();
  layout();
}
const around = i => {
  const x = i % bc, y = (i / bc) | 0, out = [];
  for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++){
    const X = x + dx, Y = y + dy;
    if ((dx || dy) && X >= 0 && Y >= 0 && X < bc && Y < br) out.push(Y * bc + X);
  }
  return out;
};
// Mines are laid at the first dig, away from it, so the first square always opens ground.
function lay(first){
  const keep = new Set([first, ...around(first)]), spots = [];
  for (let i = 0; i < bc * br; i++) if (!keep.has(i)) spots.push(i);
  for (let k = 0; k < nMines; k++){ const j = k + Math.floor(Math.random() * (spots.length - k)); [spots[k], spots[j]] = [spots[j], spots[k]]; mine[spots[k]] = 1; }
  for (let i = 0; i < bc * br; i++) cnt[i] = around(i).reduce((s, j) => s + mine[j], 0);
}
function dig(i){
  if (state === "ready"){ lay(i); state = "play"; }
  if (state !== "play" || open[i] || flag[i]) return;
  if (mine[i]) return lose(i);
  const todo = [i]; let n = 0;   // empty ground opens its neighbours too
  while (todo.length){
    const j = todo.pop(); if (open[j] || flag[j]) continue;
    open[j] = 1; nOpen++; n++;
    if (!cnt[j]) todo.push(...around(j));
  }
  const [x, y] = mid(i); vfx.debris(x, y, n > 1 ? 3 : 2, PAL.dirt, n > 1 ? 10 : 5);
  sfx("dirt");
  if (nOpen === bc * br - nMines) win();
}
// Digging an open number whose mines are all flagged digs every square around it.
function chord(i){
  const ns = around(i);
  if (ns.reduce((s, j) => s + flag[j], 0) !== cnt[i]) return;
  for (const j of ns) if (!open[j] && !flag[j]) dig(j);
}
function act(i, flagIt){
  if (state === "lost" || state === "won") return;
  if (open[i]) return chord(i);
  if (!flagIt) return dig(i);
  flag[i] ^= 1; nFlags += flag[i] ? 1 : -1; sfx("switch");
  if (navigator.vibrate) navigator.vibrate(12);
}
function lose(i){
  state = "lost"; hitAt = i; open[i] = 1;
  blow(i); feel.freeze(0.08);
  // the other mines go off one after another, nearest first
  const [x0, y0] = [i % bc, (i / bc) | 0], rest = [];
  for (let j = 0; j < bc * br; j++) if (mine[j] && j !== i && !flag[j]) rest.push(j);
  rest.sort((a, b) => Math.hypot(a % bc - x0, ((a / bc) | 0) - y0) - Math.hypot(b % bc - x0, ((b / bc) | 0) - y0));
  boomQ = rest.map((j, k) => ({ j, t: 0.35 + k * Math.min(0.12, 2 / rest.length) }));
  msg = "BOOM!";
}
function blow(i){
  gone[i] = 1; const [x, y] = mid(i);
  vfx.explode(x, y, 6); feel.shake(boomQ.length ? 3 : 6, 0.3); sfx(boomQ.length ? "boom" : "bigboom");
}
function win(){
  state = "won";
  for (let i = 0; i < bc * br; i++) if (mine[i] && !flag[i]){ flag[i] = 1; nFlags++; }
  const s = Math.floor(time), prev = best[level];
  msg = "CLEARED IN " + s + "S";
  if (level !== "custom" && (prev === undefined || s < prev)){ best[level] = s; store.setJSON("best", best); if (prev !== undefined) msg += " - NEW BEST"; }
  for (let k = 0; k < 6; k++) vfx.burst(pix.W * (0.15 + k * 0.14), BY + br * T * 0.4, { n: 12, speed: 120, life: 0.9, g: 160 });
  sfx("win");
}
const mid = i => [BX + (i % bc + 0.5) * T, BY + (((i / bc) | 0) + 0.5) * T];

/* ---------- fitting ---------- */
function layout(){
  if (!bc) return;
  const W = Math.max(bc * T, MIN_W), H = HUD + Math.max(br * T, MIN_H), F = PIXEL_FONT;
  BX = (W - bc * T) >> 1; BY = HUD + ((H - HUD - br * T) >> 1);
  if (!pix || pix.W !== W || pix.H !== H){ pix = createPixels(W, H, Math.floor(W / F.w), Math.floor(H / F.h), 1); pix.font = F; }
  ready = pix.fit(stage, cv, ctx);
}
// the DIG / FLAG switch in the middle of the HUD, in pixels
const button = () => { const w = Math.max(30, Math.round(pix.W * 0.3)); return { x: (pix.W - w) >> 1, y: 3, w, h: HUD - 6 }; };

/* ---------- drawing ---------- */
const hash = (x, y) => (((x * 73856093) ^ (y * 19349663)) >>> 0) % 997;
function grass(x0, y0, tx, ty, pressed){
  const R = pix.ramp(GRASS[(tx + ty) & 1]), h = hash(tx, ty);
  for (let y = 0; y < T; y++) for (let x = 0; x < T; x++){
    const edge = pressed ? 2 : y === 0 || x === 0 ? 3 : y === T - 1 || x === T - 1 ? 1 : 2;
    pix.px(x0 + x, y0 + y, R[pressed ? 1 : edge], 2);
  }
  if (pressed) return;
  for (let k = 0; k < 3; k++){   // a few tufts
    const x = 2 + (h * (k + 3)) % (T - 4), y = 3 + (h * (k + 7)) % (T - 5);
    pix.px(x0 + x, y0 + y, R[4], 2); pix.px(x0 + x, y0 + y + 1, R[1], 2);
  }
}
function ground(x0, y0, tx, ty, base){
  const R = pix.ramp(base), h = hash(tx, ty);
  pix.rect(x0, y0, T, T, R[2], 1);
  pix.px(x0 + 2 + h % 7, y0 + 2 + (h >> 3) % 7, R[1], 1); pix.px(x0 + 3 + (h >> 2) % 6, y0 + 4 + (h >> 4) % 6, R[3], 1);
}
function digit(x0, y0, d, c){
  for (let r = 0; r < 7; r++) for (let k = 0; k < 5; k++) if (DIGITS[d][r][k] === "#") pix.px(x0 + 4 + k, y0 + 3 + r, c, 3);
}
function drawFlag(x0, y0, wrong){
  pix.rect(x0 + 3, y0 + 9, 6, 2, [70, 60, 50], 3);
  pix.line(x0 + 5, y0 + 2, x0 + 5, y0 + 9, [226, 222, 210], 3);
  for (let r = 0; r < 5; r++) pix.rect(x0 + 6, y0 + 2 + r, 3 - Math.abs(r - 2), 1, [230, 56, 44], 3);
  if (wrong){ pix.line(x0 + 1, y0 + 1, x0 + 10, y0 + 10, [255, 220, 60], 3); pix.line(x0 + 10, y0 + 1, x0 + 1, y0 + 10, [255, 220, 60], 3); }
}
function drawMine(x0, y0){
  const cx = x0 + 6, cy = y0 + 6;
  for (let a = 0; a < 8; a++){ const s = a % 2 ? 4 : 5; pix.line(cx, cy, Math.round(cx + Math.cos(a * Math.PI / 4) * s), Math.round(cy + Math.sin(a * Math.PI / 4) * s), [44, 44, 52], 3); }
  pix.ball(cx - 0.5, cy - 0.5, 3.4, [80, 80, 92], 3, true);
}
function draw(){
  pix.clear();
  const W = pix.W, b = button(), held = [...touches.values()].find(p => p.moved < 12 && !p.done);
  const press = held && state !== "lost" && state !== "won" ? cellAt(held) : -1;
  // the HUD band
  pix.rect(0, 0, W, HUD, [26, 34, 30], 1);
  for (let x = 0; x < W; x++) pix.px(x, HUD - 1, [14, 18, 16], 1);
  for (let y = b.y; y < b.y + b.h; y++) for (let x = b.x; x < b.x + b.w; x++){
    const rim = y === b.y || y === b.y + b.h - 1 || x === b.x || x === b.x + b.w - 1;
    pix.px(x, y, rim ? (digMode ? [140, 104, 66] : [200, 70, 56]) : (digMode ? [64, 46, 30] : [88, 30, 26]), 3);
  }
  // the hedge around a small field, then the field
  const HR = pix.ramp([46, 92, 50]);
  for (let y = HUD; y < pix.H; y++) for (let x = 0; x < W; x++) pix.px(x, y, HR[pix.bayer(x, y) < 0.12 ? 3 : hash(x >> 2, y >> 2) % 5 ? 1 : 2], 1);
  for (let ty = 0; ty < br; ty++) for (let tx = 0; tx < bc; tx++){
    const i = ty * bc + tx, x0 = BX + tx * T, y0 = BY + ty * T, over = state === "lost";
    if (gone[i]){ ground(x0, y0, tx, ty, i === hitAt ? [200, 60, 40] : SCORCH); continue; }
    if (open[i]){ ground(x0, y0, tx, ty, DIRT[(tx + ty) & 1]); if (cnt[i]) digit(x0, y0, cnt[i], NUM[cnt[i]]); continue; }
    if (over && mine[i] && !flag[i]){ ground(x0, y0, tx, ty, DIRT[(tx + ty) & 1]); drawMine(x0, y0); continue; }
    grass(x0, y0, tx, ty, i === press && !flag[i]);
    if (flag[i]) drawFlag(x0, y0, over && !mine[i]);
  }
  if (!INPUT.touch && state !== "lost" && state !== "won"){   // the keyboard cursor
    const x0 = BX + cursor.x * T, y0 = BY + cursor.y * T, c = [255, 226, 90];
    for (let k = 0; k < T; k++){ pix.px(x0 + k, y0, c, 3); pix.px(x0 + k, y0 + T - 1, c, 3); pix.px(x0, y0 + k, c, 3); pix.px(x0 + T - 1, y0 + k, c, 3); }
  }
  vfx.draw(pix);
  pix.edges();
  // text over it
  const C = pix.cols, hr = 1, bcol = pix.gridAt((b.x + b.w / 2) / W, 0)[0];
  const left = nMines - nFlags, label = digMode ? "DIG" : "FLAG";
  pix.text(1, hr, String(left).padStart(3, " "), left < 0 ? RED : ACCENT);
  pix.text(bcol - (label.length >> 1), hr, label, WHITE);
  pix.text(C - 4, hr, String(Math.min(999, Math.floor(time))).padStart(3, "0"), ACCENT);
  const mr = Math.round(pix.rows * 0.55);
  if (state === "ready" && !menu.open) say(mr, INPUT.touch ? "TAP TO DIG - HOLD TO FLAG" : "CLICK TO DIG - RIGHT-CLICK TO FLAG", WHITE);
  if ((state === "lost" || state === "won") && overT > 0.6 && !menu.open){
    say(mr - 1, msg, state === "won" ? GREEN : RED);
    say(mr + 1, INPUT.touch ? "TAP FOR A NEW FIELD" : "CLICK OR N FOR A NEW FIELD", WHITE);
  }
  if (menu.open) menu.draw(pix, { accent: ACCENT, normal: WHITE, dim: DIM, title: "MEADOW MINES", note: bestNote() });
  pix.present(ctx);
}
// a message over the field: text on MENU_LAYER gets a black box behind it
const say = (row, s, v) => pix.text((pix.cols - s.length - 2) >> 1, row, " " + s + " ", v, MENU_LAYER);
const bestNote = () => "BEST " + ["easy", "medium", "hard"].map(n => n.slice(0, n === "medium" ? 3 : 4).toUpperCase() + " " + (best[n] ?? "--")).join(" ");

/* ---------- input ---------- */
function cellAt(p){
  const x = Math.floor((p.x * pix.W - BX) / T), y = Math.floor((p.y * pix.H - BY) / T);
  return x >= 0 && y >= 0 && x < bc && y < br ? y * bc + x : -1;
}
const nextField = () => { if (overT > 0.6) newField(); };
// A field chosen in the menu starts at once unless a game is under way; then it is used for the next one.
const chosen = () => { if (state !== "play") newField(); };
// Custom sizes step by one (mines by five) and wrap round, so tapping a row alone reaches every value.
const wrap = (v, d, [a, b]) => v + d > b ? a : v + d < a ? b : v + d;
function setCustom(k, d){
  if (k === "m") custom.m = wrap(Math.min(custom.m, maxMines(custom)), 5 * d, [10, maxMines(custom)]);
  else { custom[k] = wrap(custom[k], d, k === "w" ? CW : CH); custom.m = Math.min(custom.m, maxMines(custom)); }
  store.setJSON("custom", custom); chosen();
}
const menu = createMenu(() => [
  { label: "RESUME", select: () => menu.hide() },
  { label: "NEW FIELD", select: () => { menu.hide(); newField(); } },
  { label: "FIELD", value: () => nextLevel.toUpperCase(),
    change: d => { nextLevel = NAMES[(NAMES.indexOf(nextLevel) + (d || 1) + NAMES.length) % NAMES.length]; chosen(); } },
  ...(nextLevel === "custom" ? [
    { label: "  WIDTH", value: () => String(custom.w), change: d => setCustom("w", d || 1) },
    { label: "  HEIGHT", value: () => String(custom.h), change: d => setCustom("h", d || 1) },
    { label: "  MINES", value: () => String(custom.m), change: d => setCustom("m", d || 1) }] : []),
  { label: "SOUND", value: () => audio.muted ? "OFF" : "ON", change: () => audio.toggleMute() },
  { label: "DISPLAY SETTINGS", select: () => { location.href = "settings.html"; } },
  { label: "BACK TO CARTRIDGES", select: () => { location.href = "./"; } }
], { onOpen: () => audio.pause(), onClose: () => audio.resume() });

addEventListener("keydown", e => {
  if (menu.key(e)){ e.preventDefault(); return; }
  const k = e.key, mv = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] }[k];
  if (mv || k === " ") e.preventDefault();
  if (e.repeat && !mv) return;
  audio.unlock();
  if (k === "Escape" || k === "p" || k === "P") return menu.show();
  if (k === "m" || k === "M") return audio.toggleMute();
  if (k === "n" || k === "N" || k === "r" || k === "R") return newField();
  if (state === "lost" || state === "won"){ if (k === " " || k === "Enter") nextField(); return; }
  if (mv){ cursor.x = Math.max(0, Math.min(bc - 1, cursor.x + mv[0])); cursor.y = Math.max(0, Math.min(br - 1, cursor.y + mv[1])); }
  const i = cursor.y * bc + cursor.x;
  if (k === " " || k === "Enter") act(i, false);
  if (k === "f" || k === "F" || k === "x" || k === "X") act(i, true);
});
// Touch and mouse: a tap digs (or flags, with the switch on FLAG); holding a finger still on a square does the other
// one. A right-click flags. Tapping the switch in the HUD flips it.
let button0 = 0;
stage.addEventListener("pointerdown", e => { button0 = e.button; }, true);
stage.addEventListener("contextmenu", e => e.preventDefault());
const HOLD = 0.38;   // seconds a still finger takes to flag
const touches = createTouch(cv, {
  down: p => { audio.unlock(); p.t = 0; },
  up: p => {
    if (p.done || !p.tap || !pix) return;
    if (menu.open) return menu.tap(...pix.gridAt(p.x, p.y));
    if (state === "lost" || state === "won") return nextField();
    const b = button(), x = p.x * pix.W, y = p.y * pix.H;
    if (x >= b.x - 4 && x < b.x + b.w + 4 && y < HUD){ digMode = !digMode; sfx("switch"); return; }
    const i = cellAt(p); if (i < 0) return;
    cursor = { x: i % bc, y: (i / bc) | 0 };
    act(i, button0 === 2 ? true : !digMode);
  }
});
headerButtons(menu, audio);

/* ---------- loop ---------- */
function tick(dt){
  if (!ready) return;
  if (!menu.open && (dt = feel.step(dt))){
    vfx.update(dt);
    if (state === "play") time += dt;
    if (state === "lost" || state === "won") overT += dt;
    for (const q of boomQ) if ((q.t -= dt) <= 0 && !gone[q.j]) blow(q.j);
    for (const p of touches.values()){   // a held finger
      if (p.done || p.moved >= 12 || (p.t += dt) < HOLD || state === "lost" || state === "won") continue;
      p.done = true; const i = cellAt(p);
      if (i >= 0 && !open[i]) act(i, digMode);
    }
  }
  feel.begin(ctx, cv); draw(); feel.end(ctx, cv);
}
newField();
onResize(stage, layout);
startLoop(tick);
})();
</script>
</body></html>
