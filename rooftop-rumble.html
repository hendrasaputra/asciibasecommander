<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Rooftop Rumble</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
/* Shared by the game pages: page layout, the touch gamepad, and the landscape phone layout. Built into each page. */
:root{
  --ground:#E9EDF1; --ink:#20304A; --muted:#5E6A7D; --line:#C9D1DB;
  --btn:#DCE2E9; --accent:#2F5BD3;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#151B26; --ink:#D9E1EC; --muted:#8792A3; --line:#2A3445;
    --btn:#222B3A; --accent:#7FA2FF;
  }
}
:root[data-theme="dark"]{
  --ground:#151B26; --ink:#D9E1EC; --muted:#8792A3; --line:#2A3445;
  --btn:#222B3A; --accent:#7FA2FF;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;overscroll-behavior:none}
body{height:100%;height:100svh;margin:0;touch-action:manipulation;overscroll-behavior:none;-webkit-touch-callout:none;background:var(--ground);color:var(--ink);
  font:15px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  display:flex;flex-direction:column;overflow:hidden;-webkit-user-select:none;user-select:none}
header{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:2px 12px;padding:10px 14px 6px}
h1{font-size:17px;font-weight:650;margin:0;letter-spacing:-0.01em}
h1 a{color:inherit;text-decoration:none}h1 a:hover{text-decoration:underline}
#hud{font:12px/1.2 ui-monospace,"SF Mono",Menlo,Consolas,monospace;color:var(--muted);white-space:nowrap}
#stage{flex:1;position:relative;touch-action:none;margin:0 8px;border:1px solid var(--line);border-radius:6px;overflow:hidden;min-height:0;background:#0B0F16}
#cv{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:block;touch-action:none}
nav{padding:8px 8px 10px;display:flex;flex-direction:column;gap:6px}
button{flex:1 1 auto;min-width:60px;min-height:40px;padding:6px 8px;border:0;border-radius:8px;background:var(--btn);color:var(--ink);font:inherit;font-size:14px;cursor:pointer;touch-action:none}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
/* Touch gamepad, styled after a handheld console: cross-shaped D-pad, slanted A/B, pill SELECT/START */
#gamepad{display:grid;grid-template-columns:auto 1fr auto;grid-template-areas:"dpad . ab" "mid mid mid";align-items:center;row-gap:4px;padding:4px 12px 20px;touch-action:none}
#gamepad[hidden]{display:none}
#dpad{grid-area:dpad;position:relative;width:120px;height:120px;touch-action:none;cursor:pointer}
#dpad::before,#dpad::after{content:"";position:absolute;background:#2A2A31;border-radius:7px;box-shadow:0 4px 0 #0E0E12}
#dpad::before{left:0;right:0;top:40px;height:40px}
#dpad::after{top:0;bottom:0;left:40px;width:40px}
#dpad span{position:absolute;z-index:1;color:#6E6E78;font-size:13px;line-height:1;pointer-events:none;transition:color .05s}
#dpad .l{left:11px;top:53px}#dpad .r{right:11px;top:53px}#dpad .u{left:54px;top:11px}#dpad .d{left:54px;bottom:11px}
#dpad[data-dir="left"] .l,#dpad[data-dir="right"] .r,#dpad[data-dir="up"] .u,#dpad[data-dir="down"] .d{color:#F4F4F8}
#dpad[data-dir="left"]{transform:perspective(300px) rotateY(-8deg)}
#dpad[data-dir="right"]{transform:perspective(300px) rotateY(8deg)}
#dpad[data-dir="up"]{transform:perspective(300px) rotateX(8deg)}
#dpad[data-dir="down"]{transform:perspective(300px) rotateX(-8deg)}
.mid{grid-area:mid;justify-self:center;display:flex;gap:18px;transform:rotate(-22deg)}
.mid button{min-width:0;min-height:0;width:52px;height:16px;padding:0;border-radius:8px;background:#8D8C94;box-shadow:0 3px 0 #55545B;font-size:0;position:relative}
.mid button::after{content:attr(data-label);position:absolute;top:22px;left:50%;transform:translateX(-50%);font:600 10px/1 ui-monospace,Menlo,monospace;letter-spacing:.08em;color:var(--muted)}
.ab{grid-area:ab;display:flex;gap:14px;transform:rotate(-22deg)}
.ab button{min-width:0;min-height:0;width:60px;height:60px;padding:0;border-radius:50%;background:#A3245C;color:#F7D7E6;font:700 19px/1 ui-monospace,Menlo,monospace;box-shadow:0 5px 0 #5E1233}
.ab button:first-child{margin-top:30px}
#gamepad button.on{transform:translateY(3px);box-shadow:0 2px 0 #0E0E12;filter:brightness(.85)}
body.touch #hud{display:none}
/* Phone on its side: D-pad on the left, A/B on the right, game in the middle */
@media (orientation: landscape) and (max-height: 600px){
  body.touch{display:grid;grid-template-columns:auto 1fr auto;grid-template-rows:1fr auto}
  body.touch header{display:none}
  body.touch nav,body.touch #gamepad{display:contents}
  body.touch #stage{grid-column:2;grid-row:1;margin:6px 0 4px}
  body.touch #dpad{grid-column:1;grid-row:1 / 3;align-self:center;justify-self:center;margin:0 18px 70px}
  body.touch .mid{grid-column:1;grid-row:1 / 3;align-self:end;justify-self:center;margin-bottom:46px}
  body.touch .ab{grid-column:3;grid-row:1 / 3;align-self:center;margin:0 18px 0 10px}
}
</style>
</head>
<body>
<header>
  <h1><a href="./" title="Back to the cartridge shelf">&#8249; Rooftop Rumble</a></h1>
  <div id="hud">&uarr; &darr; angle &middot; hold Space for power, let go to throw &middot; Esc menu &middot; M sound</div>
</header>
<div id="stage">
  <canvas id="cv" aria-label="Game screen. Up and down set the angle. Hold Space to build power and let go to throw."></canvas>
</div>
<nav>
  <div id="gamepad" hidden>
    <div id="dpad" role="group" aria-label="Direction pad. Up and down set the angle."><span class="l">&#9664;</span><span class="r">&#9654;</span><span class="u">&#9650;</span><span class="d">&#9660;</span></div>
    <div class="mid"><button data-pad="select" data-label="SELECT" aria-label="Select: open the menu"></button><button data-pad="start" data-label="START" aria-label="Start, continue, or open the menu"></button></div>
    <div class="ab"><button data-pad="b" aria-label="B: hold for power, let go to throw">B</button><button data-pad="a" aria-label="A: hold for power, let go to throw">A</button></div>
  </div>
</nav>
<script>
"use strict";
/* ================= Shared core: physics, light, ink, 24-bit renderer ================= */
const MONO = 'ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace';
const SANS = '-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif';
// The simulated screen is always dark: characters emit light, so they need a black background.
const SCREEN = { bg: "#0B0F16", dot: "#1C2432", line: "#263042", text: "#DCE3EC", muted: "#7C889B", accent: "#7FA2FF", pink: "#F07FB8", lamp: "#FFC857" };
const RAMPS = { classic: " .:-=+*#%@", detailed: " .'`^\",:;Il!i~+_-?]}1)|/tfjrxnuvczXYUJCLQ0OZmwqpdbkhao*#MW&8%B@", blocks: " \u2591\u2592\u2593\u2588" };
function norm(v){ const l = Math.hypot(...v); return v.map(x => x / l); }
const DIR = norm([-0.5, -0.6, 0.65]), SUB = [0.25, 0.75], MREF = 2.4;
const AMB_RGB = [0.55, 0.65, 0.9];     // room light is slightly blue
const FLASH_RGB = [1.0, 0.75, 0.45];   // impact flashes are warm
const FLOOR_ALB = 0.5;                 // share of light the floor reflects
const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5];
const MATS = {
  foam:   { name: "foam",   density: 0.2, e: 0.70, mu: 0.6, kd: 0.95, ks: 0.05, shine: 4,  alb: [0.20, 0.85, 0.72], rMin: 1.6, rMax: 2.4 },
  rubber: { name: "rubber", density: 1.0, e: 0.55, mu: 0.8, kd: 0.85, ks: 0.30, shine: 14, alb: [0.30, 0.48, 1.00], alt: [1.00, 0.38, 0.68], rMin: 1.2, rMax: 1.9 },
  steel:  { name: "steel",  density: 7.0, e: 0.35, mu: 0.2, kd: 0.45, ks: 1.10, shine: 70, alb: [0.72, 0.76, 0.82], rMin: 0.9, rMax: 1.3 },
  peg:    { name: "peg",    density: 0,   e: 0.50, mu: 0.3, kd: 0.80, ks: 0.20, shine: 10, alb: [0.42, 0.47, 0.56] }
};
const MIX = ["rubber", "rubber", "rubber", "rubber", "foam", "foam", "foam", "steel", "steel", "steel"];
function hexToLinear(hex){
  const n = parseInt(hex.slice(1), 16);
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255].map(c => Math.pow(c / 255, 2.2));
}
function defaultDisplay(){
  return { chars: RAMPS.classic, calibrate: true, dither: false, black: 0.15, exposure: 1.3, gamma: 2.2, split: 0.2, glow: 0.35, room: 0.18, lampHex: "#FFD9A0", lampRGB: hexToLinear("#FFD9A0") };
}

/* ---------- arcade display settings (settings.html), shared by the game pages ---------- */
// One choice for every cartridge, saved in this browser: character set, ASCII or pixel drawing, tube TV filter, and
// detail (1, 2 or 3: how many times finer the engine draws its lit bodies and light; see Screen.fit).
const ARCADE_KEY = "arcade.v1.display";
const ARCADE_DEFAULTS = { ramp: "classic", custom: " .:oO0@", mode: "ascii", crt: false, detail: 1 };
function arcadeSettings(){
  let saved = {};
  try { saved = JSON.parse(localStorage.getItem(ARCADE_KEY) || "{}") || {}; }
  catch (e){ console.warn("Arcade: saved display settings unreadable, using defaults", e); }
  return { ...ARCADE_DEFAULTS, ...saved };
}
function saveArcadeSettings(s){
  try { localStorage.setItem(ARCADE_KEY, JSON.stringify(s)); return true; }
  catch (e){ console.warn("Arcade: could not save display settings", e); return false; }
}
function arcadeChars(s){ return s.ramp === "custom" ? (s.custom.length > 1 ? s.custom : " @") : RAMPS[s.ramp] || RAMPS.classic; }
// The tube TV look is CSS laid over the game's #stage: scanlines, a phosphor grille, vignette, rounded glass, flicker.
const CRT_CSS = `
body.crt #stage{background:#050607}
body.crt #cv{border-radius:14px;filter:saturate(1.15) contrast(1.06) brightness(1.1)}
body.crt #stage::before,body.crt #stage::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:2}
body.crt #stage::before{background:repeating-linear-gradient(to bottom,rgba(0,0,0,.24) 0 1px,transparent 1px 3px),
  repeating-linear-gradient(to right,rgba(255,40,40,.06) 0 1px,rgba(40,255,40,.06) 1px 2px,rgba(60,60,255,.06) 2px 3px)}
body.crt #stage::after{border-radius:inherit;background:radial-gradient(ellipse at center,transparent 58%,rgba(0,0,0,.55) 100%);
  box-shadow:inset 0 0 50px rgba(0,0,0,.85),inset 0 0 6px rgba(160,200,255,.15);animation:crt-flicker 5s steps(40) infinite}
@keyframes crt-flicker{0%,100%{opacity:1}47%{opacity:.93}50%{opacity:1}73%{opacity:.96}}
@media (prefers-reduced-motion: reduce){body.crt #stage::after{animation:none}}`;
// Call once at start-up with the game's display: applies the character set, pixel mode and the TV filter.
function applyArcadeSettings(D){
  const s = arcadeSettings();
  D.chars = arcadeChars(s); D.pixels = s.mode === "pixels"; D.detail = Math.max(1, Math.min(3, s.detail | 0 || 1));
  if (!document.getElementById("crt-css")){ const st = document.createElement("style"); st.id = "crt-css"; st.textContent = CRT_CSS; document.head.appendChild(st); }
  document.body.classList.toggle("crt", !!s.crt);
  return s;
}

/* ---------- physics (unchanged from v2) ---------- */
function hit(b, dv){ if (dv > 220) b.flash = Math.max(b.flash, Math.min(1, (dv - 220) / 1000)); }
class World {
  constructor(){ this.bodies = []; this.forces = []; this.w = 300; this.h = 300; this.unit = 10; this.g = { x: 0, y: 0 };
    this.substeps = 4; this.cell = 60; this.grid = new Map(); this.drag = 0; this.onSub = null;
    this.openTop = false;   // true: no ceiling, bodies can fly above y = 0 and fall back
    this.terrain = null;    // optional grid of solid cells: { cw, ch, cols, rows, solid: Uint8Array, mat } (see collideTerrain)
  }
  add(x, y, r, matName, alb, matOverride){
    const M = matOverride || MATS[matName], st = matName === "peg";
    const m = st ? 0 : M.density * (r / this.unit) ** 2;
    const b = { x, y, vx: 0, vy: 0, r, a: Math.random() * 6.283, w: 0, mat: M, alb: alb || M.alb, static: st, m,
      im: st ? 0 : 1 / m, iI: st ? 0 : 1 / (0.4 * m * r * r), grab: null, flash: 0, touch: false };
    this.bodies.push(b);
    if (this.bodies.length > 260){ const i = this.bodies.findIndex(o => !o.static && !o.grab); if (i >= 0) this.bodies.splice(i, 1); }
    return b;
  }
  // A box is a rotating rectangle with half-width hw and half-height hh. Its r is the bounding radius, which the
  // broadphase grid uses; mass uses the same area rule as circles, so equal materials have equal density.
  addBox(x, y, hw, hh, matName, alb, matOverride){
    const b = this.add(x, y, Math.hypot(hw, hh), matName, alb, matOverride);
    b.box = true; b.hw = hw; b.hh = hh;
    if (!b.static){ b.m = b.mat.density * 4 * hw * hh / Math.PI / this.unit ** 2; b.im = 1 / b.m; b.iI = 3 / (b.m * (hw * hw + hh * hh)); }
    return b;
  }
  step(dt){
    let maxR = 1; for (const b of this.bodies) if (b.r > maxR) maxR = b.r;
    this.cell = maxR * 2 + 2;
    const h = dt / this.substeps;
    for (let s = 0; s < this.substeps; s++){ this.substep(h); if (this.onSub) this.onSub(); }
    const decay = Math.pow(0.001, dt); for (const b of this.bodies) b.flash *= decay;
  }
  substep(h){
    const { w, h: H, g } = this;
    for (const b of this.bodies){
      if (b.static) continue;
      const mN = Math.max(0.25, b.m / MREF);
      let ax = g.x, ay = g.y;
      const sp = Math.hypot(b.vx, b.vy);
      if (sp > 0 && this.drag){ const k = this.drag * b.r * sp * b.im; ax -= b.vx * k; ay -= b.vy * k; }
      if (b.grab){ ax += (520 * (b.grab.x - b.x) - 46 * b.vx) / mN; ay += (520 * (b.grab.y - b.y) - 46 * b.vy) / mN; }
      for (const f of this.forces){
        const dx = b.x - f.x, dy = b.y - f.y, d = Math.hypot(dx, dy);
        if (d > 0.001 && d < f.radius){ const k = (1 - d / f.radius) * f.strength / mN; ax += dx / d * k; ay += dy / d * k; }
      }
      b.vx += ax * h; b.vy += ay * h;
      const s2 = Math.hypot(b.vx, b.vy); if (s2 > 4000){ b.vx *= 4000 / s2; b.vy *= 4000 / s2; }
      b.x += b.vx * h; b.y += b.vy * h; b.a += b.w * h; b.w *= 0.9997;
      if (b.box){ this.boxWalls(b); continue; }
      if (b.x - b.r <= 0){ b.x = b.r; this.wall(b, -1, 0, h); }
      if (b.x + b.r >= w){ b.x = w - b.r; this.wall(b, 1, 0, h); }
      if (!this.openTop && b.y - b.r <= 0){ b.y = b.r; this.wall(b, 0, -1, h); }
      if (b.y + b.r >= H){ b.y = H - b.r; this.wall(b, 0, 1, h); }
    }
    for (const b of this.bodies) b.touch = false;
    this.collide(); this.collide(false);   // second pass reuses the grid: positions only moved by sub-pixel corrections
    if (this.terrain) this.collideTerrain();
    for (const b of this.bodies){
      if (b.static) continue;
      if (b.touch && !b.grab && b.vx * b.vx + b.vy * b.vy < 1600){ b.vx *= 0.9; b.vy *= 0.9; b.w *= 0.9; }
      if (!b.box){ b.x = Math.min(w - b.r, Math.max(b.r, b.x)); b.y = Math.min(H - b.r, this.openTop ? b.y : Math.max(b.r, b.y)); }
    }
  }
  // Boxes meet walls at their corners: push back the deepest corner, then apply one impulse at the middle of the
  // corners past the wall, so a box lying flat gets no spurious spin.
  boxWalls(b){
    const c = Math.cos(b.a), s = Math.sin(b.a), ux = c * b.hw, uy = s * b.hw, vx = -s * b.hh, vy = c * b.hh;
    const P = [b.x + ux + vx, b.y + uy + vy, b.x - ux + vx, b.y - uy + vy, b.x - ux - vx, b.y - uy - vy, b.x + ux - vx, b.y + uy - vy];
    for (const [nx, ny, lim] of [[-1, 0, 0], [1, 0, this.w], [0, -1, 0], [0, 1, this.h]]){
      if (ny < 0 && this.openTop) continue;
      let depth = 0, sx = 0, sy = 0, n = 0;
      for (let i = 0; i < 8; i += 2){
        const d = nx ? nx * (P[i] - lim) : ny * (P[i + 1] - lim);   // how far this corner is past the wall
        if (d > 0){ depth = Math.max(depth, d); sx += P[i]; sy += P[i + 1]; n++; }
      }
      if (!n) continue;
      b.x -= nx * depth; b.y -= ny * depth;
      for (let i = 0; i < 8; i += 2){ P[i] -= nx * depth; P[i + 1] -= ny * depth; }
      b.touch = true;
      this.impulse(b, null, sx / n - nx * depth, sy / n - ny * depth, nx, ny);
    }
  }
  // Impulse at contact point (px, py) with normal n pointing from a towards b. b = null is an immovable wall.
  // Includes rotation, so it works for any shape; circle pairs keep their own cheaper path in resolve().
  impulse(a, b, px, py, nx, ny){
    const rax = px - a.x, ray = py - a.y, rbx = b ? px - b.x : 0, rby = b ? py - b.y : 0;
    const bim = b ? b.im : 0, biI = b ? b.iI : 0;
    const rel = () => [(b ? b.vx - b.w * rby : 0) - (a.vx - a.w * ray), (b ? b.vy + b.w * rbx : 0) - (a.vy + a.w * rax)];
    let [rvx, rvy] = rel();
    const vn = rvx * nx + rvy * ny;
    if (vn >= 0) return;
    const ran = rax * ny - ray * nx, rbn = rbx * ny - rby * nx;
    const e = -vn < 30 ? 0 : b ? (a.mat.e + b.mat.e) / 2 : a.mat.e;
    const j = -(1 + e) * vn / (a.im + bim + ran * ran * a.iI + rbn * rbn * biI);
    a.vx -= j * nx * a.im; a.vy -= j * ny * a.im; a.w -= j * ran * a.iI; hit(a, j * a.im);
    if (b){ b.vx += j * nx * bim; b.vy += j * ny * bim; b.w += j * rbn * biI; hit(b, j * bim); }
    [rvx, rvy] = rel();
    const tx = -ny, ty = nx, vt = rvx * tx + rvy * ty, rat = rax * ty - ray * tx, rbt = rbx * ty - rby * tx;
    const lim = (b ? Math.sqrt(a.mat.mu * b.mat.mu) : a.mat.mu) * j;
    const jt = Math.max(-lim, Math.min(lim, -vt / (a.im + bim + rat * rat * a.iI + rbt * rbt * biI)));
    a.vx -= jt * tx * a.im; a.vy -= jt * ty * a.im; a.w -= jt * rat * a.iI;
    if (b){ b.vx += jt * tx * bim; b.vy += jt * ty * bim; b.w += jt * rbt * biI; }
  }
  // Terrain cells are not bodies: each moving body checks only the solid cells under its bounding box, each one
  // treated as a fixed box. So a screen full of terrain costs nothing until something touches it.
  collideTerrain(){
    const T = this.terrain, cell = this.tcell || (this.tcell = { box: true, static: true, a: 0, im: 0, iI: 0, vx: 0, vy: 0, w: 0, flash: 0 });
    cell.hw = T.cw / 2; cell.hh = T.ch / 2; cell.r = Math.hypot(cell.hw, cell.hh); cell.mat = T.mat;
    for (const b of this.bodies){
      if (b.static || b.sensor) continue;
      const c0 = Math.max(0, Math.floor((b.x - b.r) / T.cw)), c1 = Math.min(T.cols - 1, Math.floor((b.x + b.r) / T.cw));
      const r0 = Math.max(0, Math.floor((b.y - b.r) / T.ch)), r1 = Math.min(T.rows - 1, Math.floor((b.y + b.r) / T.ch));
      for (let r = r0; r <= r1; r++) for (let c = c0; c <= c1; c++){
        if (!T.solid[r * T.cols + c]) continue;
        cell.x = (c + 0.5) * T.cw; cell.y = (r + 0.5) * T.ch;
        this.resolve(cell, b);
      }
    }
  }
  resolveBox(a, b){
    const A = a.box ? a : b, B = A === a ? b : a;   // A is always a box
    const C = B.box ? boxBox(A, B) : boxCircle(A, B);
    if (!C) return;
    A.touch = B.touch = true;
    const ws = A.im + B.im, corr = Math.max(0, C.depth - 0.3) / ws * 0.8;
    A.x -= C.nx * corr * A.im; A.y -= C.ny * corr * A.im; B.x += C.nx * corr * B.im; B.y += C.ny * corr * B.im;
    for (const [px, py] of C.pts) this.impulse(A, B, px, py, C.nx, C.ny);
  }
  wall(b, nx, ny, h){
    const M = b.mat; let jn; b.touch = true;
    const vn = b.vx * nx + b.vy * ny;
    if (vn > 0){ const e = vn < 30 ? 0 : M.e, dv = (1 + e) * vn; b.vx -= dv * nx; b.vy -= dv * ny; hit(b, dv); jn = dv * b.m; }

/* ---------- in-game pause menu, shared by the games ---------- */
// Drawn into the game's own screen on MENU_LAYER, above the game's text, so it matches ASCII or pixel mode and
// stays readable.
// The game supplies the rows as a function (labels and values can change): each row is
// { label, value?: () => string, change?: dir => void, select?: () => void }.
// Keys while open: up/down move, left/right change a value, Enter/Space choose, Esc/P close.
function createMenu(rows, { onOpen, onClose, onChange } = {}){
  const m = { open: false, at: 0, box: null };

  m.hide = () => { if (!m.open) return; m.open = false; onClose && onClose(); touched(); };
  m.toggle = () => (m.open ? m.hide() : m.show());

  m.change = d => { const r = rows()[m.at]; if (r.change) r.change(d); else if (d > 0 && r.select) r.select(); touched(); };
  m.choose = () => { const r = rows()[m.at]; if (r.select) r.select(); else if (r.change) r.change(1); touched(); };

    if (!m.open) return false;
    const k = e.key;
    if (k === "ArrowUp" || k === "w" || k === "W") m.move(-1);
    else if (k === "ArrowDown" || k === "s" || k === "S") m.move(1);
    else if (k === "ArrowLeft" || k === "a" || k === "A") m.change(-1);
    else if (k === "ArrowRight" || k === "d" || k === "D") m.change(1);
    else if (k === "Enter" || k === " ") m.choose();
    else if (k === "Escape" || k === "p" || k === "P") m.hide();

  };

  m.tap = (gx, gy) => {
    if (!m.open || !m.box) return false;
    const b = m.box, i = gy - b.y0;
    if (gx < b.x0 || gx >= b.x0 + b.w || gy < b.top || gy >= b.top + b.h){ m.hide(); return true; }

    const w = Math.max(40, Math.min(GW - 2, longest)), h = n + 6 + (note ? 1 : 0), x0 = (GW - w) >> 1, top = Math.max(1, (GH - h) >> 1);

      // written on top later (including dim notes) still shows.
      text(x0, top + y, "|", dim); text(x0 + 1, top + y, " ".repeat(w - 2), [0, 0, 0]); text(x0 + w - 1, top + y, "|", dim);

// Built into every cartridge after core.js and menu.js. Each game keeps only its own rules and drawing.

    get(k, d = null){ try { const v = localStorage.getItem(prefix + k); return v === null ? d : v; } catch (e){ return d; } },
    set(k, v){ try { localStorage.setItem(prefix + k, v); return true; } catch (e){ console.warn(label + ": could not save " + k, e); return false; } },
    getJSON(k, d){ const v = this.get(k); if (v === null) return d; try { return JSON.parse(v); } catch (e){ console.warn(label + ": saved " + k + " unreadable, using defaults", e); return d; } },

// A saved top-n list. add() returns the new entry's rank (0 is best) and whether saving worked.
function scoreTable(store, n = 5, key = "scores", better = (a, b) => b.score - a.score){
  const list = store.getJSON(key, []);
  return { list, add(entry){ list.push(entry); list.sort(better); list.length = Math.min(list.length, n); return { rank: list.indexOf(entry), saved: store.setJSON(key, list) }; } };
}

  const saved = store.get("controls"); if (saved) touch = saved === "touch";
  const buzz = () => navigator.vibrate && navigator.vibrate(8);   // a tick of feedback on phones that support it
  const P = {
    get touch(){ return touch; },
    set(t, save){ touch = t; document.body.classList.toggle("touch", t); pad.hidden = !t; if (save) store.set("controls", t ? "touch" : "keyboard"); },
    toggle(){ P.set(!touch, true); }
  };
  P.set(touch, false);
  const NAMES8 = ["right", "downright", "down", "downleft", "left", "upleft", "up", "upright"];
  function dirAt(e, mode){
    const r = dpad.getBoundingClientRect(), dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2);
    if (mode === "x") return Math.abs(dx) < r.width * 0.1 ? "" : dx < 0 ? "left" : "right";
    if (Math.hypot(dx, dy) < r.width * 0.1) return "";
    if (mode === 8) return NAMES8[(Math.round(Math.atan2(dy, dx) / (Math.PI / 4)) + 8) % 8];
    return Math.abs(dx) > Math.abs(dy) ? (dx < 0 ? "left" : "right") : (dy < 0 ? "up" : "down");
  }
  let dir = "";
  function at(e){
    const m = menu(), d = dirAt(e, m ? 4 : axis);
    if (d === dir) return;
    dir = d; dpad.dataset.dir = d.includes("left") ? "left" : d.includes("right") ? "right" : d;
    if (d) buzz();
    if (m){ if (d) d === "up" ? m.move(-1) : d === "down" ? m.move(1) : m.change(d === "left" ? -1 : 1); return; }   // in a menu: one step per push
    onDir(d);
  }
  dpad.addEventListener("pointerdown", e => { e.preventDefault(); dpad.setPointerCapture(e.pointerId); onAny(); at(e); });
  dpad.addEventListener("pointermove", e => { if (dpad.hasPointerCapture(e.pointerId)) at(e); });
  for (const ev of ["pointerup", "pointercancel"]) dpad.addEventListener(ev, () => { dir = ""; dpad.dataset.dir = ""; if (!menu()) onDir(""); });
  document.querySelectorAll("[data-pad]").forEach(b => {
    const id = b.dataset.pad;
    b.addEventListener("pointerdown", e => {
      e.preventDefault(); b.setPointerCapture(e.pointerId); b.classList.add("on"); buzz(); onAny();
      const m = menu();
      if (m){ id === "a" ? m.choose() : m.hide(); return; }
      onPress(id);
    });
    const up = () => { b.classList.remove("on"); onRelease(id); };
    b.addEventListener("pointerup", up); b.addEventListener("pointercancel", up);
  });
  return P;
}

// The short names every game draws with, on whichever screen get() returns (it changes when the page is re-fitted).
function pen(get){
  return { put: (gx, gy, rgb, k, layer, glyph) => get().cell(gx, gy, rgb, k, layer, glyph), text: (gx, gy, s, rgb) => get().text(gx, gy, s, rgb),
    center: (gy, s, rgb) => get().center(gy, s, rgb), sprite: (art, x, y, rgb, k, layer) => get().sprite(art, x, y, rgb, k, layer) };
}
// Sizes the canvas to w x h CSS pixels (scaled down by k < 1 if it must shrink to fit) and the drawing to the device.
function sizeCanvas(cv, ctx, w, h, dpr, k = 1){
  cv.style.width = w + "px"; cv.style.height = h + "px";
  cv.style.transform = "translate(-50%,-50%)" + (k < 1 ? " scale(" + k + ")" : "");
  cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
// A screen for a game whose rules run on a fixed gw x gh grid: the largest font whose grid fits the stage. Below 5px
// text is unreadable, so a tiny stage (a phone on its side) scales the canvas down instead. null if the stage is hidden.
function fitGrid(stage, cv, ctx, D, gw, gh){
  const r = stage.getBoundingClientRect(); if (!r.width) return null;
  const dpr = Math.min(window.devicePixelRatio || 1, 3);
  let screen;
  for (let f = Math.max(5, Math.ceil(Math.min(r.width / gw / 0.5, r.height / gh / 1.15))); ; f--){
    screen = new Screen(f, D); screen.fit(r.width, r.height, dpr);
    if ((screen.cols >= gw && screen.rows >= gh) || f <= 5) break;
  }
  const W = gw * screen.cw, H = gh * screen.ch;
  screen.fit(W, H, dpr);
  sizeCanvas(cv, ctx, W, H, dpr, Math.min(1, r.width / W, r.height / H));
  return screen;
}
// After a re-fit, bodies keep their place on the grid: scale them by the change in cell size.
function rescaleBodies(world, old, screen){
  if (!old) return;
  const kx = screen.cw / old.cw, ky = screen.ch / old.ch;
  for (const b of world.bodies){ b.x *= kx; b.y *= ky; b.r *= kx; if (b.box){ b.hw *= kx; b.hh *= kx; if (b.hw0){ b.hw0 *= kx; b.hh0 *= kx; } } if (b.r0) b.r0 *= kx; }
}
// Calls fn after real size changes (rotation, window resize), not the mobile address bar sliding in and out,
// which would make the game jump while you play.
function onResize(stage, fn){
  let fitted = stage.getBoundingClientRect();
  new ResizeObserver(() => {
    const r = stage.getBoundingClientRect();
    if (Math.abs(r.width - fitted.width) < 1 && Math.abs(r.height - fitted.height) < fitted.height * 0.15) return;
    fitted = r; fn();
  }).observe(stage);
}
// The frame loop: step(dt, t) at most ~60 times a second (120 Hz displays call more often than a game needs),
// with dt capped at 1/30 s so a stall never makes things jump.
function startLoop(step){
  const FRAME_MS = 1000 / 60;
  let last = 0, next = 0;
  function tick(t){
    requestAnimationFrame(tick);
    if (t < next - 1) return;
    next = t - next > FRAME_MS ? t + FRAME_MS : next + FRAME_MS;
    const dt = Math.min((t - last) / 1000, 1 / 30); last = t;
    step(dt, t);
  }
  requestAnimationFrame(t => { last = t; requestAnimationFrame(tick); });
}

  if (old){ const kx = screen.cw / old.cw, ky = screen.ch / old.ch; for (const p of [...trail, ...lastTrail[0], ...lastTrail[1]]){ p.x *= kx; p.y *= ky; } }
  stars = Array.from({ length: 90 }, () => ({ x: 1 + Math.floor(Math.random() * (GW - 2)), y: 1 + Math.floor(Math.random() * 24), ph: Math.random() * 6.283 }));
}

/* ---------- the city ---------- */
// Buildings of random width and height following one skyline shape. Cell kinds: 1 wall, 2 lit window, 3 dark window.
function makeCity(){
  const solid = new Uint8Array(GW * GH), kind = new Uint8Array(GW * GH), tint = new Uint8Array(GW * GH), buildings = [];
  const shape = ["rise", "fall", "valley", "valley", "valley", "peak"][Math.floor(Math.random() * 6)];
  let h = shape === "fall" || shape === "valley" ? 30 : 12, x = 1;
  while (x < GW - 7){
    const half = x < GW / 2;
    h += shape === "rise" ? 2 : shape === "fall" ? -2 : shape === "valley" ? (half ? -3 : 3) : (half ? 3 : -3);
    const bw = Math.min(GW - 1 - x, 6 + Math.floor(Math.random() * 7));
    const bh = clamp(h + Math.floor(Math.random() * 10), 6, GH - 18), top = GH - bh, tn = Math.floor(Math.random() * 3);
    for (let c = x; c < x + bw; c++) for (let r = top; r < GH; r++){
      const i = r * GW + c, win = (c - x) % 2 === 1 && c < x + bw - 1 && (GH - r) % 2 === 0 && r > top && r < GH - 1;
      solid[i] = 1; tint[i] = tn; kind[i] = win ? (Math.random() < 0.75 ? 2 : 3) : 1;
    }
    buildings.push({ x, w: bw, top });
    x += bw + 1;
  }
  return { solid, kind, tint, buildings };
}
function newMatch(){ score = [0, 0]; roundStarter = 0; newRound(); }
function newRound(){
  world.bodies.length = 0; world.forces.length = 0; blasts = []; fruit = null; trail = []; lastTrail = [[], []]; moonShock = 0;
  city = makeCity();
  world.terrain = { cw: screen.cw, ch: screen.ch, cols: GW, rows: GH, solid: city.solid, mat: BRICK };
  wind = Math.round((Math.random() * 10 - 5) * (Math.random() < 0.33 ? 2 : 1));   // usually gentle, sometimes strong
  world.g = { x: wind * world.h * 0.012, y: world.h * 0.9 };   // wind is sideways gravity
  const B = city.buildings, pick = (a, b) => B[a + Math.floor(Math.random() * (b - a + 1))];
  apes = [pick(1, 2), pick(B.length - 3, B.length - 2)].map(b => ({ x: b.x + ((b.w - AW) >> 1), y: b.top - AH, angle: 45, power: 50, pose: "idle", poseT: 0, dead: false, fallT: 0 }));
  cpu = null;
  turn = roundStarter; roundStarter ^= 1;
  sfx("level_start");
  startTurn();
}
function startTurn(){
  trail = []; stateT = 0; charge = null;
  state = isCpu(turn) ? "cpu" : "aim";
  if (state === "cpu") plan = planShot(turn);
  say(name(turn) + "'S TURN", 1.2);
}
function say(text, secs){ msg = text; msgT = secs; }

/* ---------- difficulty ---------- */
// Easy shows the whole predicted arc and the computer aims loosely; Normal shows the start of the arc; Hard shows
// only the aim pointer, and the computer reads the wind and judges its throws well.
const LEVELS = ["easy", "normal", "hard"];
let level = LEVELS.includes(store.get("difficulty")) ? store.get("difficulty") : "normal";
const ARC_SHARE = { easy: 1, normal: 0.2, hard: 0 };   // how much of the predicted arc is drawn
// The computer's error on its first throw of a round, how much of it is left after each throw, and the least it
// keeps. Measured over many rounds (computer alone), a hit takes about 7 throws on Easy, 4 on Normal and 3 on Hard.
const CPU = { easy: { noise: 0.5, decay: 0.9, floor: 0.14 }, normal: { noise: 0.3, decay: 0.8, floor: 0.06 }, hard: { noise: 0.2, decay: 0.65, floor: 0.03 } };

/* ---------- predicting a throw: the same physics as the engine's step, without touching the world ---------- */
let probe = null;   // the fruit's radius and inverse mass, measured once from a real body
function predict(i, angle, power){
  if (!probe){ const b = world.add(0, 0, screen.ch * 0.35, "steel"); probe = { r: b.r, im: b.im }; world.bodies.splice(world.bodies.indexOf(b), 1); }
  const A = apes[i], dir = i === 0 ? 1 : -1, ang = angle * Math.PI / 180, v = power / 100 * vmax(), h = 1 / 60 / world.substeps;
  let x = cx(A.x + (dir > 0 ? AW - 1 : 0)), y = cy(A.y) - screen.ch, vx = Math.cos(ang) * v * dir, vy = -Math.sin(ang) * v;
  const path = [];
  for (let n = 0; n < 60 * 12 * world.substeps; n++){
    const sp = Math.hypot(vx, vy), k = world.drag * probe.r * sp * probe.im;
    vx += (world.g.x - vx * k) * h; vy += (world.g.y - vy * k) * h;
    const s2 = Math.hypot(vx, vy); if (s2 > 4000){ vx *= 4000 / s2; vy *= 4000 / s2; }
    x += vx * h; y += vy * h;
    if (n % world.substeps === 0) path.push({ x, y });
    const gx = Math.floor(x / screen.cw), gy = Math.floor(y / screen.ch), age = n * h;
    if (x <= probe.r + 1 || x >= world.w - probe.r - 1) return { path, x, y, ape: -1 };
    for (let j = 0; j < 2; j++) if (!apes[j].dead && (j !== i || age > 0.25) && inSprite(APE[apes[j].pose], apes[j].x, apes[j].y, gx, gy)) return { path, x, y, ape: j };
    if (gy >= GH - 1 || (gy >= 0 && gx >= 0 && gx < GW && city.solid[gy * GW + gx])) return { path, x, y, ape: -1 };
  }
  return { path, x, y, ape: -1 };
}

/* ---------- computer opponent: works out the best throw for the city as it is now, then misses by its error ---------- */
// The error shrinks with every throw in a round, faster on Hard: the computer gets its eye in, as people do.
function planShot(i){
  const foe = apes[1 - i], C = CPU[level];
  if (!cpu) cpu = { tries: 0 };
  // Angles every 5 degrees and every power: the throw that comes nearest the middle of the target. A hit counts as
  // much nearer, so a solid hit beats a near miss, and one that only grazes the sprite's edge is the last choice.
  let best = null;
  const tx = cx(foe.x + 3), ty = cy(foe.y + 1);
  for (let angle = 15; angle <= 85; angle += 5) for (let power = 5; power <= 100; power++){
    if (cpu.last && cpu.last.angle === angle && cpu.last.power === power) continue;   // never the same throw that just missed
    const r = predict(i, angle, power), miss = r.ape === i ? 1e9 : Math.hypot(r.x - tx, r.y - ty) + (r.ape === 1 - i ? 0 : 1000);
    if (!best || miss < best.miss) best = { angle, power, miss };
  }
  const e = Math.max(C.floor, C.noise * Math.pow(C.decay, cpu.tries++)), wobble = () => Math.random() * 2 - 1;
  cpu.last = { angle: Math.round(clamp(best.angle + wobble() * e * 25, 5, 85)), power: Math.round(clamp(best.power * (1 + wobble() * e), 5, 100)) };
  return cpu.last;
}

/* ---------- throwing ---------- */
function throwFruit(i){
  const A = apes[i], dir = i === 0 ? 1 : -1, ang = A.angle * Math.PI / 180, v = A.power / 100 * vmax();
  const hx = cx(A.x + (dir > 0 ? AW - 1 : 0)), hy = cy(A.y) - screen.ch;   // from the raised hand
  fruit = world.add(hx, hy, screen.ch * 0.35, "steel");
  fruit.sensor = true;   // flies through everything; checkFruit() decides what it hit
  fruit.vx = Math.cos(ang) * v * dir; fruit.vy = -Math.sin(ang) * v; fruit.w = 14 * dir; fruit.thrower = i; fruit.age = 0;
  A.pose = dir > 0 ? "throwR" : "throwL"; A.poseT = 0.35;
  trail = []; state = "flight"; stateT = 0; sfx("shoot");
}
function inSprite(art, x, y, gx, gy){ const dx = gx - x, dy = gy - y; return dy >= 0 && dy < art.length && dx >= 0 && dx < art[0].length && art[dy][dx] !== " "; }
// Runs after every physics substep, so a fast throw can't skip through a thin wall between frames.
function checkFruit(){
  const b = fruit; if (!b || state !== "flight") return;
  const gx = Math.floor(b.x / screen.cw), gy = Math.floor(b.y / screen.ch);
  if (b.x <= b.r + 1 || b.x >= world.w - b.r - 1) return endShot();   // off the side: a miss
  for (let i = 0; i < 2; i++) if (!apes[i].dead && (i !== b.thrower || b.age > 0.25) && inSprite(APE[apes[i].pose], apes[i].x, apes[i].y, gx, gy)) return apeHit(i, b.thrower);
  if (gy >= GH - 1 || (gy >= 0 && gx >= 0 && gx < GW && city.solid[gy * GW + gx])){ explode(b.x, b.y, 2.0); return endShot(); }
  if (inSprite(MOON.calm, MOON_X, MOON_Y, gx, gy)){ if (moonShock <= 0) sfx("hit"); moonShock = 1.5; }   // the moon flinches; the throw carries on
}
function removeFruit(){ if (fruit){ world.bodies.splice(world.bodies.indexOf(fruit), 1); fruit = null; } }
function endShot(){
  const i = turn;
  lastTrail[i] = trail; removeFruit();
  state = "settle"; stateT = 0;
}

/* ---------- blasts ---------- */
// Clears the terrain cells in the blast, turns some into tumbling rubble boxes, and shoves loose debris away.
function explode(x, y, rRows){
  const R = rRows * screen.ch;
  blasts.push({ x, y, t: 0.45 }); sfx("explode");
  const c0 = Math.max(0, Math.floor((x - R) / screen.cw)), c1 = Math.min(GW - 1, Math.floor((x + R) / screen.cw));
  const r0 = Math.max(0, Math.floor((y - R) / screen.ch)), r1 = Math.min(GH - 1, Math.floor((y + R) / screen.ch));
  for (let r = r0; r <= r1; r++) for (let c = c0; c <= c1; c++){
    const i = r * GW + c, dx = cx(c) - x, dy = cy(r) - y, d = Math.hypot(dx, dy);
    if (d > R || !city.solid[i]) continue;
    if (Math.random() < 0.55){
      const rgb = city.kind[i] === 2 ? WINDOW_RGB.map(v => v * 0.5) : BUILDING_RGB[city.tint[i]];
      const b = world.addBox(cx(c), cy(r), screen.cw * 0.45, screen.ch * 0.38, "brick", rgb, BRICK), sp = 150 + Math.random() * 350;
      b.vx = dx / (d || 1) * sp; b.vy = dy / (d || 1) * sp - 150; b.w = (Math.random() - 0.5) * 20; b.flash = 0.6; b.life = 4 + Math.random() * 2;
    }
    city.solid[i] = 0; city.kind[i] = 0;
  }
  world.forces.push({ x, y, radius: R * 2.2, strength: world.h * 60, t: 0.08 });
}
function apeHit(i, thrower){
  const A = apes[i], ax = cx(A.x + 3), ay = cy(A.y + 1);
  removeFruit();
  explode(ax, ay, 1.4);
  for (let k = 0; k < 16; k++){
    const a = Math.random() * 6.283, sp = 150 + Math.random() * 400, b = world.add(ax, ay, screen.cw * (0.5 + Math.random() * 0.3), "debris", PLAYER_RGB[i].map(v => v * 0.6), DEBRIS);
    b.vx = Math.cos(a) * sp; b.vy = Math.sin(a) * sp - 200; b.flash = 1; b.life = 3 + Math.random() * 2; b.r0 = b.r;
  }
  A.dead = true; sfx("death");
  const winner = i === thrower ? 1 - i : thrower;
  score[winner]++;
  say(i === thrower ? "OOPS! " + name(i) + " HIT THEMSELF" : "DIRECT HIT!", 2.4);
  state = "hit"; stateT = 0;
}

/* ---------- update ---------- */
function update(dt){
  stateT += dt; msgT -= dt; moonShock -= dt;
  for (const A of apes){
    if (A.poseT > 0 && (A.poseT -= dt) <= 0) A.pose = "idle";
    if (A.dead) continue;
    // an ape whose rooftop was blasted away drops until it lands on something
    let held = A.y + AH >= GH;
    for (let c = A.x; c < A.x + AW && !held; c++) if (city.solid[(A.y + AH) * GW + c]) held = true;
    if (!held && (A.fallT -= dt) <= 0){ A.y++; A.fallT = 0.05; }
  }
  if (state === "aim"){
    const A = apes[turn];
    A.angle = clamp(A.angle + ((keys.up ? 1 : 0) - (keys.down ? 1 : 0)) * 40 * dt, 0, 90);
    if (charge !== null){ charge += dt; const c = (charge / CHARGE_SECS) % 2; A.power = clamp(Math.round((c < 1 ? c : 2 - c) * 100), 1, 100); }
  } else if (state === "cpu"){   // sweep the aim towards the plan, so the player sees it think
    const A = apes[turn], k = Math.min(1, dt * 3);
    A.angle += (plan.angle - A.angle) * k; A.power += (plan.power - A.power) * k;
    if (stateT > 1.3){ A.angle = plan.angle; A.power = plan.power; throwFruit(turn); }
  } else if (state === "flight"){
    if (!fruit.falling && fruit.vy > 0){ fruit.falling = true; sfx("bomb"); }   // the whistle starts as it begins to drop
    fruit.age += dt; trail.push({ x: fruit.x, y: fruit.y }); if (trail.length > 400) trail.shift();
    if (stateT > 12) endShot();   // safety net: a throw that never lands
  } else if (state === "settle" && stateT > 0.7){ turn ^= 1; startTurn(); }
  else if (state === "hit"){
    const w = apes.findIndex(A => !A.dead); if (w >= 0){ apes[w].pose = (stateT * 3.5 | 0) % 2 ? "cheer" : "idle"; }
    if (stateT > 2.4){
      if (Math.max(...score) >= WIN_SCORE){ state = "over"; stateT = 0; sfx(isCpu(score[0] > score[1] ? 0 : 1) ? "game_over" : "wave_clear"); }
      else newRound();
    }
  }
}

/* ---------- drawing ---------- */
const { put, text, center, sprite } = pen(() => screen);   // drawing on the character grid (src/arcade.js)
function blastLight(gx, gy){   // warm light from recent blasts, falling off with distance
  let v = 0;
  for (const B of blasts){ const d = Math.hypot(cx(gx) - B.x, (cy(gy) - B.y) * 0.8) / (screen.ch * 12); if (d < 1) v += (B.t / 0.45) * (1 - d) * 1.4; }
  return v;
}
function drawCity(t){
  const { solid, kind, tint } = city;
  for (let r = 0; r < GH; r++) for (let c = 0; c < GW; c++){
    const i = r * GW + c; if (!solid[i]) continue;
    const base = BUILDING_RGB[tint[i]], roof = r === 0 || !solid[i - GW], f = blasts.length ? blastLight(c, r) : 0;
    let rgb, k, glyph;
    if (kind[i] === 2){ rgb = WINDOW_RGB; k = 0.85 + 0.15 * Math.sin(t * 0.003 + i); glyph = 35; }   // lit window
    else if (kind[i] === 3){ rgb = base; k = 0.25; glyph = 46; }                                       // dark window
    else { rgb = base; k = roof ? 0.9 : 0.5; glyph = roof ? 61 : 58; }                                 // wall; moonlit roof edge
    if (state === "title") k *= 0.45;   // keep the skyline behind the title quiet
    put(c, r, [rgb[0] * k + FLASH[0] * f * 0.4, rgb[1] * k + FLASH[1] * f * 0.4, rgb[2] * k + FLASH[2] * f * 0.4], 1, 1, glyph);
  }
  for (const B of blasts){   // the flash also lights the night air around it
    const gx = Math.floor(B.x / screen.cw), gy = Math.floor(B.y / screen.ch), v = B.t / 0.45;
    for (let r = gy - 6; r <= gy + 6; r++) for (let c = gx - 12; c <= gx + 12; c++){
      const d = Math.hypot((c - gx) / 12, (r - gy) / 6); if (d >= 1 || c < 0 || r < 0 || c >= GW || r >= GH) continue;
      const a = v * (1 - d) * 0.25; screen.add(r * GW + c, FLASH[0] * a, FLASH[1] * a, FLASH[2] * a);
    }
  }
}
function drawTitle(){
  for (let r = 25; r <= 32; r++) for (let c = 8; c < GW - 8; c++) put(c, r, WHITE, 1, 3, 32);   // a dark panel behind the menu
  [["ROOFTOP", 12], ["RUMBLE", 19]].forEach(([word, y0], wi) => {
    const x0 = Math.floor((GW - word.length * 12 + 2) / 2);
    [...word].forEach((ch, li) => FONT[ch].forEach((row, dy) => { for (let dx = 0; dx < 5; dx++) if (row[dx] === "#")
      for (const k of [0, 1]) put(x0 + li * 12 + dx * 2 + k, y0 + dy, wi ? PLAYER_RGB[1] : PLAYER_RGB[0], 1.3, 3, 35); }));
  });
  const blink = (performance.now() / 500 | 0) % 2;
  if (pad.touch){
    center(27, "A  ONE PLAYER (VS COMPUTER)     B  TWO PLAYERS", blink ? WHITE : DIM);
    center(29, "D-PAD UP/DOWN ANGLE.  HOLD A OR B FOR POWER, LET GO TO THROW", DIM);
  } else {
    center(27, "1  ONE PLAYER (VS COMPUTER)     2  TWO PLAYERS", blink ? WHITE : DIM);
    center(29, "UP/DOWN ANGLE   HOLD SPACE FOR POWER, LET GO TO THROW   ESC MENU", DIM);
  }
  center(31, "FIRST TO " + WIN_SCORE + " HITS WINS. MIND THE WIND.   DIFFICULTY: " + level.toUpperCase() + " (MENU)", DIM);
}
function draw(t){
  screen.clear();
  for (const s of stars){ const v = 0.06 + 0.05 * Math.sin(t * 0.0015 + s.ph); put(s.x, s.y, [v, v, v * 1.3], 1, 0, 46); }
  sprite(moonShock > 0 ? MOON.shock : MOON.calm, MOON_X, MOON_Y, [1.5, 1.5, 1.2], 1, 2);
  if (city) drawCity(t);
  for (const b of world.bodies) if (!b.sensor) screen.sphere(b, moonLight, { stripe: false });
  if (state === "title"){ drawTitle(); drawMenu(); screen.render(ctx); return; }
  apes.forEach((A, i) => { if (!A.dead) sprite(APE[A.pose], A.x, A.y, PLAYER_RGB[i], i === turn && state !== "hit" ? 1.15 : 0.8, 3); });
  if (state === "aim" || state === "cpu"){
    const A = apes[turn], dir = turn === 0 ? 1 : -1, ang = A.angle * Math.PI / 180;
    for (const p of lastTrail[turn]) put(Math.floor(p.x / screen.cw), Math.floor(p.y / screen.ch), PLAYER_RGB[turn], 0.18, 0, 46);   // your last throw, faintly
    const hx = A.x + (dir > 0 ? AW - 1 : 0) + 0.5, hy = A.y - 0.5, n = 2 + Math.round(A.power / 14);
    for (let k = 1; k <= n; k++) put(Math.floor(hx + Math.cos(ang) * dir * k * 1.6), Math.floor(hy - Math.sin(ang) * k * 0.8), PLAYER_RGB[turn], k === n ? 1.3 : 0.6, 3, k === n ? 43 : 46);
    // the predicted arc, as dots: all of it on Easy, its start on Normal (only for people, not the computer)
    const share = ARC_SHARE[level];
    if (share && state === "aim"){
      const key = turn + "," + Math.round(A.angle) + "," + Math.round(A.power) + "," + wind;
      if (!arc || arc.key !== key) arc = { key, ...predict(turn, Math.round(A.angle), Math.round(A.power)) };
      const pts = arc.path, m = Math.ceil(pts.length * share);
      for (let k = 6; k < m; k += 3){ const p = pts[k], gy = Math.floor(p.y / screen.ch); if (gy >= 1) put(Math.floor(p.x / screen.cw), gy, PLAYER_RGB[turn], 0.5 * (1 - k / (m + 6)) + 0.25, 3, 46); }
      if (share === 1 && arc.ape === 1 - turn){ const p = pts[pts.length - 1]; put(Math.floor(p.x / screen.cw), Math.floor(p.y / screen.ch), WHITE, 1.4, 3, 88); }   // it would hit: an X marks it
    }
  }
  for (const p of trail) put(Math.floor(p.x / screen.cw), Math.floor(p.y / screen.ch), FRUIT_RGB, 0.25, 0, 46);
  if (fruit){
    const gx = Math.floor(fruit.x / screen.cw), gy = Math.floor(fruit.y / screen.ch);
    if (gy >= 1) put(gx, gy, FRUIT_RGB, 1, 3, "(^)v".charCodeAt(((fruit.a % 6.283 + 6.283) % 6.283) / 1.571 | 0));
    else put(gx, 1, FRUIT_RGB, 0.8, 3, 94);   // above the screen: show where it will come down
  }

  for (let i = 0; i < 2; i++){
    const A = apes[i], s = `${name(i)}  ${score[i]}   ANGLE ${String(Math.round(A.angle)).padStart(2)}  POWER ${String(Math.round(A.power)).padStart(3)}`;
    text(i === 0 ? 1 : GW - 1 - s.length, 0, s, i === turn ? PLAYER_RGB[i] : DIM);
  }
  if (state === "aim" || state === "cpu"){   // power meter, with a | where your last throw was
    const A = apes[turn], W = 30, fill = Math.round(A.power / 100 * W), lp = lastPower[turn];
    const x0 = Math.floor((GW - W - 16) / 2);
    text(x0, 2, "POWER ", PLAYER_RGB[turn]);
    for (let k = 0; k < W; k++){
      const mark = lp !== null && k === Math.min(W - 1, Math.round(lp / 100 * W));
      put(x0 + 6 + k, 2, mark ? WHITE : PLAYER_RGB[turn], k < fill ? 1.2 : mark ? 0.9 : 0.25, 3, mark ? 124 : k < fill ? 35 : 46);
    }
    text(x0 + 7 + W, 2, String(Math.round(A.power)).padStart(3), PLAYER_RGB[turn]);
    if (state === "aim" && charge === null && msgT <= 0) center(3, pad.touch ? "HOLD A OR B FOR POWER, LET GO TO THROW" : "HOLD SPACE FOR POWER, LET GO TO THROW", DIM);
  }
  const arrows = wind === 0 ? "CALM" : (wind < 0 ? "<".repeat(Math.min(5, Math.ceil(-wind / 2))) + " " + -wind : wind + " " + ">".repeat(Math.min(5, Math.ceil(wind / 2))));
  center(1, "WIND " + arrows, WHITE);
  if (state === "over"){
    const w = score[0] > score[1] ? 0 : 1;
    center(8, `  ${name(w)} WINS ${score[w]}-${score[1 - w]}  `, PLAYER_RGB[w]);
    center(10, pad.touch ? "  PRESS START FOR A NEW MATCH  " : "  PRESS SPACE FOR A NEW MATCH  ", WHITE);
  } else if (msgT > 0) center(8, "  " + msg + "  ", WHITE);
  const hint = pad.touch ? " SELECT MENU " : " ESC MENU ";

}
function drawMenu(){
  // the menu writes on its own layer, above the game's text, so nothing shows through its box
  if (menu.open) menu.draw(screen, { accent: FRUIT_RGB, normal: WHITE, dim: DIM, title: state === "title" ? "MENU" : "PAUSED", note: "MODE APPLIES TO THE NEXT MATCH" });
}

/* ---------- input ---------- */
const keys = { up: false, down: false, left: false, right: false };
const KEYMAP = { ArrowUp: "up", w: "up", W: "up", ArrowDown: "down", s: "down", S: "down" };
let nextMode = mode;   // the menu's Mode choice; it takes over when a new match starts
function start(m){ mode = nextMode = m; newMatch(); }
function action(){   // start or continue from the title and win screens
  if (state === "title") start("cpu");
  else if (state === "over") state = "title";
}
function press(){ if (state === "aim"){ if (charge === null){ charge = 0; apes[turn].power = 1; } } else action(); }   // Space, A, B down
function release(){   // Space, A, B up: throw with the power on the meter
  if (state !== "aim" || charge === null) return;
  charge = null; lastPower[turn] = apes[turn].power; throwFruit(turn);
}
// The pause menu (src/menu.js) holds what the old button row did. Open it with Esc or P, SELECT, or a mouse click.
const menu = createMenu(() => [
  { label: "RESUME", select: () => menu.hide() },
  { label: "NEW MATCH", select: () => { menu.hide(); audio.unlock(); start(nextMode); } },
  { label: "MODE", value: () => nextMode === "cpu" ? "VS COMPUTER" : "TWO PLAYERS", change: () => { nextMode = nextMode === "cpu" ? "two" : "cpu"; } },
  { label: "DIFFICULTY", value: () => level.toUpperCase(), change: d => { level = LEVELS[(LEVELS.indexOf(level) + (d || 1) + 3) % 3]; store.set("difficulty", level); arc = null; } },
  { label: "SOUND", value: () => audio.muted ? "OFF" : "ON", change: () => audio.toggleMute() },
  { label: "CONTROLS", value: () => pad.touch ? "TOUCH" : "KEYBOARD", change: () => pad.toggle() },
  { label: "DISPLAY SETTINGS", select: () => { location.href = "settings.html"; } },
  { label: "BACK TO CARTRIDGES", select: () => { location.href = "./"; } }
], {
  onOpen: () => { charge = null; for (const k in keys) keys[k] = false; audio.pause(); },   // opening cancels a charge
  onClose: () => { audio.resume(); }
});
addEventListener("keydown", e => {
  if (menu.key(e)){ e.preventDefault(); return; }
  const k = KEYMAP[e.key]; if (k){ e.preventDefault(); keys[k] = true; }
  if (e.key === " ") e.preventDefault();
  if (e.repeat) return;
  if (e.key === "Escape" || e.key === "p" || e.key === "P"){ audio.unlock(); return menu.show(); }
  if (e.key === "m" || e.key === "M") return audio.toggleMute();
  audio.unlock();
  if (state === "title" && (e.key === "1" || e.key === "2")) return start(e.key === "1" ? "cpu" : "two");
  if (e.key === " " || e.key === "Enter") press();
  if (e.key === "r" || e.key === "R") start(nextMode);
});
addEventListener("keyup", e => { const k = KEYMAP[e.key]; if (k) keys[k] = false; if (e.key === " " || e.key === "Enter") release(); });
addEventListener("blur", () => { for (const k in keys) keys[k] = false; charge = null; });   // leaving the window cancels a charge

const pad = createPad({ store, menu: () => menu.open && menu, onAny: () => audio.unlock(),
  onDir: d => { for (const k in keys) keys[k] = k === d; },
  onPress: id => {
    if (id === "select") return menu.show();
    if (state === "title" && (id === "a" || id === "b")) return start(id === "a" ? "cpu" : "two");
    if (id === "start") return state === "title" || state === "over" ? action() : menu.show();
    press();
  },
  onRelease: id => { if (id === "a" || id === "b") release(); } });
cv.addEventListener("pointerdown", e => {
  audio.unlock();
  if (menu.open){ const [gx, gy] = gridAt(e, cv, GW, GH); menu.tap(gx, gy); return; }
  if (state === "title" || state === "over") action();
  else if (!pad.touch) menu.show();   // a mouse click during play opens the menu
});

/* ---------- loop ---------- */
world.onSub = checkFruit;
function tick(dt, t){
  if (screen && !menu.open){   // the open menu pauses everything
    if (state !== "title" && state !== "over") update(dt);
    for (const B of blasts) B.t -= dt;
    blasts = blasts.filter(B => B.t > 0);
    for (const f of world.forces) f.t -= dt;
    world.forces = world.forces.filter(f => f.t > 0);
    world.step(dt);
    for (const b of world.bodies) if (b.life){ b.life -= dt; if (b.life < 1 && b.r0) b.r = b.r0 * Math.max(0.3, b.life); }
    world.bodies = world.bodies.filter(b => !(b.life <= 0));
  }
  if (screen) draw(t);
}
layout();
city = makeCity();   // a skyline behind the title screen
world.terrain = { cw: screen.cw, ch: screen.ch, cols: GW, rows: GH, solid: city.solid, mat: BRICK };
onResize(stage, layout);
startLoop(tick);
})();
</script>
