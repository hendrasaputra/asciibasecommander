<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Rover Patrol</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
/* Shared by the game pages: page layout, the touch gamepad, and the landscape phone layout. Built into each page. */
:root{
  --ground:#E9EDF1; --ink:#20304A; --muted:#5E6A7D; --line:#C9D1DB;
  --btn:#DCE2E9; --accent:#2F5BD3;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#151B26; --ink:#D9E1EC; --muted:#8792A3; --line:#2A3445;
    --btn:#222B3A; --accent:#7FA2FF;
  }
}
:root[data-theme="dark"]{
  --ground:#151B26; --ink:#D9E1EC; --muted:#8792A3; --line:#2A3445;
  --btn:#222B3A; --accent:#7FA2FF;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;overscroll-behavior:none}
body{height:100%;height:100svh;margin:0;touch-action:manipulation;overscroll-behavior:none;-webkit-touch-callout:none;background:var(--ground);color:var(--ink);
  font:15px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  display:flex;flex-direction:column;overflow:hidden;-webkit-user-select:none;user-select:none}
header{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:2px 12px;padding:10px 14px 6px}
h1{font-size:17px;font-weight:650;margin:0;letter-spacing:-0.01em}
h1 a{color:inherit;text-decoration:none}h1 a:hover{text-decoration:underline}
#hud{font:12px/1.2 ui-monospace,"SF Mono",Menlo,Consolas,monospace;color:var(--muted);white-space:nowrap}
#stage{flex:1;position:relative;touch-action:none;margin:0 8px;border:1px solid var(--line);border-radius:6px;overflow:hidden;min-height:0;background:#0B0F16}
#cv{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:block;touch-action:none}
nav{padding:8px 8px 10px;display:flex;flex-direction:column;gap:6px}
button{flex:1 1 auto;min-width:60px;min-height:40px;padding:6px 8px;border:0;border-radius:8px;background:var(--btn);color:var(--ink);font:inherit;font-size:14px;cursor:pointer;touch-action:none}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
/* Touch gamepad, styled after a handheld console: cross-shaped D-pad, slanted A/B, pill SELECT/START */
#gamepad{display:grid;grid-template-columns:auto 1fr auto;grid-template-areas:"dpad . ab" "mid mid mid";align-items:center;row-gap:4px;padding:4px 12px 20px;touch-action:none}
#gamepad[hidden]{display:none}
#dpad{grid-area:dpad;position:relative;width:120px;height:120px;touch-action:none;cursor:pointer}
#dpad::before,#dpad::after{content:"";position:absolute;background:#2A2A31;border-radius:7px;box-shadow:0 4px 0 #0E0E12}
#dpad::before{left:0;right:0;top:40px;height:40px}
#dpad::after{top:0;bottom:0;left:40px;width:40px}
#dpad span{position:absolute;z-index:1;color:#6E6E78;font-size:13px;line-height:1;pointer-events:none;transition:color .05s}
#dpad .l{left:11px;top:53px}#dpad .r{right:11px;top:53px}#dpad .u{left:54px;top:11px}#dpad .d{left:54px;bottom:11px}
#dpad[data-dir="left"] .l,#dpad[data-dir="right"] .r,#dpad[data-dir="up"] .u,#dpad[data-dir="down"] .d{color:#F4F4F8}
#dpad[data-dir="left"]{transform:perspective(300px) rotateY(-8deg)}
#dpad[data-dir="right"]{transform:perspective(300px) rotateY(8deg)}
#dpad[data-dir="up"]{transform:perspective(300px) rotateX(8deg)}
#dpad[data-dir="down"]{transform:perspective(300px) rotateX(-8deg)}
.mid{grid-area:mid;justify-self:center;display:flex;gap:18px;transform:rotate(-22deg)}
.mid button{min-width:0;min-height:0;width:52px;height:16px;padding:0;border-radius:8px;background:#8D8C94;box-shadow:0 3px 0 #55545B;font-size:0;position:relative}
.mid button::after{content:attr(data-label);position:absolute;top:22px;left:50%;transform:translateX(-50%);font:600 10px/1 ui-monospace,Menlo,monospace;letter-spacing:.08em;color:var(--muted)}
.ab{grid-area:ab;display:flex;gap:14px;transform:rotate(-22deg)}
.ab button{min-width:0;min-height:0;width:60px;height:60px;padding:0;border-radius:50%;background:#A3245C;color:#F7D7E6;font:700 19px/1 ui-monospace,Menlo,monospace;box-shadow:0 5px 0 #5E1233}
.ab button:first-child{margin-top:30px}
#gamepad button.on{transform:translateY(3px);box-shadow:0 2px 0 #0E0E12;filter:brightness(.85)}
body.touch #hud{display:none}
/* Phone on its side: D-pad on the left, A/B on the right, game in the middle */
@media (orientation: landscape) and (max-height: 600px){
  body.touch{display:grid;grid-template-columns:auto 1fr auto;grid-template-rows:1fr auto}
  body.touch header{display:none}
  body.touch nav,body.touch #gamepad{display:contents}
  body.touch #stage{grid-column:2;grid-row:1;margin:6px 0 4px}
  body.touch #dpad{grid-column:1;grid-row:1 / 3;align-self:center;justify-self:center;margin:0 18px 70px}
  body.touch .mid{grid-column:1;grid-row:1 / 3;align-self:end;justify-self:center;margin-bottom:46px}
  body.touch .ab{grid-column:3;grid-row:1 / 3;align-self:center;margin:0 18px 0 10px}
}
</style>
</head>
<body>
<header>
  <h1><a href="./" title="Back to the cartridge shelf">&#8249; Rover Patrol</a></h1>
  <div id="hud">&larr; &rarr; speed &middot; &uarr; / Space jump &middot; X fire &middot; Esc menu &middot; M sound</div>
</header>
<div id="stage">
  <canvas id="cv" aria-label="Game screen. Left slows the rover, Right speeds it up, Up or Space jumps, X fires forward and up."></canvas>
</div>
<nav>
  <div id="gamepad" hidden>
    <div id="dpad" role="group" aria-label="Direction pad. Left slows down, right speeds up, up jumps."><span class="l">&#9664;</span><span class="r">&#9654;</span><span class="u">&#9650;</span><span class="d">&#9660;</span></div>
    <div class="mid"><button data-pad="select" data-label="SELECT" aria-label="Select: open the menu"></button><button data-pad="start" data-label="START" aria-label="Start: start the game, or open the menu"></button></div>
    <div class="ab"><button data-pad="b" aria-label="B: fire">B</button><button data-pad="a" aria-label="A: jump">A</button></div>
  </div>
</nav>
<script>
"use strict";
/* ================= Shared core: physics, light, ink, 24-bit renderer ================= */
const MONO = 'ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace';
const SANS = '-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif';
// The simulated screen is always dark: characters emit light, so they need a black background.
const SCREEN = { bg: "#0B0F16", dot: "#1C2432", line: "#263042", text: "#DCE3EC", muted: "#7C889B", accent: "#7FA2FF", pink: "#F07FB8", lamp: "#FFC857" };
const RAMPS = { classic: " .:-=+*#%@", detailed: " .'`^\",:;Il!i~+_-?]}1)|/tfjrxnuvczXYUJCLQ0OZmwqpdbkhao*#MW&8%B@", blocks: " \u2591\u2592\u2593\u2588" };
function norm(v){ const l = Math.hypot(...v); return v.map(x => x / l); }
const DIR = norm([-0.5, -0.6, 0.65]), SUB = [0.25, 0.75], MREF = 2.4;
const AMB_RGB = [0.55, 0.65, 0.9];     // room light is slightly blue
const FLASH_RGB = [1.0, 0.75, 0.45];   // impact flashes are warm
const FLOOR_ALB = 0.5;                 // share of light the floor reflects
const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5];
const MATS = {
  foam:   { name: "foam",   density: 0.2, e: 0.70, mu: 0.6, kd: 0.95, ks: 0.05, shine: 4,  alb: [0.20, 0.85, 0.72], rMin: 1.6, rMax: 2.4 },
  rubber: { name: "rubber", density: 1.0, e: 0.55, mu: 0.8, kd: 0.85, ks: 0.30, shine: 14, alb: [0.30, 0.48, 1.00], alt: [1.00, 0.38, 0.68], rMin: 1.2, rMax: 1.9 },
  steel:  { name: "steel",  density: 7.0, e: 0.35, mu: 0.2, kd: 0.45, ks: 1.10, shine: 70, alb: [0.72, 0.76, 0.82], rMin: 0.9, rMax: 1.3 },
  peg:    { name: "peg",    density: 0,   e: 0.50, mu: 0.3, kd: 0.80, ks: 0.20, shine: 10, alb: [0.42, 0.47, 0.56] }
};
const MIX = ["rubber", "rubber", "rubber", "rubber", "foam", "foam", "foam", "steel", "steel", "steel"];
function hexToLinear(hex){
  const n = parseInt(hex.slice(1), 16);
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255].map(c => Math.pow(c / 255, 2.2));
}
function defaultDisplay(){
  return { chars: RAMPS.classic, calibrate: true, dither: false, black: 0.15, exposure: 1.3, gamma: 2.2, split: 0.2, glow: 0.35, room: 0.18, lampHex: "#FFD9A0", lampRGB: hexToLinear("#FFD9A0") };
}

/* ---------- arcade display settings (settings.html), shared by the game pages ---------- */
// One choice for every cartridge, saved in this browser: character set, ASCII or pixel drawing, tube TV filter, and
// detail (1, 2 or 3: how many times finer the engine draws its lit bodies and light; see Screen.fit).
const ARCADE_KEY = "arcade.v1.display";
const ARCADE_DEFAULTS = { ramp: "classic", custom: " .:oO0@", mode: "ascii", crt: false, detail: 1 };
function arcadeSettings(){
  let saved = {};
  try { saved = JSON.parse(localStorage.getItem(ARCADE_KEY) || "{}") || {}; }
  catch (e){ console.warn("Arcade: saved display settings unreadable, using defaults", e); }
  return { ...ARCADE_DEFAULTS, ...saved };
}
function saveArcadeSettings(s){
  try { localStorage.setItem(ARCADE_KEY, JSON.stringify(s)); return true; }
  catch (e){ console.warn("Arcade: could not save display settings", e); return false; }
}
function arcadeChars(s){ return s.ramp === "custom" ? (s.custom.length > 1 ? s.custom : " @") : RAMPS[s.ramp] || RAMPS.classic; }
// The tube TV look is CSS laid over the game's #stage: scanlines, a phosphor grille, vignette, rounded glass, flicker.
const CRT_CSS = `
body.crt #stage{background:#050607}
body.crt #cv{border-radius:14px;filter:saturate(1.15) contrast(1.06) brightness(1.1)}
body.crt #stage::before,body.crt #stage::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:2}
body.crt #stage::before{background:repeating-linear-gradient(to bottom,rgba(0,0,0,.24) 0 1px,transparent 1px 3px),
  repeating-linear-gradient(to right,rgba(255,40,40,.06) 0 1px,rgba(40,255,40,.06) 1px 2px,rgba(60,60,255,.06) 2px 3px)}
body.crt #stage::after{border-radius:inherit;background:radial-gradient(ellipse at center,transparent 58%,rgba(0,0,0,.55) 100%);
  box-shadow:inset 0 0 50px rgba(0,0,0,.85),inset 0 0 6px rgba(160,200,255,.15);animation:crt-flicker 5s steps(40) infinite}
@keyframes crt-flicker{0%,100%{opacity:1}47%{opacity:.93}50%{opacity:1}73%{opacity:.96}}
@media (prefers-reduced-motion: reduce){body.crt #stage::after{animation:none}}`;
// Call once at start-up with the game's display: applies the character set, pixel mode and the TV filter.
function applyArcadeSettings(D){
  const s = arcadeSettings();
  D.chars = arcadeChars(s); D.pixels = s.mode === "pixels"; D.detail = Math.max(1, Math.min(3, s.detail | 0 || 1));
  if (!document.getElementById("crt-css")){ const st = document.createElement("style"); st.id = "crt-css"; st.textContent = CRT_CSS; document.head.appendChild(st); }
  document.body.classList.toggle("crt", !!s.crt);
  return s;
}

/* ---------- physics (unchanged from v2) ---------- */
function hit(b, dv){ if (dv > 220) b.flash = Math.max(b.flash, Math.min(1, (dv - 220) / 1000)); }
class World {
  constructor(){ this.bodies = []; this.forces = []; this.w = 300; this.h = 300; this.unit = 10; this.g = { x: 0, y: 0 };
    this.substeps = 4; this.cell = 60; this.grid = new Map(); this.drag = 0; this.onSub = null;
    this.openTop = false;   // true: no ceiling, bodies can fly above y = 0 and fall back
    this.terrain = null;    // optional grid of solid cells: { cw, ch, cols, rows, solid: Uint8Array, mat } (see collideTerrain)
  }
  add(x, y, r, matName, alb, matOverride){
    const M = matOverride || MATS[matName], st = matName === "peg";
    const m = st ? 0 : M.density * (r / this.unit) ** 2;
    const b = { x, y, vx: 0, vy: 0, r, a: Math.random() * 6.283, w: 0, mat: M, alb: alb || M.alb, static: st, m,
      im: st ? 0 : 1 / m, iI: st ? 0 : 1 / (0.4 * m * r * r), grab: null, flash: 0, touch: false };
    this.bodies.push(b);
    if (this.bodies.length > 260){ const i = this.bodies.findIndex(o => !o.static && !o.grab); if (i >= 0) this.bodies.splice(i, 1); }
    return b;
  }
  // A box is a rotating rectangle with half-width hw and half-height hh. Its r is the bounding radius, which the
  // broadphase grid uses; mass uses the same area rule as circles, so equal materials have equal density.
  addBox(x, y, hw, hh, matName, alb, matOverride){
    const b = this.add(x, y, Math.hypot(hw, hh), matName, alb, matOverride);
    b.box = true; b.hw = hw; b.hh = hh;
    if (!b.static){ b.m = b.mat.density * 4 * hw * hh / Math.PI / this.unit ** 2; b.im = 1 / b.m; b.iI = 3 / (b.m * (hw * hw + hh * hh)); }
    return b;
  }
  step(dt){
    let maxR = 1; for (const b of this.bodies) if (b.r > maxR) maxR = b.r;
    this.cell = maxR * 2 + 2;
    const h = dt / this.substeps;
    for (let s = 0; s < this.substeps; s++){ this.substep(h); if (this.onSub) this.onSub(); }
    const decay = Math.pow(0.001, dt); for (const b of this.bodies) b.flash *= decay;
  }
  substep(h){
    const { w, h: H, g } = this;
    for (const b of this.bodies){
      if (b.static) continue;
      const mN = Math.max(0.25, b.m / MREF);
      let ax = g.x, ay = g.y;
      const sp = Math.hypot(b.vx, b.vy);
      if (sp > 0 && this.drag){ const k = this.drag * b.r * sp * b.im; ax -= b.vx * k; ay -= b.vy * k; }
      if (b.grab){ ax += (520 * (b.grab.x - b.x) - 46 * b.vx) / mN; ay += (520 * (b.grab.y - b.y) - 46 * b.vy) / mN; }
      for (const f of this.forces){
        const dx = b.x - f.x, dy = b.y - f.y, d = Math.hypot(dx, dy);
        if (d > 0.001 && d < f.radius){ const k = (1 - d / f.radius) * f.strength / mN; ax += dx / d * k; ay += dy / d * k; }
      }
      b.vx += ax * h; b.vy += ay * h;
      const s2 = Math.hypot(b.vx, b.vy); if (s2 > 4000){ b.vx *= 4000 / s2; b.vy *= 4000 / s2; }
      b.x += b.vx * h; b.y += b.vy * h; b.a += b.w * h; b.w *= 0.9997;
      if (b.box){ this.boxWalls(b); continue; }
      if (b.x - b.r <= 0){ b.x = b.r; this.wall(b, -1, 0, h); }
      if (b.x + b.r >= w){ b.x = w - b.r; this.wall(b, 1, 0, h); }
      if (!this.openTop && b.y - b.r <= 0){ b.y = b.r; this.wall(b, 0, -1, h); }
      if (b.y + b.r >= H){ b.y = H - b.r; this.wall(b, 0, 1, h); }
    }
    for (const b of this.bodies) b.touch = false;
    this.collide(); this.collide(false);   // second pass reuses the grid: positions only moved by sub-pixel corrections
    if (this.terrain) this.collideTerrain();
    for (const b of this.bodies){
      if (b.static) continue;
      if (b.touch && !b.grab && b.vx * b.vx + b.vy * b.vy < 1600){ b.vx *= 0.9; b.vy *= 0.9; b.w *= 0.9; }
      if (!b.box){ b.x = Math.min(w - b.r, Math.max(b.r, b.x)); b.y = Math.min(H - b.r, this.openTop ? b.y : Math.max(b.r, b.y)); }
    }
  }
  // Boxes meet walls at their corners: push back the deepest corner, then apply one impulse at the middle of the
  // corners past the wall, so a box lying flat gets no spurious spin.
  boxWalls(b){
    const c = Math.cos(b.a), s = Math.sin(b.a), ux = c * b.hw, uy = s * b.hw, vx = -s * b.hh, vy = c * b.hh;
    const P = [b.x + ux + vx, b.y + uy + vy, b.x - ux + vx, b.y - uy + vy, b.x - ux - vx, b.y - uy - vy, b.x + ux - vx, b.y + uy - vy];
    for (const [nx, ny, lim] of [[-1, 0, 0], [1, 0, this.w], [0, -1, 0], [0, 1, this.h]]){
      if (ny < 0 && this.openTop) continue;
      let depth = 0, sx = 0, sy = 0, n = 0;
      for (let i = 0; i < 8; i += 2){
        const d = nx ? nx * (P[i] - lim) : ny * (P[i + 1] - lim);   // how far this corner is past the wall
        if (d > 0){ depth = Math.max(depth, d); sx += P[i]; sy += P[i + 1]; n++; }
      }
      if (!n) continue;
      b.x -= nx * depth; b.y -= ny * depth;
      for (let i = 0; i < 8; i += 2){ P[i] -= nx * depth; P[i + 1] -= ny * depth; }
      b.touch = true;
      this.impulse(b, null, sx / n - nx * depth, sy / n - ny * depth, nx, ny);
    }
  }
  // Impulse at contact point (px, py) with normal n pointing from a towards b. b = null is an immovable wall.
  // Includes rotation, so it works for any shape; circle pairs keep their own cheaper path in resolve().
  impulse(a, b, px, py, nx, ny){
    const rax = px - a.x, ray = py - a.y, rbx = b ? px - b.x : 0, rby = b ? py - b.y : 0;
    const bim = b ? b.im : 0, biI = b ? b.iI : 0;
    const rel = () => [(b ? b.vx - b.w * rby : 0) - (a.vx - a.w * ray), (b ? b.vy + b.w * rbx : 0) - (a.vy + a.w * rax)];
    let [rvx, rvy] = rel();
    const vn = rvx * nx + rvy * ny;
    if (vn >= 0) return;
    const ran = rax * ny - ray * nx, rbn = rbx * ny - rby * nx;
    const e = -vn < 30 ? 0 : b ? (a.mat.e + b.mat.e) / 2 : a.mat.e;
    const j = -(1 + e) * vn / (a.im + bim + ran * ran * a.iI + rbn * rbn * biI);
    a.vx -= j * nx * a.im; a.vy -= j * ny * a.im; a.w -= j * ran * a.iI; hit(a, j * a.im);
    if (b){ b.vx += j * nx * bim; b.vy += j * ny * bim; b.w += j * rbn * biI; hit(b, j * bim); }
    [rvx, rvy] = rel();
    const tx = -ny, ty = nx, vt = rvx * tx + rvy * ty, rat = rax * ty - ray * tx, rbt = rbx * ty - rby * tx;
    const lim = (b ? Math.sqrt(a.mat.mu * b.mat.mu) : a.mat.mu) * j;
    const jt = Math.max(-lim, Math.min(lim, -vt / (a.im + bim + rat * rat * a.iI + rbt * rbt * biI)));
    a.vx -= jt * tx * a.im; a.vy -= jt * ty * a.im; a.w -= jt * rat * a.iI;
    if (b){ b.vx += jt * tx * bim; b.vy += jt * ty * bim; b.w += jt * rbt * biI; }
  }
  // Terrain cells are not bodies: each moving body checks only the solid cells under its bounding box, each one
  // treated as a fixed box. So a screen full of terrain costs nothing until something touches it.
  collideTerrain(){
    const T = this.terrain, cell = this.tcell || (this.tcell = { box: true, static: true, a: 0, im: 0, iI: 0, vx: 0, vy: 0, w: 0, flash: 0 });
    cell.hw = T.cw / 2; cell.hh = T.ch / 2; cell.r = Math.hypot(cell.hw, cell.hh); cell.mat = T.mat;
    for (const b of this.bodies){
      if (b.static || b.sensor) continue;
      const c0 = Math.max(0, Math.floor((b.x - b.r) / T.cw)), c1 = Math.min(T.cols - 1, Math.floor((b.x + b.r) / T.cw));
      const r0 = Math.max(0, Math.floor((b.y - b.r) / T.ch)), r1 = Math.min(T.rows - 1, Math.floor((b.y + b.r) / T.ch));
      for (let r = r0; r <= r1; r++) for (let c = c0; c <= c1; c++){
        if (!T.solid[r * T.cols + c]) continue;
        cell.x = (c + 0.5) * T.cw; cell.y = (r + 0.5) * T.ch;
        this.resolve(cell, b);
      }
    }
  }
  resolveBox(a, b){
    const A = a.box ? a : b, B = A === a ? b : a;   // A is always a box
    const C = B.box ? boxBox(A, B) : boxCircle(A, B);
    if (!C) return;
    A.touch = B.touch = true;
    const ws = A.im + B.im, corr = Math.max(0, C.depth - 0.3) / ws * 0.8;
    A.x -= C.nx * corr * A.im; A.y -= C.ny * corr * A.im; B.x += C.nx * corr * B.im; B.y += C.ny * corr * B.im;
    for (const [px, py] of C.pts) this.impulse(A, B, px, py, C.nx, C.ny);
  }
  wall(b, nx, ny, h){
    const M = b.mat; let jn; b.touch = true;
    const vn = b.vx * nx + b.vy * ny;
    if (vn > 0){ const e = vn < 30 ? 0 : M.e, dv = (1 + e) * vn; b.vx -= dv * nx; b.vy -= dv * ny; hit(b, dv); jn = dv * b.m; }

/* ---------- in-game pause menu, shared by the games ---------- */
// Drawn into the game's own screen on MENU_LAYER, above the game's text, so it matches ASCII or pixel mode and
// stays readable.
// The game supplies the rows as a function (labels and values can change): each row is
// { label, value?: () => string, change?: dir => void, select?: () => void }.
// Keys while open: up/down move, left/right change a value, Enter/Space choose, Esc/P close.
function createMenu(rows, { onOpen, onClose, onChange } = {}){
  const m = { open: false, at: 0, box: null };

  m.hide = () => { if (!m.open) return; m.open = false; onClose && onClose(); touched(); };
  m.toggle = () => (m.open ? m.hide() : m.show());

  m.change = d => { const r = rows()[m.at]; if (r.change) r.change(d); else if (d > 0 && r.select) r.select(); touched(); };
  m.choose = () => { const r = rows()[m.at]; if (r.select) r.select(); else if (r.change) r.change(1); touched(); };

    if (!m.open) return false;
    const k = e.key;
    if (k === "ArrowUp" || k === "w" || k === "W") m.move(-1);
    else if (k === "ArrowDown" || k === "s" || k === "S") m.move(1);
    else if (k === "ArrowLeft" || k === "a" || k === "A") m.change(-1);
    else if (k === "ArrowRight" || k === "d" || k === "D") m.change(1);
    else if (k === "Enter" || k === " ") m.choose();
    else if (k === "Escape" || k === "p" || k === "P") m.hide();

  };

  m.tap = (gx, gy) => {
    if (!m.open || !m.box) return false;
    const b = m.box, i = gy - b.y0;
    if (gx < b.x0 || gx >= b.x0 + b.w || gy < b.top || gy >= b.top + b.h){ m.hide(); return true; }

    const w = Math.max(40, Math.min(GW - 2, longest)), h = n + 6 + (note ? 1 : 0), x0 = (GW - w) >> 1, top = Math.max(1, (GH - h) >> 1);

      // written on top later (including dim notes) still shows.
      text(x0, top + y, "|", dim); text(x0 + 1, top + y, " ".repeat(w - 2), [0, 0, 0]); text(x0 + w - 1, top + y, "|", dim);

// Built into every cartridge after core.js and menu.js. Each game keeps only its own rules and drawing.

    get(k, d = null){ try { const v = localStorage.getItem(prefix + k); return v === null ? d : v; } catch (e){ return d; } },
    set(k, v){ try { localStorage.setItem(prefix + k, v); return true; } catch (e){ console.warn(label + ": could not save " + k, e); return false; } },
    getJSON(k, d){ const v = this.get(k); if (v === null) return d; try { return JSON.parse(v); } catch (e){ console.warn(label + ": saved " + k + " unreadable, using defaults", e); return d; } },

// A saved top-n list. add() returns the new entry's rank (0 is best) and whether saving worked.
function scoreTable(store, n = 5, key = "scores", better = (a, b) => b.score - a.score){
  const list = store.getJSON(key, []);
  return { list, add(entry){ list.push(entry); list.sort(better); list.length = Math.min(list.length, n); return { rank: list.indexOf(entry), saved: store.setJSON(key, list) }; } };
}

    if (d === dir) return;

// The short names every game draws with, on whichever screen get() returns (it changes when the page is re-fitted).
function pen(get){
  return { put: (gx, gy, rgb, k, layer, glyph) => get().cell(gx, gy, rgb, k, layer, glyph), text: (gx, gy, s, rgb) => get().text(gx, gy, s, rgb),
    center: (gy, s, rgb) => get().center(gy, s, rgb), sprite: (art, x, y, rgb, k, layer) => get().sprite(art, x, y, rgb, k, layer) };
}

// which would make the game jump while you play.
function onResize(stage, fn){

  new ResizeObserver(() => {
    const r = stage.getBoundingClientRect();
    if (Math.abs(r.width - fitted.width) < 1 && Math.abs(r.height - fitted.height) < fitted.height * 0.15) return;
    fitted = r; fn();

// The frame loop: step(dt, t) at most ~60 times a second (120 Hz displays call more often than a game needs),
// with dt capped at 1/30 s so a stall never makes things jump.

  P: ["####.", "#...#", "####.", "#....", "#...."], A: [".###.", "#...#", "#####", "#...#", "#...#"],
  T: ["#####", "..#..", "..#..", "..#..", "..#.."], L: ["#....", "#....", "#....", "#....", "#####"]
};

const D = defaultDisplay(); D.room = 0.2; D.glow = 0.25; D.lampRGB = [1.0, 0.95, 0.85];   // a low sun on the left
applyArcadeSettings(D);   // character set, pixel mode and TV filter from the shared Settings page
const world = new World(); world.openTop = true;
const sun = { x: 0, y: 0, z: 0, on: true };
let screen = null, state = "title", stateT = 0, stars = [];
let scroll = 0, sc = 0, speed = CRUISE, features = [], genTo = 0, seed = 1, gr = new Int16Array(GW + 16);
let grounded = true, by = 0, vy = 0, wy = [0, 0, 0], airT = 0;
let ufos = [], bombs = [], fShots = [], uShots = [], flashes = [], waveT = 0, fireT = 0;
let score = 0, lives = LIVES, reached = 0, pointT = 0, msg = "", msgT = 0, best = false;
const cx = gx => (gx + 0.5) * screen.cw, cy = gy => (gy + 0.5) * screen.ch;
const bxs = () => 16 + (speed - VMIN);   // the rover's screen column: it moves forward on screen as it speeds up
const bx = () => sc + Math.floor(bxs());   // the rover's left world column
const letter = k => String.fromCharCode(65 + k % 26);
const postX = k => k * SEC + POST;

/* ---------- saved settings, high scores and sound (src/arcade.js) ---------- */
const store = prefs("roverPatrol.v1.", "Rover Patrol"), scores = scoreTable(store);
function saveScore(){ best = score > 0 && scores.add({ score, point: letter(reached) + (reached >= 26 ? "+" : "") }).rank === 0; }
// effects and an original music loop, made by audio/rover-sfx.py
const audio = createAudio({ label: "Rover Patrol", store, sounds: ROVER_SFX, music: { music: ROVER_MUSIC }, volume: 1, musicGain: 0.27 });
const sfx = name => audio.play(name), playMusic = on => audio.music(on ? "music" : null);

function layout(){
  const old = screen; screen = fitGrid(stage, cv, ctx, D, GW, GH) || old; if (screen === old) return;
  const W = GW * screen.cw, H = GH * screen.ch;
  world.w = W; world.h = H; world.unit = screen.cw; world.drag = 2e-4 * (600 / H) ** 2; world.g = { x: 0, y: H * 1.2 };
  sun.x = W * 0.08; sun.y = -H * 0.25; sun.z = H * 0.9;
  rescaleBodies(world, old, screen);
  stars = Array.from({ length: 110 }, () => ({ x: Math.floor(Math.random() * GW), y: 2 + Math.floor(Math.random() * 22), ph: Math.random() * 6.283 }));
}

/* ---------- the course ---------- */
// Each checkpoint section is generated from its own seed, so going back to a checkpoint rebuilds the same course.
function rngFor(s){ let a = s >>> 0; return () => { a = (a + 0x6D2B79F5) >>> 0; let q = a; q = Math.imul(q ^ q >>> 15, q | 1); q ^= q + Math.imul(q ^ q >>> 7, q | 61); return ((q ^ q >>> 14) >>> 0) / 4294967296; }; }
function genSection(s){
  const rnd = rngFor(seed * 1000 + s), d = s;   // difficulty grows with every checkpoint
  let x = s * SEC + POST + 18;
  const end = (s + 1) * SEC + POST - 22;   // keep the ground around each post clear, for a safe restart
  while (x < end){
    const roll = rnd();
    if (roll < 0.4){ const w = 3 + Math.floor(rnd() * Math.min(5, 1 + d / 2)); add({ type: "crater", x, w }); x += w; }
    else if (roll < 0.62 || d < 2) { add({ type: "rock", x, w: 2, h: 1, hp: 1 }); x += 2; }
    else if (roll < 0.8 || d < 4){ add({ type: "rock", x, w: 3, h: 2, hp: 2 }); x += 3; }
    else { add({ type: "mine", x, w: 1 }); x += 1; }
    if (d >= 6 && rnd() < 0.3){ x += 9; add({ type: "rock", x, w: 2, h: 1, hp: 1 }); x += 2; }   // a pair: land, then jump or shoot again
    x += Math.round(16 + Math.max(0, 16 - d) + rnd() * 14);
  }
}
function add(f){ features.push(f); features.sort((a, b) => a.x - b.x); }
const bump = wc => Math.max(0, Math.min(2, Math.round(1 + 0.6 * Math.sin(wc * 0.12) + 0.8 * Math.sin(wc * 0.037 + 2))));
function craterAt(wc){ for (const f of features) if (f.type === "crater" && wc >= f.x && wc < f.x + f.w) return f; return null; }
function inPit(f, wc){ return f.w <= 2 ? true : wc > f.x && wc < f.x + f.w - 1; }   // the deep middle of a crater
function groundRow(wc){
  const f = craterAt(wc);
  let r = GBASE - bump(wc);
  if (f) r += f.w <= 2 ? 2 : (wc === f.x || wc === f.x + f.w - 1) ? 1 : 3;
  return r;
}
// The ground under every screen column (plus a margin for the rover's wheels), and the same as engine terrain.
function computeGround(){
  for (let c = 0; c < gr.length; c++) gr[c] = groundRow(sc + c);
  const solid = world.terrain ? world.terrain.solid : new Uint8Array(GW * GH);
  for (let c = 0; c < GW; c++) for (let r = 0; r < GH; r++) solid[r * GW + c] = r >= gr[c] ? 1 : 0;
  world.terrain = { cw: screen.cw, ch: screen.ch, cols: GW, rows: GH, solid, mat: ROCK };
}
const groundAt = wc => gr[Math.max(0, Math.min(gr.length - 1, wc - sc))];

/* ---------- game flow ---------- */
function newGame(){
  seed = 1 + Math.floor(Math.random() * 1e6);
  score = 0; lives = LIVES; reached = 0; best = false;
  state = "play"; stateT = 0; sfx("start"); playMusic(true);
  respawn();
}
function respawn(){
  world.bodies.length = 0; world.forces.length = 0;
  features = features.filter(f => f.x < reached * SEC); genTo = reached;
  ufos = []; bombs = []; fShots = []; uShots = []; flashes = [];
  speed = CRUISE; scroll = postX(reached) + 3 - (Math.floor(bxs()) + 4); sc = Math.floor(scroll);
  ensureCourse(); computeGround();
  grounded = true; vy = 0; for (let i = 0; i < 3; i++) wy[i] = groundAt(bx() + WHEELS[i]) - 1;
  waveT = 6; pointT = 0; say("POINT " + letter(reached), 1.5);
}
function ensureCourse(){
  while (genTo * SEC < sc + GW + SEC){ genSection(genTo); genTo++; }
  features = features.filter(f => f.x + f.w > sc - 2);
}
function say(text, secs){ msg = text; msgT = secs; }
function die(){
  if (state !== "play") return;
  state = "dead"; stateT = 0; sfx("crash");
  // the rover comes apart: chassis plates and the three wheels fly, then bounce on the ground
  const x0 = bxs(), top = Math.min(...wy) - 2;
  boom(cx(x0 + 4), cy(top + 1), 1.4);
  for (let k = 0; k < 4; k++){
    const b = world.addBox(cx(x0 + 1 + k * 2), cy(top + 1), screen.cw * 1.1, screen.ch * 0.4, "part", ROVER_RGB.map(v => v * 0.35), PART);
    b.vx = (Math.random() - 0.3) * 300; b.vy = -200 - Math.random() * 250; b.w = (Math.random() - 0.5) * 20; b.flash = 1;
  }
  for (const w of WHEELS){
    const b = world.add(cx(x0 + w), cy(wy[0]), screen.ch * 0.55, "rubber", [0.3, 0.3, 0.33]);
    b.vx = (Math.random() - 0.2) * 300; b.vy = -250 - Math.random() * 200; b.w = (Math.random() - 0.5) * 30;
  }
}
function boom(px, py, size, rgb = FLASH, n = 0){   // a flash that lights the ground, a shove, and optional rubble
  flashes.push({ x: px, y: py, t: 0.5, size });
  world.forces.push({ x: px, y: py, radius: screen.ch * 6 * size, strength: world.h * 10, t: 0.06 });
  for (let k = 0; k < n; k++){
    const a = Math.random() * Math.PI, sp = 150 + Math.random() * 350;
    const b = world.add(px, py, screen.ch * (0.25 + Math.random() * 0.25), "rock", rgb, ROCK);
    b.vx = Math.cos(a) * sp; b.vy = -Math.sin(a) * sp; b.w = (Math.random() - 0.5) * 20; b.life = 1.5 + Math.random();
  }
}
function scoreAt(pts, text){ score += pts; if (text) say(text, 0.8); }

/* ---------- update ---------- */
function update(dt){
  stateT += dt; msgT -= dt; pointT += dt;
  for (const f of flashes) f.t -= dt;
  flashes = flashes.filter(f => f.t > 0);
  if (state === "dead"){
    if (stateT > 2.5){
      lives--;
      if (lives <= 0){ state = "over"; stateT = 0; playMusic(false); sfx("over"); saveScore(); }
      else { state = "play"; respawn(); }
    }
    return scrollBy(dt * speed * 0.3);   // the wreck slows to a stop
  }
  if (state !== "play") return;
  // speed: right accelerates, left brakes, otherwise drift back to cruising speed
  if (keys.right) speed = Math.min(VMAX, speed + 14 * dt);
  else if (keys.left) speed = Math.max(VMIN, speed - 14 * dt);
  else speed += Math.sign(CRUISE - speed) * Math.min(Math.abs(CRUISE - speed), 5 * dt);
  scrollBy(speed * dt);
  const x = bx(), mid = x + 4;
  // wheels: on the ground each one follows the ground under it, so the rover rocks over bumps and crater rims
  if (grounded){
    for (let i = 0; i < 3; i++){ const tg = groundAt(x + WHEELS[i]) - 1; wy[i] += (tg - wy[i]) * Math.min(1, dt * 30); if (tg < wy[i]) wy[i] = tg; }
    const pit = craterAt(mid);
    if (pit && inPit(pit, mid)) return die();
  } else {
    airT += dt;
    vy += (jumpHeld && vy < 0 && airT < JUMP_HOLD ? G * HOLD_G : G) * dt; by += vy * dt;
    const land = Math.min(...WHEELS.map(w => groundAt(x + w) - 1));
    if (vy > 0 && by >= land){
      grounded = true; for (let i = 0; i < 3; i++) wy[i] = Math.max(by, groundAt(x + WHEELS[i]) - 1);
      sfx("land");
      for (let k = 0; k < 3; k++){ const b = world.add(cx(bxs() + 1 + k * 3), cy(land), screen.ch * 0.2, "foam", [0.3, 0.28, 0.25]); b.vx = (Math.random() - 0.5) * 200; b.vy = -100 - Math.random() * 120; b.life = 0.6; }
    } else for (let i = 0; i < 3; i++) wy[i] = by;
  }
  if (jumpQueued > 0 && grounded){ grounded = false; by = Math.min(...wy); vy = -JUMPV; airT = 0; jumpQueued = 0; sfx("jump"); }
  jumpQueued = Math.max(0, jumpQueued - dt);
  const bottom = Math.max(...wy);
  for (const f of features){
    if (f.x > x + RW) break;
    if (f.x + f.w <= x + 1){ if (!f.passed){ f.passed = true; if (f.type !== "crater" || f.w > 2) scoreAt(50); } continue; }
    if (f.type === "rock" && f.x <= x + RW - 1 && f.x + f.w - 1 >= x + 1 && bottom >= groundAt(f.x) - f.h) return die();
    if (f.type === "mine" && grounded && f.x >= x + 1 && f.x <= x + 7){ boom(cx(f.x - sc), cy(groundAt(f.x)), 1); return die(); }
  }
  // firing: one shot forward and one straight up, while the button is held
  if ((fireT -= dt) <= 0 && fireHeld && fShots.length < 1 + (uShots.length < 3 ? 1 : 0)){
    fireT = 0.28; sfx("fire");
    const row1 = Math.round(Math.min(...wy)) - 1;
    if (!fShots.length) fShots.push({ x: x + RW, y: row1, d: 0 });
    if (uShots.length < 3) uShots.push({ x: x + 4, y: row1 - 2 });
  }
  for (const s of fShots){
    for (let k = 0, n = Math.ceil(70 * dt); k < n && !s.dead; k++){
      s.x += 70 * dt / n; s.d += 70 * dt / n;
      const wc = Math.floor(s.x);
      for (const f of features) if (f.type === "rock" && wc >= f.x && wc < f.x + f.w && s.y >= groundAt(f.x) - f.h - 1){ hitRock(f); s.dead = true; break; }
    }
    if (s.d > 42) s.dead = true;
  }
  fShots = fShots.filter(s => !s.dead);
  for (const s of uShots){
    s.y -= 45 * dt;
    for (const u of ufos) if (!u.dead && s.x >= u.x + sc && s.x < u.x + sc + 5 && s.y >= u.y - 0.5 && s.y < u.y + 2){ kill(u); s.dead = true; break; }
    for (const b of bombs) if (!s.dead && Math.abs(b.x - s.x) < 1.2 && Math.abs(b.y - s.y) < 1.2){ b.dead = true; s.dead = true; boom(cx(b.x - sc), cy(b.y), 0.6, BOMB_RGB.map(v => v * 0.3), 3); sfx("explode"); scoreAt(50); }
    if (s.y < 1) s.dead = true;
  }
  uShots = uShots.filter(s => !s.dead);
  updateUfos(dt, x);
  for (const b of bombs){
    b.vy += BOMB_G * dt; b.y += b.vy * dt;
    const wc = Math.floor(b.x), top = Math.min(...wy) - 2;
    if (wc >= x && wc < x + RW && b.y >= top - 0.5 && b.y <= bottom + 0.5){ b.dead = true; boom(cx(wc - sc), cy(b.y), 1); return die(); }
    if (b.y >= groundAt(wc) - 0.5){
      b.dead = true; boom(cx(wc - sc), cy(groundAt(wc)), 0.8, [0.3, 0.28, 0.25], 5); sfx("explode");
      const w = b.big ? 3 : 2;
      if (!features.some(f => f.x < wc + w + 1 && f.x + f.w > wc - 1)) add({ type: "crater", x: wc, w, passed: wc + w <= x + 1 });   // the blast leaves a crater
    }
  }
  bombs = bombs.filter(b => !b.dead);
  if (mid >= postX(reached + 1)){
    reached++;
    const bonus = 500 + Math.max(0, Math.round(60 - pointT)) * 10;
    score += bonus; pointT = 0; sfx("point");
    say((reached % 26 === 0 ? "COURSE COMPLETE! " : "POINT " + letter(reached) + "  ") + "BONUS " + bonus, 2);
  }
}
function scrollBy(cols){
  const before = sc; scroll += cols; sc = Math.floor(scroll);
  if (sc !== before){
    const dx = (sc - before) * screen.cw;
    for (const b of world.bodies) b.x -= dx;   // the rubble stays where it fell on the ground
    world.bodies = world.bodies.filter(b => b.x > -b.r * 2);
    for (const f of flashes) f.x -= dx;
    if (state !== "title") ensureCourse();   // the title drives along an empty course
  }
  computeGround();
}
function hitRock(f){
  const px = cx(f.x - sc + f.w / 2), py = cy(groundAt(f.x) - f.h / 2);
  f.hp--; sfx("rock");
  boom(px, py, 0.5, [0.35, 0.32, 0.3], f.hp > 0 ? 4 : 8);
  if (f.hp > 0){ f.w = 2; f.h = 1; scoreAt(50); }   // a big rock breaks down to a small one
  else { features.splice(features.indexOf(f), 1); scoreAt(100); }
}
function kill(u){
  u.dead = true; sfx("explode");
  boom(cx(u.x + 2), cy(u.y + 1), 1, UFO_RGB[u.kind].map(v => v * 0.3), 8);
  scoreAt(u.kind === "bomber" ? 200 : 100, u.kind === "bomber" ? "200" : "100");
}
function updateUfos(dt, x){
  if (reached >= 1 && (waveT -= dt) <= 0){   // UFO waves from the second checkpoint on
    const d = reached, n = 2 + Math.min(3, Math.floor(d / 3));
    waveT = 14 - Math.min(8, d * 0.7) + Math.random() * 6; sfx("ufo");
    for (let i = 0; i < n; i++) ufos.push({ kind: d >= 4 && i % 2 ? "bomber" : "saucer", x: GW + 4 + i * 8, y: 5, y0: 4 + Math.random() * 10,
      home: 30 + Math.random() * 70, ph: Math.random() * 6.283, t: 0, life: 12 + Math.random() * 6, drop: 1.5 + Math.random() * 2 });
  }
  const mid = x + 4;
  for (const u of ufos){
    u.t += dt;
    if (u.t < u.life){
      u.x += (u.home + 14 * Math.sin(u.t * 0.8 + u.ph) - u.x) * Math.min(1, dt * 1.2);
      u.y = u.y0 + 3 * Math.sin(u.t * 1.7 + u.ph);
      // drop a bomb where the rover will be when it lands, with some error so a steady speed isn't fatal
      const T = Math.sqrt(2 * Math.max(1, GBASE - u.y) / BOMB_G), aim = mid + speed * T + (u.err ??= (Math.random() - 0.5) * 6);
      if ((u.drop -= dt) <= 0 && Math.abs(u.x + 2 + sc - aim) < 1.5){
        bombs.push({ x: u.x + 2 + sc, y: u.y + 2, vy: 0, big: u.kind === "bomber" }); sfx("bomb");
        u.drop = (u.kind === "bomber" ? 1.6 : 2.4) - Math.min(1, reached * 0.06) + Math.random(); u.err = undefined;
      }
    } else { u.x += 40 * dt; u.y -= 8 * dt; }
  }
  ufos = ufos.filter(u => !u.dead && u.x < GW + 6 + 8 * 6 && u.y > -3);
}

/* ---------- drawing ---------- */
const { put, text, center, sprite } = pen(() => screen);   // drawing on the character grid (src/arcade.js)
const ball = { a: 0, w: 0, flash: 0, mat: ROCK };
function litBall(px, py, r, alb, mat = ROCK){ ball.x = px; ball.y = py; ball.r = r; ball.alb = alb; ball.mat = mat; screen.sphere(ball, sun, { stripe: false }); }
function flashAt(gx, gy){
  let v = 0;
  for (const f of flashes){ const d = Math.hypot(cx(gx) - f.x, (cy(gy) - f.y) * 0.8) / (screen.ch * 10 * f.size); if (d < 1) v += (f.t / 0.5) * (1 - d) * 1.2; }
  return v;
}
// Far mountains and nearer hills scroll slower than the ground, for depth.
const farH = x => 28 - Math.round(3 * Math.sin(x * 0.045) + 2 * Math.sin(x * 0.13 + 1) + 1.5 * Math.abs(Math.sin(x * 0.29)));
const hillH = x => 33 - Math.round(2 * Math.sin(x * 0.07 + 3) + 1.3 * Math.sin(x * 0.19));
function drawLand(t){
  const fx = Math.floor(scroll * 0.12), hx = Math.floor(scroll * 0.35), lit = flashes.length > 0;
  for (let c = 0; c < GW; c++){
    const fTop = farH(c + fx), hTop = hillH(c + hx), g = gr[c], pit = craterAt(sc + c);
    for (let r = 2; r < GH; r++){
      let rgb, v, layer = 0, glyph = 0;
      if (r >= g){   // the ground: lit from the left on rising slopes, darker with depth
        const slope = (gr[Math.max(0, c - 1)] - gr[Math.min(GW - 1, c + 1)]) * 0.15, depth = r - g;
        v = depth === 0 ? 0.55 + slope : Math.max(0.04, 0.24 - depth * 0.05); rgb = GROUND_RGB; layer = 1;
        if (pit && depth <= 1){ rgb = HAZARD_RGB; v = depth === 0 ? 0.85 : 0.5; glyph = 35; }   // a crater's rim and floor, solid and red
      } else if (r >= hTop){ v = r === hTop ? 0.2 : 0.05; rgb = HILL_RGB; }
      else if (r >= fTop){ v = r === fTop ? 0.16 : 0.035; rgb = FAR_RGB; }
      else continue;
      const f = lit ? flashAt(c, r) : 0;
      put(c, r, [rgb[0] * v + FLASH[0] * f * 0.5, rgb[1] * v + FLASH[1] * f * 0.5, rgb[2] * v + FLASH[2] * f * 0.5], 1, layer, glyph);
    }
  }
  for (const s of stars) if (s.y < farH(s.x + fx)){ const v = 0.07 + 0.05 * Math.sin(t * 0.0015 + s.ph); put(s.x, s.y, [v, v, v * 1.3], 1, 0, 46); }
  litBall(cx(GW - 18), cy(9), screen.ch * 3.2, [0.15, 0.35, 0.75], PART);   // a planet in the sky, lit from the side
}
function drawCourse(t){
  for (const f of features){
    const c = f.x - sc; if (c > GW + 2) break; if (c + f.w < -2) continue;
    if (f.type === "rock"){   // solid red, lighter on top, so it reads as danger in every display mode
      const g = groundAt(f.x), art = f.h > 1 ? [" @ ", "@@@"] : ["@@"];
      art.forEach((row, dy) => { for (let dx = 0; dx < row.length; dx++) if (row[dx] !== " ") put(c + dx, g - art.length + dy, HAZARD_RGB, dy === 0 ? 1 : 0.75, 3, 64); });
    }
    else if (f.type === "mine") put(c, groundAt(f.x) - 1, BOMB_RGB, 0.85 + 0.25 * Math.sin(t * 0.012), 3, 42);   // pulses, but never goes dim
  }
  for (let k = reached; k <= reached + 1; k++){   // checkpoint posts with their letter
    const c = postX(k) - sc; if (c < -3 || c > GW + 3) continue;
    const g = groundAt(postX(k));
    for (let r = g - 4; r < g; r++) put(c, r, DIM, 1.4, 3, 124);
    text(c - 1, g - 6, "[" + letter(k) + "]", k <= reached ? DIM : ACCENT);
  }
}
function drawRover(t){
  const x = Math.floor(bxs()), top = Math.round(Math.min(...wy)) - 2;
  sprite(ROVER, x, top, ROVER_RGB, 1, 3);
  WHEELS.forEach((w, i) => put(x + w, Math.round(wy[i]), WHEEL_RGB, 1, 3, "O0Oo"[((scroll + w) * 2 | 0) & 3].charCodeAt(0)));
}
function drawTitle(){
  [["ROVER", 7], ["PATROL", 14]].forEach(([word, y0], wi) => {
    const x0 = Math.floor((GW - word.length * 12 + 2) / 2);
    [...word].forEach((ch, li) => FONT[ch].forEach((row, dy) => { for (let dx = 0; dx < 5; dx++) if (row[dx] === "#")
      for (const k of [0, 1]) put(x0 + li * 12 + dx * 2 + k, y0 + dy, wi ? ROVER_RGB : UFO_RGB.saucer, 1.2, 3, 35); }));
  });
  const blink = (performance.now() / 500 | 0) % 2;
  center(21, pad.touch ? "PRESS A OR START" : "PRESS SPACE TO START", blink ? WHITE : DIM);
  center(23, pad.touch ? "D-PAD LEFT/RIGHT SPEED   A OR UP JUMP (HOLD: FURTHER)   B FIRE   SELECT MENU" : "LEFT/RIGHT SPEED   UP OR SPACE JUMP (HOLD: FURTHER)   X FIRE   ESC MENU", DIM);
  center(24, "JUMP CRATERS AND MINES. SHOOT ROCKS AHEAD AND UFOS ABOVE.", DIM);
  if (scores.list.length){
    center(27, "HIGH SCORES", ACCENT);
    scores.list.forEach((s, i) => center(28 + i, `${i + 1}. ${String(s.score).padStart(7)}   POINT ${s.point.padEnd(2)}`, i ? DIM : WHITE));
  }
}
function draw(t){
  screen.clear();
  drawLand(t);
  for (const b of world.bodies) screen.sphere(b, sun, { stripe: false });
  if (state === "title"){ drawRover(t); drawTitle(); drawMenu(); screen.render(ctx); return; }
  drawCourse(t);
  if (state === "play") drawRover(t);
  for (const u of ufos) sprite(u.kind === "bomber" ? BOMBER : SAUCER, Math.round(u.x), Math.round(u.y), UFO_RGB[u.kind], 1, 3);
  for (const b of bombs) put(Math.floor(b.x) - sc, Math.round(b.y), BOMB_RGB, 1, 3, b.big ? 64 : 111);
  for (const s of fShots) put(Math.floor(s.x) - sc, s.y, SHOT_RGB, 1, 3, 45);
  for (const s of uShots) put(s.x - sc, Math.round(s.y), SHOT_RGB, 1, 3, 124);
  // HUD: score and lives on the left, the course A..Z in the middle, time on the right
  text(1, 0, "SCORE " + String(score).padStart(6, "0"), WHITE);
  text(1, 1, "HI    " + String(Math.max(score, scores.list[0] ? scores.list[0].score : 0)).padStart(6, "0"), DIM);
  text(GW - 18, 0, "LIVES " + "^".repeat(Math.max(0, lives - (state === "dead" ? 1 : 0))), ROVER_RGB);
  text(GW - 18, 1, "TIME  " + String(Math.floor(pointT)).padStart(3), DIM);
  const x0 = Math.floor((GW - 51) / 2), here = reached % 26;
  for (let k = 0; k < 26; k++) put(x0 + k * 2, 0, k === here ? ACCENT : k < here ? WHITE : DIM, 1, TEXT_LAYER, 65 + k);
  if (state === "over"){
    center(16, "  GAME OVER  ", WHITE);
    center(18, `  ${score} POINTS  `, ACCENT);
    if (best) center(20, "  NEW HIGH SCORE!  ", ACCENT);
    if (stateT > 1) center(22, pad.touch ? "  PRESS START  " : "  PRESS SPACE  ", DIM);
  } else if (msgT > 0) center(4, "  " + msg + "  ", WHITE);
  const hint = pad.touch ? " SELECT MENU " : " ESC MENU ";
  text(GW - 1 - hint.length, GH - 1, hint, DIM);
  drawMenu();
  screen.render(ctx);
}
function drawMenu(){
  // the menu writes on its own layer, above the game's text, so nothing shows through its box
  if (menu.open) menu.draw(screen, { accent: ACCENT, normal: WHITE, dim: DIM, title: state === "title" ? "MENU" : "PAUSED" });
}

/* ---------- input ---------- */
const keys = { left: false, right: false };
const KEYMAP = { ArrowLeft: "left", a: "left", A: "left", ArrowRight: "right", d: "right", D: "right" };
const JUMP_KEYS = new Set(["ArrowUp", "w", "W", " "]), FIRE_KEYS = new Set(["x", "X", "f", "F", "Control", "Enter"]);
let jumpQueued = 0, jumpHeld = false, fireHeld = false;   // jumpQueued: seconds a press waits for the ground
function action(){   // start from the title; back to the title from game over
  if (state === "title") newGame();
  else if (state === "over" && stateT > 1) toTitle();
}
function toTitle(){ state = "title"; features = []; world.bodies.length = 0; ufos = []; bombs = []; speed = CRUISE; }
const menu = createMenu(() => [
  { label: "RESUME", select: () => menu.hide() },
  { label: state === "title" ? "START GAME" : "RESTART", select: () => { menu.hide(); audio.unlock(); newGame(); } },
  { label: "SOUND", value: () => audio.muted ? "OFF" : "ON", change: () => audio.toggleMute() },
  { label: "CONTROLS", value: () => pad.touch ? "TOUCH" : "KEYBOARD", change: () => pad.toggle() },
  { label: "DISPLAY SETTINGS", select: () => { location.href = "settings.html"; } },
  { label: "BACK TO CARTRIDGES", select: () => { location.href = "./"; } }
], {
  onOpen: () => { for (const k in keys) keys[k] = false; fireHeld = jumpHeld = false; audio.pause(); },
  onClose: () => { audio.resume(); }
});
addEventListener("keydown", e => {
  if (menu.key(e)){ e.preventDefault(); return; }
  const k = KEYMAP[e.key]; if (k){ e.preventDefault(); keys[k] = true; }
  if (JUMP_KEYS.has(e.key) || FIRE_KEYS.has(e.key)) e.preventDefault();
  if (FIRE_KEYS.has(e.key)) fireHeld = true;
  if (e.repeat) return;
  audio.unlock();
  if (e.key === "Escape" || e.key === "p" || e.key === "P") return menu.show();
  if (e.key === "m" || e.key === "M") return audio.toggleMute();
  if (e.key === "r" || e.key === "R") return newGame();
  if (state !== "play"){ if (e.key === " " || e.key === "Enter") action(); return; }
  if (JUMP_KEYS.has(e.key)){ jumpQueued = JUMP_BUFFER; jumpHeld = true; }
});
addEventListener("keyup", e => { const k = KEYMAP[e.key]; if (k) keys[k] = false; if (FIRE_KEYS.has(e.key)) fireHeld = false; if (JUMP_KEYS.has(e.key)) jumpHeld = false; });
addEventListener("blur", () => { for (const k in keys) keys[k] = false; fireHeld = jumpHeld = false; });

const pad = createPad({ store, menu: () => menu.open && menu, onAny: () => audio.unlock(),
  onDir: d => { if (d === "up" && state === "play" && !jumpHeld) jumpQueued = JUMP_BUFFER; jumpHeld = d === "up"; keys.left = d === "left"; keys.right = d === "right"; },
  onPress: id => {
    if (id === "select") return menu.show();
    if (state === "title" || state === "over"){ if (id === "a" || id === "start") action(); return; }
    if (id === "start") return menu.show();
    if (id === "a"){ jumpQueued = JUMP_BUFFER; jumpHeld = true; } else fireHeld = true;
  },
  onRelease: id => { if (id === "b") fireHeld = false; if (id === "a") jumpHeld = false; } });
cv.addEventListener("pointerdown", e => {
  audio.unlock();
  if (menu.open){ const [gx, gy] = gridAt(e, cv, GW, GH); menu.tap(gx, gy); return; }
  if (state === "title" || state === "over") action();
  else if (!pad.touch) menu.show();   // a mouse click during play opens the menu
});

/* ---------- loop ---------- */
function tick(dt, t){
  if (screen && !menu.open){   // the open menu pauses everything
    if (state === "title"){   // the rover drives along an empty course behind the title
      scrollBy(10 * dt); for (let i = 0; i < 3; i++) wy[i] += (groundAt(bx() + WHEELS[i]) - 1 - wy[i]) * Math.min(1, dt * 30);
    } else update(dt);
    for (const f of world.forces) f.t -= dt;
    world.forces = world.forces.filter(f => f.t > 0);
    world.step(dt);
    for (const b of world.bodies) if (b.life) b.life -= dt;
    world.bodies = world.bodies.filter(b => !(b.life < 0));
  }
  if (screen) draw(t);
}
layout();
computeGround(); for (let i = 0; i < 3; i++) wy[i] = groundAt(bx() + WHEELS[i]) - 1;
onResize(stage, () => { layout(); computeGround(); });
startLoop(tick);
})();
</script>
</body></html>
