<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Base Commander</title>
<style>
:root{
  --ground:#E9EDF1; --ink:#20304A; --muted:#5E6A7D; --line:#C9D1DB;
  --btn:#DCE2E9; --btn-on:#20304A; --btn-on-ink:#F4F6F8; --accent:#2F5BD3;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#151B26; --ink:#D9E1EC; --muted:#8792A3; --line:#2A3445;
    --btn:#222B3A; --btn-on:#D9E1EC; --btn-on-ink:#151B26; --accent:#7FA2FF;
  }
}
:root[data-theme="dark"]{
  --ground:#151B26; --ink:#D9E1EC; --muted:#8792A3; --line:#2A3445;
  --btn:#222B3A; --btn-on:#D9E1EC; --btn-on-ink:#151B26; --accent:#7FA2FF;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%}
body{height:100%;margin:0;background:var(--ground);color:var(--ink);
  font:15px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  display:flex;flex-direction:column;overflow:hidden;-webkit-user-select:none;user-select:none}
header{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:2px 12px;padding:10px 14px 6px}
h1{font-size:17px;font-weight:650;margin:0;letter-spacing:-0.01em}
#hud{font:12px/1.2 ui-monospace,"SF Mono",Menlo,Consolas,monospace;color:var(--muted);white-space:nowrap}
#stage{flex:1;position:relative;margin:0 8px;border:1px solid var(--line);border-radius:6px;overflow:hidden;min-height:0;background:#0B0F16}
#cv{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:block;touch-action:none}
nav{padding:8px 8px 10px;display:flex;flex-direction:column;gap:6px}
.row{display:flex;gap:6px;flex-wrap:wrap}
button{flex:1 1 auto;min-width:60px;min-height:40px;padding:6px 8px;border:0;border-radius:8px;background:var(--btn);color:var(--ink);font:inherit;font-size:14px;cursor:pointer;touch-action:none}
button[aria-pressed="true"]{background:var(--btn-on);color:var(--btn-on-ink);font-weight:600}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.pad button{font-weight:600;min-height:52px}
</style>
</head>
<body>
<header>
  <h1>Base Commander</h1>
  <div id="hud">&larr; &rarr; / A D move &middot; Space fire &middot; P pause &middot; R restart</div>
</header>
<div id="stage">
  <canvas id="cv" aria-label="Game screen. Arrow keys or A and D move, Space fires."></canvas>
</div>
<nav>
  <div class="row pad" role="group" aria-label="Touch controls">
    <button data-key="left" aria-label="Move left">&#9664;</button>
    <button data-key="fire">Fire</button>
    <button data-key="right" aria-label="Move right">&#9654;</button>
  </div>
  <div class="row">
    <button id="bPause">Pause</button>
    <button id="bRestart">Restart</button>
    <button id="bDiff">Difficulty: normal</button>
  </div>
</nav>
<script>
"use strict";
/* ================= Shared core: physics, light, ink, 24-bit renderer ================= */
const MONO = 'ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace';
const SANS = '-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif';
// The simulated screen is always dark: characters emit light, so they need a black background.
const SCREEN = { bg: "#0B0F16", dot: "#1C2432", line: "#263042", text: "#DCE3EC", muted: "#7C889B", accent: "#7FA2FF", pink: "#F07FB8", lamp: "#FFC857" };
const RAMPS = { classic: " .:-=+*#%@", detailed: " .'`^\",:;Il!i~+_-?]}1)|/tfjrxnuvczXYUJCLQ0OZmwqpdbkhao*#MW&8%B@", blocks: " \u2591\u2592\u2593\u2588" };
function norm(v){ const l = Math.hypot(...v); return v.map(x => x / l); }
const DIR = norm([-0.5, -0.6, 0.65]), SUB = [0.25, 0.75], MREF = 2.4;
const AMB_RGB = [0.55, 0.65, 0.9];     // room light is slightly blue
const FLASH_RGB = [1.0, 0.75, 0.45];   // impact flashes are warm
const FLOOR_ALB = 0.5;                 // share of light the floor reflects
const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5];
const MATS = {
  foam:   { name: "foam",   density: 0.2, e: 0.70, mu: 0.6, kd: 0.95, ks: 0.05, shine: 4,  alb: [0.20, 0.85, 0.72], rMin: 1.6, rMax: 2.4 },
  rubber: { name: "rubber", density: 1.0, e: 0.55, mu: 0.8, kd: 0.85, ks: 0.30, shine: 14, alb: [0.30, 0.48, 1.00], alt: [1.00, 0.38, 0.68], rMin: 1.2, rMax: 1.9 },
  steel:  { name: "steel",  density: 7.0, e: 0.35, mu: 0.2, kd: 0.45, ks: 1.10, shine: 70, alb: [0.72, 0.76, 0.82], rMin: 0.9, rMax: 1.3 },
  peg:    { name: "peg",    density: 0,   e: 0.50, mu: 0.3, kd: 0.80, ks: 0.20, shine: 10, alb: [0.42, 0.47, 0.56] }
};
const MIX = ["rubber", "rubber", "rubber", "rubber", "foam", "foam", "foam", "steel", "steel", "steel"];
function hexToLinear(hex){
  const n = parseInt(hex.slice(1), 16);
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255].map(c => Math.pow(c / 255, 2.2));
}
function defaultDisplay(){
  return { chars: RAMPS.classic, calibrate: true, dither: false, black: 0.15, exposure: 1.3, gamma: 2.2, split: 0.2, glow: 0.35, room: 0.18, lampHex: "#FFD9A0", lampRGB: hexToLinear("#FFD9A0") };
}

/* ---------- physics (unchanged from v2) ---------- */
function hit(b, dv){ if (dv > 220) b.flash = Math.max(b.flash, Math.min(1, (dv - 220) / 1000)); }
class World {
  constructor(){ this.bodies = []; this.forces = []; this.w = 300; this.h = 300; this.unit = 10; this.g = { x: 0, y: 0 };
    this.substeps = 4; this.cell = 60; this.grid = new Map(); this.drag = 0; this.onSub = null; }
  add(x, y, r, matName, alb, matOverride){
    const M = matOverride || MATS[matName], st = matName === "peg";
    const m = st ? 0 : M.density * (r / this.unit) ** 2;
    const b = { x, y, vx: 0, vy: 0, r, a: Math.random() * 6.283, w: 0, mat: M, alb: alb || M.alb, static: st, m,
      im: st ? 0 : 1 / m, iI: st ? 0 : 1 / (0.4 * m * r * r), grab: null, flash: 0, touch: false };
    this.bodies.push(b);
    if (this.bodies.length > 260){ const i = this.bodies.findIndex(o => !o.static && !o.grab); if (i >= 0) this.bodies.splice(i, 1); }
    return b;
  }
  step(dt){
    let maxR = 1; for (const b of this.bodies) if (b.r > maxR) maxR = b.r;
    this.cell = maxR * 2 + 2;
    const h = dt / this.substeps;
    for (let s = 0; s < this.substeps; s++){ this.substep(h); if (this.onSub) this.onSub(); }
    const decay = Math.pow(0.001, dt); for (const b of this.bodies) b.flash *= decay;
  }
  substep(h){
    const { w, h: H, g } = this;
    for (const b of this.bodies){
      if (b.static) continue;
      const mN = Math.max(0.25, b.m / MREF);
      let ax = g.x, ay = g.y;
      const sp = Math.hypot(b.vx, b.vy);
      if (sp > 0 && this.drag){ const k = this.drag * b.r * sp * b.im; ax -= b.vx * k; ay -= b.vy * k; }
      if (b.grab){ ax += (520 * (b.grab.x - b.x) - 46 * b.vx) / mN; ay += (520 * (b.grab.y - b.y) - 46 * b.vy) / mN; }
      for (const f of this.forces){
        const dx = b.x - f.x, dy = b.y - f.y, d = Math.hypot(dx, dy);
        if (d > 0.001 && d < f.radius){ const k = (1 - d / f.radius) * f.strength / mN; ax += dx / d * k; ay += dy / d * k; }
      }
      b.vx += ax * h; b.vy += ay * h;
      const s2 = Math.hypot(b.vx, b.vy); if (s2 > 4000){ b.vx *= 4000 / s2; b.vy *= 4000 / s2; }
      b.x += b.vx * h; b.y += b.vy * h; b.a += b.w * h; b.w *= 0.9997;
      if (b.x - b.r <= 0){ b.x = b.r; this.wall(b, -1, 0, h); }
      if (b.x + b.r >= w){ b.x = w - b.r; this.wall(b, 1, 0, h); }
      if (b.y - b.r <= 0){ b.y = b.r; this.wall(b, 0, -1, h); }
      if (b.y + b.r >= H){ b.y = H - b.r; this.wall(b, 0, 1, h); }
    }
    for (const b of this.bodies) b.touch = false;
    this.collide(); this.collide();
    for (const b of this.bodies){
      if (b.static) continue;
      if (b.touch && !b.grab && b.vx * b.vx + b.vy * b.vy < 1600){ b.vx *= 0.9; b.vy *= 0.9; b.w *= 0.9; }
      b.x = Math.min(w - b.r, Math.max(b.r, b.x)); b.y = Math.min(H - b.r, Math.max(b.r, b.y));
    }
  }
  wall(b, nx, ny, h){
    const M = b.mat; let jn; b.touch = true;
    const vn = b.vx * nx + b.vy * ny;
    if (vn > 0){ const e = vn < 30 ? 0 : M.e, dv = (1 + e) * vn; b.vx -= dv * nx; b.vy -= dv * ny; hit(b, dv); jn = dv * b.m; }
    else jn = Math.max(0, this.g.x * nx + this.g.y * ny) * h * b.m;
    const tx = -ny, ty = nx, slip = b.vx * tx + b.vy * ty + b.w * b.r;
    let jt = -slip / (b.im + b.r * b.r * b.iI);
    const lim = M.mu * jn; jt = Math.max(-lim, Math.min(lim, jt));
    b.vx += jt * tx * b.im; b.vy += jt * ty * b.im; b.w += jt * b.r * b.iI;
  }
  buildGrid(){
    const cs = this.cell, grid = this.grid, B = this.bodies; grid.clear();
    for (let i = 0; i < B.length; i++){
      const key = Math.floor(B[i].x / cs) + "," + Math.floor(B[i].y / cs);
      let arr = grid.get(key); if (!arr){ arr = []; grid.set(key, arr); } arr.push(i);
    }
  }
  collide(){
    this.buildGrid();
    const cs = this.cell, grid = this.grid, B = this.bodies;
    for (let i = 0; i < B.length; i++){
      const a = B[i], cx = Math.floor(a.x / cs), cy = Math.floor(a.y / cs);
      for (let ox = -1; ox <= 1; ox++) for (let oy = -1; oy <= 1; oy++){
        const arr = grid.get((cx + ox) + "," + (cy + oy));
        if (arr) for (const j of arr) if (j > i) this.resolve(a, B[j]);
      }
    }
  }
  resolve(a, b){
    const dx = b.x - a.x, dy = b.y - a.y, rs = a.r + b.r, d2 = dx * dx + dy * dy;
    if (d2 >= rs * rs || d2 === 0) return;
    const wa = a.im, wb = b.im, ws = wa + wb; if (ws === 0) return;
    const d = Math.sqrt(d2), nx = dx / d, ny = dy / d; a.touch = b.touch = true;
    const corr = Math.max(0, rs - d - 0.3) / ws * 0.8;
    a.x -= nx * corr * wa; a.y -= ny * corr * wa; b.x += nx * corr * wb; b.y += ny * corr * wb;
    const rvx = b.vx - a.vx, rvy = b.vy - a.vy, vn = rvx * nx + rvy * ny;
    if (vn >= 0) return;
    const e = -vn < 30 ? 0 : (a.mat.e + b.mat.e) / 2, j = -(1 + e) * vn / ws;
    a.vx -= j * nx * wa; a.vy -= j * ny * wa; b.vx += j * nx * wb; b.vy += j * ny * wb;
    hit(a, j * wa); hit(b, j * wb);
    const tx = -ny, ty = nx, vt = rvx * tx + rvy * ty - b.w * b.r - a.w * a.r;
    let jt = -vt / (ws + a.r * a.r * a.iI + b.r * b.r * b.iI);
    const lim = Math.sqrt(a.mat.mu * b.mat.mu) * j; jt = Math.max(-lim, Math.min(lim, jt));
    a.vx -= jt * tx * wa; a.vy -= jt * ty * wa; b.vx += jt * tx * wb; b.vy += jt * ty * wb;
    a.w -= jt * a.r * a.iI; b.w -= jt * b.r * b.iI;
  }
  pick(x, y, slop){
    let best = null, bestD = Infinity;
    for (const b of this.bodies){ if (b.static || b.grab) continue;
      const d = Math.hypot(b.x - x, b.y - y) - b.r; if (d < slop && d < bestD){ best = b; bestD = d; } }
    return best;
  }
}
function spawn(w, x, y, matName, rScale){
  const M = MATS[matName], k = rScale ?? (M.rMin + Math.random() * (M.rMax - M.rMin));
  return w.add(x, y, w.unit * k, matName, M.alt && Math.random() < 0.5 ? M.alt : M.alb);
}

/* ---------- ink measurement: how much of its cell each character actually fills ---------- */
const inkCache = new Map();
function measureInk(chars, fontPx){
  const key = chars + "|" + fontPx;
  if (inkCache.has(key)) return inkCache.get(key);
  const k = 4, c = document.createElement("canvas"), x = c.getContext("2d", { willReadFrequently: true });
  x.font = (fontPx * k) + "px " + MONO;
  const cw = Math.ceil(x.measureText("M").width), ch = Math.round(fontPx * 1.15) * k;
  c.width = cw; c.height = ch;
  x.font = (fontPx * k) + "px " + MONO; x.textBaseline = "top"; x.fillStyle = "#fff";
  const yOff = (ch - fontPx * k) / 2, out = [];
  for (const g of new Set([...chars])){
    x.clearRect(0, 0, cw, ch); x.fillText(g, 0, yOff);
    const d = x.getImageData(0, 0, cw, ch).data; let s = 0;
    for (let i = 3; i < d.length; i += 4) s += d[i];
    out.push({ ch: g, ink: s / (255 * cw * ch) });
  }
  inkCache.set(key, out);
  return out;
}
// Build a 256-entry table: brightness 0..255 -> character code.
function buildLUT(chars, fontPx, calibrate){
  if ([...chars].length < 2) chars = " @";
  const lut = new Uint16Array(256);
  const measured = measureInk(chars, fontPx);
  if (calibrate){
    const lv = measured.slice().sort((a, b) => a.ink - b.ink);
    if (lv[0].ink > 0.001) lv.unshift({ ch: " ", ink: 0 });
    const max = lv[lv.length - 1].ink || 1;
    lv.forEach(l => l.level = l.ink / max);
    let j = 0;
    for (let i = 0; i < 256; i++){
      const t = i / 255;
      while (j < lv.length - 1 && Math.abs(lv[j + 1].level - t) <= Math.abs(lv[j].level - t)) j++;
      lut[i] = lv[j].ch.charCodeAt(0);
    }
    return { lut, levels: lv, count: lv.length, ascii: lv.every(l => l.ch.charCodeAt(0) < 128) };
  }
  const arr = [...chars], n = arr.length - 1;
  for (let i = 0; i < 256; i++) lut[i] = arr[Math.round(i / 255 * n)].charCodeAt(0);
  const lv = arr.map((ch, i) => ({ ch, ink: (measured.find(m => m.ch === ch) || { ink: 0 }).ink, level: i / n }));
  return { lut, levels: lv, count: arr.length, ascii: arr.every(c => c.charCodeAt(0) < 128) };
}

/* ---------- lighting ---------- */
// Returns diffuse and highlight strength for one point on a sphere.
function lightTerms(b, dx, dy, nz, L, out){
  const M = b.mat; let lx, ly, lz, att;
  if (L && L.on){
    const px = b.x + dx * b.r, py = b.y + dy * b.r, pz = b.r * (1 + nz);
    lx = L.x - px; ly = L.y - py; lz = L.z - pz;
    const d2 = lx * lx + ly * ly + lz * lz, ld = Math.sqrt(d2) || 1;
    lx /= ld; ly /= ld; lz /= ld; att = Math.min(3, 2.5 * L.z * L.z / d2);   // inverse-square falloff
  } else { lx = DIR[0]; ly = DIR[1]; lz = DIR[2]; att = 1; }
  out.d = att * M.kd * Math.max(0, dx * lx + dy * ly + nz * lz);
  const hx = lx, hy = ly, hz = lz + 1, hl = Math.sqrt(hx * hx + hy * hy + hz * hz);
  out.s = att * M.ks * Math.pow(Math.max(0, (dx * hx + dy * hy + nz * hz) / hl), M.shine);
}
function shadowAt(fx, fy, B, L){
  const dx = L.x - fx, dy = L.y - fy, lz = L.z, d2 = dx * dx + dy * dy + lz * lz;
  let sh = 1;
  for (const b of B){
    const cx = b.x - fx, cy = b.y - fy, cz = b.r, t = (cx * dx + cy * dy + cz * lz) / d2;
    if (t <= 0 || t >= 1) continue;
    const qx = cx - t * dx, qy = cy - t * dy, qz = cz - t * lz;
    const o = (b.r * 1.15 - Math.sqrt(qx * qx + qy * qy + qz * qz)) / (b.r * 0.45);
    if (o <= 0) continue;
    sh *= 1 - 0.85 * Math.min(1, o); if (sh < 0.12) break;
  }
  return sh;
}

/* ---------- 24-bit character screen ---------- */
// Layers decide who wins a cell: 0 floor light, 1 trails and rings, 2 balls, 3 lamp bulb.
class Screen {
  constructor(fontPx, D){ this.fontPx = fontPx; this.D = D || defaultDisplay();
    this.colC = document.createElement("canvas"); this.glowC = document.createElement("canvas");
    this.glowS = document.createElement("canvas"); this.glyphC = document.createElement("canvas"); this.t = {}; }
  fit(W, H, dpr){
    const probe = this.glyphC.getContext("2d"); probe.font = this.fontPx + "px " + MONO;
    this.cw = probe.measureText("M").width; this.ch = Math.round(this.fontPx * 1.15);
    this.cols = Math.max(1, Math.floor(W / this.cw)); this.rows = Math.max(1, Math.floor(H / this.ch));
    const n = this.n = this.cols * this.rows;
    this.rad = new Float32Array(3 * n); this.lum = new Float32Array(n); this.lay = new Int8Array(n);
    this.over = new Uint16Array(n); this.glyphs = new Uint16Array(n);
    this.w = this.cols * this.cw; this.h = this.rows * this.ch; this.W = W; this.H = H; this.dpr = dpr;
    this.colC.width = this.glowC.width = this.cols; this.colC.height = this.glowC.height = this.rows;
    this.glowS.width = Math.max(1, Math.ceil(this.cols / 4)); this.glowS.height = Math.max(1, Math.ceil(this.rows / 4));
    this.colX = this.colC.getContext("2d"); this.glowX = this.glowC.getContext("2d"); this.glowSX = this.glowS.getContext("2d");
    this.colImg = this.colX.createImageData(this.cols, this.rows); this.glowImg = this.glowX.createImageData(this.cols, this.rows);
    this.glyphC.width = Math.max(1, Math.round(W * dpr)); this.glyphC.height = Math.max(1, Math.round(H * dpr));
    this.gx = this.glyphC.getContext("2d");
    this.setRamp();
  }
  setRamp(){ this.ink = buildLUT(this.D.chars, this.fontPx, this.D.calibrate); }
  clear(){ this.rad.fill(0); this.lum.fill(0); this.lay.fill(-1); this.over.fill(0); }
  put(i, r, g, b, layer, glyph){
    const L = 0.2126 * r + 0.7152 * g + 0.0722 * b, lay = this.lay;
    if (lay[i] > layer || (lay[i] === layer && L <= this.lum[i])) return;
    const k = 3 * i; this.rad[k] = r; this.rad[k + 1] = g; this.rad[k + 2] = b;
    this.lum[i] = L; lay[i] = layer; this.over[i] = glyph || 0;
  }
  add(i, r, g, b){   // light adds up: used for floor light, glows and halos
    if (this.lay[i] > 0) return;
    const k = 3 * i; this.rad[k] += r; this.rad[k + 1] += g; this.rad[k + 2] += b;
    this.lum[i] = 0.2126 * this.rad[k] + 0.7152 * this.rad[k + 1] + 0.0722 * this.rad[k + 2]; this.lay[i] = 0;
  }
  light(L){ return L && L.on ? this.D.lampRGB : [0.95, 0.95, 0.95]; }
  sphere(b, L, opt = {}){
    const { cols, rows, cw, ch } = this, t = this.t, A = b.alb, LC = this.light(L), room = this.D.room;
    const dOn = opt.diffuse !== false, sOn = opt.spec !== false, stripe = opt.stripe !== false && !b.static;
    const c0 = Math.max(0, Math.floor((b.x - b.r) / cw)), c1 = Math.min(cols - 1, Math.floor((b.x + b.r) / cw));
    const r0 = Math.max(0, Math.floor((b.y - b.r) / ch)), r1 = Math.min(rows - 1, Math.floor((b.y + b.r) / ch));
    const inv = 1 / b.r, ca = Math.cos(b.a), sa = Math.sin(b.a), fl = b.flash * 0.8;
    for (let r = r0; r <= r1; r++) for (let c = c0; c <= c1; c++){
      let R = 0, G = 0, Bv = 0, cov = 0;
      for (const sy of SUB) for (const sx of SUB){
        const dx = ((c + sx) * cw - b.x) * inv, dy = ((r + sy) * ch - b.y) * inv, d2 = dx * dx + dy * dy;
        if (d2 >= 1) continue;
        cov++; lightTerms(b, dx, dy, Math.sqrt(1 - d2), L, t);
        const d = dOn ? t.d : 0, s = sOn ? t.s : 0;
        let k = (stripe && Math.abs(-dx * sa + dy * ca) < 0.13) ? 0.45 : 1;

    const a = Math.random() * 6.283, sp = 120 + Math.random() * 380, r = screen.cw * (0.55 + Math.random() * 0.35);
    const b = world.add(x + (Math.random() - 0.5) * screen.cw, y + (Math.random() - 0.5) * screen.ch, r, "debris", rgb, DEBRIS);
    b.vx = Math.cos(a) * sp; b.vy = Math.sin(a) * sp + vy0; b.w = (Math.random() - 0.5) * 30;
    b.flash = 1; b.life = 3 + Math.random() * 2; b.r0 = r;
  }
}
// Airdrop crates are real bodies: they float down on a chute, then bounce off shields and debris.
function dropCrate(x, y){
  const r = Math.random(), kind = r < 0.7 ? "P" : r < 0.9 ? "S" : "L";
  const b = world.add(x, y, screen.ch * 0.5, "crate", DROPS[kind].rgb, CRATE);
  b.crate = kind; b.chute = true; b.ttl = 8;   // ttl counts down only once it has landed
}
function eachCell(sprite, x, y, fn){ sprite.forEach((row, dy) => { for (let dx = 0; dx < row.length; dx++) if (row[dx] !== " ") fn(x + dx, y + dy, row.charCodeAt(dx)); }); }

/* ---------- rules ---------- */
function damage(s){
  s.hp--; s.body.flash = 1; s.body.alb = SHIELD_RGB.map(v => v * (0.25 + 0.75 * s.hp / 3));
  if (s.hp > 0) return;
  world.bodies.splice(world.bodies.indexOf(s.body), 1); shields.splice(shields.indexOf(s), 1);
  burst(s.body.x, s.body.y, SHIELD_RGB, 2);
}
function hitShield(x, y){ const s = shields.find(s => s.x === x && s.y === y); if (s) damage(s); return !!s; }
function hitAlien(x, y, shot){
  for (const a of aliens){
    if (!a.alive || shot.hits.has(a)) continue;
    const T = TYPES[a.type], art = T.art[frame], dx = x - a.x, dy = y - a.y;
    if (dx < 0 || dx >= AW || dy < 0 || dy >= AH || art[dy][dx] === " ") continue;
    shot.hits.add(a); a.flash = 0.12;
    if (--a.hp > 0){ score += 1; burst(cx(x), cy(y), T.rgb, 2, -150); return true; }
    a.alive = false; score += T.pts + Math.floor((GH - a.y) / 4) + level;
    eachCell(art, a.x, a.y, (gx, gy) => burst(cx(gx), cy(gy), T.rgb, 1, -250));
    if (a.maxHp >= 3 && Math.random() < 0.35) dropCrate(cx(a.x + 3), cy(a.y + 2));   // armoured enemies may drop parts
    return true;
  }
  return false;
}
function inCannon(x, y){ const art = cannonArt(), dx = x - Math.round(px), dy = y - PY; return dy >= 0 && dy < 3 && dx >= 0 && dx < CW && art[dy][dx] !== " "; }
function loseLife(){
  eachCell(cannonArt(), Math.round(px), PY, (gx, gy) => burst(cx(gx), cy(gy), CANNON_RGB, 2, -300));
  lives--; shots = []; bombs = [];
  if (lives <= 0){ state = "over"; recordScore(); return; }
  const lost = gun > 0; gun = Math.max(0, gun - 1);
  px = (GW - CW) / 2; state = "dead"; deadT = 1.2; flash(lost ? "SHIP LOST - GUN DOWN TO " + GUNS[gun].name : "SHIP LOST");
}
function collect(kind){
  burst(cannon.x, cannon.y - screen.ch * 2, DROPS[kind].rgb, 6, -300);
  if (kind === "S"){ buildShields(); flash("SHIELDS REPAIRED"); return; }
  if (kind === "L"){ lives++; flash("+1 LIFE"); return; }
  parts++;
  if (gun < GUNS.length - 1 && parts >= partsCost()){ parts -= partsCost(); gun++; flash("GUN UPGRADE: " + GUNS[gun].name, 2); }
  else flash("+1 PARTS");
}
function fireAlien(a){
  const T = TYPES[a.type], x = a.x + 3, y = a.y + AH, sp = T.speed * lv.bombMul;
  if (Math.random() < T.bomb) bombs.push({ kind: "bomb", x, y, sp: lv.bombMul, acc: 0 });
  else for (const ox of T.twin ? [-2, 2] : [0]) bombs.push({ kind: "laser", x: x + ox, y, sp, acc: 0 });
}
function impact(s, y){   // an enemy shot lands on a shield or the floor; bombs hit a small area
  const r = WEAPONS[s.kind].blast ? 1 : 0;
  shields.filter(q => Math.abs(q.x - s.x) <= r && Math.abs(q.y - y) <= r).forEach(damage);
  burst(cx(s.x), cy(y), WEAPONS[s.kind].rgb.map(v => v * 0.6), r ? 4 : 1, -200);
}

function update(dt){
  const d = DIFF[diffKey];
  if ((animT += dt) >= 0.35){ animT = 0; frame ^= 1; }
  px = Math.max(1, Math.min(GW - 1 - CW, px + ((keys.right ? 1 : 0) - (keys.left ? 1 : 0)) * CANNON_SPEED * dt));
  if ((fireT -= dt) <= 0 && keys.fire){
    const G = GUNS[gun];
    for (const [ox, vx] of G.shots){ const x = Math.round(px) + 3 + ox; shots.push({ x, fx: x, y: PY - 1, vx, acc: 0, pierce: G.pierce || 1, hits: new Set() }); }
    fireT = d.fire * G.delay;
  }
  // bullets advance one cell at a time so nothing is skipped at low frame rates
  for (const s of shots){
    s.acc += SHOT_SPEED * dt;
    while (s.acc >= 1 && !s.dead){
      s.acc--; s.y--; s.fx += s.vx; s.x = Math.round(s.fx);
      if (s.y < 1 || s.x < 1 || s.x > GW - 2 || hitShield(s.x, s.y)) s.dead = true;
      else if (hitAlien(s.x, s.y, s) && --s.pierce <= 0) s.dead = true;
    }
  }
  shots = shots.filter(s => !s.dead);

  const alive = aliens.filter(a => a.alive);
  if (!alive.length){ score += 50 * level; state = "clear"; level++; return; }
  for (const a of alive) a.flash -= dt;
  const gone = 1 - alive.length / aliens.length;
  if ((fleet.t += dt) >= Math.max(0.1, fleet.every - gone * 0.4)){
    fleet.t = 0;
    const minX = Math.min(...alive.map(a => a.x)), maxX = Math.max(...alive.map(a => a.x + AW - 1));
    if (fleet.dir > 0 ? maxX >= GW - 3 : minX <= 2){ for (const a of alive) a.y += 2; fleet.dir = -fleet.dir; }
    else for (const a of alive) a.x += fleet.dir;
  }
  if (Math.max(...alive.map(a => a.y + AH - 1)) >= PY){ lives = 1; loseLife(); return; }   // landed: game over
  if ((chewT += dt) >= 0.2){   // aliens chew through shields they touch
    chewT = 0;
    for (const a of alive) eachCell(TYPES[a.type].art[frame], a.x, a.y, (gx, gy) => { const s = shields.find(s => s.x === gx && s.y === gy); if (s) damage(s); });
  }
  for (const a of alive){
    if (Math.random() >= (lv.shot + gone * 0.18) * TYPES[a.type].rate * dt) continue;
    if (alive.some(o => o.y > a.y && Math.abs(o.x - a.x) < AW)) continue;   // only the front line fires
    fireAlien(a);
  }
  let hitMe = false;
  for (const s of bombs){
    s.acc += WEAPONS[s.kind].speed * s.sp * dt;
    while (s.acc >= 1 && !s.dead){
      s.acc--; s.y++;
      if (s.y >= GH - 1){ s.dead = true; impact(s, s.y - 1); }
      else if (shields.some(q => q.x === s.x && q.y === s.y)){ s.dead = true; impact(s, s.y); }
      else if (inCannon(s.x, s.y)) s.dead = hitMe = true;
      else { const p = shots.find(p => !p.dead && p.x === s.x && Math.abs(p.y - s.y) <= 1);
        if (p){ p.dead = s.dead = true; score += 2; burst(cx(s.x), cy(s.y), [1, 0.7, 0.3], 2); } }
    }
  }
  bombs = bombs.filter(s => !s.dead); shots = shots.filter(s => !s.dead);
  if (hitMe){ loseLife(); return; }
  // supply plane crosses the top and drops a crate at a random column
  if (!plane && (dropT -= dt) <= 0){
    const dir = Math.random() < 0.5 ? 1 : -1;
    plane = { x: dir > 0 ? -8 : GW, dir, dropX: 6 + Math.floor(Math.random() * (GW - 12)), done: false };
    dropT = 12 + Math.random() * 10;
  }
  if (plane){
    plane.x += plane.dir * PLANE_SPEED * dt;
    if (!plane.done && Math.abs(plane.x + 4 - plane.dropX) < 1){ plane.done = true; dropCrate(cx(plane.dropX), cy(3)); }
    if (plane.x < -9 || plane.x > GW + 1) plane = null;
  }
  for (const b of world.bodies) if (b.crate && b.ttl > 0 && Math.hypot(b.x - cannon.x, b.y - cannon.y) < cannon.r + b.r + screen.ch * 0.5){ b.ttl = 0; collect(b.crate); }
  // passing bullets shove loose debris
  for (const b of world.bodies) if (b.life){
    for (const s of shots) if (Math.abs(cx(s.x) - b.x) < screen.cw * 1.5 && Math.abs(cy(s.y) - b.y) < screen.ch){ b.vy = Math.min(b.vy, -500); b.vx += (b.x - cx(s.x)) * 20; }
    for (const s of bombs) if (Math.abs(cx(s.x) - b.x) < screen.cw * 1.5 && Math.abs(cy(s.y) - b.y) < screen.ch) b.vy = Math.max(b.vy, 400);
  }
}

/* ---------- drawing ---------- */
function put(gx, gy, rgb, k, layer, code){ if (gx >= 0 && gy >= 0 && gx < GW && gy < GH) screen.put(gy * GW + gx, rgb[0] * k, rgb[1] * k, rgb[2] * k, layer, code); }
function text(gx, gy, s, rgb){ for (let i = 0; i < s.length; i++) put(gx + i, gy, rgb, 1, 3, s.charCodeAt(i)); }
const center = (gy, s, rgb) => text(Math.floor((GW - s.length) / 2), gy, s, rgb);
const SHOT_RGB = [0.5, 1.1, 1.6], LANCE_RGB = [1.6, 0.6, 1.4], WHITE = [1.6, 1.6, 1.6], DIM = [0.35, 0.4, 0.55], BORDER_RGB = [0.12, 0.16, 0.28];
function bounce(p){   // ease-out bounce: a letter dropping onto the floor
  const n = 7.5625, d = 2.75;
  if (p < 1 / d) return n * p * p;
  if (p < 2 / d) return n * (p -= 1.5 / d) * p + 0.75;
  if (p < 2.5 / d) return n * (p -= 2.25 / d) * p + 0.9375;
  return n * (p -= 2.625 / d) * p + 0.984375;
}
const hue = h => [0, 1, 2].map(k => 0.8 * (0.5 + 0.5 * Math.cos(6.283 * (h - k / 3))) + 0.15);
function drawTitle(t){
  let k = 0;
  for (const [word, y0] of TITLE){
    const x0 = Math.floor((GW - word.length * 8 + 1) / 2);
    for (let i = 0; i < word.length; i++, k++){
      const p = Math.max(0, Math.min(1, (titleT - 0.15 * k) / 1.1)); if (!p) continue;
      const x = x0 + i * 8, y = Math.round(y0 - (1 - bounce(p)) * (y0 + 8));
      if (p > 0.37 && !landed.has(k)){ landed.add(k); burst(cx(x + 3), cy(y0 + 7), hue(x / GW), 6, -150); }   // dust on first impact
      FONT[word[i]].forEach((row, dy) => { for (let dx = 0; dx < 7; dx++) if (row[dx] === "#"){
        const c = hue(t * 0.0002 + (x + dx) / GW * 0.6 + dy * 0.03);
        put(x + dx + 1, y + dy + 1, c, 0.12, 1, 46);   // drop shadow
        put(x + dx, y + dy, c, 1.5, 2, 35);
      } });
    }
  }
  const fleetX = Math.round(Math.sin(titleT * 0.8) * 3);
  for (let i = 0; i < 7; i++) eachCell(TYPES[i].art[frame], 6 + fleetX + i * 13, 28, (gx, gy, code) => put(gx, gy, TYPES[i].rgb, 0.9, 2, code));
  if (titleT > 3){
    center(25, "~ DEFEND THE BASE ~", CANNON_RGB);
    if ((t / 500 | 0) % 2) center(46, "PRESS SPACE OR TAP FIRE TO START", WHITE);
  }
  center(36, "HIGH SCORES", CANNON_RGB);
  if (!scores.length) center(38, "NO SCORES YET", DIM);
  scores.forEach((e, i) => center(38 + i, (i + 1) + ". " + String(e.s).padStart(6, "0") + "  LV " + String(e.l).padEnd(3) + " " + e.d.toUpperCase().padEnd(6) + " " + new Date(e.t).toISOString().slice(0, 10), WHITE));
  center(52, "ARROWS/A D MOVE  SPACE FIRE  P PAUSE  R RESTART", DIM);
  center(54, "CATCH AIRDROPS: [P] PARTS  [S] SHIELDS  [L] LIFE", DIM);
  center(56, "DIFFICULTY: " + diffKey.toUpperCase(), DIM);
}
function draw(t){
  screen.clear();
  for (const s of stars){ const v = 0.07 + 0.05 * Math.sin(t * 0.002 + s.ph); screen.put(s.i, v, v, v * 1.2, 0, 46); }
  const bodies = world.bodies.filter(b => !b.hidden);
  for (const b of bodies) if (!b.crate) screen.sphere(b, sun, { stripe: false });
  if (state === "title") for (const b of bodies) if (b.life) screen.streak(b, world.unit);   // in play, streaks would look like enemy lasers
  if (state === "title"){ drawTitle(t); drawBorder(); screen.render(ctx); return; }
  const pulse = 0.85 + 0.15 * frame;
  for (const a of aliens) if (a.alive){
    const k = a.flash > 0 ? 2 : pulse * (0.55 + 0.45 * a.hp / a.maxHp);   // damaged armour glows dimmer
    eachCell(TYPES[a.type].art[frame], a.x, a.y, (gx, gy, code) => put(gx, gy, TYPES[a.type].rgb, k, 2, code));
  }
  for (const b of bodies) if (b.crate && (b.ttl > 3 || (t / 150 | 0) % 2)){
    const gx = Math.floor(b.x / screen.cw), gy = Math.floor(b.y / screen.ch), c = DROPS[b.crate].rgb;
    text(gx - 1, gy, "[" + b.crate + "]", c);
    if (b.chute) text(gx - 1, gy - 1, "/~\\", WHITE);
  }
  if (plane) text(Math.floor(plane.x), 2, plane.dir > 0 ? "==-[H]->" : "<-[H]-==", WHITE);
  for (const s of shots) put(s.x, s.y, GUNS[gun].pierce ? LANCE_RGB : SHOT_RGB, 1, 3, s.vx < 0 ? 92 : s.vx > 0 ? 47 : 124);
  for (const s of bombs){   // lasers are a two-cell line, bombs a small dot
    const W = WEAPONS[s.kind]; put(s.x, s.y, W.rgb, 1, 3, W.glyph);
    if (s.kind === "laser") put(s.x, s.y - 1, W.rgb, 0.6, 3, W.glyph);
  }
  if (state === "play" || state === "clear") eachCell(cannonArt(), Math.round(px), PY, (gx, gy, code) => put(gx, gy, CANNON_RGB, 1, 3, code));
  drawBorder();
  text(2, 0, " SCORE " + String(score).padStart(6, "0") + "  HI " + String(Math.max(score, scores[0]?.s || 0)).padStart(6, "0") + " ", WHITE);
  const right = " LV " + level + "  LIVES " + Math.max(0, lives) + "  " + diffKey.toUpperCase() + " ";
  text(GW - 2 - right.length, 0, right, WHITE);
  text(2, GH - 1, " GUN " + GUNS[gun].name + "  PARTS " + (gun < GUNS.length - 1 ? parts + "/" + partsCost() : "MAX") + " ", CANNON_RGB);
  const left = " ENEMIES " + aliens.filter(a => a.alive).length + " ";
  text(GW - 2 - left.length, GH - 1, left, WHITE);
  const mid = GH >> 1;
  if (paused) center(mid, "  [ PAUSED ]  ", WHITE);
  else if (state === "over"){
    center(mid, "  GAME OVER - press R  ", WHITE);
    if (rank >= 0) center(mid + 2, "  NEW HIGH SCORE - RANK " + (rank + 1) + "  ", CANNON_RGB);
  } else if (state === "clear"){
    const n = makeLevel(level);
    center(mid, "  WAVE " + (level - 1) + " CLEARED - press R  ", WHITE);
    center(mid + 2, "  NEXT: " + n.rows * n.cols + " ENEMIES" + (n.fresh !== undefined ? "  NEW: " + TYPES[n.fresh].name : "") + "  ", CANNON_RGB);
  }
  if (msgT > 0) center(4, " " + msg + " ", [1.6, 0.5, 0.35]);
  screen.render(ctx);
}

function drawBorder(){
  for (let x = 0; x < GW; x++){ put(x, 0, BORDER_RGB, 1, 1, 45); put(x, GH - 1, BORDER_RGB, 1, 1, 45); }
  for (let y = 0; y < GH; y++){ put(0, y, BORDER_RGB, 1, 1, 124); put(GW - 1, y, BORDER_RGB, 1, 1, 124); }
  for (const [x, y] of [[0, 0], [GW - 1, 0], [0, GH - 1], [GW - 1, GH - 1]]) put(x, y, BORDER_RGB, 1, 1, 43);
}

/* ---------- input ---------- */
const keys = { left: false, right: false, fire: false };
const KEYMAP = { ArrowLeft: "left", a: "left", A: "left", ArrowRight: "right", d: "right", D: "right", " ": "fire" };
function togglePause(){ if (state !== "play" && state !== "dead") return; paused = !paused; $("bPause").textContent = paused ? "Resume" : "Pause"; }
addEventListener("keydown", e => {
  const k = KEYMAP[e.key]; if (k){ e.preventDefault(); keys[k] = true; }
  if (e.repeat) return;
  if (state === "title"){ if (e.key === " " || e.key === "Enter") restart(); return; }
  if (e.key === "p" || e.key === "P") togglePause();
  if (e.key === "r" || e.key === "R" || (e.key === "Enter" && (state === "over" || state === "clear"))) restart();
});
addEventListener("keyup", e => { const k = KEYMAP[e.key]; if (k) keys[k] = false; });
addEventListener("blur", () => { keys.left = keys.right = keys.fire = false; });
document.querySelectorAll("[data-key]").forEach(b => {
  const set = v => e => { e.preventDefault(); keys[b.dataset.key] = v; if (v && state === "title" && b.dataset.key === "fire") restart(); };
  b.addEventListener("pointerdown", set(true));
  for (const ev of ["pointerup", "pointerleave", "pointercancel"]) b.addEventListener(ev, set(false));
});
cv.addEventListener("pointerdown", () => { if (state === "title") restart(); });
$("bPause").addEventListener("click", togglePause);
$("bRestart").addEventListener("click", () => { $("bPause").textContent = "Pause"; restart(); });
$("bDiff").addEventListener("click", e => {   // lives change on the next restart; level tuning on the next wave
  const ks = Object.keys(DIFF); diffKey = ks[(ks.indexOf(diffKey) + 1) % ks.length];
  e.target.textContent = "Difficulty: " + diffKey; if (state !== "title") flash("DIFFICULTY " + diffKey.toUpperCase() + " - press R");
});

/* ---------- loop ---------- */
let last = performance.now();
function tick(t){
  const dt = Math.min((t - last) / 1000, 1 / 30); last = t;
  if (screen && !paused){
    if (state === "play") update(dt);
    else if (state === "dead" && (deadT -= dt) <= 0) state = "play";
    else if (state === "title"){
      titleT += dt; if ((animT += dt) >= 0.35){ animT = 0; frame ^= 1; }
      if (titleT > 3 && (fwT -= dt) <= 0){   // fireworks: debris bursts that rain onto the floor
        fwT = 0.6 + Math.random() * 0.8;
        burst(cx(8 + Math.random() * (GW - 16)), cy(3 + Math.random() * 16), hue(Math.random()), 12, -100);
      }
    }
    msgT -= dt;
    if (cannon){ cannon.x = state === "play" ? cx(Math.round(px) + 3) : -1e4; cannon.y = (PY + 1.5) * screen.ch; }
    world.step(dt);
    for (const b of world.bodies){
      if (b.life){ b.life -= dt; if (b.life < 1) b.r = b.r0 * Math.max(0.3, b.life); }
      if (b.crate){
        if (!b.chute) b.ttl -= dt;
        // the chute holds the fall to a slow drift until the crate lands on something
        if (b.chute && (b.touch || b.y + b.r >= world.h - 1)) b.chute = false;
        if (b.chute){ b.vy = Math.min(b.vy, screen.ch * 8); b.vx *= 0.95; }
      }
    }
    world.bodies = world.bodies.filter(b => !(b.life <= 0) && !(b.ttl <= 0));
  }
  if (screen) draw(t);
  requestAnimationFrame(tick);
}
layout();
new ResizeObserver(() => { if (screen){ layout(); for (const s of shields){ s.body.x = cx(s.x); s.body.y = cy(s.y); } } }).observe(stage);
requestAnimationFrame(t => { last = t; requestAnimationFrame(tick); });
})();
</script>
</body></html>
