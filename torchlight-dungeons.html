<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Torchlight Dungeons</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
/* Shared by the game pages: page layout, the touch gamepad, and the landscape phone layout. Built into each page. */
:root{
  --ground:#E9EDF1; --ink:#20304A; --muted:#5E6A7D; --line:#C9D1DB;
  --btn:#DCE2E9; --accent:#2F5BD3;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#151B26; --ink:#D9E1EC; --muted:#8792A3; --line:#2A3445;
    --btn:#222B3A; --accent:#7FA2FF;
  }
}
:root[data-theme="dark"]{
  --ground:#151B26; --ink:#D9E1EC; --muted:#8792A3; --line:#2A3445;
  --btn:#222B3A; --accent:#7FA2FF;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;overscroll-behavior:none}
body{height:100%;height:100svh;margin:0;touch-action:manipulation;overscroll-behavior:none;-webkit-touch-callout:none;background:var(--ground);color:var(--ink);
  font:15px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  display:flex;flex-direction:column;overflow:hidden;-webkit-user-select:none;user-select:none}
header{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:2px 12px;padding:10px 14px 6px}
h1{font-size:17px;font-weight:650;margin:0;letter-spacing:-0.01em}
h1 a{color:inherit;text-decoration:none}h1 a:hover{text-decoration:underline}
#hud{font:12px/1.2 ui-monospace,"SF Mono",Menlo,Consolas,monospace;color:var(--muted);white-space:nowrap}
#stage{flex:1;position:relative;touch-action:none;margin:0 8px;border:1px solid var(--line);border-radius:6px;overflow:hidden;min-height:0;background:#0B0F16}
#cv{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:block;touch-action:none}
nav{padding:8px 8px 10px;display:flex;flex-direction:column;gap:6px}
button{flex:1 1 auto;min-width:60px;min-height:40px;padding:6px 8px;border:0;border-radius:8px;background:var(--btn);color:var(--ink);font:inherit;font-size:14px;cursor:pointer;touch-action:none}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
/* Touch gamepad, styled after a handheld console: cross-shaped D-pad, slanted A/B, pill SELECT/START */
#gamepad{display:grid;grid-template-columns:auto 1fr auto;grid-template-areas:"dpad . ab" "mid mid mid";align-items:center;row-gap:4px;padding:4px 12px 20px;touch-action:none}
#gamepad[hidden]{display:none}
#dpad{grid-area:dpad;position:relative;width:120px;height:120px;touch-action:none;cursor:pointer}
#dpad::before,#dpad::after{content:"";position:absolute;background:#2A2A31;border-radius:7px;box-shadow:0 4px 0 #0E0E12}
#dpad::before{left:0;right:0;top:40px;height:40px}
#dpad::after{top:0;bottom:0;left:40px;width:40px}
#dpad span{position:absolute;z-index:1;color:#6E6E78;font-size:13px;line-height:1;pointer-events:none;transition:color .05s}
#dpad .l{left:11px;top:53px}#dpad .r{right:11px;top:53px}#dpad .u{left:54px;top:11px}#dpad .d{left:54px;bottom:11px}
#dpad[data-dir="left"] .l,#dpad[data-dir="right"] .r,#dpad[data-dir="up"] .u,#dpad[data-dir="down"] .d{color:#F4F4F8}
#dpad[data-dir="left"]{transform:perspective(300px) rotateY(-8deg)}
#dpad[data-dir="right"]{transform:perspective(300px) rotateY(8deg)}
#dpad[data-dir="up"]{transform:perspective(300px) rotateX(8deg)}
#dpad[data-dir="down"]{transform:perspective(300px) rotateX(-8deg)}
.mid{grid-area:mid;justify-self:center;display:flex;gap:18px;transform:rotate(-22deg)}
.mid button{min-width:0;min-height:0;width:52px;height:16px;padding:0;border-radius:8px;background:#8D8C94;box-shadow:0 3px 0 #55545B;font-size:0;position:relative}
.mid button::after{content:attr(data-label);position:absolute;top:22px;left:50%;transform:translateX(-50%);font:600 10px/1 ui-monospace,Menlo,monospace;letter-spacing:.08em;color:var(--muted)}
.ab{grid-area:ab;display:flex;gap:14px;transform:rotate(-22deg)}
.ab button{min-width:0;min-height:0;width:60px;height:60px;padding:0;border-radius:50%;background:#A3245C;color:#F7D7E6;font:700 19px/1 ui-monospace,Menlo,monospace;box-shadow:0 5px 0 #5E1233}
.ab button:first-child{margin-top:30px}
#gamepad button.on{transform:translateY(3px);box-shadow:0 2px 0 #0E0E12;filter:brightness(.85)}
body.touch #hud{display:none}
/* Phone on its side: D-pad on the left, A/B on the right, game in the middle */
@media (orientation: landscape) and (max-height: 600px){
  body.touch{display:grid;grid-template-columns:auto 1fr auto;grid-template-rows:1fr auto}
  body.touch header{display:none}
  body.touch nav,body.touch #gamepad{display:contents}
  body.touch #stage{grid-column:2;grid-row:1;margin:6px 0 4px}
  body.touch #dpad{grid-column:1;grid-row:1 / 3;align-self:center;justify-self:center;margin:0 18px 70px}
  body.touch .mid{grid-column:1;grid-row:1 / 3;align-self:end;justify-self:center;margin-bottom:46px}
  body.touch .ab{grid-column:3;grid-row:1 / 3;align-self:center;margin:0 18px 0 10px}
}
</style>
</head>
<body>
<header>
  <h1><a href="./" title="Back to the cartridge shelf">&#8249; Torchlight Dungeons</a></h1>
  <div id="hud">arrows / numpad move &middot; Shift runs &middot; g pick up &middot; i items &middot; &gt; stairs &middot; R rest &middot; ? help &middot; Esc menu</div>
</header>
<div id="stage">
  <canvas id="cv" aria-label="Game screen: the dungeon around you, with messages at the top and your status at the bottom. Press question mark for the list of commands."></canvas>
</div>
<nav>
  <div id="gamepad" hidden>
    <div id="dpad" role="group" aria-label="Direction pad. Eight directions: press between two arrows to move diagonally. Hold to keep walking."><span class="l">&#9664;</span><span class="r">&#9654;</span><span class="u">&#9650;</span><span class="d">&#9660;</span></div>
    <div class="mid"><button data-pad="select" data-label="SELECT" aria-label="Select: open the menu"></button><button data-pad="start" data-label="START" aria-label="Start: start the game, or open the menu"></button></div>
    <div class="ab"><button data-pad="b" aria-label="B: commands">B</button><button data-pad="a" aria-label="A: act here: pick up, take the stairs, or wait a turn">A</button></div>
  </div>
</nav>
<script>
"use strict";
/* ================= Shared core: physics, light, ink, 24-bit renderer ================= */
const MONO = 'ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace';
const SANS = '-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif';
// The simulated screen is always dark: characters emit light, so they need a black background.
const SCREEN = { bg: "#0B0F16", dot: "#1C2432", line: "#263042", text: "#DCE3EC", muted: "#7C889B", accent: "#7FA2FF", pink: "#F07FB8", lamp: "#FFC857" };
const RAMPS = { classic: " .:-=+*#%@", detailed: " .'`^\",:;Il!i~+_-?]}1)|/tfjrxnuvczXYUJCLQ0OZmwqpdbkhao*#MW&8%B@", blocks: " \u2591\u2592\u2593\u2588" };
function norm(v){ const l = Math.hypot(...v); return v.map(x => x / l); }
const DIR = norm([-0.5, -0.6, 0.65]), SUB = [0.25, 0.75], MREF = 2.4;
const AMB_RGB = [0.55, 0.65, 0.9];     // room light is slightly blue
const FLASH_RGB = [1.0, 0.75, 0.45];   // impact flashes are warm
const FLOOR_ALB = 0.5;                 // share of light the floor reflects
const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5];
const MATS = {
  foam:   { name: "foam",   density: 0.2, e: 0.70, mu: 0.6, kd: 0.95, ks: 0.05, shine: 4,  alb: [0.20, 0.85, 0.72], rMin: 1.6, rMax: 2.4 },
  rubber: { name: "rubber", density: 1.0, e: 0.55, mu: 0.8, kd: 0.85, ks: 0.30, shine: 14, alb: [0.30, 0.48, 1.00], alt: [1.00, 0.38, 0.68], rMin: 1.2, rMax: 1.9 },
  steel:  { name: "steel",  density: 7.0, e: 0.35, mu: 0.2, kd: 0.45, ks: 1.10, shine: 70, alb: [0.72, 0.76, 0.82], rMin: 0.9, rMax: 1.3 },
  peg:    { name: "peg",    density: 0,   e: 0.50, mu: 0.3, kd: 0.80, ks: 0.20, shine: 10, alb: [0.42, 0.47, 0.56] }
};
const MIX = ["rubber", "rubber", "rubber", "rubber", "foam", "foam", "foam", "steel", "steel", "steel"];
function hexToLinear(hex){
  const n = parseInt(hex.slice(1), 16);
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255].map(c => Math.pow(c / 255, 2.2));
}
function defaultDisplay(){
  return { chars: RAMPS.classic, calibrate: true, dither: false, black: 0.15, exposure: 1.3, gamma: 2.2, split: 0.2, glow: 0.35, room: 0.18, lampHex: "#FFD9A0", lampRGB: hexToLinear("#FFD9A0") };
}

/* ---------- arcade display settings (settings.html), shared by the game pages ---------- */
// One choice for every cartridge, saved in this browser: character set, ASCII or pixel drawing, tube TV filter, and
// detail (1, 2 or 3: how many times finer the engine draws its lit bodies and light; see Screen.fit).
const ARCADE_KEY = "arcade.v1.display";
const ARCADE_DEFAULTS = { ramp: "classic", custom: " .:oO0@", mode: "ascii", crt: false, detail: 1 };
function arcadeSettings(){
  let saved = {};
  try { saved = JSON.parse(localStorage.getItem(ARCADE_KEY) || "{}") || {}; }
  catch (e){ console.warn("Arcade: saved display settings unreadable, using defaults", e); }
  return { ...ARCADE_DEFAULTS, ...saved };
}
function saveArcadeSettings(s){
  try { localStorage.setItem(ARCADE_KEY, JSON.stringify(s)); return true; }
  catch (e){ console.warn("Arcade: could not save display settings", e); return false; }
}
function arcadeChars(s){ return s.ramp === "custom" ? (s.custom.length > 1 ? s.custom : " @") : RAMPS[s.ramp] || RAMPS.classic; }
// The tube TV look is CSS laid over the game's #stage: scanlines, a phosphor grille, vignette, rounded glass, flicker.
const CRT_CSS = `
body.crt #stage{background:#050607}
body.crt #cv{border-radius:14px;filter:saturate(1.15) contrast(1.06) brightness(1.1)}
body.crt #stage::before,body.crt #stage::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:2}
body.crt #stage::before{background:repeating-linear-gradient(to bottom,rgba(0,0,0,.24) 0 1px,transparent 1px 3px),
  repeating-linear-gradient(to right,rgba(255,40,40,.06) 0 1px,rgba(40,255,40,.06) 1px 2px,rgba(60,60,255,.06) 2px 3px)}
body.crt #stage::after{border-radius:inherit;background:radial-gradient(ellipse at center,transparent 58%,rgba(0,0,0,.55) 100%);
  box-shadow:inset 0 0 50px rgba(0,0,0,.85),inset 0 0 6px rgba(160,200,255,.15);animation:crt-flicker 5s steps(40) infinite}
@keyframes crt-flicker{0%,100%{opacity:1}47%{opacity:.93}50%{opacity:1}73%{opacity:.96}}
@media (prefers-reduced-motion: reduce){body.crt #stage::after{animation:none}}`;
// Call once at start-up with the game's display: applies the character set, pixel mode and the TV filter.
function applyArcadeSettings(D){
  const s = arcadeSettings();
  D.chars = arcadeChars(s); D.pixels = s.mode === "pixels"; D.detail = Math.max(1, Math.min(3, s.detail | 0 || 1));
  if (!document.getElementById("crt-css")){ const st = document.createElement("style"); st.id = "crt-css"; st.textContent = CRT_CSS; document.head.appendChild(st); }
  document.body.classList.toggle("crt", !!s.crt);
  return s;
}

/* ---------- physics (unchanged from v2) ---------- */
function hit(b, dv){ if (dv > 220) b.flash = Math.max(b.flash, Math.min(1, (dv - 220) / 1000)); }
class World {
  constructor(){ this.bodies = []; this.forces = []; this.w = 300; this.h = 300; this.unit = 10; this.g = { x: 0, y: 0 };
    this.substeps = 4; this.cell = 60; this.grid = new Map(); this.drag = 0; this.onSub = null;
    this.openTop = false;   // true: no ceiling, bodies can fly above y = 0 and fall back
    this.terrain = null;    // optional grid of solid cells: { cw, ch, cols, rows, solid: Uint8Array, mat } (see collideTerrain)
  }
  add(x, y, r, matName, alb, matOverride){
    const M = matOverride || MATS[matName], st = matName === "peg";
    const m = st ? 0 : M.density * (r / this.unit) ** 2;
    const b = { x, y, vx: 0, vy: 0, r, a: Math.random() * 6.283, w: 0, mat: M, alb: alb || M.alb, static: st, m,
      im: st ? 0 : 1 / m, iI: st ? 0 : 1 / (0.4 * m * r * r), grab: null, flash: 0, touch: false };
    this.bodies.push(b);
    if (this.bodies.length > 260){ const i = this.bodies.findIndex(o => !o.static && !o.grab); if (i >= 0) this.bodies.splice(i, 1); }
    return b;
  }
  // A box is a rotating rectangle with half-width hw and half-height hh. Its r is the bounding radius, which the
  // broadphase grid uses; mass uses the same area rule as circles, so equal materials have equal density.
  addBox(x, y, hw, hh, matName, alb, matOverride){
    const b = this.add(x, y, Math.hypot(hw, hh), matName, alb, matOverride);
    b.box = true; b.hw = hw; b.hh = hh;
    if (!b.static){ b.m = b.mat.density * 4 * hw * hh / Math.PI / this.unit ** 2; b.im = 1 / b.m; b.iI = 3 / (b.m * (hw * hw + hh * hh)); }
    return b;
  }
  step(dt){
    let maxR = 1; for (const b of this.bodies) if (b.r > maxR) maxR = b.r;
    this.cell = maxR * 2 + 2;
    const h = dt / this.substeps;
    for (let s = 0; s < this.substeps; s++){ this.substep(h); if (this.onSub) this.onSub(); }
    const decay = Math.pow(0.001, dt); for (const b of this.bodies) b.flash *= decay;
  }
  substep(h){
    const { w, h: H, g } = this;
    for (const b of this.bodies){
      if (b.static) continue;
      const mN = Math.max(0.25, b.m / MREF);
      let ax = g.x, ay = g.y;
      const sp = Math.hypot(b.vx, b.vy);
      if (sp > 0 && this.drag){ const k = this.drag * b.r * sp * b.im; ax -= b.vx * k; ay -= b.vy * k; }
      if (b.grab){ ax += (520 * (b.grab.x - b.x) - 46 * b.vx) / mN; ay += (520 * (b.grab.y - b.y) - 46 * b.vy) / mN; }
      for (const f of this.forces){
        const dx = b.x - f.x, dy = b.y - f.y, d = Math.hypot(dx, dy);
        if (d > 0.001 && d < f.radius){ const k = (1 - d / f.radius) * f.strength / mN; ax += dx / d * k; ay += dy / d * k; }
      }
      b.vx += ax * h; b.vy += ay * h;
      const s2 = Math.hypot(b.vx, b.vy); if (s2 > 4000){ b.vx *= 4000 / s2; b.vy *= 4000 / s2; }
      b.x += b.vx * h; b.y += b.vy * h; b.a += b.w * h; b.w *= 0.9997;
      if (b.box){ this.boxWalls(b); continue; }
      if (b.x - b.r <= 0){ b.x = b.r; this.wall(b, -1, 0, h); }
      if (b.x + b.r >= w){ b.x = w - b.r; this.wall(b, 1, 0, h); }
      if (!this.openTop && b.y - b.r <= 0){ b.y = b.r; this.wall(b, 0, -1, h); }
      if (b.y + b.r >= H){ b.y = H - b.r; this.wall(b, 0, 1, h); }
    }
    for (const b of this.bodies) b.touch = false;
    this.collide(); this.collide(false);   // second pass reuses the grid: positions only moved by sub-pixel corrections
    if (this.terrain) this.collideTerrain();
    for (const b of this.bodies){
      if (b.static) continue;
      if (b.touch && !b.grab && b.vx * b.vx + b.vy * b.vy < 1600){ b.vx *= 0.9; b.vy *= 0.9; b.w *= 0.9; }
      if (!b.box){ b.x = Math.min(w - b.r, Math.max(b.r, b.x)); b.y = Math.min(H - b.r, this.openTop ? b.y : Math.max(b.r, b.y)); }
    }
  }
  // Boxes meet walls at their corners: push back the deepest corner, then apply one impulse at the middle of the
  // corners past the wall, so a box lying flat gets no spurious spin.
  boxWalls(b){
    const c = Math.cos(b.a), s = Math.sin(b.a), ux = c * b.hw, uy = s * b.hw, vx = -s * b.hh, vy = c * b.hh;
    const P = [b.x + ux + vx, b.y + uy + vy, b.x - ux + vx, b.y - uy + vy, b.x - ux - vx, b.y - uy - vy, b.x + ux - vx, b.y + uy - vy];
    for (const [nx, ny, lim] of [[-1, 0, 0], [1, 0, this.w], [0, -1, 0], [0, 1, this.h]]){
      if (ny < 0 && this.openTop) continue;
      let depth = 0, sx = 0, sy = 0, n = 0;
      for (let i = 0; i < 8; i += 2){
        const d = nx ? nx * (P[i] - lim) : ny * (P[i + 1] - lim);   // how far this corner is past the wall
        if (d > 0){ depth = Math.max(depth, d); sx += P[i]; sy += P[i + 1]; n++; }
      }
      if (!n) continue;
      b.x -= nx * depth; b.y -= ny * depth;
      for (let i = 0; i < 8; i += 2){ P[i] -= nx * depth; P[i + 1] -= ny * depth; }
      b.touch = true;
      this.impulse(b, null, sx / n - nx * depth, sy / n - ny * depth, nx, ny);
    }
  }
  // Impulse at contact point (px, py) with normal n pointing from a towards b. b = null is an immovable wall.
  // Includes rotation, so it works for any shape; circle pairs keep their own cheaper path in resolve().
  impulse(a, b, px, py, nx, ny){
    const rax = px - a.x, ray = py - a.y, rbx = b ? px - b.x : 0, rby = b ? py - b.y : 0;
    const bim = b ? b.im : 0, biI = b ? b.iI : 0;
    const rel = () => [(b ? b.vx - b.w * rby : 0) - (a.vx - a.w * ray), (b ? b.vy + b.w * rbx : 0) - (a.vy + a.w * rax)];
    let [rvx, rvy] = rel();
    const vn = rvx * nx + rvy * ny;
    if (vn >= 0) return;
    const ran = rax * ny - ray * nx, rbn = rbx * ny - rby * nx;
    const e = -vn < 30 ? 0 : b ? (a.mat.e + b.mat.e) / 2 : a.mat.e;
    const j = -(1 + e) * vn / (a.im + bim + ran * ran * a.iI + rbn * rbn * biI);
    a.vx -= j * nx * a.im; a.vy -= j * ny * a.im; a.w -= j * ran * a.iI; hit(a, j * a.im);
    if (b){ b.vx += j * nx * bim; b.vy += j * ny * bim; b.w += j * rbn * biI; hit(b, j * bim); }
    [rvx, rvy] = rel();
    const tx = -ny, ty = nx, vt = rvx * tx + rvy * ty, rat = rax * ty - ray * tx, rbt = rbx * ty - rby * tx;
    const lim = (b ? Math.sqrt(a.mat.mu * b.mat.mu) : a.mat.mu) * j;
    const jt = Math.max(-lim, Math.min(lim, -vt / (a.im + bim + rat * rat * a.iI + rbt * rbt * biI)));
    a.vx -= jt * tx * a.im; a.vy -= jt * ty * a.im; a.w -= jt * rat * a.iI;
    if (b){ b.vx += jt * tx * bim; b.vy += jt * ty * bim; b.w += jt * rbt * biI; }
  }
  // Terrain cells are not bodies: each moving body checks only the solid cells under its bounding box, each one
  // treated as a fixed box. So a screen full of terrain costs nothing until something touches it.
  collideTerrain(){
    const T = this.terrain, cell = this.tcell || (this.tcell = { box: true, static: true, a: 0, im: 0, iI: 0, vx: 0, vy: 0, w: 0, flash: 0 });
    cell.hw = T.cw / 2; cell.hh = T.ch / 2; cell.r = Math.hypot(cell.hw, cell.hh); cell.mat = T.mat;
    for (const b of this.bodies){
      if (b.static || b.sensor) continue;
      const c0 = Math.max(0, Math.floor((b.x - b.r) / T.cw)), c1 = Math.min(T.cols - 1, Math.floor((b.x + b.r) / T.cw));
      const r0 = Math.max(0, Math.floor((b.y - b.r) / T.ch)), r1 = Math.min(T.rows - 1, Math.floor((b.y + b.r) / T.ch));
      for (let r = r0; r <= r1; r++) for (let c = c0; c <= c1; c++){
        if (!T.solid[r * T.cols + c]) continue;
        cell.x = (c + 0.5) * T.cw; cell.y = (r + 0.5) * T.ch;
        this.resolve(cell, b);
      }
    }
  }
  resolveBox(a, b){
    const A = a.box ? a : b, B = A === a ? b : a;   // A is always a box
    const C = B.box ? boxBox(A, B) : boxCircle(A, B);
    if (!C) return;
    A.touch = B.touch = true;
    const ws = A.im + B.im, corr = Math.max(0, C.depth - 0.3) / ws * 0.8;
    A.x -= C.nx * corr * A.im; A.y -= C.ny * corr * A.im; B.x += C.nx * corr * B.im; B.y += C.ny * corr * B.im;
    for (const [px, py] of C.pts) this.impulse(A, B, px, py, C.nx, C.ny);
  }
  wall(b, nx, ny, h){
    const M = b.mat; let jn; b.touch = true;
    const vn = b.vx * nx + b.vy * ny;

/* ---------- in-game pause menu, shared by the games ---------- */
// Drawn into the game's own screen on MENU_LAYER, above the game's text, so it matches ASCII or pixel mode and
// stays readable.
// The game supplies the rows as a function (labels and values can change): each row is
// { label, value?: () => string, change?: dir => void, select?: () => void }.
// Keys while open: up/down move, left/right change a value, Enter/Space choose, Esc/P close.
function createMenu(rows, { onOpen, onClose, onChange } = {}){

  m.hide = () => { if (!m.open) return; m.open = false; onClose && onClose(); touched(); };
  m.toggle = () => (m.open ? m.hide() : m.show());

  m.change = d => { const r = rows()[m.at]; if (r.change) r.change(d); else if (d > 0 && r.select) r.select(); touched(); };
  m.choose = () => { const r = rows()[m.at]; if (r.select) r.select(); else if (r.change) r.change(1); touched(); };

    if (!m.open) return false;
    const k = e.key;
    if (k === "ArrowUp" || k === "w" || k === "W") m.move(-1);
    else if (k === "ArrowDown" || k === "s" || k === "S") m.move(1);
    else if (k === "ArrowLeft" || k === "a" || k === "A") m.change(-1);
    else if (k === "ArrowRight" || k === "d" || k === "D") m.change(1);
    else if (k === "Enter" || k === " ") m.choose();
    else if (k === "Escape" || k === "p" || k === "P") m.hide();

  };

  m.tap = (gx, gy) => {
    if (!m.open || !m.box) return false;
    const b = m.box, i = gy - b.y0;
    if (gx < b.x0 || gx >= b.x0 + b.w || gy < b.top || gy >= b.top + b.h){ m.hide(); return true; }

      // written on top later (including dim notes) still shows.
      text(x0, top + y, "|", dim); text(x0 + 1, top + y, " ".repeat(w - 2), [0, 0, 0]); text(x0 + w - 1, top + y, "|", dim);

    get(k, d = null){ try { const v = localStorage.getItem(prefix + k); return v === null ? d : v; } catch (e){ return d; } },
    set(k, v){ try { localStorage.setItem(prefix + k, v); return true; } catch (e){ console.warn(label + ": could not save " + k, e); return false; } },
    getJSON(k, d){ const v = this.get(k); if (v === null) return d; try { return JSON.parse(v); } catch (e){ console.warn(label + ": saved " + k + " unreadable, using defaults", e); return d; } },

// A saved top-n list. add() returns the new entry's rank (0 is best) and whether saving worked.
function scoreTable(store, n = 5, key = "scores", better = (a, b) => b.score - a.score){
  const list = store.getJSON(key, []);
  return { list, add(entry){ list.push(entry); list.sort(better); list.length = Math.min(list.length, n); return { rank: list.indexOf(entry), saved: store.setJSON(key, list) }; } };
}

// The frame loop: step(dt, t) at most ~60 times a second (120 Hz displays call more often than a game needs),

// One small generator (mulberry32), so a level or a whole game can be replayed from its seed, and its state saved.
class RNG {
  constructor(seed){ this.s = (seed >>> 0) || 1; }
  next(){
    let a = (this.s = (this.s + 0x6D2B79F5) >>> 0);
    a = Math.imul(a ^ a >>> 15, a | 1); a ^= a + Math.imul(a ^ a >>> 7, a | 61);
    return ((a ^ a >>> 14) >>> 0) / 4294967296;
  }

  range(a, b){ return a + this.int(b - a + 1); }             // a .. b
  chance(p){ return this.next() < p; }

  dice(s){ const [n, d] = s.split("d").map(Number); let t = 0; for (let i = 0; i < n; i++) t += 1 + this.int(d); return t; }   // "2d6"
  shuffle(a){ for (let i = a.length - 1; i > 0; i--){ const j = this.int(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; }

}
/* ---------- Torchlight Dungeons: field of view and the light field ---------- */
// Symmetric shadowcasting, written from Albert Ford's public description of the algorithm: if A can see B, B can see
// A, so "the monster sees you" and "you see the monster" always agree. Walls that bound the view are seen too.
// blocks(x, y) says whether a cell stops sight (out-of-bounds cells must block); see(x, y) is called once per cell.
let fovStamp = null, fovMark = 0, fovW = 0;
function fov(ox, oy, radius, blocks, see, w, h){
  if (!fovStamp || fovStamp.length !== w * h){ fovStamp = new Uint32Array(w * h); fovMark = 0; }
  fovW = w; fovMark++;

  const show = (x, y) => { if (x < 0 || y < 0 || x >= w || y >= h) return; const i = y * fovW + x; if (fovStamp[i] !== mark){ fovStamp[i] = mark; see(x, y); } };
  show(ox, oy);

    // the four quadrants: north, east, south, west; (depth, col) -> map cell
    const tx = (d, c) => q === 0 ? ox + c : q === 1 ? ox + d : q === 2 ? ox + c : ox - d;
    const ty = (d, c) => q === 0 ? oy - d : q === 1 ? oy + c : q === 2 ? oy + d : oy + c;
    const scan = (depth, start, end) => {
      if (depth > radius) return;
      let prev = 0;   // 0 none yet, 1 wall, 2 floor
      const c0 = Math.floor(depth * start + 0.5), c1 = Math.ceil(depth * end - 0.5);
      for (let c = c0; c <= c1; c++){

        if ((wall || (c >= depth * start && c <= depth * end)) && c * c + depth * depth <= r2) show(x, y);
        if (prev === 1 && !wall) start = (2 * c - 1) / (2 * depth);
        if (prev === 2 && wall) scan(depth + 1, start, (2 * c - 1) / (2 * depth));
        prev = wall ? 1 : 2;

      if (prev === 2) scan(depth + 1, start, end);

// Adds one light source into a field of RGB light (3 floats per cell): it lights every cell it can see, fading
// with distance, so walls cast real shadows. src: { x, y, r: radius in cells, i: intensity, rgb }.

    const k = 1 - Math.hypot(x - src.x, y - src.y) / R; if (k <= 0) return;
    const v = src.i * k * k, j = 3 * (y * w + x);

// Energy scheduler: every tick each actor gains energy by its speed, and whoever reaches 100 acts. Speed +10 acts

// Rooms of a few shapes joined by corridors, with doors where a corridor passes through a room's wall, and stairs.
// Original code: the layout ideas (rooms, tunnels, lit rooms that get rarer with depth) are common to the genre.
const MW = 198, MH = 66;   // map size, as in Moria
// Town tiles: GROUND (open ground), SHOP (a shop's entrance; L.shopAt says which), LAMP (a lamp post: blocks your
// way but not your view).
const T = { EDGE: 0, WALL: 1, FLOOR: 2, DOOR: 3, OPEN: 4, DOWN: 5, UP: 6, SHOP: 7, GROUND: 8, LAMP: 9 };
const passable = t => t >= T.FLOOR && t !== T.DOOR && t !== T.LAMP;   // closed doors open when you walk into them

function generateLevel(rng, depth){

  for (let x = 0; x < MW; x++){ tiles[x] = T.EDGE; tiles[(MH - 1) * MW + x] = T.EDGE; }
  for (let y = 0; y < MH; y++){ tiles[y * MW] = T.EDGE; tiles[y * MW + MW - 1] = T.EDGE; }
  const rooms = [];

    if (x0 < 2 || y0 < 2 || x1 > MW - 3 || y1 > MH - 3) return false;
    for (let y = y0 - 2; y <= y1 + 2; y++) for (let x = x0 - 2; x <= x1 + 2; x++) if (room[y * MW + x] >= 0) return false;
    return true;
  };

    const w = 4 + rng.int(14), h = 3 + rng.int(7), x0 = 2 + rng.int(MW - w - 4), y0 = 2 + rng.int(MH - h - 4), x1 = x0 + w - 1, y1 = y0 + h - 1;
    if (!free(x0, y0, x1, y1)) continue;
    const id = rooms.length, isLit = rng.int(28) + 1 > depth;   // lit rooms are common near the top, rare deep down
    const shape = w >= 9 && h >= 5 ? rng.pick(["plain", "plain", "plain", "cross", "pillars"]) : "plain";
    const cells = [];
    for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++){

        const cxw = Math.floor(w / 4), cyh = Math.floor(h / 3);
        if ((x < x0 + cxw || x > x1 - cxw) && (y < y0 + cyh || y > y1 - cyh)) continue;
      }
      if (shape === "pillars" && (x - x0) % 2 === 1 && (y - y0) % 2 === 1 && x < x1 && y < y1) continue;   // a pillared hall
      cells.push(y * MW + x);
    }
    for (const i of cells){ tiles[i] = T.FLOOR; room[i] = id; }
    // the room's walls belong to it too, so they are lit with it and doors can be placed in them
    for (const i of cells) for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++){
      const j = i + dy * MW + dx; if (tiles[j] === T.WALL && room[j] < 0) room[j] = id;
    }
    if (isLit) for (let y = y0 - 1; y <= y1 + 1; y++) for (let x = x0 - 1; x <= x1 + 1; x++) if (room[y * MW + x] === id) lit[y * MW + x] = 1;
    rooms.push({ id, x0, y0, x1, y1, lit: isLit, cells, cx: (x0 + x1) >> 1, cy: (y0 + y1) >> 1 });
  }

  const order = [...rooms].sort((a, b) => a.cx - b.cx);

  const tunnel = (a, b) => {

    const walk = (tx, ty) => { while (x !== tx || y !== ty){ if (x !== tx) x += Math.sign(tx - x); else y += Math.sign(ty - y); dig(y * MW + x); } };
    walk(bendX, bendY); walk(b.cx, b.cy);

  for (let k = 0; k < 3 + rng.int(4); k++) tunnel(rng.pick(rooms), rng.pick(rooms));
  // doors: a carved cell in a room's wall that a corridor passes straight through
  for (let i = 0; i < tiles.length; i++){
    if (!carved[i] || room[i] < 0 || tiles[i] !== T.FLOOR) continue;
    const ns = passable(tiles[i - MW]) && passable(tiles[i + MW]) && opaque(tiles[i - 1]) && opaque(tiles[i + 1]);
    const ew = passable(tiles[i - 1]) && passable(tiles[i + 1]) && opaque(tiles[i - MW]) && opaque(tiles[i + MW]);
    if ((ns || ew) && rng.chance(0.75)) tiles[i] = rng.chance(0.65) ? T.DOOR : T.OPEN;

    }

  for (let k = 0; k < 1 + rng.int(2); k++) tiles[spot()] = T.UP;   // on level 1 they lead up to the town
  return { tiles, room, lit, rooms, spot, w: MW, h: MH };
}

/* ---------- the town ---------- */
// A walled town on the surface: six shops in two rows along a main street, a few houses, lamp posts, and the
// stairs down. It uses the top-left TW x TH of the map; L.w and L.h tell the camera where it ends.
const TW = 80, TH = 26;
function generateTown(rng){

  const shopAt = new Int8Array(MW * MH).fill(-1), at = (x, y) => y * MW + x;

  const shops = [], houses = [], lamps = [];
  const building = (x0, y0, w, h) => { for (let y = y0; y < y0 + h; y++) for (let x = x0; x < x0 + w; x++) tiles[at(x, y)] = T.WALL; };
  // shops: three facing the street from above, three from below; the street runs along the middle
  const order = rng.shuffle([0, 1, 2, 3, 4, 5]), street = TH >> 1;

    building(x0, y0, w, h);

    tiles[door] = T.SHOP; shopAt[door] = order[k];

  for (let tries = 0; tries < 60 && houses.length < 6; tries++){
    const w = 4 + rng.int(4), h = 3 + rng.int(2), x0 = 2 + rng.int(TW - w - 4), y0 = 2 + rng.int(TH - h - 4);
    let free = true;
    for (let y = y0 - 1; y <= y0 + h && free; y++) for (let x = x0 - 1; x <= x0 + w && free; x++) if (tiles[at(x, y)] !== T.GROUND || Math.abs(y - street) <= 1) free = false;
    if (free){ building(x0, y0, w, h); houses.push({ x0, y0, w, h }); }
  }
  for (let x = 6; x < TW - 4; x += 12) for (const y of [street - 1, street + 1]) if (tiles[at(x, y)] === T.GROUND){ tiles[at(x, y)] = T.LAMP; lamps.push(at(x, y)); }

  const ground = []; for (let i = 0; i < tiles.length; i++) if (tiles[i] === T.GROUND) ground.push(i);
  let down;

  tiles[down] = T.DOWN;
  return { tiles, room, lit, rooms: [{ cells: ground.filter(i => i !== down) }], spot: () => down, w: TW, h: TH, town: true, shops, shopAt, lamps, houses, street };
}
// Every cell a player can stand on, reached from the first room (closed doors count as passable).
function reachable(L){

    if (from > 0 && player.turns - lastTown > 500) shops.forEach((sh, i) => { sh.stock = restock(sh.stock, SHOPS[i], rng, player.know, 0.5); });
    lastTown = player.turns; wasDay = isDay(); lightTown();
    for (let y = 0; y < L.h; y++) for (let x = 0; x < L.w; x++) mem[idx(x, y)] = 1;   // you know your own town
    for (let k = 0, n = 5 + rng.int(4) + (wasDay ? 0 : 3); k < n; k++) spawnMonster(false);
    centerCamera(true); updateSight();
    say(from > 0 ? "You climb out into the town of Lanternhollow." : "You stand in Lanternhollow, a town above the dungeon. The shops are numbered 1 to 6.");
    say(wasDay ? "It is daytime." : "It is night; the lamps are lit.");

  }

  for (let i = 0; i < MW * MH; i++) if (L.lit[i]){ roomLight[3 * i] = ROOM_RGB[0]; roomLight[3 * i + 1] = ROOM_RGB[1]; roomLight[3 * i + 2] = ROOM_RGB[2]; }
  for (let k = 0, n = 14 + d + rng.int(8); k < n; k++) spawnMonster(false);
  for (let k = 0, n = 8 + rng.int(6); k < n; k++) dropAt(freeSpot(0), rng.chance(0.35) ? { k: "gold", n: rng.range(8, 25) * d } : loot(d));

const depthName = d => d ? feet(d) + " ft" : "the town";

/* ---------- the town: day and night ---------- */
// A day lasts DAY turns: daylight for the first half. By day the sun crosses from east to west and the buildings
// cast shadows away from it; at night there is faint moonlight, and the lamp posts and shop doorways glow.
const DAY = 10000, MOON_RGB = [0.035, 0.045, 0.08], LAMP_RGB = [1.0, 0.7, 0.35];
let shops = null, lastTown = 0, wasDay = true;
const dayPhase = () => (player.turns % DAY) / DAY, isDay = () => dayPhase() < 0.5;
function lightTown(){
  roomLight.fill(0);
  const ph = dayPhase();
  if (ph < 0.5){
    const a = ph / 0.5 * Math.PI, high = Math.sin(a), k = 0.3 + 0.7 * high;   // brightest at noon, warmer at dawn and dusk
    const rgb = [0.95 * k, (0.7 + 0.22 * high) * k, (0.5 + 0.35 * high) * k], sx = Math.cos(a) * 2, sy = 0.6;   // towards the sun (to the south)
    for (let y = 0; y < L.h; y++) for (let x = 0; x < L.w; x++){
      const i = idx(x, y);
      let f = 1;
      if (!opaque(L.tiles[i])) for (let s = 1; s <= 4; s++){   // in a building's shadow?
        const tx = Math.round(x + sx * s), ty = Math.round(y + sy * s);
        if (tx >= 0 && ty >= 0 && tx < L.w && ty < L.h && L.tiles[idx(tx, ty)] === T.WALL){ f = 0.45; break; }
      }
      roomLight[3 * i] = rgb[0] * f; roomLight[3 * i + 1] = rgb[1] * f; roomLight[3 * i + 2] = rgb[2] * f;
    }
    return;
  }
  for (let y = 0; y < L.h; y++) for (let x = 0; x < L.w; x++){ const i = idx(x, y); roomLight[3 * i] = MOON_RGB[0]; roomLight[3 * i + 1] = MOON_RGB[1]; roomLight[3 * i + 2] = MOON_RGB[2]; }
  for (const i of L.lamps) addLight(roomLight, MW, MH, blocks, { x: i % MW, y: Math.floor(i / MW), r: 6, i: 0.9, rgb: LAMP_RGB });
  L.shops.forEach((sh, k) => addLight(roomLight, MW, MH, blocks, { x: sh.door % MW, y: Math.floor(sh.door / MW), r: 4, i: 0.8, rgb: SHOPS[k].rgb.map(v => v * 0.7) }));
}
function freeSpot(minDist){
  for (let tries = 0; tries < 400; tries++){
    const r = rng.pick(L.rooms), i = rng.pick(r.cells), x = i % MW, y = Math.floor(i / MW);
    if ((L.tiles[i] === T.FLOOR || L.tiles[i] === T.GROUND) && !monAt(x, y) && dist(x, y, player.x, player.y) >= minDist && !(minDist && visible(i))) return i;

}
function dropAt(i, it){ if (i >= 0) floor.push({ x: i % MW, y: Math.floor(i / MW), it }); }
function pickMonster(d){
  const deep = rng.chance(0.1) ? 3 : 0;   // now and then, something from deeper down
  const pool = d === 0 ? MONSTERS.filter(m => m.town) : MONSTERS.filter(m => !m.town && m.depth <= d + deep);

function spawnMonster(awake){
  const K = pickMonster(depth), at = freeSpot(10); if (at < 0) return;

  let x = at % MW, y = Math.floor(at / MW);
  for (let k = 0; k < n; k++){
    // a pack gathers around the first one
    let px = x, py = y;
    for (let t = 0; t < 12 && (k > 0) && (monAt(px, py) || !passable(L.tiles[idx(px, py)])); t++){ px = x + rng.range(-2, 2); py = y + rng.range(-2, 2); }
    if (monAt(px, py) || !passable(L.tiles[idx(px, py)])) continue;
    const hp = rng.dice(K.hp);
    mons.push({ K, x: px, y: py, hp, mhp: hp, energy: rng.int(100), speed: K.speed, sleep: awake || K.pack ? 0 : rng.range(0, 30), seen: false });
  }
}

/* ---------- sight and light ---------- */
function computeLight(field, t){
  field.set(roomLight);
  const R = lightRadius();
  if (R > 0){
    const f = t ? 0.06 * Math.sin(t * 0.011) + 0.04 * Math.sin(t * 0.029 + 1.3) + 0.03 * Math.sin(t * 0.071) : 0;   // the flame flickers
    addLight(field, MW, MH, blocks, { x: player.x, y: player.y, r: R + f * 4, i: 1.3 * (1 + f), rgb: TORCH_RGB });
  }
  for (const m of mons) if (m.K && m.K.glow) addLight(field, MW, MH, blocks, { x: m.x, y: m.y, r: m.K.glow.r, i: 1.0, rgb: m.K.glow.rgb });
  if (!t) return;   // bolts and flashes only light what is drawn; they do not change what the turn saw
  for (const s of shots){ const c = s.path[Math.min(s.path.length - 1, Math.floor(s.t * s.speed))]; if (s.light) addLight(field, MW, MH, blocks, { x: c[0], y: c[1], r: 2.5, i: 1.2, rgb: s.light }); }
  for (const f of flashes) addLight(field, MW, MH, blocks, { x: f.x, y: f.y, r: 3.5, i: 1.6 * f.t / f.t0, rgb: f.rgb });
}
// After each turn: what the player can see is what is in their line of sight AND has light on it.
function updateSight(){
  turnNo++;
  computeLight(lightTurn, 0);
  const blind = player.t && player.t.blind > 0;
  fov(player.x, player.y, 45, blocks, (x, y) => {
    const i = idx(x, y); inFov[i] = turnNo;
    if (!blind && lum(lightTurn, 3 * i) > 0.03){ seenAt[i] = turnNo; mem[i] = 1; }
  }, MW, MH);
  for (const f of floor) if (visible(idx(f.x, f.y))) f.seen = true;   // items you have seen stay on the map
  rebuildTerrain();
}
function centerCamera(force){
  const ox = cam.x, oy = cam.y, w = L ? L.w : MW, h = L ? L.h : MH, mx = Math.max(0, w - GW), my = Math.max(0, h - VH);
  // the view moves in steps when you near its edge, like Moria's panels, rather than on every step
  if (force || player.x - cam.x < GW * 0.2 || player.x - cam.x > GW * 0.8) cam.x = w < GW ? -((GW - w) >> 1) : Math.max(0, Math.min(mx, player.x - (GW >> 1)));

  if (screen && (ox !== cam.x || oy !== cam.y)) for (const b of world.bodies){ b.x += (ox - cam.x) * screen.cw; b.y += (oy - cam.y) * screen.ch; }
}
// The engine's terrain for the debris: the walls on screen, plus the message and status rows.
function rebuildTerrain(){
  if (!screen || !L) return;
  const solid = new Uint8Array(GW * GH);
  for (let r = 0; r < GH; r++) for (let c = 0; c < GW; c++){
    const my = cam.y + r - VY, mx = cam.x + c;
    solid[r * GW + c] = r < VY || r >= VY + VH || mx < 0 || my < 0 || mx >= MW || my >= MH || opaque(L.tiles[idx(mx, my)]) ? 1 : 0;
  }
  world.terrain = { cw: screen.cw, ch: screen.ch, cols: GW, rows: GH, solid, mat: BITS };
}

/* ---------- the player's actions: each returns true when it took a turn ---------- */
function tryMove(dx, dy){
  if (player.t.confused && rng.chance(0.4)){ [dx, dy] = DIRS[rng.pick([1, 2, 3, 4, 6, 7, 8, 9])]; say("You are confused."); }
  const x = player.x + dx, y = player.y + dy, i = idx(x, y), t = L.tiles[i], m = monAt(x, y);
  if (m) return attack(m);
  if (t === T.DOOR){ L.tiles[i] = T.OPEN; say("You open the door."); return true; }
  if (!passable(t)){ say(t <= T.WALL ? "There is a wall in the way." : "Something is in the way."); return false; }
  player.x = x; player.y = y;
  for (const f of itemsAt(x, y)) if (f.it.k === "gold"){ player.gold += f.it.n; say("You find " + f.it.n + " gold pieces."); floor.splice(floor.indexOf(f), 1); }
  const here = itemsAt(x, y);
  if (here.length === 1) say("You see " + nameOf(here[0].it) + ".");
  else if (here.length > 1) say("You see several items here.");
  if (t === T.SHOP) openShop(L.shopAt[i]);
  if (t === T.DOWN) say("There is a staircase down here.");
  if (t === T.UP) say("There is a staircase up here.");
  return true;
}
const hitChance = (skill, ac, extra = 0) => Math.max(5, Math.min(95, skill + 20 - ac * 0.8 + extra));
// A weapon that slays a sort of monster, or is branded with an element the monster does not resist, doubles its dice.
function multiplier(P, K){

  if (P.brand && !(K.res || []).includes(P.brand)) return 2;
  return 1;
}
function attack(m){
  const K = m.K, name = theName(m), weak = player.food < 1000 ? -10 : 0, w = weapon(), P = w ? itemPowers(w) : { hit: 0, dam: 0 };

    const verb = ambush ? "You ambush " : mult > 1 && P.brand ? { fire: "You burn ", cold: "You freeze ", elec: "You shock " }[P.brand] : mult > 1 ? "You smite " : "You hit ";
    damage(m, dmg, verb + name + ".");
    return true;
  }

  return true;
}
function damage(m, dmg, msg, delay = 0){   // returns true if it died

}
function kill(m, name, delay = 0){
  say("You have slain " + name + ".");
  mons.splice(mons.indexOf(m), 1); player.kills++;
  gainExp(m.K.exp * m.K.depth / player.lvl);
  if (m.K.drop && rng.chance(m.K.drop)) dropAt(idx(m.x, m.y), rng.chance(0.6) ? { k: "gold", n: rng.range(5, 20) * depth } : loot(depth));
  const { x, y } = m;

}
function gainExp(e){
  player.exp += e;
  while (player.exp >= expNeeded(player, player.lvl + 1) && player.lvl < 40){
    const before = titleOf(player);
    player.lvl++; const up = levelHp(player, rng); player.mhp += up; player.hp += up;
    player.mmana = maxMana(player);

// Bits that tumble from a kill (or sparks from a hit, or glass from a potion), lit by your torch.
function burst(x, y, rgb, n){

  const px = (x - cam.x + 0.5) * screen.cw, py = (y - cam.y + VY + 0.5) * screen.ch;
  for (let k = 0; k < n; k++){
    const a = Math.random() * 6.283, sp = 80 + Math.random() * 220, b = world.add(px, py, screen.ch * (0.18 + Math.random() * 0.15), "bits", rgb.map(v => v * 0.45), BITS);

// A feeling about a weapon's or armour's quality, before it is identified.
function sense(it, chance){

  const sum = (it.tohit || 0) + (it.todam || 0) + (it.toac || 0);

}
function pickUp(){
  const here = itemsAt(player.x, player.y);

  for (const f of here){
    sense(f.it, skillOf(player, "notice"));
    const got = carry(f.it);
    if (!got){ say("You cannot carry any more."); break; }
    floor.splice(floor.indexOf(f), 1);
    say("You have " + nameOf(got) + " (" + String.fromCharCode(97 + player.inv.indexOf(got)) + ").");
  }
  recalc();
  if (player.bonus.burden) say("You are carrying too much and slow down.");
  return true;
}
function takeStairs(down){
  const t = L.tiles[idx(player.x, player.y)];
  if (t !== (down ? T.DOWN : T.UP)){ say("There is no staircase " + (down ? "down" : "up") + " here."); return false; }
  say(down ? "You descend the stairs." : "You climb the stairs.");
  newLevel(depth + (down ? 1 : -1));

}
function takeOne(it){ if (--it.n <= 0) player.inv.splice(player.inv.indexOf(it), 1); }
// Using an item teaches you its kind when you could tell what it did; otherwise it is marked {tried}.
function learn(it, noticed){

  if (player.know.known[K.id]) return;
  player.know.known[K.id] = true;
  say("You learn that it is " + nameOf({ k: it.k, n: 1 }) + ".");
  gainExp((K.depth + (player.lvl >> 1)) / player.lvl);
}
function useItem(it, how){

    player.food = Math.min(15000, player.food + (K.food || 0)); takeOne(it);
    if (K.effect) learn(it, FX[K.effect]({ K, it })); else say("That tastes good.");
    return true;
  }
  if (how === "quaff"){ takeOne(it); learn(it, FX[K.effect]({ K, it })); return true; }
  if (how === "read"){
    if (player.t.blind){ say("You can't see to read!"); return false; }
    if (player.t.confused){ say("You are too confused to read."); return false; }
    takeOne(it); learn(it, FX[K.effect]({ K, it })); return true;
  }

    const lt = player.eq.light;
    if (!lt || !ITEM[lt.k].maxFuel || lt.fuel === undefined){ say("You need a lantern to pour the oil into."); return false; }
    lt.fuel = Math.min(ITEM[lt.k].maxFuel, lt.fuel + K.fuel); say("You fill your lantern."); takeOne(it); return true;
  }

  if (how === "use") return useDevice(it);

    floor.push({ x: player.x, y: player.y, it: { ...it }, seen: true }); player.inv.splice(player.inv.indexOf(it), 1);

function wear(it){

}

  if (it.cursed){ say("You cannot remove " + nameOf(it) + ": it is cursed!"); if (!it.id) it.sense = "cursed"; return false; }
  if (player.inv.length >= 22){ say("You have no room in your pack."); return false; }

}
function useDevice(it){
  const K = ITEM[it.k], verb = { wand: "Aim", staff: "Use", rod: "Zap" }[K.cat];

  if (K.cat !== "rod" && it.charges <= 0){ say("It has no charges left."); return true; }
  const fail = Math.max(5, Math.min(75, 35 + K.depth - skillOf(player, "device") * 0.5));

/* ---------- effects: what potions, scrolls, mushrooms, wands, staffs and rods do ---------- */
// Each returns true when the player can tell what happened, which teaches them the item's kind.
const ELEM_RGB = { fire: [1.0, 0.45, 0.15], cold: [0.5, 0.75, 1.0], elec: [0.8, 0.8, 1.2], acid: [0.5, 1.0, 0.3], poison: [0.5, 0.9, 0.3], arcane: [0.8, 0.6, 1.0], drain: [0.6, 0.25, 0.8], light: [1.0, 1.0, 0.75] };
const TIMERS = { fast: ["You feel yourself moving faster!", "You feel yourself slow down."], hero: ["You feel like a hero!", "The heroism wears off."],
  berserk: ["You feel a terrible rage!", "You feel less violent."], bless: ["You feel righteous!", "The prayer has expired."],
  resFire: ["You feel safe from heat.", "You feel less safe from heat."], resCold: ["You feel safe from cold.", "You feel less safe from cold."],
  infra: ["Your eyes begin to tingle.", "Your eyes stop tingling."], poison: ["You are poisoned!", "You are no longer poisoned."],
  confused: ["You are confused!", "You feel less confused now."], blind: ["You are blind!", "You can see again."], asleep: ["You fall asleep.", "You wake up."] };
function setTimer(k, n){ const was = player.t[k] > 0; player.t[k] = Math.max(player.t[k] || 0, n); if (!was) say(TIMERS[k][0]); recalc(); return true; }
function clearTimer(k){ if (!(player.t[k] > 0)) return false; player.t[k] = 0; say(TIMERS[k][1]); recalc(); return true; }
const resists = m => rng.int(100) < 10 + 3 * m.K.depth;   // monsters save against sleep, slowing, confusion and fear
function hurtMon(m, dmg, elem, msg, delay){
  if (elem === "drain" && m.K.undead){ say(cap(theName(m)) + " is unaffected."); return false; }
  if (elem && (m.K.res || []).includes(elem)){ dmg = Math.ceil(dmg / 3); msg += " It resists a lot."; }
  return damage(m, dmg, msg, delay);
}
function missile(path, elem, speed = 40){   // the visible flight of a bolt, and its flash where it stops

  shots.push({ path, t: 0, speed, glyph: elem === "elec" ? "~" : "*", rgb: rgb.map(v => v * 1.8), light: rgb });
  later.push({ t: delay, fn: () => { flashes.push({ x: end[0], y: end[1], t: 0.35, t0: 0.35, rgb }); burst(end[0], end[1], rgb, 3); } });
  return delay;
}
function lineToWall(tx, ty, range){ const out = []; for (const c of line(player.x, player.y, tx, ty, range)){ if (blocks(c[0], c[1])) return { path: out, wall: c }; out.push(c); } return { path: out, wall: null }; }
function mapAround(r){
  for (let y = Math.max(1, player.y - r); y < Math.min(MH - 1, player.y + r); y++) for (let x = Math.max(1, player.x - r); x < Math.min(MW - 1, player.x + r); x++){
    const i = idx(x, y), t = L.tiles[i];
    if (!opaque(t) || t === T.DOOR) mem[i] = 1;
    else for (const d of [1, -1, MW, -MW, MW + 1, MW - 1, -MW + 1, -MW - 1]) if (!opaque(L.tiles[i + d])){ mem[i] = 1; break; }
  }
}
function teleportPlayer(range){

    const x = player.x + rng.range(-range, range), y = player.y + rng.range(-range, range);
    if (x < 1 || y < 1 || x >= MW - 1 || y >= MH - 1 || !passable(L.tiles[idx(x, y)]) || monAt(x, y) || dist(x, y, player.x, player.y) < range / 3) continue;
    player.x = x; player.y = y; centerCamera(true); return true;
  }
  return false;
}
function summonNear(pool, n){
  let made = 0;
  for (let k = 0; k < n && pool.length; k++){
    const K = rng.pick(pool);
    for (let tries = 0; tries < 20; tries++){
      const x = player.x + rng.range(-3, 3), y = player.y + rng.range(-3, 3);
      if (!passable(L.tiles[idx(x, y)]) || monAt(x, y)) continue;
      const hp = rng.dice(K.hp); mons.push({ K, x, y, hp, mhp: hp, energy: 0, speed: K.speed, sleep: 0, seen: false }); made++; break;
    }
  }
  return made;
}
function lightCells(cells){ for (const i of cells){ L.lit[i] = 1; roomLight[3 * i] = ROOM_RGB[0]; roomLight[3 * i + 1] = ROOM_RGB[1]; roomLight[3 * i + 2] = ROOM_RGB[2]; } }
function roomCells(){   // the room you stand in (with its walls), or the cells around you in a corridor
  const id = L.room[idx(player.x, player.y)], out = [];
  if (id >= 0) for (let i = 0; i < MW * MH; i++) if (L.room[i] === id) out.push(i);
  for (let y = player.y - 2; y <= player.y + 2; y++) for (let x = player.x - 2; x <= player.x + 2; x++) out.push(idx(x, y));
  return out;
}
function statusBolt(c, what){   // a bolt that puts a monster to sleep, slows, confuses or scares it
  const { path, m } = flight(c.tx, c.ty, 18), delay = missile(path, "arcane");
  if (!m) return false;
  if (resists(m)){ say(cap(theName(m)) + " is unaffected."); return true; }
  if (what === "sleep"){ m.sleep = 500; say(cap(theName(m)) + " falls asleep."); }
  if (what === "slow"){ m.slow = 20; say(cap(theName(m)) + " starts moving slower."); }
  if (what === "confuse"){ m.conf = 10 + rng.int(10); say(cap(theName(m)) + " looks confused."); }
  if (what === "scare"){ m.afraid = 20; say(cap(theName(m)) + " flees in terror!"); }
  return true;
}
function allInView(what){
  let n = 0;
  for (const m of mons) if (m.K && seesMon(m) && !resists(m)){ n++; if (what === "sleep") m.sleep = 500; else m.slow = 20; }
  if (n) say(what === "sleep" ? "The monsters around you fall asleep." : "The monsters around you slow down.");
  return n > 0;
}

function enchant(it, field){
  if (!it){ say("You have nothing to enchant."); return true; }
  const v = it[field] || 0, chance = v < 0 ? 100 : Math.max(10, 100 - v * 12);
  if (rng.int(100) < chance && !it.art){
    it[field] = v + 1; if (it.cursed && rng.chance(0.5)){ it.cursed = false; if (it.sense === "cursed") delete it.sense; }
    say("Your " + ITEM[it.k].name.toLowerCase() + " glows faintly."); recalc();
  } else say("The enchantment fails.");
  return true;
}

/* ---------- aiming: bolts and thrown things fly along a line until they hit a wall or a monster ---------- */
let aiming = null;   // while set, the next direction (or "nearest") fires it
function line(x0, y0, x1, y1, range){
  const out = [], dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0), sx = Math.sign(x1 - x0), sy = Math.sign(y1 - y0);
  let err = dx + dy, x = x0, y = y0;
  while (out.length < range){
    if (x === x1 && y === y1) break;
    const e2 = 2 * err; if (e2 >= dy){ err += dy; x += sx; } if (e2 <= dx){ err += dx; y += sy; }
    out.push([x, y]);
  }
  return out;
}
function flight(tx, ty, range){   // the cells a missile passes, and the monster it reaches first
  const path = [];
  for (const [x, y] of line(player.x, player.y, tx, ty, range)){
    if (blocks(x, y)) break;
    path.push([x, y]);
    const m = monAt(x, y); if (m) return { path, m };
  }
  return { path, m: null };
}
function nearestTarget(){
  let best = null;
  for (const m of mons) if (m.K && seesMon(m) && (!best || dist(m.x, m.y, player.x, player.y) < dist(best.x, best.y, player.x, player.y))) best = m;
  return best;
}
function aim(prompt, fn){ aiming = fn; oldMsgs = []; msgs = []; say(prompt + " Direction? (" + (pad.touch ? "D-pad, A nearest, B cancel" : "a direction key, ' or t for nearest, Esc") + ")"); }
function aimAt(dx, dy){ const f = aiming; aiming = null; act(() => f(player.x + dx * 20, player.y + dy * 20)); }
function aimNearest(){
  if (!aiming) return;
  const m = nearestTarget(); if (!m){ aiming = null; oldMsgs = []; msgs = []; say("There is nothing in sight to aim at."); return; }
  const f = aiming; aiming = null; act(() => f(m.x, m.y));
}
function throwItem(it){
  const K = ITEM[it.k];
  aim("Throw " + nameOf(it, 1) + ".", (tx, ty) => {
    const { path, m } = flight(tx, ty, 10), one = { ...it, n: 1 }, rgb = itemRgb(one, player.know);
    takeOne(it); recalc();
    if (!path.length){ dropAt(idx(player.x, player.y), one); say("It drops at your feet."); return true; }
    shots.push({ path, t: 0, speed: 35, glyph: K.glyph, rgb });
    const delay = path.length / 35, end = path[path.length - 1];
    let lands = K.cat !== "potion";
    if (m){
      if (rng.int(100) < hitChance(skillOf(player, "shoot"), m.K.ac, -2 * path.length + (K.throw ? 10 : 0))){
        const dmg = Math.max(1, rng.dice(K.dice || "1d1") + (one.todam || 0) + (K.throw ? Math.max(0, statMod(player.stats.dex)) : 0));
        damage(m, dmg, "The " + K.name.toLowerCase() + " hits " + theName(m) + ".", delay);
        if (K.throw && rng.chance(0.25)) lands = false;   // darts sometimes break
      } else say("The " + K.name.toLowerCase() + " misses " + theName(m) + ".");
    }
    if (K.cat === "potion"){ say("The potion shatters."); later.push({ t: delay, fn: () => burst(end[0], end[1], rgb, 8) }); }   // glass skitters across the floor
    if (lands) dropAt(idx(end[0], end[1]), one);
    return true;
  });
}
function fireAmmo(it){
  const bow = player.eq.bow, K = ITEM[it.k], B = ITEM[bow.k];
  aim("Fire " + nameOf(it, 1) + ".", (tx, ty) => {
    const { path, m } = flight(tx, ty, 10 + B.mult * 5), one = { ...it, n: 1 }, BP = itemPowers(bow);
    takeOne(it); recalc();
    if (!path.length){ dropAt(idx(player.x, player.y), one); return true; }
    shots.push({ path, t: 0, speed: 55, glyph: K.glyph, rgb: K.rgb });
    const delay = path.length / 55, end = path[path.length - 1];
    let lands = true;
    if (m){
      if (rng.int(100) < hitChance(skillOf(player, "shoot") + 3 * (BP.hit + (one.tohit || 0) + player.bonus.hit), m.K.ac, -path.length)){
        damage(m, Math.max(1, (rng.dice(K.dice) + (one.todam || 0) + BP.dam) * B.mult), "The " + K.name.toLowerCase() + " hits " + theName(m) + ".", delay);
        if (rng.chance(0.35)) lands = false;
      } else { say("The " + K.name.toLowerCase() + " misses " + theName(m) + "."); if (rng.chance(0.1)) lands = false; }
    }
    if (lands) dropAt(idx(end[0], end[1]), one);
    return true;
  });
}
function fire(){
  const bow = player.eq.bow;
  if (!bow){ say("You have nothing to fire with."); return; }
  const ammo = ITEM[bow.k].ammo;
  chooseItem("FIRE WHICH?", it => ITEM[it.k].ammo === ammo && ITEM[it.k].cat === "ammo", fireAmmo, "You have nothing to fire from your " + ITEM[bow.k].name.toLowerCase() + ".");
}
function cast(){
  const C = cls(), P = POWERS[powerFor(C)];
  if (!P){ say("You know no spells or prayers."); return false; }
  if (player.mana < P.cost){ say("You do not have enough mana to " + (C.realm === "holy" ? "pray " : "cast ") + P.name + "."); return false; }
  const fail = Math.max(5, Math.min(95, 30 - 3 * statMod(player.stats[C.stat]) - 2 * (player.lvl - 1)));
  const go = (tx, ty) => {
    player.mana -= P.cost;
    if (rng.int(100) < fail){ say(C.realm === "holy" ? "You lose your concentration." : "You failed to get the spell off!"); return true; }
    if (P.heal){ const h = rng.dice(P.heal) + player.lvl; player.hp = Math.min(player.mhp, player.hp + h); say("A warm light closes your wounds."); flashes.push({ x: player.x, y: player.y, t: 0.4, t0: 0.4, rgb: [1.0, 0.85, 0.5] }); return true; }
    // Spark: a bolt of light that always hits the first monster in its path
    const { path, m } = flight(tx, ty, 15);
    if (!path.length){ say("The spark fizzles against the wall."); return true; }
    shots.push({ path, t: 0, speed: 40, glyph: "*", rgb: [1.8, 1.7, 1.0], light: SPARK_RGB });
    const delay = path.length / 40, end = path[path.length - 1];
    later.push({ t: delay, fn: () => { flashes.push({ x: end[0], y: end[1], t: 0.35, t0: 0.35, rgb: SPARK_RGB }); burst(end[0], end[1], [1.6, 1.4, 0.6], 3); } });
    if (m) damage(m, rng.dice(P.dice) + Math.floor(player.lvl / 2), "The spark strikes " + theName(m) + ".", delay);
    return true;
  };
  if (P.aim) aim("Cast " + P.name + ".", go);
  else act(() => go());
  return false;
}

/* ---------- a turn: the player acts, then everyone faster or as fast acts until it is the player's turn again ---------- */
function act(fn){
  if (state !== "play") return false;
  oldMsgs = msgs.length ? msgs : oldMsgs; msgs = [];
  const r = fn();
  if (!r) return false;
  if (r === "level") return true;
  const go = () => { if (pendingLevel === null || state !== "play") return false; const d = Math.max(0, pendingLevel); pendingLevel = null; newLevel(d); return true; };
  if (go()) return true;
  endTurn();
  while (player.t.asleep > 0 && state === "play") endTurn();   // asleep: the monsters keep moving
  go();   // Word of Recall takes effect at the end of a turn
  return true;
}
function endTurn(){
  player.energy -= 100; player.turns++;
  everyTurn();
  for (let guard = 0; guard < 500 && state === "play"; guard++){
    const a = nextActor(mons);
    if (a === player) break;
    monsterTurn(a); a.energy -= 100;
  }
  if (state !== "play") return;
  if (rng.int(300) === 0) spawnMonster(true);   // the dungeon is never quite empty
  centerCamera(false); updateSight();
  for (const m of mons) if (m.K){ const v = seesMon(m); if (v && !m.seen) disturbed = true; m.seen = v; }
}
let disturbed = false, pendingLevel = null;
function everyTurn(){
  // food and light burn away, and wounds and mana slowly come back
  if (!player.bonus.slowDigest || player.turns % 2) player.food--;
  if (player.food === 2000) say("You are getting hungry.");
  if (player.food === 1000) say("You are getting weak from hunger.");
  if (player.food === 0) say("You are starving!");
  if (player.food < 0 && player.food % 10 === 0) hurt(1, "starvation");
  if (player.t.poison > 0) hurt(1, "poison");
  if (player.recall > 0 && --player.recall === 0){
    pendingLevel = depth > 0 ? 0 : Math.max(1, player.maxDepth);
    say(depth > 0 ? "You feel yourself yanked upwards!" : "You feel yourself yanked downwards!");
  }
  if (depth === 0 && player.turns % 25 === 0){   // the sun moves; night falls; morning comes
    lightTown();
    if (isDay() !== wasDay){ wasDay = isDay(); say(wasDay ? "The sun rises over Lanternhollow." : "Night falls, and the lamps are lit."); }
  }
  for (const k of Object.keys(TIMERS)) if (player.t[k] > 0 && --player.t[k] === 0){ say(TIMERS[k][1]); recalc(); }
  for (const it of player.inv) if (it.timeout > 0) it.timeout--;   // rods recharge
  if (player.bonus.teleportCurse && rng.int(80) === 0 && teleportPlayer(40)){ say("You feel yourself yanked sideways!");
    for (const s of ["ring1", "ring2"]) if (player.eq[s] && ITEM[player.eq[s].k].teleportCurse) learn(player.eq[s], true); }
  if (player.turns % 100 === 0) for (const it of [...player.inv, ...SLOTS.map(s => player.eq[s]).filter(Boolean)]) sense(it, skillOf(player, "notice") / 3);
  const lt = player.eq.light;
  if (lt && lt.fuel > 0){
    lt.fuel--;
    if (lt.fuel === 500) say("Your light is growing faint.");
    if (lt.fuel === 0) say("Your light has gone out!");
  }
  const k = resting ? 2 : 1;
  if (player.food > 1000 && player.hp < player.mhp){
    player.regen += (0.03 + player.mhp * 0.004) * k * (race().regen || 1) * (player.bonus.regen ? 2 : 1);
    while (player.regen >= 1 && player.hp < player.mhp){ player.hp++; player.regen--; }
  }
  if (player.mana < player.mmana){
    player.mregen += (0.02 + player.mmana * 0.008) * k;
    while (player.mregen >= 1 && player.mana < player.mmana){ player.mana++; player.mregen--; }
  }
}
function hurt(n, by){
  player.hp -= n; disturbed = true;
  if (player.hp <= 0){ killer = by; die(); }
}
function die(){
  state = "dead"; stateT = 0; aiming = null;
  const p = player, entry = { score: Math.floor(p.exp) + 100 * p.maxDepth, name: p.name, race: race().name, cls: cls().name, lvl: p.lvl, depth: feet(p.maxDepth), killer };
  tomb = { ...entry, best: scores.add(entry).rank === 0, at: depthName(depth) };
  say("You die.");
}
function monsterTurn(m){
  const K = m.K, d = dist(m.x, m.y, player.x, player.y);
  if (m.sleep > 0){   // noise nearby wakes it; a stealthy character makes less of it
    const st = skillOf(player, "stealth");
    if (d < 16 - st) m.sleep -= rng.range(0, Math.max(1, 6 - st));
    return;
  }
  m.speed = K.speed - (m.slow > 0 ? 10 : 0);
  if (m.slow > 0) m.slow--;
  if (K.still){ if (d <= 1) monsterAttack(m); return; }
  if (m.conf > 0){ m.conf--; const [dx, dy] = DIRS[rng.pick([1, 2, 3, 4, 6, 7, 8, 9])]; return step(m, m.x + dx, m.y + dy); }
  if (d <= 1 && !m.afraid) return monsterAttack(m);

    let doors = 0; for (const k of [1, 2, 3, 4, 6, 7, 8, 9]){ const [a, b] = DIRS[k], u = L.tiles[idx(player.x + a, player.y + b)]; if (u === T.DOOR || u === T.OPEN) doors++; }

  for (const s of shots) s.t += dt;
  shots = shots.filter(s => s.t * s.speed < s.path.length + 1);
  for (const f of flashes) f.t -= dt;
  flashes = flashes.filter(f => f.t > 0);
  for (const l of later) if ((l.t -= dt) <= 0) l.fn();
  later = later.filter(l => l.t > 0);
  world.step(dt);
  for (const b of world.bodies) b.life -= dt;
  world.bodies = world.bodies.filter(b => b.life > 0);
  draw(t);
}
layout();
onResize(stage, layout);
startLoop(tick);
})();
</script>
