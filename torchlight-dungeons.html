<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Torchlight Dungeons</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
:root{
  --ground:#E9EDF1; --ink:#20304A; --muted:#5E6A7D; --line:#C9D1DB;
  --btn:#DCE2E9; --btn-on:#20304A; --btn-on-ink:#F4F6F8; --accent:#2F5BD3;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#151B26; --ink:#D9E1EC; --muted:#8792A3; --line:#2A3445;
    --btn:#222B3A; --btn-on:#D9E1EC; --btn-on-ink:#151B26; --accent:#7FA2FF;
  }
}
:root[data-theme="dark"]{
  --ground:#151B26; --ink:#D9E1EC; --muted:#8792A3; --line:#2A3445;
  --btn:#222B3A; --btn-on:#D9E1EC; --btn-on-ink:#151B26; --accent:#7FA2FF;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;overscroll-behavior:none}
body{height:100%;height:100svh;margin:0;touch-action:manipulation;overscroll-behavior:none;-webkit-touch-callout:none;background:var(--ground);color:var(--ink);
  font:15px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  display:flex;flex-direction:column;overflow:hidden;-webkit-user-select:none;user-select:none}
header{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:2px 12px;padding:10px 14px 6px}
h1{font-size:17px;font-weight:650;margin:0;letter-spacing:-0.01em}
h1 a{color:inherit;text-decoration:none}h1 a:hover{text-decoration:underline}
#hud{font:12px/1.2 ui-monospace,"SF Mono",Menlo,Consolas,monospace;color:var(--muted);white-space:nowrap}
#stage{flex:1;position:relative;touch-action:none;margin:0 8px;border:1px solid var(--line);border-radius:6px;overflow:hidden;min-height:0;background:#0B0F16}
#cv{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:block;touch-action:none}
nav{padding:8px 8px 10px;display:flex;flex-direction:column;gap:6px}
button{flex:1 1 auto;min-width:60px;min-height:40px;padding:6px 8px;border:0;border-radius:8px;background:var(--btn);color:var(--ink);font:inherit;font-size:14px;cursor:pointer;touch-action:none}
button[aria-pressed="true"]{background:var(--btn-on);color:var(--btn-on-ink);font-weight:600}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
/* Touch gamepad, styled after a handheld console: cross-shaped D-pad, slanted A/B, pill SELECT/START */
#gamepad{display:grid;grid-template-columns:auto 1fr auto;grid-template-areas:"dpad . ab" "mid mid mid";align-items:center;row-gap:4px;padding:4px 12px 20px;touch-action:none}
#gamepad[hidden]{display:none}
#dpad{grid-area:dpad;position:relative;width:120px;height:120px;touch-action:none;cursor:pointer}
#dpad::before,#dpad::after{content:"";position:absolute;background:#2A2A31;border-radius:7px;box-shadow:0 4px 0 #0E0E12}
#dpad::before{left:0;right:0;top:40px;height:40px}
#dpad::after{top:0;bottom:0;left:40px;width:40px}
#dpad span{position:absolute;z-index:1;color:#6E6E78;font-size:13px;line-height:1;pointer-events:none;transition:color .05s}
#dpad .l{left:11px;top:53px}#dpad .r{right:11px;top:53px}#dpad .u{left:54px;top:11px}#dpad .d{left:54px;bottom:11px}
#dpad[data-dir="left"] .l,#dpad[data-dir="right"] .r,#dpad[data-dir="up"] .u,#dpad[data-dir="down"] .d{color:#F4F4F8}
#dpad[data-dir="left"]{transform:perspective(300px) rotateY(-8deg)}
#dpad[data-dir="right"]{transform:perspective(300px) rotateY(8deg)}
#dpad[data-dir="up"]{transform:perspective(300px) rotateX(8deg)}
#dpad[data-dir="down"]{transform:perspective(300px) rotateX(-8deg)}
.mid{grid-area:mid;justify-self:center;display:flex;gap:18px;transform:rotate(-22deg)}
.mid button{min-width:0;min-height:0;width:52px;height:16px;padding:0;border-radius:8px;background:#8D8C94;box-shadow:0 3px 0 #55545B;font-size:0;position:relative}
.mid button::after{content:attr(data-label);position:absolute;top:22px;left:50%;transform:translateX(-50%);font:600 10px/1 ui-monospace,Menlo,monospace;letter-spacing:.08em;color:var(--muted)}
.ab{grid-area:ab;display:flex;gap:14px;transform:rotate(-22deg)}
.ab button{min-width:0;min-height:0;width:60px;height:60px;padding:0;border-radius:50%;background:#A3245C;color:#F7D7E6;font:700 19px/1 ui-monospace,Menlo,monospace;box-shadow:0 5px 0 #5E1233}
.ab button:first-child{margin-top:30px}
#gamepad button.on{transform:translateY(3px);box-shadow:0 2px 0 #0E0E12;filter:brightness(.85)}
body.touch #hud{display:none}
/* Phone on its side: D-pad on the left, A/B on the right, game in the middle */
@media (orientation: landscape) and (max-height: 600px){
  body.touch{display:grid;grid-template-columns:auto 1fr auto;grid-template-rows:1fr auto}
  body.touch header{display:none}
  body.touch nav,body.touch #gamepad{display:contents}
  body.touch #stage{grid-column:2;grid-row:1;margin:6px 0 4px}
  body.touch #dpad{grid-column:1;grid-row:1 / 3;align-self:center;justify-self:center;margin:0 18px 70px}
  body.touch .mid{grid-column:1;grid-row:1 / 3;align-self:end;justify-self:center;margin-bottom:46px}
  body.touch .ab{grid-column:3;grid-row:1 / 3;align-self:center;margin:0 18px 0 10px}
}
</style>
</head>
<body>
<header>
  <h1><a href="./" title="Back to the cartridge shelf">&#8249; Torchlight Dungeons</a></h1>
  <div id="hud">arrows / numpad move &middot; Shift runs &middot; g pick up &middot; i items &middot; &gt; stairs &middot; R rest &middot; ? help &middot; Esc menu</div>
</header>
<div id="stage">
  <canvas id="cv" aria-label="Game screen: the dungeon around you, with messages at the top and your status at the bottom. Press question mark for the list of commands."></canvas>
</div>
<nav>
  <div id="gamepad" hidden>
    <div id="dpad" role="group" aria-label="Direction pad. Eight directions: press between two arrows to move diagonally. Hold to keep walking."><span class="l">&#9664;</span><span class="r">&#9654;</span><span class="u">&#9650;</span><span class="d">&#9660;</span></div>
    <div class="mid"><button data-pad="select" data-label="SELECT" aria-label="Select: open the menu"></button><button data-pad="start" data-label="START" aria-label="Start: start the game, or open the menu"></button></div>
    <div class="ab"><button data-pad="b" aria-label="B: commands">B</button><button data-pad="a" aria-label="A: act here: pick up, take the stairs, or wait a turn">A</button></div>
  </div>
</nav>
<script>
"use strict";
/* ================= Shared core: physics, light, ink, 24-bit renderer ================= */
const MONO = 'ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace';
const SANS = '-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif';
// The simulated screen is always dark: characters emit light, so they need a black background.
const SCREEN = { bg: "#0B0F16", dot: "#1C2432", line: "#263042", text: "#DCE3EC", muted: "#7C889B", accent: "#7FA2FF", pink: "#F07FB8", lamp: "#FFC857" };
const RAMPS = { classic: " .:-=+*#%@", detailed: " .'`^\",:;Il!i~+_-?]}1)|/tfjrxnuvczXYUJCLQ0OZmwqpdbkhao*#MW&8%B@", blocks: " \u2591\u2592\u2593\u2588" };
function norm(v){ const l = Math.hypot(...v); return v.map(x => x / l); }
const DIR = norm([-0.5, -0.6, 0.65]), SUB = [0.25, 0.75], MREF = 2.4;
const AMB_RGB = [0.55, 0.65, 0.9];     // room light is slightly blue
const FLASH_RGB = [1.0, 0.75, 0.45];   // impact flashes are warm
const FLOOR_ALB = 0.5;                 // share of light the floor reflects
const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5];
const MATS = {
  foam:   { name: "foam",   density: 0.2, e: 0.70, mu: 0.6, kd: 0.95, ks: 0.05, shine: 4,  alb: [0.20, 0.85, 0.72], rMin: 1.6, rMax: 2.4 },
  rubber: { name: "rubber", density: 1.0, e: 0.55, mu: 0.8, kd: 0.85, ks: 0.30, shine: 14, alb: [0.30, 0.48, 1.00], alt: [1.00, 0.38, 0.68], rMin: 1.2, rMax: 1.9 },
  steel:  { name: "steel",  density: 7.0, e: 0.35, mu: 0.2, kd: 0.45, ks: 1.10, shine: 70, alb: [0.72, 0.76, 0.82], rMin: 0.9, rMax: 1.3 },
  peg:    { name: "peg",    density: 0,   e: 0.50, mu: 0.3, kd: 0.80, ks: 0.20, shine: 10, alb: [0.42, 0.47, 0.56] }
};
const MIX = ["rubber", "rubber", "rubber", "rubber", "foam", "foam", "foam", "steel", "steel", "steel"];
function hexToLinear(hex){
  const n = parseInt(hex.slice(1), 16);
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255].map(c => Math.pow(c / 255, 2.2));
}
function defaultDisplay(){
  return { chars: RAMPS.classic, calibrate: true, dither: false, black: 0.15, exposure: 1.3, gamma: 2.2, split: 0.2, glow: 0.35, room: 0.18, lampHex: "#FFD9A0", lampRGB: hexToLinear("#FFD9A0") };
}

/* ---------- arcade display settings (settings.html), shared by the game pages ---------- */
// One choice for every cartridge, saved in this browser: character set, ASCII or pixel drawing, tube TV filter.
const ARCADE_KEY = "arcade.v1.display";
const ARCADE_DEFAULTS = { ramp: "classic", custom: " .:oO0@", mode: "ascii", crt: false };
function arcadeSettings(){
  let saved = {};
  try { saved = JSON.parse(localStorage.getItem(ARCADE_KEY) || "{}") || {}; }
  catch (e){ console.warn("Arcade: saved display settings unreadable, using defaults", e); }
  return { ...ARCADE_DEFAULTS, ...saved };
}
function saveArcadeSettings(s){
  try { localStorage.setItem(ARCADE_KEY, JSON.stringify(s)); return true; }
  catch (e){ console.warn("Arcade: could not save display settings", e); return false; }
}
function arcadeChars(s){ return s.ramp === "custom" ? (s.custom.length > 1 ? s.custom : " @") : RAMPS[s.ramp] || RAMPS.classic; }
// The tube TV look is CSS laid over the game's #stage: scanlines, a phosphor grille, vignette, rounded glass, flicker.
const CRT_CSS = `
body.crt #stage{background:#050607}
body.crt #cv{border-radius:14px;filter:saturate(1.15) contrast(1.06) brightness(1.1)}
body.crt #stage::before,body.crt #stage::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:2}
body.crt #stage::before{background:repeating-linear-gradient(to bottom,rgba(0,0,0,.24) 0 1px,transparent 1px 3px),
  repeating-linear-gradient(to right,rgba(255,40,40,.06) 0 1px,rgba(40,255,40,.06) 1px 2px,rgba(60,60,255,.06) 2px 3px)}
body.crt #stage::after{border-radius:inherit;background:radial-gradient(ellipse at center,transparent 58%,rgba(0,0,0,.55) 100%);
  box-shadow:inset 0 0 50px rgba(0,0,0,.85),inset 0 0 6px rgba(160,200,255,.15);animation:crt-flicker 5s steps(40) infinite}
@keyframes crt-flicker{0%,100%{opacity:1}47%{opacity:.93}50%{opacity:1}73%{opacity:.96}}
@media (prefers-reduced-motion: reduce){body.crt #stage::after{animation:none}}`;
// Call once at start-up with the game's display: applies the character set, pixel mode and the TV filter.
function applyArcadeSettings(D){
  const s = arcadeSettings();
  D.chars = arcadeChars(s); D.pixels = s.mode === "pixels";
  if (!document.getElementById("crt-css")){ const st = document.createElement("style"); st.id = "crt-css"; st.textContent = CRT_CSS; document.head.appendChild(st); }
  document.body.classList.toggle("crt", !!s.crt);
  return s;
}

/* ---------- physics (unchanged from v2) ---------- */
function hit(b, dv){ if (dv > 220) b.flash = Math.max(b.flash, Math.min(1, (dv - 220) / 1000)); }
class World {
  constructor(){ this.bodies = []; this.forces = []; this.w = 300; this.h = 300; this.unit = 10; this.g = { x: 0, y: 0 };
    this.substeps = 4; this.cell = 60; this.grid = new Map(); this.drag = 0; this.onSub = null;
    this.openTop = false;   // true: no ceiling, bodies can fly above y = 0 and fall back
    this.terrain = null;    // optional grid of solid cells: { cw, ch, cols, rows, solid: Uint8Array, mat } (see collideTerrain)
  }
  add(x, y, r, matName, alb, matOverride){
    const M = matOverride || MATS[matName], st = matName === "peg";
    const m = st ? 0 : M.density * (r / this.unit) ** 2;
    const b = { x, y, vx: 0, vy: 0, r, a: Math.random() * 6.283, w: 0, mat: M, alb: alb || M.alb, static: st, m,
      im: st ? 0 : 1 / m, iI: st ? 0 : 1 / (0.4 * m * r * r), grab: null, flash: 0, touch: false };
    this.bodies.push(b);
    if (this.bodies.length > 260){ const i = this.bodies.findIndex(o => !o.static && !o.grab); if (i >= 0) this.bodies.splice(i, 1); }
    return b;
  }
  // A box is a rotating rectangle with half-width hw and half-height hh. Its r is the bounding radius, which the
  // broadphase grid uses; mass uses the same area rule as circles, so equal materials have equal density.
  addBox(x, y, hw, hh, matName, alb, matOverride){
    const b = this.add(x, y, Math.hypot(hw, hh), matName, alb, matOverride);
    b.box = true; b.hw = hw; b.hh = hh;
    if (!b.static){ b.m = b.mat.density * 4 * hw * hh / Math.PI / this.unit ** 2; b.im = 1 / b.m; b.iI = 3 / (b.m * (hw * hw + hh * hh)); }
    return b;
  }
  step(dt){
    let maxR = 1; for (const b of this.bodies) if (b.r > maxR) maxR = b.r;
    this.cell = maxR * 2 + 2;
    const h = dt / this.substeps;
    for (let s = 0; s < this.substeps; s++){ this.substep(h); if (this.onSub) this.onSub(); }
    const decay = Math.pow(0.001, dt); for (const b of this.bodies) b.flash *= decay;
  }
  substep(h){
    const { w, h: H, g } = this;
    for (const b of this.bodies){
      if (b.static) continue;
      const mN = Math.max(0.25, b.m / MREF);
      let ax = g.x, ay = g.y;
      const sp = Math.hypot(b.vx, b.vy);
      if (sp > 0 && this.drag){ const k = this.drag * b.r * sp * b.im; ax -= b.vx * k; ay -= b.vy * k; }
      if (b.grab){ ax += (520 * (b.grab.x - b.x) - 46 * b.vx) / mN; ay += (520 * (b.grab.y - b.y) - 46 * b.vy) / mN; }
      for (const f of this.forces){
        const dx = b.x - f.x, dy = b.y - f.y, d = Math.hypot(dx, dy);
        if (d > 0.001 && d < f.radius){ const k = (1 - d / f.radius) * f.strength / mN; ax += dx / d * k; ay += dy / d * k; }
      }
      b.vx += ax * h; b.vy += ay * h;
      const s2 = Math.hypot(b.vx, b.vy); if (s2 > 4000){ b.vx *= 4000 / s2; b.vy *= 4000 / s2; }
      b.x += b.vx * h; b.y += b.vy * h; b.a += b.w * h; b.w *= 0.9997;
      if (b.box){ this.boxWalls(b); continue; }
      if (b.x - b.r <= 0){ b.x = b.r; this.wall(b, -1, 0, h); }
      if (b.x + b.r >= w){ b.x = w - b.r; this.wall(b, 1, 0, h); }
      if (!this.openTop && b.y - b.r <= 0){ b.y = b.r; this.wall(b, 0, -1, h); }
      if (b.y + b.r >= H){ b.y = H - b.r; this.wall(b, 0, 1, h); }
    }
    for (const b of this.bodies) b.touch = false;
    this.collide(); this.collide(false);   // second pass reuses the grid: positions only moved by sub-pixel corrections
    if (this.terrain) this.collideTerrain();
    for (const b of this.bodies){
      if (b.static) continue;
      if (b.touch && !b.grab && b.vx * b.vx + b.vy * b.vy < 1600){ b.vx *= 0.9; b.vy *= 0.9; b.w *= 0.9; }
      if (!b.box){ b.x = Math.min(w - b.r, Math.max(b.r, b.x)); b.y = Math.min(H - b.r, this.openTop ? b.y : Math.max(b.r, b.y)); }
    }
  }
  // Boxes meet walls at their corners: push back the deepest corner, then apply one impulse at the middle of the
  // corners past the wall, so a box lying flat gets no spurious spin.
  boxWalls(b){
    const c = Math.cos(b.a), s = Math.sin(b.a), ux = c * b.hw, uy = s * b.hw, vx = -s * b.hh, vy = c * b.hh;
    const P = [b.x + ux + vx, b.y + uy + vy, b.x - ux + vx, b.y - uy + vy, b.x - ux - vx, b.y - uy - vy, b.x + ux - vx, b.y + uy - vy];
    for (const [nx, ny, lim] of [[-1, 0, 0], [1, 0, this.w], [0, -1, 0], [0, 1, this.h]]){
      if (ny < 0 && this.openTop) continue;
      let depth = 0, sx = 0, sy = 0, n = 0;
      for (let i = 0; i < 8; i += 2){
        const d = nx ? nx * (P[i] - lim) : ny * (P[i + 1] - lim);   // how far this corner is past the wall
        if (d > 0){ depth = Math.max(depth, d); sx += P[i]; sy += P[i + 1]; n++; }
      }
      if (!n) continue;
      b.x -= nx * depth; b.y -= ny * depth;
      for (let i = 0; i < 8; i += 2){ P[i] -= nx * depth; P[i + 1] -= ny * depth; }
      b.touch = true;
      this.impulse(b, null, sx / n - nx * depth, sy / n - ny * depth, nx, ny);
    }
  }
  // Impulse at contact point (px, py) with normal n pointing from a towards b. b = null is an immovable wall.
  // Includes rotation, so it works for any shape; circle pairs keep their own cheaper path in resolve().
  impulse(a, b, px, py, nx, ny){
    const rax = px - a.x, ray = py - a.y, rbx = b ? px - b.x : 0, rby = b ? py - b.y : 0;
    const bim = b ? b.im : 0, biI = b ? b.iI : 0;
    const rel = () => [(b ? b.vx - b.w * rby : 0) - (a.vx - a.w * ray), (b ? b.vy + b.w * rbx : 0) - (a.vy + a.w * rax)];
    let [rvx, rvy] = rel();
    const vn = rvx * nx + rvy * ny;
    if (vn >= 0) return;
    const ran = rax * ny - ray * nx, rbn = rbx * ny - rby * nx;
    const e = -vn < 30 ? 0 : b ? (a.mat.e + b.mat.e) / 2 : a.mat.e;
    const j = -(1 + e) * vn / (a.im + bim + ran * ran * a.iI + rbn * rbn * biI);
    a.vx -= j * nx * a.im; a.vy -= j * ny * a.im; a.w -= j * ran * a.iI; hit(a, j * a.im);
    if (b){ b.vx += j * nx * bim; b.vy += j * ny * bim; b.w += j * rbn * biI; hit(b, j * bim); }
    [rvx, rvy] = rel();
    const tx = -ny, ty = nx, vt = rvx * tx + rvy * ty, rat = rax * ty - ray * tx, rbt = rbx * ty - rby * tx;
    const lim = (b ? Math.sqrt(a.mat.mu * b.mat.mu) : a.mat.mu) * j;
    const jt = Math.max(-lim, Math.min(lim, -vt / (a.im + bim + rat * rat * a.iI + rbt * rbt * biI)));
    a.vx -= jt * tx * a.im; a.vy -= jt * ty * a.im; a.w -= jt * rat * a.iI;
    if (b){ b.vx += jt * tx * bim; b.vy += jt * ty * bim; b.w += jt * rbt * biI; }
  }
  // Terrain cells are not bodies: each moving body checks only the solid cells under its bounding box, each one
  // treated as a fixed box. So a screen full of terrain costs nothing until something touches it.
  collideTerrain(){
    const T = this.terrain, cell = this.tcell || (this.tcell = { box: true, static: true, a: 0, im: 0, iI: 0, vx: 0, vy: 0, w: 0, flash: 0 });
    cell.hw = T.cw / 2; cell.hh = T.ch / 2; cell.r = Math.hypot(cell.hw, cell.hh); cell.mat = T.mat;
    for (const b of this.bodies){
      if (b.static || b.sensor) continue;
      const c0 = Math.max(0, Math.floor((b.x - b.r) / T.cw)), c1 = Math.min(T.cols - 1, Math.floor((b.x + b.r) / T.cw));
      const r0 = Math.max(0, Math.floor((b.y - b.r) / T.ch)), r1 = Math.min(T.rows - 1, Math.floor((b.y + b.r) / T.ch));
      for (let r = r0; r <= r1; r++) for (let c = c0; c <= c1; c++){
        if (!T.solid[r * T.cols + c]) continue;
        cell.x = (c + 0.5) * T.cw; cell.y = (r + 0.5) * T.ch;
        this.resolve(cell, b);
      }
    }
  }
  resolveBox(a, b){
    const A = a.box ? a : b, B = A === a ? b : a;   // A is always a box
    const C = B.box ? boxBox(A, B) : boxCircle(A, B);
    if (!C) return;
    A.touch = B.touch = true;
    const ws = A.im + B.im, corr = Math.max(0, C.depth - 0.3) / ws * 0.8;
    A.x -= C.nx * corr * A.im; A.y -= C.ny * corr * A.im; B.x += C.nx * corr * B.im; B.y += C.ny * corr * B.im;
    for (const [px, py] of C.pts) this.impulse(A, B, px, py, C.nx, C.ny);
  }
  wall(b, nx, ny, h){
    const M = b.mat; let jn; b.touch = true;

}
function useItem(it, how){
  const K = ITEM[it.k], take = () => { if (--it.n <= 0) player.inv.splice(player.inv.indexOf(it), 1); };
  if (how === "eat"){ player.food = Math.min(15000, player.food + K.food); say("That tastes good."); take(); return true; }
  if (how === "quaff"){
    const h = rng.dice(K.heal); player.hp = Math.min(player.mhp, player.hp + h);
    say(player.hp >= player.mhp ? "You feel very good." : "You feel better."); take(); return true;
  }
  if (how === "fuel"){
    const lt = player.eq.light;
    if (!lt || !ITEM[lt.k].maxFuel){ say("You need a lantern to pour the oil into."); return false; }
    lt.fuel = Math.min(ITEM[lt.k].maxFuel, lt.fuel + K.fuel); say("You fill your lantern."); take(); return true;
  }
  if (how === "wield"){
    const slot = K.slot, one = { ...it, n: 1 };
    take();
    const old = player.eq[slot]; player.eq[slot] = one;
    if (old) carry(old);
    say((slot === "body" ? "You are wearing " : slot === "light" ? "Your light source is " : "You are wielding ") + itemName(one) + ".");
    return true;
  }
  if (how === "drop"){
    floor.push({ x: player.x, y: player.y, it: { ...it } }); player.inv.splice(player.inv.indexOf(it), 1);
    say("You drop " + itemName(it) + "."); return true;
  }
  return false;
}

/* ---------- a turn: the player acts, then everyone faster or as fast acts until it is the player's turn again ---------- */
function act(fn){
  if (state !== "play") return false;
  oldMsgs = msgs.length ? msgs : oldMsgs; msgs = [];
  const r = fn();
  if (!r) return false;
  if (r !== "level") endTurn();
  return true;
}
function endTurn(){
  player.energy -= 100; player.turns++;
  everyTurn();
  for (let guard = 0; guard < 500 && state === "play"; guard++){
    const a = nextActor(mons);
    if (a === player) break;
    monsterTurn(a); a.energy -= 100;
  }
  if (state !== "play") return;
  if (rng.int(300) === 0) spawnMonster(true);   // the dungeon is never quite empty
  centerCamera(false); updateSight();
  for (const m of mons) if (m.K){ const v = visible(idx(m.x, m.y)); if (v && !m.seen) disturbed = true; m.seen = v; }
}
let disturbed = false, hpBefore = 0;
function everyTurn(){
  // food and light burn away, and wounds slowly heal
  player.food--;
  if (player.food === 2000) say("You are getting hungry.");
  if (player.food === 1000) say("You are getting weak from hunger.");
  if (player.food === 0) say("You are starving!");
  if (player.food < 0 && player.food % 10 === 0) hurt(1, "starvation");
  const lt = player.eq.light;
  if (lt && lt.fuel > 0){
    lt.fuel--;
    if (lt.fuel === 500) say("Your light is growing faint.");
    if (lt.fuel === 0) say("Your light has gone out!");
  }
  if (player.food > 1000 && player.hp < player.mhp){
    player.regen += 0.03 + player.mhp * 0.004 * (resting ? 2 : 1);
    while (player.regen >= 1 && player.hp < player.mhp){ player.hp++; player.regen--; }
  }
}
function hurt(n, by){
  player.hp -= n; disturbed = true;
  if (player.hp <= 0){ killer = by; die(); }
}
function die(){
  state = "dead"; stateT = 0;
  const entry = { score: Math.floor(player.exp) + 100 * player.maxDepth, lvl: player.lvl, depth: feet(player.maxDepth), killer };
  scores.push(entry); scores.sort((a, b) => b.score - a.score); scores = scores.slice(0, 5); store("scores", scores);
  tomb = { ...entry, best: scores[0] === entry, turns: player.turns };
  say("You die.");
}
function monsterTurn(m){
  const K = m.K, d = dist(m.x, m.y, player.x, player.y);
  if (m.sleep > 0){ if (d < 14) m.sleep -= rng.range(1, 3); return; }   // noise nearby wakes it, sooner the closer you are
  if (K.still){ if (d <= 1) monsterAttack(m); return; }
  if (d <= 1 && !m.afraid) return monsterAttack(m);
  const seesYou = inFov[idx(m.x, m.y)] === turnNo && d < 20;   // sight is symmetric: if you could see it, it can see you
  let tx = player.x, ty = player.y, away = false;
  if (m.afraid){ m.afraid--; away = true; }
  if ((K.erratic && rng.chance(K.erratic)) || (!seesYou && d > 6)){   // wander
    const [dx, dy] = DIRS[rng.pick([1, 2, 3, 4, 6, 7, 8, 9])]; tx = m.x + dx; ty = m.y + dy;
    return step(m, tx, ty);
  }
  // step to the neighbour that gets closest to (or furthest from) the player
  let best = null, bestD = away ? -1 : 1e9;
  for (const k of [1, 2, 3, 4, 6, 7, 8, 9]){
    const [dx, dy] = DIRS[k], x = m.x + dx, y = m.y + dy, t = L.tiles[idx(x, y)];
    if (!(passable(t) || t === T.DOOR) || (monAt(x, y) && !(x === player.x && y === player.y))) continue;
    const nd = Math.hypot(x - tx, y - ty);
    if (away ? nd > bestD : nd < bestD){ bestD = nd; best = [x, y]; }
  }
  if (best) step(m, best[0], best[1]);
}
function step(m, x, y){
  const i = idx(x, y), t = L.tiles[i];
  if (x === player.x && y === player.y) return m.afraid ? null : monsterAttack(m);
  if (t === T.DOOR){ L.tiles[i] = T.OPEN; if (visible(i)) say("A door opens."); return; }
  if (!passable(t) || monAt(x, y)) return;
  m.x = x; m.y = y;
}
function monsterAttack(m){
  const K = m.K, name = visible(idx(m.x, m.y)) ? "The " + K.name : "It";
  for (const [dice, verb] of K.blows){
    if (state !== "play") return;
    if (rng.int(100) < Math.max(15, Math.min(95, 60 + 2 * K.depth - armour()))){ say(name + " " + verb + " you."); hurt(rng.dice(dice), "a " + K.name); }
    else say(name + " misses you.");
  }
}

/* ---------- longer actions: running and resting stop when something happens ---------- */
let resting = false;
function run(dx, dy){
  if (state !== "play") return;
  disturbed = false;
  const open = (x, y) => passable(L.tiles[idx(x, y)]) && !monAt(x, y);
  for (let n = 0; n < 200 && state === "play" && !disturbed; n++){
    if (mons.some(m => m.K && visible(idx(m.x, m.y)) && !m.K.still)) break;
    if (!open(player.x + dx, player.y + dy)){
      // in a corridor, follow a single bend
      if (dx && dy) break;
      const turns = (dx ? [[0, 1], [0, -1]] : [[1, 0], [-1, 0]]).filter(([a, b]) => open(player.x + a, player.y + b));
      if (turns.length !== 1) break;
      [dx, dy] = turns[0];
    }
    if (!act(() => tryMove(dx, dy))) break;
    const t = L.tiles[idx(player.x, player.y)];
    if (t === T.DOWN || t === T.UP || itemsAt(player.x, player.y).length) break;
    let doors = 0; for (const k of [1, 2, 3, 4, 6, 7, 8, 9]){ const [a, b] = DIRS[k], u = L.tiles[idx(player.x + a, player.y + b)]; if (u === T.DOOR || u === T.OPEN) doors++; }
    if (doors) break;
  }
}
function rest(){
  if (state !== "play") return;
  if (player.hp >= player.mhp){ say("You are already fully rested."); return; }
  disturbed = false; resting = true;
  for (let n = 0; n < 1000 && state === "play" && !disturbed && player.hp < player.mhp; n++){
    if (mons.some(m => m.K && visible(idx(m.x, m.y)))){ say("You cannot rest with monsters nearby."); break; }
    act(() => true);
  }
  resting = false;
}
function contextAction(){   // the touch A button: whatever makes sense here
  const t = L.tiles[idx(player.x, player.y)];
  if (t === T.DOWN || t === T.UP) return act(() => takeStairs(t === T.DOWN));
  if (itemsAt(player.x, player.y).length) return act(pickUp);
  act(() => true);   // otherwise wait a turn
}
function look(){
  const seen = mons.filter(m => m.K && visible(idx(m.x, m.y)));
  oldMsgs = []; msgs = [];
  if (!seen.length) say("You see no monsters.");
  for (const m of seen.slice(0, 4)) say("You see a " + m.K.name + (m.sleep > 0 ? " (asleep)" : "") + ". " + m.K.desc);
}

/* ---------- a new character (phase 1: a human fighter) ---------- */
function newGame(){
  rng = new RNG((Date.now() ^ (Math.random() * 1e9)) >>> 0);
  player = { x: 0, y: 0, hp: 24, mhp: 24, lvl: 1, exp: 0, energy: 100, speed: 0, food: 5000, gold: rng.range(40, 120), regen: 0,
    inv: [], eq: { weapon: makeItem("shortsword"), body: makeItem("jerkin"), light: makeItem("torch") }, maxDepth: 1, kills: 0, turns: 0 };
  for (const [k, n] of [["torch", 2], ["ration", 4], ["heal", 2]]) carry(makeItem(k, n));
  log = []; msgs = []; oldMsgs = []; killer = ""; tomb = null;
  state = "play"; stateT = 0;
  newLevel(1);
}

/* ---------- drawing ---------- */
function put(gx, gy, rgb, k, layer, code){ if (gx >= 0 && gy >= 0 && gx < GW && gy < GH) screen.put(gy * GW + gx, rgb[0] * k, rgb[1] * k, rgb[2] * k, layer, code); }
function text(gx, gy, s, rgb){ for (let i = 0; i < s.length; i++) put(gx + i, gy, rgb, 1, TEXT_LAYER, s.charCodeAt(i)); }   // stays letters in pixel mode
const center = (gy, s, rgb) => text(Math.floor((GW - s.length) / 2), gy, s, rgb);
function drawMap(t){
  computeLight(lightNow, t);
  for (let r = 0; r < VH; r++) for (let c = 0; c < GW; c++){
    const x = cam.x + c, y = cam.y + r; if (x >= MW || y >= MH) continue;
    const i = idx(x, y), tile = L.tiles[i], [g, base] = TILE[tile];
    if (visible(i)){
      const j = 3 * i, k = 1.7;
      put(c, VY + r, [base[0] * lightNow[j] * k, base[1] * lightNow[j + 1] * k, base[2] * lightNow[j + 2] * k], 1, 1, g.charCodeAt(0));
    } else if (mem[i]) put(c, VY + r, [base[0] * MEM_RGB[0] * 2, base[1] * MEM_RGB[1] * 2, base[2] * MEM_RGB[2] * 2], 1, 1, g.charCodeAt(0));   // remembered: dim and blue
  }
  const shade = i => Math.max(0.55, Math.min(1.3, 0.45 + lum(lightNow, 3 * i) * 1.2));
  for (const f of floor){ const i = idx(f.x, f.y); if (!visible(i)) continue;
    const K = f.it.k === "gold" ? { glyph: "$", rgb: [1.4, 1.15, 0.3] } : ITEM[f.it.k];
    put(f.x - cam.x, VY + f.y - cam.y, K.rgb, shade(i), TEXT_LAYER, K.glyph.charCodeAt(0)); }
  for (const m of mons){ if (!m.K) continue; const i = idx(m.x, m.y); if (!visible(i)) continue;
    put(m.x - cam.x, VY + m.y - cam.y, m.K.rgb, m.K.glow ? 1.4 : shade(i) * 1.15, TEXT_LAYER, m.K.glyph.charCodeAt(0)); }
  if (state === "play") put(player.x - cam.x, VY + player.y - cam.y, [1.7, 1.55, 1.2], 1, TEXT_LAYER, 64);
  lamp.x = (player.x - cam.x + 0.5) * screen.cw; lamp.y = (player.y - cam.y + VY + 0.5) * screen.ch; lamp.z = screen.ch * 3;
  for (const b of world.bodies) screen.sphere(b, lamp, { stripe: false });
}
function wrap(s, w){ const out = []; let line = ""; for (const word of s.split(" ")){ if ((line + " " + word).trim().length > w){ out.push(line); line = word; } else line = (line + " " + word).trim(); } if (line) out.push(line); return out; }
function drawUI(){
  // messages: this turn's in white; if nothing happened, the last turn's in grey. Long turns keep the newest lines.
  const fresh = msgs.length > 0, lines = wrap((fresh ? msgs : oldMsgs).join("  "), GW - 1);
  lines.slice(-2).forEach((s, k) => text(0, k, s, fresh ? WHITE : DIM));
  const p = player, low = p.hp < p.mhp * 0.3, lt = p.eq.light;
  const food = p.food < 0 ? "Starving" : p.food < 1000 ? "Weak" : p.food < 2000 ? "Hungry" : "";
  const s1 = `Fighter  LV ${p.lvl}  EXP ${Math.floor(p.exp)}/${expFor(p.lvl + 1)}  `, hp = `HP ${Math.max(0, p.hp)}/${p.mhp}`, s2 = `  AC ${armour()}  ${feet(depth)} ft`;
  text(0, GH - 2, s1, WHITE); text(s1.length, GH - 2, hp, low ? RED : GREEN); text(s1.length + hp.length, GH - 2, s2, WHITE);
  const lightTxt = lt ? (ITEM[lt.k].name + " " + lt.fuel) : "No light";
  text(0, GH - 1, lightTxt, lt && lt.fuel > 500 ? ACCENT : RED);
  if (food) text(lightTxt.length + 2, GH - 1, food, RED);
  const gold = "Gold " + p.gold; text(lightTxt.length + (food ? food.length + 4 : 2), GH - 1, gold, DIM);
  const hint = touchMode ? "B COMMANDS  START MENU" : "? HELP  ESC MENU";
  text(GW - hint.length, GH - 1, hint, DIM);
}
function drawTitle(t){
  // a lit chamber behind the title: the first level, shown by a flickering torch
  if (!L){ rng = new RNG(4242); player = { x: 0, y: 0, eq: { light: { k: "torch", fuel: 4000 } }, lvl: 1 }; L = generateLevel(rng, 1); mons = []; floor = []; roomLight.fill(0);
    const r = L.rooms.reduce((a, b) => (b.x1 - b.x0) * (b.y1 - b.y0) > (a.x1 - a.x0) * (a.y1 - a.y0) ? b : a); player.x = r.cx; player.y = r.cy; centerCamera(true);
    for (let i = 0; i < MW * MH; i++) if (L.room[i] === r.id){ roomLight[3 * i] = ROOM_RGB[0] * 0.6; roomLight[3 * i + 1] = ROOM_RGB[1] * 0.6; roomLight[3 * i + 2] = ROOM_RGB[2] * 0.6; } }   // the biggest room, dimly lit
  computeLight(lightNow, t);
  for (let r = 0; r < VH; r++) for (let c = 0; c < GW; c++){
    const x = cam.x + c, y = cam.y + r; if (x >= MW || y >= MH) continue;
    const i = idx(x, y), j = 3 * i, v = lum(lightNow, j); if (v < 0.02) continue;
    const [g, base] = TILE[L.tiles[i]];
    put(c, VY + r, [base[0] * lightNow[j] * 1.7, base[1] * lightNow[j + 1] * 1.7, base[2] * lightNow[j + 2] * 1.7], 1, 1, g.charCodeAt(0));
  }
  const top = Math.max(1, (GH >> 1) - 9);
  center(top, "T O R C H L I G H T", ACCENT); center(top + 1, "D U N G E O N S", ACCENT);
  center(top + 3, "A dungeon crawl after Moria", DIM);
  const blink = (performance.now() / 500 | 0) % 2;
  center(top + 5, touchMode ? "PRESS A OR START TO BEGIN" : "PRESS SPACE TO BEGIN", blink ? WHITE : DIM);
  center(top + 6, "Early version: one character type, no saves yet.", DIM);

}
function drawTomb(){
  const T0 = tomb, lines = ["R.I.P.", "", "A Fighter of level " + T0.lvl, "killed by " + T0.killer, "at " + feet(depth) + " ft", "", "Score " + T0.score + (T0.best ? "  (best!)" : ""), "",
    touchMode ? "Press A for the title" : "Press Space for the title"];
  const w = 34, top = Math.max(2, (GH >> 1) - 7), x0 = (GW - w) >> 1;

function draw(t){

  const mt = (m, title, note) => { if (m.open) m.draw({ text: (x, y, str, rgb) => { for (let i = 0; i < str.length; i++) put(x + i, y, rgb, 1, MENU_LAYER, str.charCodeAt(i)); }, GW, GH, accent: ACCENT, normal: WHITE, dim: DIM, title, note }); };

/* ---------- input ---------- */
const ORIGINAL = { ArrowUp: 8, ArrowDown: 2, ArrowLeft: 4, ArrowRight: 6, Home: 7, PageUp: 9, End: 1, PageDown: 3, 1: 1, 2: 2, 3: 3, 4: 4, 6: 6, 7: 7, 8: 8, 9: 9 };
const ROGUE = { ArrowUp: 8, ArrowDown: 2, ArrowLeft: 4, ArrowRight: 6, h: 4, j: 2, k: 8, l: 6, y: 7, u: 9, b: 1, n: 3 };
function dirFor(e){
  const code = /^Numpad([1-9])$/.exec(e.code);
  if (code && code[1] !== "5") return +code[1];
  const map = keySet === "roguelike" ? ROGUE : ORIGINAL;
  return map[e.key] || map[e.key.toLowerCase()] || 0;
}
function onKey(e){
  if (list.open && list.key(e)){ e.preventDefault(); return; }
  if (menu.key(e)){ e.preventDefault(); return; }
  if (e.key === "Escape"){ e.preventDefault(); return menu.show(); }
  if (state === "title"){ if (e.key === " " || e.key === "Enter"){ e.preventDefault(); newGame(); } return; }
  if (state === "dead"){ if (stateT > 1 && (e.key === " " || e.key === "Enter")){ e.preventDefault(); toTitle(); } return; }
  const ro = keySet === "roguelike", d = dirFor(e);
  if (d){
    e.preventDefault();
    const [dx, dy] = DIRS[d];
    if (e.shiftKey || (ro && /^[HJKLYUBN]$/.test(e.key))) return run(dx, dy);
    return act(() => tryMove(dx, dy));
  }
  if (e.ctrlKey && (e.key === "p" || e.key === "P")){ e.preventDefault(); return messageList(); }
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const k = e.key;
  if (k === "g" || k === ",") act(pickUp);
  else if (k === ">") act(() => takeStairs(true));
  else if (k === "<") act(() => takeStairs(false));
  else if (k === "i") inventoryList();
  else if (k === "E") inventoryList(it => ITEM[it.k].use === "eat", "eat");
  else if (k === "q") inventoryList(it => ITEM[it.k].use === "quaff", "quaff");
  else if (k === "w") inventoryList(it => !!ITEM[it.k].slot, "wield");
  else if (k === "F") inventoryList(it => ITEM[it.k].use === "fuel", "fuel");
  else if (k === "d") inventoryList(() => true, "drop");
  else if (k === "R") rest();
  else if (k === "." || (!ro && (k === "5" || e.code === "Numpad5"))) act(() => true);
  else if (k === (ro ? "x" : "l")) look();
  else if (k === "C") characterList();
  else if (k === "?") helpList();
  else return;
  e.preventDefault();
}
addEventListener("keydown", onKey);
function toTitle(){ state = "title"; L = null; world.bodies.length = 0; }
addEventListener("beforeunload", e => { if (state === "play"){ e.preventDefault(); e.returnValue = ""; } });   // nothing is saved yet

const CTRL_KEY = "controls";
let touchMode = matchMedia("(pointer: coarse)").matches;   // default follows the device; the menu's Controls row overrides it
{ const c = load(CTRL_KEY, null); if (c) touchMode = c === "touch"; }
function setControls(touch, save){
  touchMode = touch; document.body.classList.toggle("touch", touch); $("gamepad").hidden = !touch;
  if (save) store(CTRL_KEY, touch ? "touch" : "keyboard");
}
setControls(touchMode, false);
const buzz = () => navigator.vibrate && navigator.vibrate(8);
// The D-pad picks one of eight directions from the angle of the thumb; holding it keeps walking.
const dpad = $("dpad");
let holdDir = 0, holdT = 0;
function dpadAt(e){
  const r = dpad.getBoundingClientRect(), dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2);
  if (Math.hypot(dx, dy) < r.width * 0.1) return 0;
  const a = Math.round(Math.atan2(dy, dx) / (Math.PI / 4));   // 0 east, 2 south, -2 north, 4 / -4 west
  return { 0: 6, 1: 3, 2: 2, 3: 1, 4: 4, [-4]: 4, [-3]: 7, [-2]: 8, [-1]: 9 }[a];
}
function dpadPress(d){
  const was = holdDir; holdDir = d;
  dpad.dataset.dir = !d ? "" : d === 8 ? "up" : d === 2 ? "down" : [1, 4, 7].includes(d) ? "left" : "right";
  if (!d || d === was) return;
  buzz();
  if (list.open || menu.open){ const m = list.open ? list : menu; d === 8 ? m.move(-1) : d === 2 ? m.move(1) : d === 4 ? m.change(-1) : d === 6 ? m.change(1) : 0; holdDir = 0; return; }
  if (state !== "play") return;
  disturbed = false; holdT = 0.3;   // a short pause before walking on
  act(() => tryMove(...DIRS[d]));
}
dpad.addEventListener("pointerdown", e => { e.preventDefault(); dpad.setPointerCapture(e.pointerId); dpadPress(dpadAt(e)); });
dpad.addEventListener("pointermove", e => { if (dpad.hasPointerCapture(e.pointerId)) dpadPress(dpadAt(e)); });
for (const ev of ["pointerup", "pointercancel"]) dpad.addEventListener(ev, () => { holdDir = 0; dpad.dataset.dir = ""; });
document.querySelectorAll("[data-pad]").forEach(b => {
  const id = b.dataset.pad;
  b.addEventListener("pointerdown", e => {
    e.preventDefault(); b.setPointerCapture(e.pointerId); b.classList.add("on"); buzz();
    if (list.open){ id === "a" ? list.choose() : list.hide(); return; }   // in a list: A chooses, any other button closes
    if (menu.open){ id === "a" ? menu.choose() : menu.hide(); return; }
    if (state === "title"){ if (id === "a" || id === "start") newGame(); else if (id === "select") menu.show(); return; }
    if (state === "dead"){ if (stateT > 1 && (id === "a" || id === "start")) toTitle(); return; }
    if (id === "start" || id === "select") return menu.show();
    if (id === "a") contextAction(); else commandList();
  });
  const up = () => b.classList.remove("on");
  b.addEventListener("pointerup", up); b.addEventListener("pointercancel", up);
});
cv.addEventListener("pointerdown", e => {
  const [gx, gy] = gridAt(e, cv, GW, GH);
  if (list.open) return list.tap(gx, gy);
  if (menu.open) return menu.tap(gx, gy);
  if (state === "title") return newGame();
  if (state === "dead"){ if (stateT > 1) toTitle(); return; }
  if (!touchMode) commandList();   // a click opens the commands
});

/* ---------- layout and loop ---------- */
function layout(){
  const r = stage.getBoundingClientRect(); if (!r.width) return;
  const old = screen, dpr = Math.min(window.devicePixelRatio || 1, 3);
  // as large a font as fits at least 60 x 24 characters, up to 14px; the view grows with the space
  const f = Math.max(6, Math.min(14, Math.floor(r.width / 60 / 0.6), Math.floor(r.height / 24 / 1.15)));
  screen = new Screen(f, D); screen.fit(r.width, r.height, dpr);
  GW = Math.min(screen.cols, 140); GH = Math.min(screen.rows, 50); VH = GH - VY - 2;
  const W = GW * screen.cw, H = GH * screen.ch;
  screen.fit(W, H, dpr);
  cv.style.width = W + "px"; cv.style.height = H + "px"; cv.style.transform = "translate(-50%,-50%)";
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr); ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  world.w = W; world.h = H; world.unit = screen.cw; world.g = { x: 0, y: H * 1.2 };
  if (old) world.bodies.length = 0;
  if (player) centerCamera(true);
  rebuildTerrain();
}
let last = performance.now(), nextFrame = 0;
const FRAME_MS = 1000 / 60;
function tick(t){
  requestAnimationFrame(tick);
  if (t < nextFrame - 1) return;   // run at most ~60 times a second, even on faster displays
  nextFrame = t - nextFrame > FRAME_MS ? t + FRAME_MS : nextFrame + FRAME_MS;
  const dt = Math.min((t - last) / 1000, 1 / 30); last = t;
  if (!screen) return;
  stateT += dt;
  if (holdDir && state === "play" && !list.open && !menu.open && (holdT -= dt) <= 0){   // keep walking while the D-pad is held
    holdT = 0.14;
    if (disturbed || !act(() => tryMove(...DIRS[holdDir]))) holdDir = 0;
  }
  world.step(dt);
  for (const b of world.bodies) b.life -= dt;
  world.bodies = world.bodies.filter(b => b.life > 0);
  draw(t);
}
layout();
let fitted = stage.getBoundingClientRect();
new ResizeObserver(() => {   // re-fit only for real size changes, not the mobile address bar sliding in and out
  const r = stage.getBoundingClientRect();
  if (Math.abs(r.width - fitted.width) < 1 && Math.abs(r.height - fitted.height) < fitted.height * 0.15) return;
  fitted = r; layout();
}).observe(stage);
requestAnimationFrame(t => { last = t; requestAnimationFrame(tick); });
})();
</script>
