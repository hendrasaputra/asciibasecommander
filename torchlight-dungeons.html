<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Torchlight Dungeons</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
/* Shared by the game pages: page layout, the touch gamepad, and the landscape phone layout. Built into each page. */
:root{
  --ground:#E9EDF1; --ink:#20304A; --muted:#5E6A7D; --line:#C9D1DB;
  --btn:#DCE2E9; --accent:#2F5BD3;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#151B26; --ink:#D9E1EC; --muted:#8792A3; --line:#2A3445;
    --btn:#222B3A; --accent:#7FA2FF;
  }
}
:root[data-theme="dark"]{
  --ground:#151B26; --ink:#D9E1EC; --muted:#8792A3; --line:#2A3445;
  --btn:#222B3A; --accent:#7FA2FF;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;overscroll-behavior:none}
body{height:100%;height:100svh;margin:0;touch-action:manipulation;overscroll-behavior:none;-webkit-touch-callout:none;background:var(--ground);color:var(--ink);
  font:15px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  display:flex;flex-direction:column;overflow:hidden;-webkit-user-select:none;user-select:none}
header{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:2px 12px;padding:10px 14px 6px}
h1{font-size:17px;font-weight:650;margin:0;letter-spacing:-0.01em}
h1 a{color:inherit;text-decoration:none}h1 a:hover{text-decoration:underline}
#hud{font:12px/1.2 ui-monospace,"SF Mono",Menlo,Consolas,monospace;color:var(--muted);white-space:nowrap}
#stage{flex:1;position:relative;touch-action:none;margin:0 8px;border:1px solid var(--line);border-radius:6px;overflow:hidden;min-height:0;background:#0B0F16}
#cv{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:block;touch-action:none}
nav{padding:8px 8px 10px;display:flex;flex-direction:column;gap:6px}
button{flex:1 1 auto;min-width:60px;min-height:40px;padding:6px 8px;border:0;border-radius:8px;background:var(--btn);color:var(--ink);font:inherit;font-size:14px;cursor:pointer;touch-action:none}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
/* Touch gamepad, styled after a handheld console: cross-shaped D-pad, slanted A/B, pill SELECT/START */
#gamepad{display:grid;grid-template-columns:auto 1fr auto;grid-template-areas:"dpad . ab" "mid mid mid";align-items:center;row-gap:4px;padding:4px 12px 20px;touch-action:none}
#gamepad[hidden]{display:none}
#dpad{grid-area:dpad;position:relative;width:120px;height:120px;touch-action:none;cursor:pointer}
#dpad::before,#dpad::after{content:"";position:absolute;background:#2A2A31;border-radius:7px;box-shadow:0 4px 0 #0E0E12}
#dpad::before{left:0;right:0;top:40px;height:40px}
#dpad::after{top:0;bottom:0;left:40px;width:40px}
#dpad span{position:absolute;z-index:1;color:#6E6E78;font-size:13px;line-height:1;pointer-events:none;transition:color .05s}
#dpad .l{left:11px;top:53px}#dpad .r{right:11px;top:53px}#dpad .u{left:54px;top:11px}#dpad .d{left:54px;bottom:11px}
#dpad[data-dir="left"] .l,#dpad[data-dir="right"] .r,#dpad[data-dir="up"] .u,#dpad[data-dir="down"] .d{color:#F4F4F8}
#dpad[data-dir="left"]{transform:perspective(300px) rotateY(-8deg)}
#dpad[data-dir="right"]{transform:perspective(300px) rotateY(8deg)}
#dpad[data-dir="up"]{transform:perspective(300px) rotateX(8deg)}
#dpad[data-dir="down"]{transform:perspective(300px) rotateX(-8deg)}
.mid{grid-area:mid;justify-self:center;display:flex;gap:18px;transform:rotate(-22deg)}
.mid button{min-width:0;min-height:0;width:52px;height:16px;padding:0;border-radius:8px;background:#8D8C94;box-shadow:0 3px 0 #55545B;font-size:0;position:relative}
.mid button::after{content:attr(data-label);position:absolute;top:22px;left:50%;transform:translateX(-50%);font:600 10px/1 ui-monospace,Menlo,monospace;letter-spacing:.08em;color:var(--muted)}
.ab{grid-area:ab;display:flex;gap:14px;transform:rotate(-22deg)}
.ab button{min-width:0;min-height:0;width:60px;height:60px;padding:0;border-radius:50%;background:#A3245C;color:#F7D7E6;font:700 19px/1 ui-monospace,Menlo,monospace;box-shadow:0 5px 0 #5E1233}
.ab button:first-child{margin-top:30px}
#gamepad button.on{transform:translateY(3px);box-shadow:0 2px 0 #0E0E12;filter:brightness(.85)}
body.touch #hud{display:none}
/* Phone on its side: D-pad on the left, A/B on the right, game in the middle */
@media (orientation: landscape) and (max-height: 600px){
  body.touch{display:grid;grid-template-columns:auto 1fr auto;grid-template-rows:1fr auto}
  body.touch header{display:none}
  body.touch nav,body.touch #gamepad{display:contents}
  body.touch #stage{grid-column:2;grid-row:1;margin:6px 0 4px}
  body.touch #dpad{grid-column:1;grid-row:1 / 3;align-self:center;justify-self:center;margin:0 18px 70px}
  body.touch .mid{grid-column:1;grid-row:1 / 3;align-self:end;justify-self:center;margin-bottom:46px}
  body.touch .ab{grid-column:3;grid-row:1 / 3;align-self:center;margin:0 18px 0 10px}
}
</style>
<style>
/* Torchlight's own look: a dark panel and HUD over the code-drawn map (phase 6). Keyboard only. */
:root { --tbg: #0d0c12; --panel: #1b1824; --edge: #3a3350; --slot: #13111a; --text: #e8e2d4; --dim: #8d86a0; --gold: #e8b830; --hpc: #c8423a; --mpc: #4a7ad8; --xpc: #c89a3a;
  --q-cursed: #d84a3a; --q-magic: #5a9cff; --q-ego: #b46cf0; --q-art: #f0a830; --q-unknown: #77708a; }
body { background: var(--tbg); color: var(--text); }
header { color: var(--text); } h1 a { color: var(--text); } #hud { color: var(--dim); }
#main { flex: 1; display: flex; gap: 8px; margin: 0 8px 8px; min-height: 0; }
#stage { margin: 0; flex: 1; border-color: var(--edge); background: #000; font: 13px/1.35 ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
#cv { left: 0; top: 0; transform: none; }
img.px { image-rendering: pixelated; width: 32px; height: 32px; display: block; }
img.px.big { width: 48px; height: 48px; } img.px.face { width: 40px; height: 40px; } img.px.hero { width: 160px; height: 160px; filter: drop-shadow(0 6px 0 #0007); }
#ov > * { position: absolute; }
#status { left: 10px; top: 10px; width: 250px; background: #0c0b12d8; border: 2px solid var(--edge); border-radius: 6px; padding: 8px 10px; }
.who { display: flex; gap: 10px; align-items: center; } .who b { display: block; font-size: 14px; } .who small { color: var(--dim); }
.meter { margin: 5px 0; } .meter span { display: flex; justify-content: space-between; font-size: 12px; } .meter i { display: block; height: 7px; background: #2a2636; border-radius: 3px; overflow: hidden; }
.meter i s { display: block; height: 100%; text-decoration: none; transition: width .2s; }
.hp s { background: var(--hpc); } .hp.low s { background: #ff5a3a; animation: blink .8s infinite; } .mp s { background: var(--mpc); } .xp s { background: var(--xpc); } .wt s { background: #7a8a5a; }
.meter.xp i { height: 4px; }
.facts { display: flex; justify-content: space-between; font-size: 12px; margin-top: 4px; } .gold { color: var(--gold); } .bad { color: #ff7a5a; }
.chips { display: flex; flex-wrap: wrap; gap: 3px; margin-top: 4px; } .chips em { font-style: normal; font-size: 11px; padding: 1px 5px; border-radius: 3px; }
.chips .good { background: #234a2c; color: #b8f0b0; } .chips .bad { background: #5a2420; color: #ffc0b0; }
#minibox { right: 10px; top: 10px; width: 240px; }
#mini { width: 240px; height: 132px; image-rendering: pixelated; border: 2px solid var(--edge); border-radius: 6px; display: block; background: #07060b; }
#target { margin-top: 6px; background: #0c0b12d8; border: 2px solid var(--gold); border-radius: 6px; padding: 8px; }
.ct { display: flex; gap: 10px; align-items: center; } .ct b { display: block; } .ct small { color: var(--dim); display: block; }
.ln { font-size: 12px; margin: 4px 0; color: #cfc8b8; } .dim { color: var(--dim); }
#log { left: 10px; bottom: 82px; width: 46%; text-shadow: 0 1px 0 #000, 0 0 4px #000; pointer-events: none; }
#log .new { color: #fff3c8; }
#bar { left: 50%; bottom: 8px; transform: translateX(-50%); display: flex; gap: 10px; padding: 5px; background: #000b; border: 2px solid var(--edge); border-radius: 6px; }
#bar .acts, #bar .hot { display: flex; gap: 4px; } #bar .acts .slot { border-color: #5a4f78; }
.slot { width: 52px; height: 52px; background: var(--slot); border: 2px solid var(--edge); border-radius: 4px; position: relative; display: grid; place-items: center; flex: none; }
.slot .k { position: absolute; left: 3px; top: 0; font-size: 11px; color: var(--gold); font-weight: bold; }
.slot .n { position: absolute; right: 3px; bottom: 0; font-size: 10px; color: var(--text); text-shadow: 0 1px 0 #000; }
.slot.off img, .slot.off .glyph { opacity: .35; } .slot .glyph { font-size: 22px; color: var(--text); } .glyph.dim { color: #5a5468; }
.slot .lab { color: #4a4460; font-size: 9px; text-transform: uppercase; text-align: center; line-height: 1.1; }
.q-cursed { border-color: var(--q-cursed) !important; } .q-magic { border-color: var(--q-magic) !important; } .q-ego { border-color: var(--q-ego) !important; }
.q-art { border-color: var(--q-art) !important; box-shadow: 0 0 6px #f0a83088; } .q-unknown { border-color: var(--q-unknown) !important; }
.card.q-cursed b { color: var(--q-cursed); } .card.q-magic b { color: var(--q-magic); } .card.q-ego b { color: var(--q-ego); } .card.q-art b { color: var(--q-art); }
#prompt { left: 50%; top: 12px; transform: translateX(-50%); background: #2a2010ee; border: 2px solid var(--gold); color: #ffe9b0; padding: 6px 14px; border-radius: 6px; white-space: nowrap; }
#panel { width: 372px; flex: none; background: var(--panel); border: 2px solid var(--edge); border-radius: 6px; display: flex; flex-direction: column; min-height: 0; font: 13px/1.35 ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
#panel[hidden] { display: none; } #panel.focus { border-color: var(--gold); }
#tabs { display: flex; } #tabs b { flex: 1; text-align: center; padding: 7px 0 5px; background: #14121c; color: var(--dim); font-weight: normal; border-bottom: 2px solid var(--edge); cursor: pointer; }
#tabs b small { display: block; font-size: 10px; color: #5a5468; } #tabs b.on { background: var(--panel); color: var(--text); border-bottom-color: transparent; } #tabs b.on small { color: var(--gold); }
#tab { padding: 10px 12px; overflow: auto; flex: 1; }
#tab .lv { border: 2px solid var(--edge); padding: 2px 8px; text-align: center; } #tab .lv b { font-size: 20px; display: block; }
#tab .name { font-size: 16px; } .sub { color: var(--dim); }
.doll { display: grid; grid-template-columns: 52px 1fr 52px; gap: 6px; margin: 10px 0 6px; align-items: center; } .doll .col { display: grid; gap: 6px; } .doll .dmid { display: grid; place-items: center; }
.row4 { display: flex; gap: 6px; justify-content: center; }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 2px 14px; border: 2px solid var(--edge); padding: 6px 10px; } .stats span { display: flex; justify-content: space-between; } .stats b { color: var(--gold); font-weight: normal; }
i.up { color: #7adc6a; font-style: normal; margin-left: 4px; } i.down { color: #ff6a5a; font-style: normal; margin-left: 4px; }
h3 { margin: 12px 0 6px; font-size: 11px; color: var(--dim); letter-spacing: .12em; text-transform: uppercase; font-weight: normal; }
.grid { display: grid; grid-template-columns: repeat(6, 52px); gap: 4px; justify-content: center; margin: 8px 0; }
.sel { outline: 2px solid var(--gold); outline-offset: 1px; }
.spell { display: grid; grid-template-columns: 34px 1fr auto; align-items: center; gap: 8px; padding: 3px 6px; border: 1px solid transparent; border-radius: 4px; cursor: pointer; }
.spell.off { opacity: .5; } .spell.ready { border-color: var(--gold); background: #2a2010; } .spell small { color: var(--dim); } .spell em { color: var(--gold); font-style: normal; font-size: 11px; }
.msgs div { font-size: 12px; padding: 2px 0; border-bottom: 1px solid #2a2636; }
.beast { display: flex; gap: 8px; margin: 6px 0; } .beast small { color: var(--dim); display: block; }
#bigmap { image-rendering: pixelated; width: 100%; border: 2px solid var(--edge); }
#tip { position: fixed; z-index: 30; width: 280px; pointer-events: none; }
.card { background: #0c0b11f4; border: 2px solid var(--gold); padding: 10px; border-radius: 4px; font: 13px/1.35 ui-monospace, "SF Mono", Menlo, Consolas, monospace; color: var(--text); }
.card p { display: flex; justify-content: space-between; margin: 3px 0; } .card hr { border: 0; border-top: 1px solid var(--edge); margin: 6px 0; }
.card p span:last-child { color: var(--gold); }
#dlg, #screen { position: absolute; inset: 0; display: grid; place-items: center; z-index: 10; }
#dlg { background: #0008; } #dlg[hidden], #screen[hidden], #target[hidden], #prompt[hidden], #ov[hidden] { display: none; }
#dlg .box { background: var(--panel); border: 2px solid var(--gold); border-radius: 8px; padding: 14px 16px; min-width: 520px; max-width: 92%; max-height: 92%; display: flex; flex-direction: column; }
#dlg .box.wide { min-width: 860px; } #dlg h2 { margin: 0 0 8px; font-size: 16px; color: var(--gold); font-weight: normal; }
#dlg .cols { display: flex; gap: 12px; min-height: 0; flex: 1; } #dlg .list { flex: 1; overflow: auto; min-width: 240px; max-height: 60vh; }
#dlg .side { width: 290px; flex: none; } #dlg .side .card { border-color: var(--edge); }
.row { display: flex; align-items: center; gap: 8px; padding: 4px 8px; border: 2px solid transparent; border-radius: 4px; cursor: pointer; }
.row span { flex: 1; } .row small { color: var(--gold); } .row.sel { border-color: var(--gold); background: #2a2010; outline: none; } .row.off { opacity: .45; }
.row[class*="q-"] { border-left-width: 4px; }
.note { color: var(--dim); font-size: 11px; margin-top: 8px; } kbd { display: inline-block; min-width: 140px; color: var(--gold); font: inherit; }
.shopline { display: flex; gap: 16px; margin-bottom: 8px; color: #cfc8b8; }
#screen { background: radial-gradient(ellipse at center, #0000 0, #000a 70%); }
.titlecard { text-align: center; background: #0c0b12cc; border: 2px solid var(--edge); border-radius: 10px; padding: 26px 40px; max-width: 640px; }
.titlecard h1 { font: 700 44px/1 Georgia, "Times New Roman", serif; letter-spacing: .14em; color: #ffcf70; text-shadow: 0 0 18px #ff8a2088, 0 3px 0 #5a2a00; text-transform: uppercase; margin: 0 0 6px; }
.titlecard h1 span { display: block; font-size: 26px; letter-spacing: .4em; color: #f0e2c0; margin-top: 8px; }
.blink { animation: blink 1.2s steps(2) infinite; color: #fff; } @keyframes blink { 50% { opacity: .35; } }
.fame { font-size: 12px; color: var(--dim); } .fame.best { color: var(--text); } .fame b { color: var(--gold); display: inline-block; min-width: 52px; text-align: right; margin-right: 6px; }
.tomb .rip { font-size: 40px; color: #d8d0c0; text-shadow: none; }
.create { background: #0c0b12ee; border: 2px solid var(--edge); border-radius: 10px; padding: 16px 20px; width: min(980px, 94%); }
.steps { display: flex; gap: 18px; margin-bottom: 12px; } .steps b { color: #5a5468; font-weight: normal; } .steps b.on { color: var(--gold); } .steps b.done { color: var(--dim); }
.cbody { display: grid; grid-template-columns: 220px 180px 1fr; gap: 16px; align-items: start; }
.cinfo h2 { margin: 0 0 6px; color: var(--gold); font-weight: normal; } .cinfo .stats { margin: 8px 0; }
.preview { display: grid; place-items: center; background: #13111a; border: 2px solid var(--edge); border-radius: 8px; padding: 10px; }
.namebox { margin-top: 8px; padding: 6px 10px; border: 2px solid var(--gold); border-radius: 4px; font-size: 16px; } .caret { animation: blink 1s steps(2) infinite; }
</style>

<body>
<header>
  <h1><a href="./" title="Back to the cartridge shelf">&#8249; Torchlight Dungeons</a></h1>
  <div id="hud">arrows move &middot; A attack &middot; S spell &middot; D drink &middot; W grab &middot; Tab target &middot; I C B J M panel &middot; ? keys &middot; Esc menu</div>
</header>
<div id="main">
  <div id="stage">
    <canvas id="cv" aria-label="The dungeon map around you."></canvas>
    <div id="ov" hidden>
      <div id="status"></div>
      <div id="minibox"><canvas id="mini" width="240" height="132"></canvas><div id="target" hidden></div></div>
      <div id="log" aria-live="polite"></div>
      <div id="bar"></div>
      <div id="prompt" hidden></div>
    </div>
    <div id="screen" hidden></div>
    <div id="dlg" hidden></div>
  </div>
  <aside id="panel" hidden><div id="tabs"></div><div id="tab"></div></aside>
</div>
<div id="tip" hidden></div>
<script>
"use strict";
/* ================= Shared core: physics, light, ink, 24-bit renderer ================= */
const MONO = 'ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace';
const SANS = '-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif';
// The simulated screen is always dark: characters emit light, so they need a black background.
const SCREEN = { bg: "#0B0F16", dot: "#1C2432", line: "#263042", text: "#DCE3EC", muted: "#7C889B", accent: "#7FA2FF", pink: "#F07FB8", lamp: "#FFC857" };
const RAMPS = { classic: " .:-=+*#%@", detailed: " .'`^\",:;Il!i~+_-?]}1)|/tfjrxnuvczXYUJCLQ0OZmwqpdbkhao*#MW&8%B@", blocks: " \u2591\u2592\u2593\u2588" };
function norm(v){ const l = Math.hypot(...v); return v.map(x => x / l); }
const DIR = norm([-0.5, -0.6, 0.65]), SUB = [0.25, 0.75], MREF = 2.4;
const AMB_RGB = [0.55, 0.65, 0.9];     // room light is slightly blue
const FLASH_RGB = [1.0, 0.75, 0.45];   // impact flashes are warm
const FLOOR_ALB = 0.5;                 // share of light the floor reflects
const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5];
const MATS = {
  foam:   { name: "foam",   density: 0.2, e: 0.70, mu: 0.6, kd: 0.95, ks: 0.05, shine: 4,  alb: [0.20, 0.85, 0.72], rMin: 1.6, rMax: 2.4 },
  rubber: { name: "rubber", density: 1.0, e: 0.55, mu: 0.8, kd: 0.85, ks: 0.30, shine: 14, alb: [0.30, 0.48, 1.00], alt: [1.00, 0.38, 0.68], rMin: 1.2, rMax: 1.9 },
  steel:  { name: "steel",  density: 7.0, e: 0.35, mu: 0.2, kd: 0.45, ks: 1.10, shine: 70, alb: [0.72, 0.76, 0.82], rMin: 0.9, rMax: 1.3 },
  peg:    { name: "peg",    density: 0,   e: 0.50, mu: 0.3, kd: 0.80, ks: 0.20, shine: 10, alb: [0.42, 0.47, 0.56] }
};
const MIX = ["rubber", "rubber", "rubber", "rubber", "foam", "foam", "foam", "steel", "steel", "steel"];
function hexToLinear(hex){
  const n = parseInt(hex.slice(1), 16);
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255].map(c => Math.pow(c / 255, 2.2));
}
function defaultDisplay(){
  return { chars: RAMPS.classic, calibrate: true, dither: false, black: 0.15, exposure: 1.3, gamma: 2.2, split: 0.2, glow: 0.35, room: 0.18, lampHex: "#FFD9A0", lampRGB: hexToLinear("#FFD9A0") };
}

/* ---------- arcade display settings (settings.html), shared by the game pages ---------- */
// One choice for every cartridge, saved in this browser: character set, ASCII or pixel drawing, tube TV filter, and
// detail (1, 2 or 3: how many times finer the engine draws its lit bodies and light; see Screen.fit).
const ARCADE_KEY = "arcade.v1.display";
const ARCADE_DEFAULTS = { ramp: "classic", custom: " .:oO0@", mode: "ascii", crt: false, detail: 1 };
function arcadeSettings(){
  let saved = {};
  try { saved = JSON.parse(localStorage.getItem(ARCADE_KEY) || "{}") || {}; }
  catch (e){ console.warn("Arcade: saved display settings unreadable, using defaults", e); }
  return { ...ARCADE_DEFAULTS, ...saved };
}
function saveArcadeSettings(s){
  try { localStorage.setItem(ARCADE_KEY, JSON.stringify(s)); return true; }
  catch (e){ console.warn("Arcade: could not save display settings", e); return false; }
}
function arcadeChars(s){ return s.ramp === "custom" ? (s.custom.length > 1 ? s.custom : " @") : RAMPS[s.ramp] || RAMPS.classic; }
// The tube TV look is CSS laid over the game's #stage: scanlines, a phosphor grille, vignette, rounded glass, flicker.
const CRT_CSS = `
body.crt #stage{background:#050607}
body.crt #cv{border-radius:14px;filter:saturate(1.15) contrast(1.06) brightness(1.1)}
body.crt #stage::before,body.crt #stage::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:2}
body.crt #stage::before{background:repeating-linear-gradient(to bottom,rgba(0,0,0,.24) 0 1px,transparent 1px 3px),

/* ---------- the town ---------- */
// A walled town on the surface: six shops in two rows along a main street, a few houses, lamp posts, and the
// stairs down. It uses the top-left TW x TH of the map; L.w and L.h tell the camera where it ends.
const TW = 80, TH = 26;
function generateTown(rng){
  const tiles = new Uint8Array(MW * MH).fill(T.EDGE), room = new Int16Array(MW * MH).fill(-1), lit = new Uint8Array(MW * MH);
  const shopAt = new Int8Array(MW * MH).fill(-1), at = (x, y) => y * MW + x;

  const shops = [], houses = [], lamps = [];
  const building = (x0, y0, w, h) => { for (let y = y0; y < y0 + h; y++) for (let x = x0; x < x0 + w; x++) tiles[at(x, y)] = T.WALL; };
  // shops: three facing the street from above, three from below; the street runs along the middle
  const order = rng.shuffle([0, 1, 2, 3, 4, 5]), street = TH >> 1;
  for (let k = 0; k < 6; k++){
    const top = k < 3, col = k % 3, w = 12 + rng.int(4), h = 5, x0 = 5 + col * 25 + rng.int(4), y0 = top ? street - h - 2 - rng.int(2) : street + 3 + rng.int(2);
    building(x0, y0, w, h);
    const dx = x0 + 2 + rng.int(w - 4), dy = top ? y0 + h - 1 : y0, door = at(dx, dy);   // the entrance faces the street
    tiles[door] = T.SHOP; shopAt[door] = order[k];
    shops[order[k]] = { x0, y0, w, h, door };
  }
  // small houses, and lamp posts along the street
  for (let tries = 0; tries < 60 && houses.length < 6; tries++){
    const w = 4 + rng.int(4), h = 3 + rng.int(2), x0 = 2 + rng.int(TW - w - 4), y0 = 2 + rng.int(TH - h - 4);
    let free = true;
    for (let y = y0 - 1; y <= y0 + h && free; y++) for (let x = x0 - 1; x <= x0 + w && free; x++) if (tiles[at(x, y)] !== T.GROUND || Math.abs(y - street) <= 1) free = false;
    if (free){ building(x0, y0, w, h); houses.push({ x0, y0, w, h }); }
  }
  for (let x = 6; x < TW - 4; x += 12) for (const y of [street - 1, street + 1]) if (tiles[at(x, y)] === T.GROUND){ tiles[at(x, y)] = T.LAMP; lamps.push(at(x, y)); }

  const ground = []; for (let i = 0; i < tiles.length; i++) if (tiles[i] === T.GROUND) ground.push(i);
  let down;
  do down = rng.pick(ground); while (Math.abs(Math.floor(down / MW) - street) < 3);
  tiles[down] = T.DOWN;

}
// Every cell a player can stand on, reached from the first room (closed doors count as passable).
function reachable(L){
  const seen = new Uint8Array(MW * MH), stack = [L.rooms[0].cells[0]]; seen[stack[0]] = 1;
  while (stack.length){
    const i = stack.pop();
    for (const d of [1, -1, MW, -MW, MW + 1, MW - 1, -MW + 1, -MW - 1]){
      const j = i + d; if (seen[j] || !(passable(L.tiles[j]) || L.tiles[j] === T.DOOR)) continue;
      seen[j] = 1; stack.push(j);
    }
  }
  return seen;
}

  }

    let t; do { t = Array.from({ length: 2 + rng.int(2) }, () => rng.pick(SYLLABLES) + (rng.chance(0.5) ? rng.pick(SYLLABLES) : "")).join(" "); } while (used.has(t));
    used.add(t); know.flav[K.id] = [t, [0.95, 0.92, 0.85]];
  }
  return know;
}

/* ---------- making items ---------- */
// Weapons and armour roll a quality: cursed (minus bonuses, and they stick to you), plain, good (plus bonuses),
// or great (good, plus a special kind or, rarely, an artifact). Deeper means better odds.
function makeItem(k, depth, rng, know, n = 1){
  const K = ITEM[k], it = { k, n };
  if (K.fuel && K.cat === "light") it.fuel = K.fuel;
  if (K.charges) it.charges = rng.dice(K.charges);
  if (K.cat === "rod") it.timeout = 0;
  if (K.pstat || K.pac || K.phit || K.pdam || K.pspeed || K.pinfra){   // rings and amulets
    const p = K.pac ? 5 + rng.int(3 + depth / 2) : K.pspeed ? 1 + rng.int(depth >= 70 ? 6 : 3) : 1 + rng.int(2 + Math.floor(depth / 15));
    it.pval = K.cursed ? -p : p; if (K.cursed) it.cursed = true;
  }
  if (K.cursed) it.cursed = true;
  if (!K.dice && !K.ac && !K.mult) return it;
  if (K.cat === "dart") return it;
  const roll = rng.int(100), good = Math.min(60, 12 + depth * 1.5), bonus = () => 1 + rng.int(3 + Math.floor(depth / 5));
  const armourish = ARMOUR_CATS.includes(K.cat);
  if (roll < 10){   // cursed
    it.cursed = K.cat !== "ammo";
    if (armourish) it.toac = -bonus(); else { it.tohit = -bonus(); it.todam = -bonus(); }
  } else if (roll < 10 + good){
    if (armourish) it.toac = bonus(); else { it.tohit = bonus(); it.todam = bonus(); }
    if (rng.int(100) < Math.min(35, 5 + depth)){   // great
      const art = ARTIFACTS.find(a => a.base === k && a.depth <= depth && !know.arts[a.id]);
      if (art && rng.chance(0.15)) return makeArtifact(art, know);
      const egos = EGOS.filter(e => e.cats.includes(K.cat) && e.depth <= depth);
      if (egos.length && K.cat !== "ammo"){ const e = rng.pick(egos); it.ego = e.id; if (e.speed) it.pval = e.speed[0] + rng.int(e.speed[1]); if (e.dam) it.todam = (it.todam || 0) + e.dam; if (e.hit) it.tohit = (it.tohit || 0) + e.hit; if (e.ac) it.toac = (it.toac || 0) + e.ac; }
    }
  }
  return it;
}
function makeArtifact(A, know){
  know.arts[A.id] = true;   // each artifact exists once per game
  const K = ITEM[A.base], it = { k: A.base, n: 1, art: A.id, tohit: A.hit || 0, todam: A.dam || 0, toac: A.ac || 0 };
  if (K.fuel && !A.nofuel) it.fuel = K.fuel;
  if (A.pval) it.pval = A.pval;
  return it;
}
function rollItem(depth, rng, know){
  const pool = ITEMS.filter(K => K.depth <= depth && (K.cat !== "rod" || depth >= 5));
  const K = rng.weighted(pool, K => 1 / K.rarity * (K.depth >= depth - 5 ? 1.4 : 1) * (K.cat === "potion" || K.cat === "scroll" ? 1.6 : 1));
  const n = K.cat === "ammo" ? rng.range(10, 25) : K.cat === "dart" ? rng.range(4, 12) : (K.cat === "potion" || K.cat === "scroll" || K.cat === "food" || K.cat === "flask") && rng.chance(0.25) ? rng.range(2, 4) : 1;
  return makeItem(K.id, depth, rng, know, n);
}

const TILE_CACHE = new Map();
// The picture for map cell (x, y). wallAt(x, y) says whether a neighbour is wall-like.
function tileImage(L, x, y, depth){
  const i = y * MW + x, t = L.tiles[i], v = (hash(x, y) * 4) | 0, below = y + 1 < MH ? L.tiles[i + MW] : T.EDGE;
  const wallish = (xx, yy) => xx < 0 || yy < 0 || xx >= MW || yy >= MH || L.tiles[yy * MW + xx] <= T.WALL || L.tiles[yy * MW + xx] === T.SHOP;
  const mask = () => (wallish(x, y - 1) ? 0 : 1) | (wallish(x + 1, y) ? 0 : 2) | (wallish(x - 1, y) ? 0 : 8);
  if (L.town){
    const near = Math.abs(y - L.street) <= 1, ground = () => near ? memo(TILE_CACHE, "cob" + v, () => cobbleTile(v)) : memo(TILE_CACHE, "grass" + v, () => grassTile(v));
    const house = t === T.WALL && x > 0 && y > 0 && x < L.w - 1 && y < L.h - 1, th = THEMES.stone;
    if (t <= T.WALL){
      const open = below > T.WALL && below !== T.SHOP;
      if (!house) return open ? memo(TILE_CACHE, "tface" + (v & 1), () => wallFace({ ...th, brick: TOWN.stone }, v & 1)) : memo(TILE_CACHE, "ttop" + mask(), () => wallTop(th, mask()));
      return open ? memo(TILE_CACHE, "house" + (v & 1), () => houseFace(v & 1)) : memo(TILE_CACHE, "roof" + mask(), () => roofTile(mask()));
    }
    if (t === T.SHOP){ const k = L.shopAt[i]; return memo(TILE_CACHE, "shop" + k, () => shopDoor(SHOPS[k].rgb)); }
    if (t === T.LAMP) return memo(TILE_CACHE, "lamp" + near + v, () => lampPost(ground()));
    if (t === T.DOWN) return memo(TILE_CACHE, "tdown", () => stairsTile(th, true, grassTile(0)));
    return ground();
  }
  const name = themeFor(depth), th = THEMES[name], k = (s, f) => memo(TILE_CACHE, name + s, f);
  const face = n => k("face" + n, () => wallFace(th, n));
  if (t <= T.WALL) return below > T.WALL && below !== T.DOOR ? face(v & 1) : k("top" + mask(), () => wallTop(th, mask()));
  if (t === T.DOOR) return k("door", () => doorTile(face(0), false));
  if (t === T.OPEN) return k("open", () => doorTile(face(0), true));
  const fl = n => k("floor" + n, () => floorTile(th, n));
  if (t === T.DOWN) return k("down", () => stairsTile(th, true, fl(0)));
  if (t === T.UP) return k("up", () => stairsTile(th, false, fl(0)));
  return fl(v);
}

const SKIN = { human: [0.93, 0.74, 0.6], sylvan: [0.95, 0.85, 0.7], stonekin: [0.8, 0.6, 0.5], burrowfolk: [0.95, 0.75, 0.6], tinkerling: [0.9, 0.8, 0.65],

  ashborn: [0.2, 0.15, 0.15], marrowkin: [0.15, 0.15, 0.12], cragborn: [0.3, 0.3, 0.3] };
const HEIGHT = { burrowfolk: 2, tinkerling: 2, stonekin: 1 };   // short peoples stand lower in the tile
const METAL = [0.72, 0.75, 0.82], LEATHER = [0.55, 0.36, 0.22], CLOTH = [0.35, 0.38, 0.6];
function material(k){
  if (!k) return null;
  if (/plate|banded|splint|steel|iron|gauntlets|tower|kite|great/.test(k)) return { rgb: METAL, shine: true };
  if (/chain|ring|scale/.test(k)) return { rgb: [0.6, 0.62, 0.66], mail: true };
  if (/robe/.test(k)) return { rgb: [0.4, 0.3, 0.6], robe: true };

function doll(who, size = TS){
  const p = pix(size, size), s = size / TS, R = (x, y, w, h, c) => p.rect(Math.round(x * s), Math.round(y * s), Math.max(1, Math.round(w * s)), Math.max(1, Math.round(h * s)), c);

  R(4 - big, 6 + dy, 8 + 2 * big, 6, hex(body.rgb));
  if (body.robe) R(4 - big, 11 + dy, 8 + 2 * big, 3 - dy, hex(body.rgb, 0.85));
  if (body.mail) for (let y = 7; y < 12; y += 2) for (let x = 5; x < 11; x += 2) R(x - big + ((y >> 1) & 1), y + dy, 1, 1, hex(body.rgb, 0.7));
  if (body.shine){ R(5 - big, 7 + dy, 2, 3, hex(body.rgb, 1.3)); R(4 - big, 6 + dy, 8 + 2 * big, 1, hex(body.rgb, 1.2)); }
  R(4 - big, 11 + dy, 8 + 2 * big, 1, hex([0.25, 0.18, 0.12]));

  R(2 - big, 7 + dy, 2, 4, hex(body.rgb, 0.85)); R(12 + big, 7 + dy, 2, 4, hex(body.rgb, 0.85));
  R(2 - big, 10 + dy, 2, 2, hex(hand)); R(12 + big, 10 + dy, 2, 2, hex(hand));

/* ---------- sight and light ---------- */
function computeLight(field, t){

    const f = t ? 0.06 * Math.sin(t * 0.011) + 0.04 * Math.sin(t * 0.029 + 1.3) + 0.03 * Math.sin(t * 0.071) : 0;   // the flame flickers
    addLight(field, MW, MH, blocks, { x: player.x, y: player.y, r: R + f * 4, i: 1.3 * (1 + f), rgb: TORCH_RGB });
  }
  for (const m of mons) if (m.K && m.K.glow) addLight(field, MW, MH, blocks, { x: m.x, y: m.y, r: m.K.glow.r, i: 1.0, rgb: m.K.glow.rgb });
  if (!t) return;   // bolts and flashes only light what is drawn; they do not change what the turn saw
  for (const s of shots){ const c = s.path[Math.min(s.path.length - 1, Math.floor(s.t * s.speed))]; if (s.light) addLight(field, MW, MH, blocks, { x: c[0], y: c[1], r: 2.5, i: 1.2, rgb: s.light }); }

}

/* ---------- aiming: bolts and thrown things fly along a line until they hit a wall or a monster ---------- */
let aiming = null;   // while set, the next direction (or "nearest") fires it

}
function flight(tx, ty, range){   // the cells a missile passes, and the monster it reaches first
  const path = [];
  for (const [x, y] of line(player.x, player.y, tx, ty, range)){
    if (blocks(x, y)) break;
    path.push([x, y]);
    const m = monAt(x, y); if (m) return { path, m };
  }
  return { path, m: null };
}

function throwItem(it, quick){

/* ---------- a turn: the player acts, then everyone faster or as fast acts until it is the player's turn again ---------- */
function act(fn){
  if (state !== "play") return false;
  msgs = []; refreshUI();
  const r = fn();
  if (!r) return false;
  if (r === "level") return true;
  const go = () => { if (pendingLevel === null || state !== "play") return false; const d = Math.max(0, pendingLevel); pendingLevel = null; newLevel(d); return true; };
  if (go()) return true;
  endTurn();
  while ((player.t.asleep > 0 || player.t.paralyzed > 0) && state === "play") endTurn();   // asleep or paralysed: the monsters keep moving
  go();   // Word of Recall takes effect at the end of a turn

    monsterTurn(a); a.energy -= 100;
  }

  if (player.t.poison > 0) hurt(1, "poison");

  }

    lightTown();
    if (isDay() !== wasDay){ wasDay = isDay(); say(wasDay ? "The sun rises over Lanternhollow." : "Night falls, and the lamps are lit."); }
  }
  for (const k of Object.keys(TIMERS)) if (player.t[k] > 0 && --player.t[k] === 0){ say(TIMERS[k][1]); recalc(); }

function monsterTurn(m){
  const K = m.K, d = dist(m.x, m.y, player.x, player.y);
  if (K.regen && m.hp < m.mhp && player.turns % 3 === 0) m.hp = Math.min(m.mhp, m.hp + Math.max(1, Math.round(m.mhp / 60)));
  if (m.sleep > 0){   // noise nearby wakes it; a stealthy character makes less of it
    const st = skillOf(player, "stealth");
    if (d < 16 - st) m.sleep -= rng.range(0, Math.max(1, 6 - st));
    return;
  }
  m.speed = K.speed - (m.slow > 0 ? 10 : 0) + (m.haste > 0 ? 10 : 0);
  if (m.slow > 0) m.slow--;
  if (m.haste > 0) m.haste--;
  if (K.breed && depth > 0 && rng.chance(K.breed * 0.3)) breed(m);
  const seesYou = inFov[idx(m.x, m.y)] === turnNo && d < 20;   // sight is symmetric: if you could see it, it can see you
  if (K.spells && seesYou && !m.conf && rng.int(K.spells.freq) === 0 && monsterCast(m)) return;
  if (K.still){ if (d <= 1) monsterAttack(m); return; }
  if (m.conf > 0){ m.conf--; const [dx, dy] = DIRS[rng.pick([1, 2, 3, 4, 6, 7, 8, 9])]; return step(m, m.x + dx, m.y + dy); }
  if (d <= 1 && !m.afraid) return monsterAttack(m);
  let tx = player.x, ty = player.y, away = false;
  if (m.afraid){ m.afraid--; away = true; }
  if ((K.erratic && rng.chance(K.erratic)) || (!seesYou && d > 6)){   // wander
    const [dx, dy] = DIRS[rng.pick([1, 2, 3, 4, 6, 7, 8, 9])]; tx = m.x + dx; ty = m.y + dy;
    return step(m, tx, ty);
  }
  // step to the neighbour that gets closest to (or furthest from) the player
  let best = null, bestD = away ? -1 : 1e9;
  for (const k of [1, 2, 3, 4, 6, 7, 8, 9]){
    const [dx, dy] = DIRS[k], x = m.x + dx, y = m.y + dy, t = L.tiles[idx(x, y)];
    if (!(passable(t) || t === T.DOOR || (t === T.WALL && (K.passWall || K.killWall))) || (monAt(x, y) && !(x === player.x && y === player.y))) continue;
    const nd = Math.hypot(x - tx, y - ty);
    if (away ? nd > bestD : nd < bestD){ bestD = nd; best = [x, y]; }
  }
  if (best) step(m, best[0], best[1]);
}
function step(m, x, y){
  const i = idx(x, y), t = L.tiles[i], K = m.K;
  if (x === player.x && y === player.y) return m.afraid ? null : monsterAttack(m);
  if (t === T.DOOR){ L.tiles[i] = T.OPEN; if (visible(i)) say("A door opens."); return; }
  if (monAt(x, y)) return;
  if (t === T.WALL && K.killWall && depth > 0){   // it tunnels: the rock breaks into rubble behind it
    L.tiles[i] = T.FLOOR;
    if (inFov[i] === turnNo){ burst(x, y, [0.55, 0.5, 0.45], 6); if (seesMon(m)) say(cap(monName(K)) + " tunnels through the rock."); else say("You hear grinding rock."); }
  } else if (!passable(t) && !(t === T.WALL && K.passWall)) return;
  m.x = x; m.y = y;
  if (hiddenMimic(m)) m.revealed = true;
}
// Breeders fill a level if you let them; a cap keeps it to a swarm, not a flood.
function breed(m){
  if (mons.filter(o => o.K && o.K.breed).length >= 40) return;
  const [dx, dy] = DIRS[rng.pick([1, 2, 3, 4, 6, 7, 8, 9])], x = m.x + dx, y = m.y + dy;
  if (!passable(L.tiles[idx(x, y)]) || monAt(x, y)) return;
  newMon(m.K, x, y, 0);
  if (visible(idx(x, y))) say(cap(monName(m.K)) + " multiplies.");
}
const saves = () => rng.int(100) < skillOf(player, "save");
// The element damage a monster deals, after your resistances; some elements do more than hurt.
function elemHurt(m, dmg, elem, by){
  if (elem && player.bonus.res.has(elem)){ dmg = Math.ceil(dmg / 3); say("You resist the " + { fire: "heat", cold: "cold", elec: "shock", acid: "acid", poison: "poison", dark: "darkness", light: "light" }[elem] + "."); }
  if (dmg > 0) hurt(dmg, by);
  if (state !== "play") return;
  if (elem === "poison" && !player.bonus.res.has("poison")) setTimer("poison", 4 + rng.int(4 + Math.floor(m.K.depth / 3)));
  if ((elem === "dark" || elem === "light") && !player.bonus.res.has(elem) && !saves()) setTimer("blind", 3 + rng.int(4));
}
const ELEMS = new Set(["fire", "cold", "elec", "acid", "poison", "dark", "light"]);
function monsterAttack(m){
  const K = m.K, name = seesMon(m) ? cap(monName(K)) : "It", L_ = lore(K), by = aName(K);
  if (hiddenMimic(m)){ m.revealed = true; say("The " + { gold: "pile of gold", potion: "potion", scroll: "scroll" }[K.mimic] + " was " + aName(K) + "!"); }
  fxLunge(m, player); if (!liveTarget() && seesMon(m)) target = m;
  lastFoe = K;
  K.blows.forEach(([dice, verb, effect], bi) => {
    if (state !== "play" || !mons.includes(m)) return;
    if (seesMon(m)) L_.blows[bi] = (L_.blows[bi] || 0) + 1;
    if (player.t.protEvil && K.evil && rng.int(100) < 50 + player.lvl - K.depth){ say(name + " is repelled."); return; }
    if (rng.int(100) >= blowChance(K.depth, armour())){ say(name + " misses you."); return; }
    if (effect === "steal") return stealGold(m, name, verb);
    if (effect === "stealItem") return stealItem(m, name, verb);
    let dmg = rng.dice(dice);
    say(name + " " + verb + (dmg || effect ? " you." : "."));
    if (ELEMS.has(effect)) return elemHurt(m, dmg, effect, by);
    if (dmg) hurt(dmg, by);
    if (state === "play" && effect) blowEffect(m, effect, name);
  });
}
function blowEffect(m, effect, name){
  const K = m.K, p = player;
  if (effect === "confuse"){ if (!saves()) setTimer("confused", 3 + rng.int(4)); }
  else if (effect === "blind"){ if (!saves()) setTimer("blind", 4 + rng.int(6)); }
  else if (effect === "terrify"){ if (saves() || p.t.hero || p.t.berserk) say("You stand your ground!"); else setTimer("afraid", 6 + rng.int(8)); }
  else if (effect === "paralyze"){ if (p.bonus.freeAct) say("You are unaffected!"); else if (saves()) say("You resist the effects!"); else setTimer("paralyzed", 2 + rng.int(3)); }
  else if (effect === "drainExp"){ if (p.exp > 0 && !saves()){ say("You feel your life draining away!"); loseExp(Math.max(5, Math.round(K.depth * 4 + p.exp * 0.02))); } }
  else if (effect.startsWith("drain:")){ const k = effect.slice(6); if (!saves() && p.base[k] > 3){ p.base[k]--; recalc();
    say("You feel " + { str: "weaker", int: "duller", wis: "more foolish", dex: "clumsier", con: "sickly", cha: "uglier" }[k] + "."); } }
  else if (effect === "drainCharges"){ const wands = p.inv.filter(it => (ITEM[it.k].cat === "wand" || ITEM[it.k].cat === "staff") && it.charges > 0);
    if (wands.length){ const it = rng.pick(wands); m.hp = Math.min(m.mhp, m.hp + it.charges * Math.max(1, K.depth >> 1)); it.charges = 0; say("Energy drains from your pack!"); } }
  else if (effect === "eatFood"){ const f = p.inv.find(it => ITEM[it.k].cat === "food"); if (f){ takeOne(f); say("It eats some of your food!"); } }
  else if (effect === "eatLight"){ const lt = p.eq.light; if (lt && lt.fuel > 0){ lt.fuel = Math.max(0, lt.fuel - (200 + K.depth * 15)); say(lt.fuel ? "Your light dims!" : "Your light goes out!"); } }
}
function stealGold(m, name, verb){   // a thief takes some gold, then slips away
  if (!player.gold){ say(name + " fumbles at your empty purse."); return; }
  if (rng.int(100) < 15 + statMod(player.stats.dex) * 4 + player.lvl){ say("You quickly protect your purse!"); return; }
  const n = Math.max(1, Math.floor(player.gold * (0.1 + rng.next() * 0.15)));
  player.gold -= n; say(name + " " + verb + " you. Your purse feels " + n + " gold lighter!");
  if (depth === 0){ if (seesMon(m)) say(cap(monName(m.K)) + " vanishes into the crowd."); mons.splice(mons.indexOf(m), 1); return; }
  m.gold = (m.gold || 0) + n; if (sendAway(m) && seesMon(m)) say(name + " vanishes!");
}
function stealItem(m, name, verb){
  const can = player.inv.filter(it => !ITEM[it.k].cat.startsWith("book") || rng.chance(0.3));
  if (!can.length || rng.int(100) < 15 + statMod(player.stats.dex) * 4 + player.lvl){ say(name + " " + verb + " you, but you grab hold of your pack."); return; }
  const it = rng.pick(can), one = { ...it, n: ITEM[it.k].cat === "ammo" ? it.n : 1 };
  if (one.n >= it.n) player.inv.splice(player.inv.indexOf(it), 1); else it.n -= one.n;
  (m.carry = m.carry || []).push(one); recalc();
  say(name + " " + verb + " you. Your " + nameOf(one) + (one.n > 1 ? " were" : " was") + " stolen!");
  if (sendAway(m)) say(name + " vanishes!");
}
// Losing experience can cost levels, and the hit points and mana that came with them.
function loseExp(n){
  const p = player; p.exp = Math.max(0, p.exp - n);
  while (p.lvl > 1 && p.exp < expNeeded(p, p.lvl)){
    p.lvl--; p.mhp = Math.max(1, p.mhp - Math.ceil(hitDie(p) / 2) - 1); p.hp = Math.min(p.hp, p.mhp); p.mmana = maxMana(p); p.mana = Math.min(p.mana, p.mmana);
    say("You feel less experienced: you are now level " + p.lvl + ".");
  }
}

/* ---------- monster spells and breath ---------- */
// What it casts is picked from its list; anything aimed travels as a visible bolt, ball or cone of coloured light.
function monsterCast(m){
  const K = m.K, S = rng.pick(K.spells.list), [kind, arg] = S.split(":"), seen = seesMon(m), name = seen ? cap(monName(K)) : "Something", by = aName(K);
  if (seen) learnSpell(K, S);
  const path = () => { const out = []; for (const c of line(m.x, m.y, player.x, player.y, 40)){ if (blocks(c[0], c[1])) break; out.push(c); if (c[0] === player.x && c[1] === player.y) break; } return out; };
  const clear = () => { const pa = path(); return pa.length && pa[pa.length - 1][0] === player.x && pa[pa.length - 1][1] === player.y; };
  const resisted = () => { if (saves()){ say("You resist the effects!"); return true; } return false; };
  lastFoe = K;
  switch (kind){
    case "blink": case "tport": { const ox = m.x, oy = m.y; if (!teleMon(m, kind === "blink" ? 6 : 40)) return false; if (seen) say(name + (kind === "blink" ? " blinks away." : " vanishes.")); burst(ox, oy, ELEM_RGB.arcane, 3); return true; }
    case "teleTo": { if (dist(m.x, m.y, player.x, player.y) <= 1) return false; for (const k of [1, 2, 3, 4, 6, 7, 8, 9]){ const [dx, dy] = DIRS[k], x = m.x + dx, y = m.y + dy;
        if (passable(L.tiles[idx(x, y)]) && !monAt(x, y)){ say(name + " commands you to return."); player.x = x; player.y = y; updateSight(); return true; } } return false; }
    case "heal": if (m.hp >= m.mhp * 0.6) return false; m.hp = Math.min(m.mhp, m.hp + Math.ceil(m.mhp / 3)); if (seen) say(name + " looks healthier."); return true;
    case "haste": if (m.haste > 0) return false; m.haste = 15; if (seen) say(name + " starts moving faster."); return true;
    case "blind": say(name + " casts a spell, burning your eyes!"); if (!resisted()) setTimer("blind", 4 + rng.int(4)); return true;
    case "confuse": say(name + " creates a mesmerising illusion."); if (!resisted()) setTimer("confused", 4 + rng.int(4)); return true;
    case "scare": say(name + " casts a fearful illusion."); if (player.t.hero || player.t.berserk || resisted()) return true; setTimer("afraid", 6 + rng.int(6)); return true;
    case "slow": say(name + " drains your power to move."); if (!resisted()) setTimer("slow", 4 + rng.int(4)); return true;
    case "paralyze": say(name + " gazes deep into your eyes!"); if (player.bonus.freeAct) say("You are unaffected!"); else if (!resisted()) setTimer("paralyzed", 2 + rng.int(3)); return true;
    case "darkness": { say(name + " gestures, and the light fails."); for (const i of roomCells()){ L.lit[i] = 0; roomLight[3 * i] = roomLight[3 * i + 1] = roomLight[3 * i + 2] = 0; }
      flashes.push({ x: player.x, y: player.y, t: 0.3, t0: 0.3, rgb: [0.05, 0.03, 0.1] }); return true; }
    case "drainMana": { if (!player.mana) return false; const n = Math.min(player.mana, 2 + (K.depth >> 2)); player.mana -= n; m.hp = Math.min(m.mhp, m.hp + n * 4); say(name + " draws psychic energy from you."); return true; }
    case "summon": { if (mons.length > 90) return false;   // enough is enough
      const pool = (arg === "kin" ? FAMILIES[K.kin] || [] : arg === "undead" ? MONSTERS.filter(o => o.undead) : MONSTERS.filter(o => !o.town)).filter(o => !o.unique && o.depth <= K.depth + 3 && o.depth >= Math.min(K.depth - 15, 1));
      const n = summonNear(pool.length ? pool : [K], 1 + rng.int(2));
      if (n) say(name + (arg === "undead" ? " calls up the dead!" : " calls for help!")); return n > 0; }
    case "arrow": case "bolt": case "ball": { if (!clear()) return false;
      const elem = kind === "arrow" ? null : arg, pa = path(), dmg = kind === "arrow" ? Math.ceil(rng.dice(boltDice(K.depth)) * 0.6) : kind === "ball" ? Math.ceil(rng.dice(boltDice(K.depth)) * 1.4) : rng.dice(boltDice(K.depth));
      const delay = elem ? missile(pa, elem, 35) : (shots.push({ path: pa, t: 0, speed: 45, item: { k: "arrow", n: 1 } }), pa.length / 45);
      say(kind === "arrow" ? name + " fires a missile." : name + " casts " + (kind === "ball" ? "a ball of " : "a bolt of ") + { fire: "fire", cold: "frost", elec: "lightning", acid: "acid", poison: "poison", dark: "darkness", light: "light", arcane: "force" }[elem] + ".");
      if (kind === "ball") later.push({ t: delay, fn: () => { flashes.push({ x: player.x, y: player.y, t: 0.5, t0: 0.5, rgb: ELEM_RGB[elem].map(v => v * 1.6) }); shove(player.x, player.y, 4); } });
      elemHurt(m, dmg, elem === "arcane" ? null : elem, by); return true; }
    case "breath": { if (!clear()) return false;
      // a cone of coloured light: five rays fanning out toward you, then the blast where you stand
      const ang = Math.atan2(player.y - m.y, player.x - m.x), R = Math.max(4, dist(m.x, m.y, player.x, player.y) + 1);
      for (const da of [-0.35, -0.17, 0, 0.17, 0.35]){ const tx = Math.round(m.x + Math.cos(ang + da) * R), ty = Math.round(m.y + Math.sin(ang + da) * R), ray = [];
        for (const c of line(m.x, m.y, tx, ty, R)){ if (blocks(c[0], c[1])) break; ray.push(c); } if (ray.length) missile(ray, arg, 30); }
      say(name + " breathes " + { fire: "fire", cold: "frost", elec: "lightning", acid: "acid", poison: "gas", dark: "darkness" }[arg] + ".");
      elemHurt(m, breathDmg(m.hp, K.depth), arg, by); return true; }
  }
  return false;
}
function teleMon(m, r){
  for (let tries = 0; tries < 100; tries++){
    const x = m.x + rng.range(-r, r), y = m.y + rng.range(-r, r);
    if (x < 1 || y < 1 || x >= MW - 1 || y >= MH - 1 || !passable(L.tiles[idx(x, y)]) || monAt(x, y)) continue;
    m.x = x; m.y = y; return true;
  }
  return false;
}

/* ---------- monster recall: what you have learned about each kind, kept across characters ---------- */
const LORE = store.getJSON("lore", {});
let lastFoe = null;
const lore = K => LORE[K.id] || (LORE[K.id] = { seen: 0, kills: 0, deaths: 0, blows: [], spells: [], res: [] });
const learnSpell = (K, S) => { const l = lore(K); if (!l.spells.includes(S)) l.spells.push(S); };
const learnRes = (K, e) => { const l = lore(K); if (!l.res.includes(e)) l.res.push(e); };
const saveLore = () => store.setJSON("lore", LORE);

/* ---------- longer actions: running and resting stop when something happens ---------- */
let resting = false;
function run(dx, dy){
  if (state !== "play") return;
  disturbed = false;
  const open = (x, y) => passable(L.tiles[idx(x, y)]) && !monAt(x, y);
  for (let n = 0; n < 200 && state === "play" && !disturbed; n++){
    if (mons.some(m => m.K && seesMon(m) && !m.K.still)) break;
    if (!open(player.x + dx, player.y + dy)){
      // in a corridor, follow a single bend
      if (dx && dy) break;
      const turns = (dx ? [[0, 1], [0, -1]] : [[1, 0], [-1, 0]]).filter(([a, b]) => open(player.x + a, player.y + b));
      if (turns.length !== 1) break;
      [dx, dy] = turns[0];
    }
    if (!act(() => tryMove(dx, dy))) break;
    const t = L.tiles[idx(player.x, player.y)];
    if (t === T.DOWN || t === T.UP || itemsAt(player.x, player.y).length) break;
    let doors = 0; for (const k of [1, 2, 3, 4, 6, 7, 8, 9]){ const [a, b] = DIRS[k], u = L.tiles[idx(player.x + a, player.y + b)]; if (u === T.DOOR || u === T.OPEN) doors++; }
    if (doors) break;
  }
}
function rest(){
  if (state !== "play") return;
  if (player.hp >= player.mhp && player.mana >= player.mmana){ say("You are already fully rested."); return; }
  disturbed = false; resting = true;
  for (let n = 0; n < 1000 && state === "play" && !disturbed && (player.hp < player.mhp || player.mana < player.mmana); n++){
    if (mons.some(m => m.K && seesMon(m))){ say("You cannot rest with monsters nearby."); break; }
    act(() => true);
  }
  resting = false;
}
/* ---------- the four smart keys (A S D W) and their helpers ---------- */
function attackKey(){   // A: swing at the target if it is next to you; otherwise shoot or throw at it
  let m = liveTarget(); if (!m) m = target = nearestTarget();
  if (!m){ msgs = []; say("There is nothing in sight to attack."); return; }
  if (dist(m.x, m.y, player.x, player.y) <= 1) return act(() => attack(m));
  const bow = player.eq.bow, ammo = bow && player.inv.find(it => ITEM[it.k].cat === "ammo" && ITEM[it.k].ammo === ITEM[bow.k].ammo);
  if (ammo) return fireAmmo(ammo, true);
  const dart = player.inv.find(it => ITEM[it.k].cat === "dart");
  if (dart) return throwItem(dart, true);
  msgs = []; say(cap(theName(m)) + " is out of reach. Walk closer, or carry a launcher and ammunition, or darts.");
}
const knownSpells = () => SPELLS.filter(S => (player.spells || []).includes(S.id));
function readySpell(){ const k = knownSpells(); if (!k.length) return null; if (!k.some(S => S.id === player.ready)) player.ready = k[0].id; return SPELL[player.ready]; }
function spellKey(){   // S: cast the readied spell
  const S = readySpell();
  if (!S){ msgs = []; say(cls().realm ? "You have not learned any " + realmWord() + "s yet. Open the Book (B) to study." : "You know no spells or prayers."); return; }
  castSpell(S, true);
}
function nextSpell(d){ const k = knownSpells(); if (!k.length) return spellKey(); const S = readySpell(), n = k[(k.indexOf(S) + d + k.length) % k.length]; player.ready = n.id; msgs = []; say("Ready: " + n.name + " (" + n.mana + " mana)."); }
// D: the healing potion that best fits your wounds, so a scratch does not use up the strongest one
function bestPotion(){
  const miss = player.mhp - player.hp, list = player.inv.filter(it => { const K = ITEM[it.k]; return K.cat === "potion" && kindKnown(K, player.know) && (K.effect === "heal" || K.effect === "healFull"); })
    .map(it => ({ it, v: ITEM[it.k].effect === "healFull" ? 1e4 : avgDice(ITEM[it.k].dice) })).sort((a, b) => a.v - b.v);
  return list.length ? (list.find(o => o.v >= miss * 0.7) || list[list.length - 1]).it : null;
}
function drinkKey(){
  msgs = [];
  if (player.hp >= player.mhp){ say("You are not hurt."); return; }
  const it = bestPotion(); if (it) return act(() => useItem(it, "quaff"));
  const S = knownSpells().filter(S => S.fx === "heal" && player.mana >= S.mana).pop();
  if (S) return castSpell(S, true);
  say("You have no healing potions you know of.");
}
function grabKey(){   // W: whatever there is to do here; nothing to do takes no turn
  const i = idx(player.x, player.y), t = L.tiles[i];
  if (itemsAt(player.x, player.y).length) return act(pickUp);
  if (t === T.DOWN || t === T.UP) return act(() => takeStairs(t === T.DOWN));
  if (t === T.SHOP) return openShop(L.shopAt[i]);
  msgs = []; say("There is nothing here.");
}
function eatKey(){
  const food = player.inv.filter(it => ITEM[it.k].cat === "food").sort((a, b) => ITEM[a.k].cost - ITEM[b.k].cost)[0];
  if (!food){ msgs = []; say("You have nothing to eat."); return; }
  act(() => useItem(food, "eat"));
}
function fuelKey(){   // F: oil for a lantern, or a fresh torch for a burnt-down one
  const lt = player.eq.light; msgs = [];
  if (!lt) { const t = player.inv.filter(it => ITEM[it.k].cat === "light").sort((a, b) => (b.fuel || 0) - (a.fuel || 0))[0]; if (t) return act(() => wear(t)); say("You have no light."); return; }
  if (lt.fuel === undefined){ say("Your light needs no fuel."); return; }
  if (ITEM[lt.k].maxFuel){ const oil = player.inv.find(it => ITEM[it.k].cat === "flask"); if (oil) return act(() => useItem(oil, "fuel")); say("You have no oil for your lantern."); return; }
  const fresh = player.inv.filter(it => it.k === lt.k && it.fuel > lt.fuel).sort((a, b) => b.fuel - a.fuel)[0];
  if (fresh) return act(() => wear(fresh));
  say("You have no fresher " + ITEM[lt.k].name.toLowerCase() + ".");
}
function cycleTarget(d){
  const list = mons.filter(m => m.K && seesMon(m)).sort((a, b) => dist(a.x, a.y, player.x, player.y) - dist(b.x, b.y, player.x, player.y));
  msgs = [];
  if (!list.length){ target = null; say("There are no monsters in sight."); return; }
  const i = list.indexOf(liveTarget());
  target = list[i < 0 ? (d > 0 ? 0 : list.length - 1) : (i + d + list.length) % list.length];
  say("Target: " + target.K.name + (target.sleep > 0 ? " (asleep)" : "") + ".");
}
function useHot(k){   // 1 to 0: a hotbar slot holds a kind of item, or a spell
  const e = player.hot[k]; msgs = [];

  if (knows){
    rows.push({ label: "Cast now", select: () => { closeDialog(); castSpell(S, true); } });
    rows.push({ label: "Ready it for S", select: () => { player.ready = S.id; closeDialog(); } });
    const hk = player.hot.findIndex(e => e && e.spell === S.id), free = player.hot.indexOf(null);
    if (hk >= 0) rows.push({ label: "Take off the hotbar", select: () => { player.hot[hk] = null; closeDialog(); } });
    else if (free >= 0) rows.push({ label: "Put on hotbar (" + ((free + 1) % 10) + ")", select: () => { player.hot[free] = { spell: S.id }; closeDialog(); } });
  }
  rows.push({ label: "Back", select: closeDialog });
  openDialog({ title: S.name, cols: [rows], sideHtml: spellCard(S) });
}
function castDialog(){   // Classic keys: m / p
  const known = SPELLS.filter(S => player.spells.includes(S.id));
  if (!known.length){ msgs = []; say("You have not learned any " + realmWord() + "s yet."); return refreshUI(); }
  openDialog({ title: (cls().realm === "holy" ? "Pray" : "Cast") + " · mana " + player.mana + "/" + player.mmana, cols: [known.map(S => ({ spell: S, label: S.name, right: S.mana + " mp " + spellFail(S, player) + "%", select: () => { closeDialog(); castSpell(S, false); } }))] });
}
function studyDialog(can){ openDialog({ title: "Study which spell?", cols: [can.map(S => ({ spell: S, label: S.name, right: "level " + spellLevel(S, cls()), select: () => { closeDialog(); study(S); } }))] }); }

/* ---------- shops ---------- */
let shopNow = -1;
function openShop(i){ const S = SHOPS[i]; msgs = []; say("You enter the " + S.name + ". " + S.keeper + ": \"" + rng.pick(S.hello) + "\""); shopNow = i; shopDialog(i, 0, [0, 0]); }
function shopDialog(i, c, at){
  const S = SHOPS[i], stock = shops[i].stock, cha = player.stats.cha;
  const buyRows = stock.map(it => ({ item: it, html: esc(cap(shopName(it))), right: buyPrice(it, S, cha) + " g", off: buyPrice(it, S, cha) > player.gold, select: () => { buy(i, it); shopDialog(i, 0, dlg.at); } }));
  const sellRows = player.inv.map(it => ({ item: it, label: cap(nameOf(it)), right: !shopBuys(S, it) ? "–" : it.id && kindKnown(ITEM[it.k], player.know) ? sellPrice(it, S, cha) + " g" : "? g", select: () => { sell(i, it); shopDialog(i, 1, dlg.at); } }));
  openDialog({ title: S.name + " · " + S.keeper, wide: true, heads: ["Buy", "Sell"], cols: [buyRows, sellRows], c, at, empty: "Nothing here.",
    head: `<div class="shopline"><span class="gold">● ${player.gold} gold</span><span>${esc(msgs.slice(-1)[0] || "")}</span></div>`, note: "Prices are for one · selling tells you what a thing is" });
}

/* ---------- the menu and help ---------- */
const KEYSETS = { modern: "Modern (arrows + A S D W)", original: "Classic (Moria letters)", roguelike: "Roguelike (hjkl)" };
function menuDialog(){
  const rows = [
    { label: "Resume", select: closeDialog },
    { label: state === "play" ? "New character" : "Start", select: () => { closeDialog(); startCreate(); } },
    { label: "Keys", right: KEYSETS[keySet] + "  ‹ ›", adjust: d => { const ks = Object.keys(KEYSETS); keySet = ks[(ks.indexOf(keySet) + ks.length + d) % ks.length]; store.set("keymap", keySet); menuDialog(); }, select: () => rows[2].adjust(1) },
    { label: "Side panel", right: (panelOn ? "Shown" : "Hidden") + " (P)", select: () => { togglePanel(); menuDialog(); } },
    { label: "Help", select: helpDialog },
    { label: "Display settings", select: () => { location.href = "settings.html"; } },
    { label: "Back to cartridges", select: () => { location.href = "./"; } }
  ];
  openDialog({ title: state === "play" ? "Paused" : "Menu", cols: [rows], side: false, note: "This early version does not save", at: dlg && dlg.title.match(/Paused|Menu/) ? dlg.at : [0] });
}
function helpDialog(){
  const modern = [["Arrow keys", "move; into a monster attacks, into a door opens"], ["Two arrows", "move diagonally (or numpad, Home, End, PgUp, PgDn)"], ["Shift + arrow", "run"],
    ["A", "attack the target: melee, or fire / throw if it is further"], ["S", "cast the readied spell"], ["D", "drink the best-fitting healing potion"], ["W", "grab: pick up, stairs, shop"],
    ["Q / Shift+Q", "ready the next / previous spell"], ["E", "eat"], ["R", "rest"], ["F", "refill your lantern, or a fresh torch"], ["Tab / Shift+Tab", "next / previous target"],
    ["Space", "wait a turn"], ["1 to 0", "use a hotbar slot"], ["I C B J M", "Pack, Character, Book, Journal, Map"], ["P", "show or hide the panel"], ["L", "look"], ["Esc", "close, or the menu"]];
  const ro = keySet === "roguelike";
  const classic = [[ro ? "hjklyubn" : "Arrows / numpad", "move (Shift runs)"], ["g or ,", "pick up"], ["i  e", "pack, equipment"], ["w  " + (ro ? "T" : "t") + "  d", "wear, take off, drop"],
    ["E  q  r", "eat, drink, read"], ["a  " + (ro ? "Z" : "u") + "  z", "aim a wand, use a staff, zap a rod"], ["F", "fill lantern"], ["f  v  I", "fire, throw, inspect"], ["m or p  S", "cast or pray, study"],
    [">  <", "stairs"], ["R  " + (ro ? "." : ". or 5"), "rest, wait"], [(ro ? "x" : "l") + "  C", "look, character"], ["Tab", "next target"], ["Esc", "menu"]];
  openDialog({ title: "Keys · " + KEYSETS[keySet], cols: [(keySet === "modern" ? modern : classic).map(([a, b]) => ({ html: `<kbd>${esc(a)}</kbd> ${esc(b)}` }))], side: false, onBack: closeDialog, note: "Change the key set in the menu" });
}

/* ---------- title, a new character, and the tombstone ---------- */
function drawScreen(){
  const el = $("screen");
  if (state === "play" || (state === "dead" && stateT < 1)){ el.hidden = true; return; }
  el.hidden = false;
  if (state === "title"){
    el.innerHTML = `<div class="titlecard"><h1>Torchlight<span>Dungeons</span></h1><p class="dim">A dungeon crawl after Moria</p>
      <p class="blink">Press Enter to begin</p><p class="dim">Early version: no saves yet. Esc opens the menu.</p>
      ${scores.list.length ? `<h3>Hall of fame</h3>${scores.list.map((s, k) => `<div class="fame ${k ? "" : "best"}"><b>${s.score}</b> ${esc(s.name || "")} the ${esc(s.race || "")} ${esc(s.cls || "Fighter")}, level ${s.lvl}, ${s.depth} ft, ${esc(s.killer)}</div>`).join("")}` : ""}</div>`;
  } else if (state === "create") drawCreate();
  else if (state === "dead"){
    const T0 = tomb;
    el.innerHTML = `<div class="titlecard tomb"><h1 class="rip">R.I.P.</h1><b>${esc(T0.name)}</b><div>the ${esc(T0.race)} ${esc(T0.cls)}, level ${T0.lvl}</div><div>killed by ${esc(T0.killer)}</div><div>${T0.at === "the town" ? "in the town" : "at " + T0.at}</div>
      <h3>Score ${T0.score}${T0.best ? " · best!" : ""}</h3><p class="blink">Press Enter for the title</p></div>`;
  }
}
function drawCreate(){
  const steps = ["People", "Calling", "Strengths", "Name"], rows = crRows(), p = crPreview(), R = RACE[p.race], C = CLASS[p.cls];
  const kit = { sellsword: "shortsword", arcanist: "dagger", lampwarden: "mace", delver: "dagger", wayfinder: "shortsword", oathknight: "mace" }[p.cls];
  const show = cr.step === 0 ? RACES[cr.at] : cr.step === 1 ? CLASSES[cr.at] : null;
  const look = { race: cr.step === 0 ? RACES[cr.at].id : p.race, eq: { weapon: cr.step >= 1 ? { sellsword: "shortsword", arcanist: "dagger", lampwarden: "mace", delver: "dagger", wayfinder: "shortsword", oathknight: "mace" }[cr.step === 1 ? CLASSES[cr.at].id : p.cls] : kit, body: "jerkin", light: "torch" } };
  const mods = o => STATS.filter(k => o[k]).map(k => STAT_NAMES[k] + " " + sign(o[k])).join(", ") || "no changes";
  let info = "";
  if (cr.step === 0){ const H = show; info = `<h2>${H.name}</h2><p>${esc(H.desc)}</p><p class="dim">Stats: ${mods(H.stats)}<br>Infravision: ${H.infra ? H.infra * 10 + " ft" : "none"} · hit die ${H.hd} · experience +${H.xp}%</p>`; }
  else if (cr.step === 1){ const K = show, fs = firstSpell(K); info = `<h2>${K.name}</h2><p>${esc(K.desc)}</p><p class="dim">Stats: ${mods(K.stats)}<br>Hit die ${K.hd} · experience +${K.xp}%<br>${fs ? (K.realm === "holy" ? "Holy prayers" : "Arcane spells") + (spellLevel(fs, K) > 1 ? " from level " + spellLevel(fs, K) : "") + ", starting with " + fs.name + "." : "No magic."}<br>Titles: ${K.titles.slice(0, 3).join(", ")} …</p>`; }
  else info = `<h2>${esc(cr.name)}</h2><p class="dim">${R.name} ${C.name}</p><div class="stats">${STATS.map(k => `<span>${STAT_NAMES[k]}<b>${p.stats[k]} <i class="dim">(${sign(statMod(p.stats[k]))})</i></b></span>`).join("")}</div>
    <p>Hit points ${firstHp(p)}${C.realm ? " · mana " + maxMana(p) : ""}</p><div class="stats">${SKILLS.map(k => { const v = skillOf(p, k); return `<span>${SKILL_NAMES[k]}<b>${k === "stealth" ? stealthWord(v) : skillWord(v)}</b></span>`; }).join("")}</div>
    ${cr.step === 2 && cr.mode === "buy" ? `<p class="gold">Points left: ${BUY_POINTS - buySpent(cr.buy)} of ${BUY_POINTS}</p>` : ""}${cr.step === 3 ? `<p class="dim">Type to change the name.</p>` : ""}`;
  $("screen").innerHTML = `<div class="create"><div class="steps">${steps.map((s, i) => `<b class="${i === cr.step ? "on" : i < cr.step ? "done" : ""}">${i + 1} ${s}</b>`).join("")}</div>
    <div class="cbody"><div class="list">${rows.map((r, i) => `<div class="row ${i === cr.at ? "sel" : ""}" data-i="${i}"><span>${esc(r.label)}</span>${cr.step === 2 && cr.mode === "buy" && i < 6 ? `<small>‹ ${cr.buy[STATS[i]]} ›</small>` : ""}</div>`).join("")}
      ${cr.step === 3 ? `<div class="namebox">${esc(cr.name)}<span class="caret">▌</span></div>` : ""}</div>
    <div class="preview">${pic(doll(look, 64), "hero")}</div><div class="cinfo">${info}</div></div>
    <div class="note">↑↓ choose · Enter select · ${cr.step === 2 && cr.mode === "buy" ? "←→ change · " : ""}Esc back</div></div>`;
  $("screen").querySelectorAll(".row[data-i]").forEach(r => r.onclick = () => { cr.at = +r.dataset.i; crChoose(); refreshUI(); });
}

/* ---------- each frame ---------- */
let miniT = 0;
function drawUI(dt){
  miniT -= dt;
  if (uiDirty){
    uiDirty = false;
    drawScreen();
    const playing = player && player.hot && (state === "play" || state === "dead");
    $("ov").hidden = !playing;
    if (playing){ drawHud(); drawPanel(); } else $("panel").hidden = true;
    if (dlg) drawDialog();
    if (tipFor && !document.body.contains(tipFor)) hideTip();
  }
  if (miniT <= 0 && L && player && player.hot && state !== "title"){ miniT = 0.2; drawMinimap($("mini"), 3, true); if (tab === "map" && panelOn) drawBigMap(); }
}

renderLayout(); titleScene();
onResize(stage, renderLayout);
startLoop(tick);
</script>
</body></html>
